<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NeuroCortex — интерактивный атлас коры головного мозга</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#6750A4; --on-primary:#fff;
  --primary-container:#EADDFF; --on-primary-container:#21005D;
  --secondary-container:#E8DEF8; --on-secondary-container:#1D192B;
  --surface:#FEF7FF; --surface-container:#F3EDF7; --surface-container-high:#ECE6F0;
  --surface-container-low:#F7F2FA;
  --on-surface:#1D1B20; --on-surface-variant:#49454F;
  --outline:#79747E; --outline-variant:#CAC4D0;
  --bg:#F5EFF9;
  --shadow:0 1px 2px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:0 4px 12px rgba(0,0,0,.15),0 8px 32px rgba(0,0,0,.10);
  --accent-frontal:#5B7CFA; --accent-parietal:#2FB79B;
  --accent-temporal:#F29B30; --accent-occipital:#A96BF0;
}
[data-theme="dark"]{
  --primary:#D0BCFF; --on-primary:#381E72;
  --primary-container:#4F378B; --on-primary-container:#EADDFF;
  --secondary-container:#4A4458; --on-secondary-container:#E8DEF8;
  --surface:#141218; --surface-container:#211F26; --surface-container-high:#2B2930;
  --surface-container-low:#1D1B20;
  --on-surface:#E6E0E9; --on-surface-variant:#CAC4D0;
  --outline:#938F99; --outline-variant:#49454F;
  --bg:#0F0D13;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
  --shadow-lg:0 4px 12px rgba(0,0,0,.6),0 8px 32px rgba(0,0,0,.5);
  --accent-frontal:#8FA6FF; --accent-parietal:#5FD9C0;
  --accent-temporal:#FFBB66; --accent-occipital:#C79BFF;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--on-surface);
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
svg{width:24px;height:24px;fill:currentColor;display:block}
button{font-family:inherit}
.app{display:grid;grid-template-rows:64px 1fr;height:100dvh}
.app-bar{
  display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--surface-container);color:var(--on-surface);
  border-bottom:1px solid var(--outline-variant);
  z-index:40;position:relative;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{
  width:36px;height:36px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--primary),var(--accent-occipital));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;
  box-shadow:var(--shadow);
}
.brand h1{font-size:17px;font-weight:500;margin:0;letter-spacing:.1px;white-space:nowrap;}
.brand small{display:block;font-size:11px;color:var(--on-surface-variant);font-weight:400}
.spacer{flex:1}
.icon-btn{
  width:44px;height:44px;border-radius:50%;border:none;background:transparent;
  color:var(--on-surface-variant);display:grid;place-items:center;cursor:pointer;
  transition:background .18s ease,color .18s ease;position:relative;flex:none;
}
.icon-btn:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.icon-btn:active{background:color-mix(in srgb,var(--on-surface) 14%,transparent)}
.icon-btn.active{color:var(--primary);background:var(--secondary-container)}
.body{display:grid;grid-template-columns:296px 1fr 372px;overflow:hidden;position:relative}
.drawer{
  background:var(--surface-container-low);border-right:1px solid var(--outline-variant);
  overflow-y:auto;padding:16px 12px 28px;scrollbar-width:thin;
}
.drawer-title{
  font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--on-surface-variant);padding:8px 12px 10px;
}
.region-item{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:12px;border-radius:16px;border:none;background:transparent;
  cursor:pointer;text-align:left;color:var(--on-surface);
  transition:background .18s ease,transform .12s ease;
}
.region-item:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
.region-item:active{transform:scale(.985)}
.region-item.selected{background:var(--secondary-container);color:var(--on-secondary-container)}
.region-dot{
  width:14px;height:14px;border-radius:50%;flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,currentColor 12%,transparent);
}
.region-item .txt{min-width:0}
.region-item .txt b{display:block;font-size:14px;font-weight:500}
.region-item .txt span{
  display:block;font-size:11.5px;opacity:.7;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.legend{margin-top:18px;padding:14px 12px;border-top:1px solid var(--outline-variant)}
.legend-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--on-surface-variant);padding:5px 0}
.legend-row i{width:10px;height:10px;border-radius:3px;flex:none;font-style:normal}
.viewport{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb,var(--primary) 9%,transparent), transparent 62%),
    var(--bg);
}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.overlay-top{
  position:absolute;top:14px;left:14px;right:14px;
  display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;
}
.chip{
  pointer-events:auto;
  display:inline-flex;align-items:center;gap:7px;
  height:34px;padding:0 14px;border-radius:10px;
  border:1px solid var(--outline-variant);
  background:color-mix(in srgb,var(--surface) 82%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--on-surface-variant);font-size:12.5px;font-weight:500;
  cursor:pointer;transition:all .18s ease;white-space:nowrap;
}
.chip:hover{border-color:var(--outline);color:var(--on-surface)}
.chip.on{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5;font-style:normal;transition:opacity .18s}
.chip.on i{opacity:1}
.hint{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:11.5px;color:var(--on-surface-variant);
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:8px 16px;border-radius:20px;border:1px solid var(--outline-variant);
  pointer-events:none;text-align:center;max-width:90%;
}
.tooltip{
  position:absolute;pointer-events:none;z-index:20;
  padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;
  background:var(--surface-container-high);color:var(--on-surface);
  border:1px solid var(--outline-variant);box-shadow:var(--shadow);
  transform:translate(-50%,-140%);opacity:0;transition:opacity .15s ease;
  white-space:nowrap;
}
.tooltip.show{opacity:1}
.panel{
  background:var(--surface-container-low);border-left:1px solid var(--outline-variant);
  display:flex;flex-direction:column;overflow:hidden;
}
.tabs{display:flex;padding:8px 8px 0;gap:4px;border-bottom:1px solid var(--outline-variant);flex:none}
.tab{
  flex:1;padding:14px 8px 12px;border:none;background:transparent;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--on-surface-variant);
  border-bottom:3px solid transparent;transition:color .18s,border-color .18s;
  margin-bottom:-1px;border-radius:12px 12px 0 0;
}
.tab:hover{background:color-mix(in srgb,var(--on-surface) 5%,transparent)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.panel-scroll{overflow-y:auto;padding:20px;flex:1;scrollbar-width:thin}
.pane{display:none}
.pane.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.region-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.region-head .big-dot{
  width:44px;height:44px;border-radius:14px;flex:none;
  display:grid;place-items:center;font-size:19px;font-weight:700;color:#fff;
  box-shadow:var(--shadow);
}
.region-head h2{margin:0;font-size:20px;font-weight:500;line-height:1.2}
.region-head .latin{margin:3px 0 0;font-size:12px;font-style:italic;color:var(--on-surface-variant)}
.desc{font-size:13.5px;line-height:1.65;color:var(--on-surface-variant);margin:0 0 20px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.stat-card{
  background:var(--surface-container);border-radius:14px;padding:12px 14px;
  border:1px solid var(--outline-variant);
}
.stat-card span{display:block;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--on-surface-variant);margin-bottom:4px}
.stat-card b{font-size:14px;font-weight:500}
.section-h{
  font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--on-surface-variant);margin:0 0 10px;
}
.fn-list{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 22px;padding:0;list-style:none}
.fn-list li{
  font-size:12px;padding:6px 12px;border-radius:8px;
  background:var(--secondary-container);color:var(--on-secondary-container);
}
.sub-list{margin:0 0 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.sub-item{
  display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;
  border-radius:12px;border:1px solid var(--outline-variant);
  background:var(--surface-container);cursor:pointer;text-align:left;
  color:var(--on-surface);font-size:13px;
  transition:all .16s ease;
}
.sub-item:hover{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,transparent)}
.sub-item .pin{width:9px;height:9px;border-radius:50%;flex:none;background:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.sub-item .go{margin-left:auto;opacity:.4;font-size:11px}
.empty{text-align:center;padding:56px 20px;color:var(--on-surface-variant);}
.empty .ico{
  width:64px;height:64px;margin:0 auto 18px;border-radius:20px;
  background:var(--surface-container);display:grid;place-items:center;
}
.empty .ico svg{width:32px;height:32px;opacity:.55}
.empty p{margin:0;font-size:13.5px;line-height:1.6}
.param{margin-bottom:24px}
.param-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:10px}
.param-head label{font-size:13.5px;font-weight:500}
.param-head .val{
  font-size:12.5px;font-weight:700;color:var(--primary);
  font-variant-numeric:tabular-nums;background:var(--secondary-container);
  padding:2px 9px;border-radius:7px;
}
.param .sub{font-size:11.5px;color:var(--on-surface-variant);margin:7px 0 0;line-height:1.5}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;
  background:transparent;cursor:pointer;display:block;
}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--primary) var(--p,50%),var(--outline-variant) var(--p,50%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--primary);margin-top:-7px;border:none;
  box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .12s ease;
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.22)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--outline-variant)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--primary)}
input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:var(--primary);border:none;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.meter{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.meter-row{display:flex;align-items:center;gap:12px;font-size:12.5px}
.meter-row .name{width:112px;color:var(--on-surface-variant);flex:none}
.meter-bar{flex:1;height:7px;border-radius:4px;background:var(--surface-container-high);overflow:hidden}
.meter-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--accent-occipital));transition:width .3s ease}
.meter-row b{width:42px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.note{
  font-size:11.5px;line-height:1.6;color:var(--on-surface-variant);
  background:var(--surface-container);border-left:3px solid var(--primary);
  padding:12px 14px;border-radius:0 10px 10px 0;margin-top:8px;
}
@media (max-width:1240px){
  .body{grid-template-columns:1fr 348px}
  .drawer{
    position:fixed;top:64px;bottom:0;left:0;width:296px;z-index:35;
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow-lg);background:var(--surface-container-low);
  }
  .drawer.open{transform:none}
  .scrim{
    position:fixed;inset:64px 0 0 0;background:rgba(0,0,0,.42);z-index:34;
    opacity:0;pointer-events:none;transition:opacity .28s ease;
  }
  .scrim.show{opacity:1;pointer-events:auto}
  #menuBtn{display:grid!important}
}
@media (min-width:1241px){
  #menuBtn{display:none}
  .scrim{display:none}
}
@media (max-width:880px){
  .body{grid-template-columns:1fr}
  .panel{
    position:fixed;top:64px;bottom:0;right:0;width:min(380px,92vw);z-index:35;
    transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow-lg);background:var(--surface-container-low);
  }
  .panel.open{transform:none}
  #panelBtn{display:grid!important}
  .brand small{display:none}
}
@media (min-width:881px){
  #panelBtn{display:none}
}
@media (max-width:520px){
  .app{grid-template-rows:56px 1fr}
  .brand h1{font-size:15px}
  .overlay-top{gap:6px;top:10px;left:10px;right:10px}
  .chip{height:32px;padding:0 11px;font-size:11.5px}
  .hint{font-size:10.5px;padding:6px 12px;bottom:10px}
  .panel-scroll{padding:16px}
}
</style>
</head>
<body>

<div class="app">
  <header class="app-bar">
    <button class="icon-btn" id="menuBtn" aria-label="Меню">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <div class="brand">
      <div class="brand-logo">NC</div>
      <div>
        <h1>NeuroCortex</h1>
        <small>Интерактивный атлас коры головного мозга</small>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" aria-label="Сменить тему">
      <svg viewBox="0 0 24 24" id="themeIcon"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A6.5 6.5 0 0 1 12 3z"/></svg>
    </button>
    <button class="icon-btn" id="panelBtn" aria-label="Панель">
      <svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2V7zm0 4h2v6h-2v-6zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
    </button>
  </header>

  <div class="body">
    <nav class="drawer" id="drawer">
      <div class="drawer-title">Доли коры</div>
      <div id="regionList"></div>
      <div class="legend">
        <div class="drawer-title" style="padding:0 0 8px">Легенда</div>
        <div class="legend-row"><i style="background:var(--accent-frontal)"></i>Лобная доля</div>
        <div class="legend-row"><i style="background:var(--accent-parietal)"></i>Теменная доля</div>
        <div class="legend-row"><i style="background:var(--accent-temporal)"></i>Височная доля</div>
        <div class="legend-row"><i style="background:var(--accent-occipital)"></i>Затылочная доля</div>
      </div>
    </nav>

    <main class="viewport" id="viewport">
      <canvas id="scene"></canvas>
      <div class="overlay-top">
        <button class="chip on" data-toggle="markers"><i></i>Зоны коры</button>
        <button class="chip" data-toggle="pathways"><i></i>Проводящие пути</button>
        <button class="chip on" data-toggle="endings"><i></i>Нервные окончания</button>
        <button class="chip" data-toggle="rotate"><i></i>Автоповорот</button>
      </div>
      <div class="tooltip" id="tooltip"></div>
      <div class="hint">Вращение — перетаскивание · Масштаб — колесо · Выбор области — клик</div>
    </main>

    <aside class="panel" id="panel">
      <div class="tabs">
        <button class="tab active" data-pane="info">Область</button>
        <button class="tab" data-pane="params">Параметры</button>
      </div>
      <div class="panel-scroll">
        <div class="pane active" id="pane-info"></div>
        <div class="pane" id="pane-params"></div>
      </div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const REGIONS = {

    functions: ['Произвольные движения','Планирование','Рабочая память','Речь (зона Брока)','Тормозный контроль','Эмоциональная регуляция'],

    desc: 'Расположена позади центральной борозды. Принимает и интегрирует соматосенсорную информацию, формирует пространственную карту мира и управляет направленным вниманием.',

    stats: { 'Толщина коры':'2.0–2.5 мм', 'Нейронов':'≈ 2.0 млрд', 'Доля коры':'≈ 20 %' }
  },
  temporal: {
    name: 'Височная доля', latin: 'Lobus temporalis',
    color: 0xF29B30, letter: 'T',
    short: 'Слух · память · понимание речи',
    desc: 'Расположена в нижне-боковой части полушария. Содержит первичную слуховую кору, зону Вернике, гиппокамп и миндалину.',
    functions: ['Слуховое восприятие','Понимание речи','Долговременная память','Эмоции','Распознавание лиц','Музыкальное восприятие'],
    stats: { 'Толщина коры':'2.5–3.0 мм', 'Нейронов':'≈ 2.2 млрд', 'Доля коры':'≈ 17 %' }

  occipital: {

    functions: ['Первичная обработка зрения','Цвет и форма','Движение объектов','Ориентация в пространстве','Зрительная память'],
    stats: { 'Толщина коры':'1.5–2.0 мм', 'Нейронов':'≈ 1.4 млрд', 'Доля коры':'≈ 12 %' }
  }
};

const AX = { x: 0.75, y: 0.90, z: 1.10 };

function cortexNoise(x, y, z) {
  const n1 = Math.sin(x * 5.4 + 1.3) * Math.cos(y * 4.6 + 0.7) * Math.sin(z * 5.1 + 2.1);
  const n2 = Math.sin(x * 10.2 + y * 3.1) * Math.cos(z * 8.7 + x * 2.4);
  const n3 = Math.sin(y * 12.6 + z * 3.8) * Math.cos(x * 11.3 + 1.1);
  const n4 = Math.sin(z * 19.0 + y * 7.0) * Math.cos(x * 17.0 + z * 4.0);
  return n1 * 0.52 + n2 * 0.28 + n3 * 0.14 + n4 * 0.06;
}

function brainSurfacePoint(dir, offset = 0) {
  const v = dir.clone().normalize();
  const n = cortexNoise(v.x * 1.0, v.y * 1.0, v.z * 1.0);
  v.multiplyScalar(1 + n * 0.055 + offset);
  v.x *= AX.x; v.y *= AX.y; v.z *= AX.z;
  return v;
}

function regionAt(p) {
  if (p.y < -0.30 && Math.abs(p.x) > 0.30 && p.z > -0.70) return 'temporal';
  if (p.z < -0.55) return 'occipital';
  if (p.z > 0.15)  return 'frontal';
  return 'parietal';
}

const geo = new THREE.SphereGeometry(1, 168, 120);
{
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = cortexNoise(v.x, v.y, v.z);
    v.multiplyScalar(1 + n * 0.055);
    v.x *= AX.x; v.y *= AX.y; v.z *= AX.z;
    const gap = 0.032 * Math.exp(-(v.x * v.x) / 0.0045);
    v.x += (v.x >= 0 ? 1 : -1) * gap;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const cnt = pos.count;
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(cnt * 3), 3));
}

endings.renderOrder = 3;
{
  const dummy = new THREE.Object3D();
  const dir = new THREE.Vector3();
  let seed = 1337;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < MAX_ENDINGS; i++) {
    const u = rnd() * 2 - 1;
    const th = rnd() * Math.PI * 2;
    const s = Math.sqrt(1 - u * u);
    dir.set(s * Math.cos(th), u, s * Math.sin(th));
    const p = brainSurfacePoint(dir, 0.012);
    dummy.position.copy(p);
    dummy.scale.setScalar(0.7 + rnd() * 0.9);
    dummy.updateMatrix();
    endings.setMatrixAt(i, dummy.matrix);
  }
  endings.instanceMatrix.needsUpdate = true;
}

function setPointerFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function intersectAll() {
  raycaster.setFromCamera(pointer, camera);
  const objs = [];
  if (markersGroup.visible) objs.push(...markersGroup.children);
  objs.push(brainMesh);
  return raycaster.intersectObjects(objs, false);
}

function pickRegionFromMesh(hit) {
  const local = brainMesh.worldToLocal(hit.point.clone());
  return regionAt(local);
}

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  setPointerFromEvent(e);
  const hits = intersectAll();
  let label = null, regionId = null;

  if (hits.length) {
    const h = hits[0];
    if (h.object.userData.type === 'subarea') {
      const sa = SUBAREAS.find(s => s.id === h.object.userData.id);
      if (sa) { label = sa.name; regionId = sa.region; }
    } else if (h.object === brainMesh) {
      regionId = pickRegionFromMesh(h);
      label = REGIONS[regionId].name;
    }
  }

  if (regionId !== hoveredRegion) {
    hoveredRegion = regionId;
    applyHighlight();
    canvas.style.cursor = regionId ? 'pointer' : 'grab';
  }

  if (label && regionId) {
    const r = canvas.getBoundingClientRect();
    tooltipEl.textContent = label;
    tooltipEl.style.left = (e.clientX - r.left) + 'px';
    tooltipEl.style.top  = (e.clientY - r.top) + 'px';
    tooltipEl.classList.add('show');
  } else {
    tooltipEl.classList.remove('show');
  }
});

canvas.addEventListener('pointerleave', () => {
  tooltipEl.classList.remove('show');
  hoveredRegion = null;
  applyHighlight();
});

let downPos = null;
canvas.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });

canvas.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 6) return;

  setPointerFromEvent(e);
  const hits = intersectAll();
  if (!hits.length) return;

  const h = hits[0];
  if (h.object.userData.type === 'subarea') {
    const sa = SUBAREAS.find(s => s.id === h.object.userData.id);
    if (sa) {
      selectRegion(sa.region, true);
      focusOn(subareaPos[sa.id]);
      highlightSubareaInList(sa.id);
    }
  } else if (h.object === brainMesh) {
    const rid = pickRegionFromMesh(h);
    selectRegion(rid, false);
    focusOn(h.point.clone().multiplyScalar(0.9));
  }
});

function applyHighlight() {
  const arr = geo.attributes.color.array;
  const active = selectedRegion || hoveredRegion;

  if (!active) {
    arr.set(baseColors);
  } else {
    const hi = new THREE.Color(REGIONS[active].color).multiplyScalar(1.55);
    const dim = 0.42;
    for (let i = 0; i < vertexRegion.length; i++) {
      if (vertexRegion[i] === active) {
        arr[i*3] = hi.r; arr[i*3+1] = hi.g; arr[i*3+2] = hi.b;
      } else {
        arr[i*3]   = baseColors[i*3]   * dim;
        arr[i*3+1] = baseColors[i*3+1] * dim;
        arr[i*3+2] = baseColors[i*3+2] * dim;
      }
    }
  }
  geo.attributes.color.needsUpdate = true;

  markerMeshes.forEach(m => {
    const sa = SUBAREAS.find(s => s.id === m.userData.id);
    const on = !active || sa.region === active;
    m.material.opacity = on ? 1 : 0.3;
    m.material.transparent = true;
    m.userData.halo.material.opacity = on ? 0.16 : 0.04;
  });

  if (active) {
    brainMat.emissive.setHex(REGIONS[active].color);
  } else {
    brainMat.emissive.setHex(0x7c5cff);
  }
}

function focusOn(point) {
  const dir = point.clone().normalize();
  const dist = 2.55;
  const toPos = dir.multiplyScalar(dist).add(new THREE.Vector3(0, 0.15, 0));
  camTween = {
    from: camera.position.clone(),
    to: toPos,
    fromT: controls.target.clone(),
    toT: point.clone().multiplyScalar(0.35),
    t: 0
  };
}

function renderParams() {
  const pane = document.getElementById('pane-params');
  pane.innerHTML = `
    <p class="section-h">Нейрофизиологические параметры</p>
    ${PARAM_DEFS.map(d => `
      <div class="param">
        <div class="param-head">
          <label for="p_${d.key}">${d.label}</label>
          <span class="val" id="v_${d.key}">${params[d.key]}${d.unit}</span>
        </div>
        <input type="range" id="p_${d.key}" min="${d.min}" max="${d.max}" value="${params[d.key]}">
        <p class="sub">${d.sub}</p>
      </div>
    `).join('')}
    <p class="section-h" style="margin-top:28px">Нейромедиаторный баланс</p>
    <div class="meter" id="meters"></div>
    <div class="note">
      Параметры влияют на визуализацию: скорость импульсов,
      плотность окончаний и свечение коры.
    </div>
  `;

  PARAM_DEFS.forEach(d => {
    const input = pane.querySelector(`#p_${d.key}`);
    const out   = pane.querySelector(`#v_${d.key}`);
    const sync  = () => {
      const pct = ((input.value - d.min) / (d.max - d.min)) * 100;
      input.style.setProperty('--p', pct + '%');
    };
    sync();
    input.addEventListener('input', () => {
      params[d.key] = +input.value;
      out.textContent = input.value + d.unit;
      sync();
      onParamChange(d.key);
    });
  });

  updateMeters();
}

function updateMeters() {
  const el = document.getElementById('meters');
  if (!el) return;
  const rows = [
    ['Дофамин', params.dopamine],
    ['Серотонин', params.serotonin],
    ['Возбудимость', params.excitability]
  ];
  el.innerHTML = rows.map(([n, v]) => `
    <div class="meter-row">
      <span class="name">${n}</span>
      <span class="meter-bar"><i style="width:${v}%"></i></span>
      <b>${v}%</b>
    </div>
  `).join('');
}

function onParamChange(key) {
  if (key === 'density') {
    endings.count = Math.round(MAX_ENDINGS * (params.density / 100));
    endings.instanceMatrix.needsUpdate = true;
  }
  if (key === 'excitability') {
    brainMat.emissiveIntensity = (params.excitability / 100) * 0.35;
  }
  if (key === 'dopamine' || key === 'serotonin' || key === 'excitability') {
    updateMeters();
  }
  if (key === 'myelin' || key === 'conduction') {
    const f = (params.conduction / 65) * (0.45 + params.myelin / 100 * 0.9);
    pulses.forEach(p => p.speed = 0.10 * f);
  }
}

        <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7zm-1 19h2v1h-2v-1z"/></svg>
      </div>
      <p>Выберите область на 3D-модели<br>или в списке слева,<br>чтобы изучить её строение и функции.</p>
    </div>
  `;
}
renderEmptyInfo();

function selectRegion(id, fromSubarea) {
  selectedRegion = id;
  selectedSubarea = null;

  document.querySelectorAll('.region-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.region === id);
  });

  const r = REGIONS[id];
  const hex = '#' + r.color.toString(16).padStart(6,'0');
  const subs = SUBAREAS.filter(s => s.region === id);

  paneInfo.innerHTML = `
    <div class="region-head">
      <div class="big-dot" style="background:${hex}">${r.letter}</div>
      <div>
        <h2>${r.name}</h2>
        <p class="latin">${r.latin}</p>
      </div>
    </div>
    <p class="desc">${r.desc}</p>

    <p class="section-h">Характеристики</p>
    <div class="stat-grid">
      ${Object.entries(r.stats).map(([k,v]) => `
        <div class="stat-card"><span>${k}</span><b>${v}</b></div>
      `).join('')}
    </div>

    <p class="section-h">Ключевые функции</p>
    <ul class="fn-list">
      ${r.functions.map(f => `<li>${f}</li>`).join('')}
    </ul>

    <p class="section-h">Зоны внутри доли</p>
    <div class="sub-list" id="subList">
      ${subs.map(s => `
        <button class="sub-item" data-sub="${s.id}">
          <span class="pin"></span>
          <span>${s.name}</span>
          <span class="go">→</span>
        </button>
      `).join('')}
    </div>

    <div class="note" id="subNote" style="display:none"></div>
  `;

  paneInfo.querySelectorAll('.sub-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.sub;
      const sa = SUBAREAS.find(s => s.id === sid);
      if (!sa) return;
      selectedSubarea = sid;
      focusOn(subareaPos[sid]);
      highlightSubareaInList(sid);
      const note = document.getElementById('subNote');
      note.style.display = 'block';
      note.innerHTML = `<b>${sa.name}</b><br>${sa.note}`;
    });
  });

  if (!fromSubarea) {
    const note = document.getElementById('subNote');
    if (note) note.style.display = 'none';
  }

  applyHighlight();
  openPanelMobile();
}

function highlightSubareaInList(sid) {
  paneInfo.querySelectorAll('.sub-item').forEach(el => {
    const on = el.dataset.sub === sid;
    el.style.borderColor = on ? 'var(--primary)' : '';
    el.style.background = on ? 'color-mix(in srgb,var(--primary) 12%,transparent)' : '';
  });
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('pane-' + tab.dataset.pane).classList.add('active');
  });
});

const chipState = { markers:true, pathways:false, endings:true, rotate:false };

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const key = chip.dataset.toggle;
    chipState[key] = !chipState[key];
    chip.classList.toggle('on', chipState[key]);
    applyChipState(key);
  });
});

function applyChipState(key) {
  if (key === 'markers') {
    markersGroup.visible = chipState.markers;
  }
  if (key === 'endings') {
    endingsGroup.visible = chipState.endings;
    if (chipState.endings) endings.count = Math.round(MAX_ENDINGS * (params.density / 100));
  }
  if (key === 'pathways') {
    pathwaysGroup.visible = chipState.pathways;
    if (chipState.pathways) {
      brainMat.opacity = 0.30;
      brainMat.depthWrite = false;
      brainMesh.renderOrder = 3;
    } else {
      brainMat.opacity = 1;
      brainMat.depthWrite = true;
      brainMesh.renderOrder = 2;
    }
  }
  if (key === 'rotate') {
    controls.autoRotate = chipState.rotate;
    controls.autoRotateSpeed = 0.9;
  }
}

const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');
const SUN = '<path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 2 3h-4l2-3zm0 20-2-3h4l-2 3zM2 12l3-2v4l-3-2zm20 0-3 2v-4l3 2zM5.6 5.6l3.2.8-2.4 2.4-.8-3.2zm12.8 12.8-3.2-.8 2.4-2.4.8 3.2zM5.6 18.4l.8-3.2 2.4 2.4-3.2.8zm12.8-12.8-.8 3.2-2.4-2.4 3.2-.8z"/>';
const MOON = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A6.5 6.5 0 0 1 12 3z"/>';

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  themeIcon.innerHTML = t === 'dark' ? SUN : MOON;
  try { localStorage.setItem('nc-theme', t); } catch(e){}
}
themeBtn.addEventListener('click', () => {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
try {
  const saved = localStorage.getItem('nc-theme');
  if (saved) setTheme(saved);
  else if (matchMedia('(prefers-color-scheme: dark)').matches) setTheme('dark');
} catch(e){}

const drawer = document.getElementById('drawer');
const panel  = document.getElementById('panel');
const scrim  = document.getElementById('scrim');

function openDrawerMobile(){ drawer.classList.add('open'); scrim.classList.add('show'); }
function closeDrawerMobile(){ drawer.classList.remove('open'); scrim.classList.remove('show'); }
function openPanelMobile(){ if (innerWidth <= 880) panel.classList.add('open'); }

document.getElementById('menuBtn').addEventListener('click', () => {
  panel.classList.remove('open');
  drawer.classList.toggle('open');
  scrim.classList.toggle('show', drawer.classList.contains('open'));
});
document.getElementById('panelBtn').addEventListener('click', () => {
  drawer.classList.remove('open');
  panel.classList.toggle('open');
  scrim.classList.toggle('show', panel.classList.contains('open'));
});
scrim.addEventListener('click', () => {
  closeDrawerMobile();
  panel.classList.remove('open');
});

function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewport);
resize();

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 1.9);
    const e = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }

  if (pathwaysGroup.visible) {
    pulses.forEach(p => {
      p.t = (p.t + dt * p.speed) % 1;
      const pt = p.curve.getPointAt(p.t);
      p.mesh.position.copy(pt);
      const s = 0.8 + Math.sin(p.t * Math.PI) * 0.9;
      p.mesh.scale.setScalar(s);
      p.mesh.material.opacity = 0.35 + Math.sin(p.t * Math.PI) * 0.6;
    });
  }

  if (markersGroup.visible) {
    const s = 1 + Math.sin(t * 2.1) * 0.10;
    markerMeshes.forEach(m => {
      m.scale.setScalar(s);
      const on = !selectedRegion || SUBAREAS.find(x => x.id === m.userData.id).region === selectedRegion;
      m.material.emissiveIntensity = on ? (0.75 + Math.sin(t * 2.1) * 0.35) : 0.05;
    });
  }

  if (endingsGroup.visible) {
    endingsMat.opacity = 0.62 + Math.sin(t * 1.6) * 0.22;
  }

  const baseGlow = (params.excitability / 100) * 0.30;
  const pulseAmt = Math.sin(t * 1.3) * 0.04 * (params.excitability / 100);
  brainMat.emissiveIntensity = baseGlow + pulseAmt;

  controls.update();
  renderer.render(scene, camera);
}

renderParams();
onParamChange('density');
onParamChange('excitability');
onParamChange('conduction');
applyChipState('markers');
applyChipState('endings');
applyHighlight();

camera.position.set(3.6, 2.4, 4.4);
focusOn(new THREE.Vector3(0, 0.15, 0));

animate();
</script>
