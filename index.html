<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NeuroCortex — интерактивный атлас коры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#6750A4; --on-primary:#fff;
  --primary-container:#EADDFF; --on-primary-container:#21005D;
  --secondary-container:#E8DEF8; --on-secondary-container:#1D192B;
  --surface:#FEF7FF; --surface-container:#F3EDF7; --surface-container-high:#ECE6F0;
  --surface-container-low:#F7F2FA;
  --on-surface:#1D1B20; --on-surface-variant:#49454F;
  --outline:#79747E; --outline-variant:#CAC4D0;
  --bg:#F5EFF9;
  --shadow:0 1px 2px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:0 4px 12px rgba(0,0,0,.15),0 8px 32px rgba(0,0,0,.10);
  --accent-frontal:#5B7CFA; --accent-parietal:#2FB79B;
  --accent-temporal:#F29B30; --accent-occipital:#A96BF0;
}
[data-theme="dark"]{
  --primary:#D0BCFF; --on-primary:#381E72;
  --primary-container:#4F378B; --on-primary-container:#EADDFF;
  --secondary-container:#4A4458; --on-secondary-container:#E8DEF8;
  --surface:#141218; --surface-container:#211F26; --surface-container-high:#2B2930;
  --surface-container-low:#1D1B20;
  --on-surface:#E6E0E9; --on-surface-variant:#CAC4D0;
  --outline:#938F99; --outline-variant:#49454F;
  --bg:#0F0D13;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
  --shadow-lg:0 4px 12px rgba(0,0,0,.6),0 8px 32px rgba(0,0,0,.5);
  --accent-frontal:#8FA6FF; --accent-parietal:#5FD9C0;
  --accent-temporal:#FFBB66; --accent-occipital:#C79BFF;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--on-surface);
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
  user-select:none;-webkit-user-select:none;
}
svg{width:24px;height:24px;fill:currentColor;display:block}
button{font-family:inherit;border:none;background:none;cursor:pointer}

.app{display:grid;grid-template-rows:64px 1fr;height:100dvh}

.app-bar{
  display:flex;align-items:center;gap:8px;padding:0 8px;
  background:var(--surface-container);color:var(--on-surface);
  border-bottom:1px solid var(--outline-variant);
  z-index:40;position:relative;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{
  width:36px;height:36px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--primary),var(--accent-occipital));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;
  box-shadow:var(--shadow);
}
.brand h1{font-size:16px;font-weight:500;margin:0;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--on-surface-variant);font-weight:400}
.spacer{flex:1}

.icon-btn{
  width:42px;height:42px;border-radius:50%;
  color:var(--on-surface-variant);display:grid;place-items:center;
  transition:background .18s ease,color .18s ease;flex:none;
}
.icon-btn:active{background:color-mix(in srgb,var(--on-surface) 14%,transparent)}

.body{display:grid;grid-template-columns:296px 1fr 372px;overflow:hidden;position:relative}

/* ==== DRAWER ==== */
.drawer{
  background:var(--surface-container-low);border-right:1px solid var(--outline-variant);
  overflow-y:auto;padding:12px 12px 24px;scrollbar-width:thin;
}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 4px 8px 12px;
}
.drawer-head .title{
  font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--on-surface-variant);
}
.close-btn{
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;color:var(--on-surface-variant);
}
.close-btn:active{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
@media (min-width:1241px){ .close-btn{display:none} }

.region-item{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:12px;border-radius:14px;text-align:left;color:var(--on-surface);
  transition:background .18s ease;
}
.region-item:active{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.region-item.selected{background:var(--secondary-container);color:var(--on-secondary-container)}
.region-dot{
  width:14px;height:14px;border-radius:50%;flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,currentColor 12%,transparent);
}
.region-item .txt{min-width:0}
.region-item .txt b{display:block;font-size:14px;font-weight:500}
.region-item .txt span{display:block;font-size:11.5px;opacity:.7;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.legend{margin-top:18px;padding:14px 12px;border-top:1px solid var(--outline-variant)}
.legend-row{display:flex;align-items:center;gap:10px;font-size:12px;
  color:var(--on-surface-variant);padding:5px 0}
.legend-row i{width:10px;height:10px;border-radius:3px;flex:none}

/* ==== VIEWPORT ==== */
.viewport{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb,var(--primary) 10%,transparent), transparent 65%),
    var(--bg);
}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}

.overlay-top{
  position:absolute;top:12px;left:12px;right:12px;
  display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;
  z-index:5;
}
.chip{
  pointer-events:auto;
  display:inline-flex;align-items:center;gap:7px;
  height:34px;padding:0 14px;border-radius:10px;
  border:1px solid var(--outline-variant);
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--on-surface-variant);font-size:12.5px;font-weight:500;
  transition:all .18s ease;white-space:nowrap;
}
.chip.on{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.chip.on i{opacity:1}

.hint{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:11.5px;color:var(--on-surface-variant);
  background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:8px 14px;border-radius:20px;border:1px solid var(--outline-variant);
  pointer-events:none;text-align:center;max-width:90%;z-index:5;
}

.tooltip{
  position:absolute;pointer-events:none;z-index:20;
  padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;
  background:var(--surface-container-high);color:var(--on-surface);
  border:1px solid var(--outline-variant);box-shadow:var(--shadow);
  transform:translate(-50%,-140%);opacity:0;transition:opacity .15s ease;
  white-space:nowrap;
}
.tooltip.show{opacity:1}

/* ==== PANEL ==== */
.panel{
  background:var(--surface-container-low);border-left:1px solid var(--outline-variant);
  display:flex;flex-direction:column;overflow:hidden;
}
.tabs{display:flex;padding:8px 8px 0;gap:4px;
  border-bottom:1px solid var(--outline-variant);flex:none;align-items:center}
.tab{
  flex:1;padding:14px 8px 12px;font-size:13px;font-weight:500;
  color:var(--on-surface-variant);border-bottom:3px solid transparent;
  transition:color .18s,border-color .18s;margin-bottom:-1px;
  border-radius:12px 12px 0 0;
}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.panel-close{
  width:36px;height:36px;border-radius:50%;margin:0 4px 0 0;
  display:grid;place-items:center;color:var(--on-surface-variant);flex:none;
}
.panel-close:active{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
@media (min-width:881px){ .panel-close{display:none} }

.panel-scroll{overflow-y:auto;padding:20px;flex:1;scrollbar-width:thin}
.pane{display:none}
.pane.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.region-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.region-head .big-dot{
  width:44px;height:44px;border-radius:14px;flex:none;
  display:grid;place-items:center;font-size:19px;font-weight:700;color:#fff;
  box-shadow:var(--shadow);
}
.region-head h2{margin:0;font-size:20px;font-weight:500;line-height:1.2}
.region-head .latin{margin:3px 0 0;font-size:12px;font-style:italic;
  color:var(--on-surface-variant)}

.desc{font-size:13.5px;line-height:1.65;color:var(--on-surface-variant);margin:0 0 20px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.stat-card{
  background:var(--surface-container);border-radius:14px;padding:12px 14px;
  border:1px solid var(--outline-variant);
}
.stat-card span{display:block;font-size:10.5px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--on-surface-variant);margin-bottom:4px}
.stat-card b{font-size:14px;font-weight:500}

.section-h{
  font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--on-surface-variant);margin:0 0 10px;
}
.fn-list{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 22px;padding:0;list-style:none}
.fn-list li{font-size:12px;padding:6px 12px;border-radius:8px;
  background:var(--secondary-container);color:var(--on-secondary-container)}

.sub-list{margin:0 0 18px;padding:0;list-style:none;
  display:flex;flex-direction:column;gap:6px}
.sub-item{
  display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;
  border-radius:12px;border:1px solid var(--outline-variant);
  background:var(--surface-container);text-align:left;color:var(--on-surface);
  font-size:13px;transition:all .16s ease;
}
.sub-item:active{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,transparent)}
.sub-item .pin{width:9px;height:9px;border-radius:50%;flex:none;background:var(--primary)}
.sub-item .go{margin-left:auto;opacity:.4;font-size:11px}

.empty{text-align:center;padding:56px 20px;color:var(--on-surface-variant)}
.empty .ico{
  width:64px;height:64px;margin:0 auto 18px;border-radius:20px;
  background:var(--surface-container);display:grid;place-items:center;
}
.empty .ico svg{width:32px;height:32px;opacity:.55}
.empty p{margin:0;font-size:13.5px;line-height:1.6}

.param{margin-bottom:24px}
.param-head{display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:9px;gap:10px}
.param-head label{font-size:13.5px;font-weight:500}
.param-head .val{
  font-size:12.5px;font-weight:700;color:var(--primary);
  background:var(--secondary-container);padding:2px 9px;border-radius:7px;
}
.param .sub{font-size:11.5px;color:var(--on-surface-variant);margin:7px 0 0;line-height:1.5}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;
  background:transparent;display:block;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--primary) var(--p,50%),var(--outline-variant) var(--p,50%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--primary);margin-top:-8px;border:none;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--outline-variant)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--primary)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
  background:var(--primary);border:none}

.meter{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.meter-row{display:flex;align-items:center;gap:12px;font-size:12.5px}
.meter-row .name{width:112px;color:var(--on-surface-variant);flex:none}
.meter-bar{flex:1;height:7px;border-radius:4px;
  background:var(--surface-container-high);overflow:hidden}
.meter-bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--primary),var(--accent-occipital));
  transition:width .3s ease}
.meter-row b{width:42px;text-align:right;font-size:12px}

.note{
  font-size:11.5px;line-height:1.6;color:var(--on-surface-variant);
  background:var(--surface-container);border-left:3px solid var(--primary);
  padding:12px 14px;border-radius:0 10px 10px 0;margin-top:8px;
}

/* ==== SCRIM ==== */
.scrim{
  position:fixed;inset:64px 0 0 0;background:rgba(0,0,0,.5);z-index:34;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.scrim.show{opacity:1;pointer-events:auto}

/* ==== RESPONSIVE ==== */
@media (max-width:1240px){
  .body{grid-template-columns:1fr 348px}
  .drawer{
    position:fixed;top:64px;bottom:0;left:0;width:296px;z-index:35;
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow-lg);background:var(--surface-container-low);
  }
  .drawer.open{transform:none}
  #menuBtn{display:grid!important}
}
@media (min-width:1241px){
  #menuBtn{display:none}
  .scrim{display:none}
}
@media (max-width:880px){
  .body{grid-template-columns:1fr}
  .panel{
    position:fixed;top:64px;bottom:0;right:0;width:min(380px,92vw);z-index:35;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow-lg);background:var(--surface-container-low);
  }
  .panel.open{transform:none}
  #panelBtn{display:grid!important}
  .brand small{display:none}
}
@media (min-width:881px){
  #panelBtn{display:none}
}
@media (max-width:520px){
  .app{grid-template-rows:56px 1fr}
  .brand h1{font-size:15px}
  .overlay-top{gap:6px;top:10px;left:10px;right:10px}
  .chip{height:32px;padding:0 11px;font-size:11.5px}
  .hint{font-size:10.5px;padding:6px 12px;bottom:10px}
  .panel-scroll{padding:16px}
  .scrim{inset:56px 0 0 0}
  .drawer,.panel{top:56px}
}
</style>
</head>
<body>

<div class="app">
  <header class="app-bar">
    <button class="icon-btn" id="menuBtn" aria-label="Открыть меню">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <div class="brand">
      <div class="brand-logo">NC</div>
      <div>
        <h1>NeuroCortex</h1>
        <small>Интерактивный атлас коры</small>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" aria-label="Сменить тему">
      <svg viewBox="0 0 24 24" id="themeIcon"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A6.5 6.5 0 0 1 12 3z"/></svg>
    </button>
    <button class="icon-btn" id="panelBtn" aria-label="Открыть панель">
      <svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2V7zm0 4h2v6h-2v-6zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
    </button>
  </header>

  <div class="body">
    <nav class="drawer" id="drawer">
      <div class="drawer-head">
        <span class="title">Доли коры</span>
        <button class="close-btn" id="closeDrawer" aria-label="Закрыть меню">
          <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div id="regionList"></div>
      <div class="legend">
        <div class="drawer-head" style="padding:0 4px 8px 12px">
          <span class="title">Легенда</span>
        </div>
        <div class="legend-row"><i style="background:var(--accent-frontal)"></i>Лобная</div>
        <div class="legend-row"><i style="background:var(--accent-parietal)"></i>Теменная</div>
        <div class="legend-row"><i style="background:var(--accent-temporal)"></i>Височная</div>
        <div class="legend-row"><i style="background:var(--accent-occipital)"></i>Затылочная</div>
      </div>
    </nav>

    <main class="viewport" id="viewport">
      <canvas id="scene"></canvas>
      <div class="overlay-top">
        <button class="chip on" data-toggle="markers"><i></i>Зоны коры</button>
        <button class="chip" data-toggle="pathways"><i></i>Проводящие пути</button>
        <button class="chip on" data-toggle="endings"><i></i>Окончания</button>
        <button class="chip" data-toggle="rotate"><i></i>Автоповорот</button>
      </div>
      <div class="tooltip" id="tooltip"></div>
      <div class="hint">Вращение — перетаскивание · Масштаб — щипок · Выбор — клик</div>
    </main>

    <aside class="panel" id="panel">
      <div class="tabs">
        <button class="tab active" data-pane="info">Область</button>
        <button class="tab" data-pane="params">Параметры</button>
        <button class="panel-close" id="closePanel" aria-label="Закрыть панель">
          <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="panel-scroll">
        <div class="pane active" id="pane-info"></div>
        <div class="pane" id="pane-params"></div>
      </div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<script type="importmap">

  "imports": {

  }
}
</script>

// Полуоси эллипсоида мозга (реальные пропорции)
const AX = { x: 0.78, y: 0.92, z: 1.12 };

// Многослойный шум — имитирует и крупные извилины, и мелкие борозды
function cortexNoise(x, y, z) {
  // Крупные извилины (низкая частота)
  const n1 = Math.sin(x * 5.4 + 1.3) * Math.cos(y * 4.6 + 0.7) * Math.sin(z * 5.1 + 2.1) * 0.55;
  // Средние борозды
  const n2 = Math.sin(x * 10.2 + y * 3.1) * Math.cos(z * 8.7 + x * 2.4) * 0.28;
  // Мелкие складки
  const n3 = Math.sin(y * 14.6 + z * 5.8) * Math.cos(x * 12.3 + 1.1) * 0.13;
  // Микрорельеф
  const n4 = Math.sin(z * 22.0 + y * 8.0) * Math.cos(x * 19.0 + z * 4.0) * 0.06;

  // Дополнительный шум для «мозгового» вида
  const n5 = Math.sin(x * 7.5 + z * 6.2) * Math.cos(y * 8.4) * 0.15;

  return n1 + n2 + n3 + n4 + n5;
}

// Точка на поверхности мозга с учётом шума
function brainSurfacePoint(dir, offset = 0) {
  const v = dir.clone().normalize();
  const n = cortexNoise(v.x, v.y, v.z);
  v.multiplyScalar(1 + n * 0.08 + offset);
  v.x *= AX.x; v.y *= AX.y; v.z *= AX.z;
  return v;
}

// Определение доли по локальной координате
function regionAt(p) {
  if (p.y < -0.32 && Math.abs(p.x) > 0.32 && p.z > -0.72) return 'temporal';
  if (p.z < -0.58) return 'occipital';
  if (p.z > 0.12)  return 'frontal';
  return 'parietal';
}

/* --- Основная геометрия коры --- */
// Оптимизация: на мобилке меньше сегментов, на десктопе больше
const SEG_W = isLowPower ? 96 : 140;
const SEG_H = isLowPower ? 72 : 110;

const geo = new THREE.SphereGeometry(1, SEG_W, SEG_H);
{
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = cortexNoise(v.x, v.y, v.z);
    v.multiplyScalar(1 + n * 0.08);
    v.x *= AX.x; v.y *= AX.y; v.z *= AX.z;

    // Продольная щель между полушариями — глубокая
    const gap = 0.045 * Math.exp(-(v.x * v.x) / 0.005);
    v.x += (v.x >= 0 ? 1 : -1) * gap;

    // Слегка приплюснуть снизу (для естественности)
    if (v.y < -0.7) v.y *= 0.92;

    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  geo.setAttribute('color', new THREE.BufferAttribute(
    new Float32Array(pos.count * 3), 3
  ));
}

/* --- PBR-материал в стиле UE5 --- */
const brainMat = new THREE.MeshStandardMaterial({

  transparent: true,
  opacity: 1,
  depthWrite: true,
  emissive: new THREE.Color(0x7c5cff),
  emissiveIntensity: 0.0,
  // Лёгкое «свечение» по краям (Fresnel-подобный эффект)
  envMapIntensity: 0.6
});

const brainMesh = new THREE.Mesh(geo, brainMat);
brainMesh.renderOrder = 2;

/* --- Раскраска вершин по долям --- */
const baseColors = new Float32Array(geo.attributes.position.count * 3);
const vertexRegion = new Array(geo.attributes.position.count);
{
  const pos = geo.attributes.position;
  const p = new THREE.Vector3();
  const c = new THREE.Color();
  const regColors = {};
  for (const k in REGIONS) regColors[k] = new THREE.Color(REGIONS[k].color);

  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i);
    const r = regionAt(p);
    vertexRegion[i] = r;
    c.copy(regColors[r]);
    baseColors[i*3]   = c.r;
    baseColors[i*3+1] = c.g;
    baseColors[i*3+2] = c.b;
  }
  geo.attributes.color.array.set(baseColors);
  geo.attributes.color.needsUpdate = true;
}

/* --- Мозжечок с бороздами --- */
{
  const cgSeg = isLowPower ? 48 : 72;

  const pos = cg.attributes.position;

  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    // Ритмичные борозды (как у мозжечка)
    const n = Math.sin(v.x * 20) * Math.cos(v.z * 18) * 0.05
            + Math.sin(v.y * 8 + v.x * 6) * 0.025;
    v.multiplyScalar(1 + n);
    v.x *= 0.36; v.y *= 0.26; v.z *= 0.32;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  cg.computeVertexNormals();
  const cm = new THREE.MeshStandardMaterial({
    color: 0x9aa7c7, roughness: 0.75, metalness: 0.05,
    transparent: true, opacity: 0.95
  });
  const cerebellum = new THREE.Mesh(cg, cm);
  cerebellum.position.set(0, -0.52, -0.74);
  cerebellum.renderOrder = 2;
  brainGroup.add(cerebellum);
}

/* --- Ствол мозга --- */
{

const pathwaysGroup = new THREE.Group();

const pathCurves = [];
const pathColor = new THREE.Color(0x9b7cff);
const pulseColor = new THREE.Color(0xffc23d);

PATHWAYS.forEach(pw => {
  const a = subareaPos[pw.a];
  const b = subareaPos[pw.b];
  if (!a || !b) return;
  const mid = a.clone().add(b).multiplyScalar(0.5).multiplyScalar(0.68);
  const curve = new THREE.CatmullRomCurve3([a.clone(), mid, b.clone()]);

  const tubeGeo = new THREE.TubeGeometry(curve, 60, 0.011, 6, false);
  const tubeMat = new THREE.MeshBasicMaterial({
    color: pathColor, transparent: true, opacity: 0.5, depthWrite: false
  });
  const tube = new THREE.Mesh(tubeGeo, tubeMat);
  tube.renderOrder = 1;
  pathwaysGroup.add(tube);
  pathCurves.push({ curve, a: pw.a, b: pw.b, name: pw.name });
});

const pulseGeo = new THREE.SphereGeometry(0.028, 10, 10);
const pulses = [];
pathCurves.forEach((pc, idx) => {
  const n = 2;
  for (let i = 0; i < n; i++) {
    const mat = new THREE.MeshBasicMaterial({
      color: pulseColor, transparent: true, opacity: 0.95, depthWrite: false
    });
    const mesh = new THREE.Mesh(pulseGeo, mat);
    mesh.renderOrder = 1;
    pathwaysGroup.add(mesh);
    pulses.push({ curve: pc.curve, t: (i / n + idx * 0.13) % 1, mesh, speed: 0.11 });
  }
});

endings.renderOrder = 3;
{
  const dummy = new THREE.Object3D();
  const dir = new THREE.Vector3();
  let seed = 1337;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

  for (let i = 0; i < MAX_ENDINGS; i++) {
    const u = rnd() * 2 - 1;
    const th = rnd() * Math.PI * 2;
    const s = Math.sqrt(1 - u * u);
    dir.set(s * Math.cos(th), u, s * Math.sin(th));
    const p = brainSurfacePoint(dir, 0.012);
    dummy.position.copy(p);
    dummy.scale.setScalar(0.7 + rnd() * 0.9);
    dummy.updateMatrix();
    endings.setMatrixAt(i, dummy.matrix);
  }
  endings.instanceMatrix.needsUpdate = true;
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tooltipEl = document.getElementById('tooltip');

let selectedRegion = null;
let selectedSubarea = null;
let hoveredRegion = null;
let camTween = null;

function setPointerFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function intersectAll() {
  raycaster.setFromCamera(pointer, camera);
  const objs = [];
  if (markersGroup.visible) objs.push(...markersGroup.children);
  objs.push(brainMesh);
  return raycaster.intersectObjects(objs, false);
}

function pickRegionFromMesh(hit) {
  const local = brainMesh.worldToLocal(hit.point.clone());
  return regionAt(local);
}

/* Hover (только на десктопе) */
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  setPointerFromEvent(e);
  const hits = intersectAll();
  let label = null, regionId = null;

  if (hits.length) {
    const h = hits[0];
    if (h.object.userData.type === 'subarea') {
      const sa = SUBAREAS.find(s => s.id === h.object.userData.id);
      if (sa) { label = sa.name; regionId = sa.region; }
    } else if (h.object === brainMesh) {
      regionId = pickRegionFromMesh(h);
      label = REGIONS[regionId].name;
    }
  }

  if (regionId !== hoveredRegion) {
    hoveredRegion = regionId;
    applyHighlight();
    canvas.style.cursor = regionId ? 'pointer' : 'grab';
  }

  if (label && regionId) {
    const r = canvas.getBoundingClientRect();
    tooltipEl.textContent = label;
    tooltipEl.style.left = (e.clientX - r.left) + 'px';
    tooltipEl.style.top  = (e.clientY - r.top) + 'px';
    tooltipEl.classList.add('show');
  } else {
    tooltipEl.classList.remove('show');
  }
});

canvas.addEventListener('pointerleave', () => {
  tooltipEl.classList.remove('show');
  hoveredRegion = null;
  applyHighlight();
});

/* Click / tap */
let downPos = null;
canvas.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 8) return;

  setPointerFromEvent(e);
  const hits = intersectAll();
  if (!hits.length) {
    // клик мимо модели — снимаем выделение
    if (selectedRegion) {
      selectedRegion = null;
      applyHighlight();
      renderEmptyInfo();
      closePanelMobile();
    }
    return;
  }

  const h = hits[0];
  if (h.object.userData.type === 'subarea') {
    const sa = SUBAREAS.find(s => s.id === h.object.userData.id);
    if (sa) {
      selectRegion(sa.region, true);
      focusOn(subareaPos[sa.id]);
      highlightSubareaInList(sa.id);
    }
  } else if (h.object === brainMesh) {
    const rid = pickRegionFromMesh(h);
    selectRegion(rid, false);
    focusOn(h.point.clone().multiplyScalar(0.9));
  }
});

/* --- Подсветка активной доли --- */
function applyHighlight() {
  const arr = geo.attributes.color.array;
  const active = selectedRegion || hoveredRegion;

  if (!active) {
    arr.set(baseColors);
  } else {
    const hi = new THREE.Color(REGIONS[active].color).multiplyScalar(1.45);
    const dim = 0.42;
    for (let i = 0; i < vertexRegion.length; i++) {
      if (vertexRegion[i] === active) {
        arr[i*3]   = hi.r;
        arr[i*3+1] = hi.g;
        arr[i*3+2] = hi.b;
      } else {
        arr[i*3]   = baseColors[i*3]   * dim;
        arr[i*3+1] = baseColors[i*3+1] * dim;
        arr[i*3+2] = baseColors[i*3+2] * dim;
      }
    }
  }
  geo.attributes.color.needsUpdate = true;

  markerMeshes.forEach(m => {
    const sa = SUBAREAS.find(s => s.id === m.userData.id);
    const on = !active || sa.region === active;
    m.material.opacity = on ? 1 : 0.3;
    m.material.transparent = true;
    m.userData.halo.material.opacity = on ? 0.18 : 0.04;
  });

  // Цвет свечения под активную долю
  if (active) {
    brainMat.emissive.setHex(REGIONS[active].color);
  } else {
    brainMat.emissive.setHex(0x7c5cff);
  }
}

/* --- Фокусировка камеры --- */
function focusOn(point) {
  const dir = point.clone().normalize();
  const dist = 2.6;
  const toPos = dir.multiplyScalar(dist).add(new THREE.Vector3(0, 0.15, 0));
  camTween = {
    from: camera.position.clone(),
    to: toPos,
    fromT: controls.target.clone(),
    toT: point.clone().multiplyScalar(0.35),
    t: 0
  };
}

  { key:'conduction',   label:'Скорость проведения', min:1,  max:120, unit:' м/с', sub:'Скорость распространения потенциала действия по аксону.' },
  { key:'myelin',       label:'Миелинизация',        min:0,  max:100, unit:' %',   sub:'Степень покрытия аксонов миелином.' },
  { key:'density',      label:'Плотность нейронов',  min:5,  max:100, unit:' %',   sub:'Количество нервных окончаний на поверхности.' },
  { key:'excitability', label:'Возбудимость коры',   min:0,  max:100, unit:' %',   sub:'Уровень кортикальной активации.' },
  { key:'dopamine',     label:'Уровень дофамина',    min:0,  max:100, unit:' %',   sub:'Мотивация, подкрепление, моторный контроль.' },
  { key:'serotonin',    label:'Уровень серотонина',  min:0,  max:100, unit:' %',   sub:'Настроение, сон, аппетит.' }
];

function renderParams() {
  const pane = document.getElementById('pane-params');
  pane.innerHTML = `
    <p class="section-h">Нейрофизиологические параметры</p>
    ${PARAM_DEFS.map(d => `
      <div class="param">
        <div class="param-head">
          <label for="p_${d.key}">${d.label}</label>
          <span class="val" id="v_${d.key}">${params[d.key]}${d.unit}</span>
        </div>
        <input type="range" id="p_${d.key}" min="${d.min}" max="${d.max}" value="${params[d.key]}">
        <p class="sub">${d.sub}</p>
      </div>
    `).join('')}
    <p class="section-h" style="margin-top:28px">Нейромедиаторный баланс</p>
    <div class="meter" id="meters"></div>
    <div class="note">
      Параметры влияют на визуализацию: скорость импульсов,
      плотность окончаний и свечение коры.
    </div>
  `;

  PARAM_DEFS.forEach(d => {
    const input = pane.querySelector(`#p_${d.key}`);
    const out   = pane.querySelector(`#v_${d.key}`);
    const sync  = () => {
      const pct = ((input.value - d.min) / (d.max - d.min)) * 100;
      input.style.setProperty('--p', pct + '%');
    };
    sync();
    input.addEventListener('input', () => {
      params[d.key] = +input.value;
      out.textContent = input.value + d.unit;
      sync();
      onParamChange(d.key);
    });
  });

  updateMeters();
}

function updateMeters() {
  const el = document.getElementById('meters');
  if (!el) return;
  const rows = [
    ['Дофамин', params.dopamine],
    ['Серотонин', params.serotonin],
    ['Возбудимость', params.excitability]
  ];
  el.innerHTML = rows.map(([n, v]) => `
    <div class="meter-row">
      <span class="name">${n}</span>
      <span class="meter-bar"><i style="width:${v}%"></i></span>
      <b>${v}%</b>
    </div>
  `).join('');
}

function onParamChange(key) {
  if (key === 'density') {
    endings.count = Math.round(MAX_ENDINGS * (params.density / 100));
    endings.instanceMatrix.needsUpdate = true;
  }
  if (key === 'excitability') {
    brainMat.emissiveIntensity = (params.excitability / 100) * 0.35;
  }
  if (key === 'dopamine' || key === 'serotonin' || key === 'excitability') {
    updateMeters();
  }
  if (key === 'myelin' || key === 'conduction') {
    const f = (params.conduction / 65) * (0.45 + params.myelin / 100 * 0.9);
    pulses.forEach(p => p.speed = 0.10 * f);
  }
}

/* ==========================================================================
   10. UI — список долей, панель информации

const regionListEl = document.getElementById('regionList');
Object.entries(REGIONS).forEach(([id, r]) => {

    <span class="txt"><b>${r.name}</b><span>${r.short}</span></span>

      id === 'frontal'  ? new THREE.Vector3(-0.2, 0.3, 0.8) :

function renderEmptyInfo() {

    <div class="empty">

renderEmptyInfo();

function selectRegion(id, fromSubarea) {
  selectedRegion = id;
  selectedSubarea = null;

  document.querySelectorAll('.region-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.region === id);
  });

  const r = REGIONS[id];
  const hex = '#' + r.color.toString(16).padStart(6,'0');
  const subs = SUBAREAS.filter(s => s.region === id);

  paneInfo.innerHTML = `
    <div class="region-head">
      <div class="big-dot" style="background:${hex}">${r.letter}</div>
      <div>
        <h2>${r.name}</h2>
        <p class="latin">${r.latin}</p>
      </div>
    </div>
    <p class="desc">${r.desc}</p>

    <p class="section-h">Характеристики</p>
    <div class="stat-grid">
      ${Object.entries(r.stats).map(([k,v]) => `
        <div class="stat-card"><span>${k}</span><b>${v}</b></div>
      `).join('')}
    </div>

    <p class="section-h">Ключевые функции</p>
    <ul class="fn-list">
      ${r.functions.map(f => `<li>${f}</li>`).join('')}
    </ul>

    <p class="section-h">Зоны внутри доли</p>
    <div class="sub-list" id="subList">
      ${subs.map(s => `
        <button class="sub-item" data-sub="${s.id}">
          <span class="pin"></span>
          <span>${s.name}</span>
          <span class="go">→</span>
        </button>
      `).join('')}
    </div>

    <div class="note" id="subNote" style="display:none"></div>
  `;

  paneInfo.querySelectorAll('.sub-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.sub;
      const sa = SUBAREAS.find(s => s.id === sid);
      if (!sa) return;
      selectedSubarea = sid;
      focusOn(subareaPos[sid]);
      highlightSubareaInList(sid);
      const note = document.getElementById('subNote');
      note.style.display = 'block';
      note.innerHTML = `<b>${sa.name}</b><br>${sa.note}`;
    });
  });

  if (!fromSubarea) {
    const note = document.getElementById('subNote');
    if (note) note.style.display = 'none';
  }

  applyHighlight();
  openPanelMobile();
}

function highlightSubareaInList(sid) {
  paneInfo.querySelectorAll('.sub-item').forEach(el => {
    const on = el.dataset.sub === sid;
    el.style.borderColor = on ? 'var(--primary)' : '';
    el.style.background = on ? 'color-mix(in srgb,var(--primary) 12%,transparent)' : '';
  });
}

/* --- Табы --- */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('pane-' + tab.dataset.pane).classList.add('active');
  });

/* --- Чипы-переключатели --- */
const chipState = { markers:true, pathways:false, endings:true, rotate:false };

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const key = chip.dataset.toggle;
    chipState[key] = !chipState[key];
    chip.classList.toggle('on', chipState[key]);
    applyChipState(key);
  });
});

function applyChipState(key) {
  if (key === 'markers') markersGroup.visible = chipState.markers;
  if (key === 'endings') {
    endingsGroup.visible = chipState.endings;
    if (chipState.endings) endings.count = Math.round(MAX_ENDINGS * (params.density / 100));
  }
  if (key === 'pathways') {
    pathwaysGroup.visible = chipState.pathways;
    if (chipState.pathways) {
      brainMat.opacity = 0.32;
      brainMat.depthWrite = false;
      brainMesh.renderOrder = 3;
    } else {
      brainMat.opacity = 1;
      brainMat.depthWrite = true;
      brainMesh.renderOrder = 2;
    }
  }
  if (key === 'rotate') {
    controls.autoRotate = chipState.rotate;
    controls.autoRotateSpeed = 0.9;
  }
}

/* ==========================================================================
   12. БОКОВЫЕ ПАНЕЛИ + СВАЙПЫ + КНОПКИ ЗАКРЫТИЯ

const drawer = document.getElementById('drawer');
const panel  = document.getElementById('panel');
const scrim  = document.getElementById('scrim');

function openDrawerMobile(){
  drawer.classList.add('open');
  panel.classList.remove('open');
  scrim.classList.add('show');
}
function closeDrawerMobile(){
  drawer.classList.remove('open');
  if (!panel.classList.contains('open')) scrim.classList.remove('show');
}
function openPanelMobile(){
  if (innerWidth <= 880) {
    panel.classList.add('open');
    drawer.classList.remove('open');
    scrim.classList.add('show');
  }
}
function closePanelMobile(){
  panel.classList.remove('open');
  if (!drawer.classList.contains('open')) scrim.classList.remove('show');
}

/* Открытие через app bar */
document.getElementById('menuBtn').addEventListener('click', () => {
  if (drawer.classList.contains('open')) closeDrawerMobile();
  else openDrawerMobile();
});
document.getElementById('panelBtn').addEventListener('click', () => {
  if (panel.classList.contains('open')) closePanelMobile();
  else openPanelMobile();
});

/* Кнопки ✕ внутри панелей */
document.getElementById('closeDrawer').addEventListener('click', closeDrawerMobile);

/* Клик по затемнению — закрываем всё */
scrim.addEventListener('click', () => {

});

/* --- Свайпы для закрытия панелей --- */
function addSwipeClose(el, direction, onClose) {
  let startX = 0, startY = 0, tracking = false;

  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    tracking = true;
  }, { passive: true });

  el.addEventListener('touchmove', (e) => {
    if (!tracking) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;

    // Свайп вправо (для drawer) — dx > 50
    if (direction === 'right' && dx > 50 && Math.abs(dy) < 80) {
      tracking = false;
      onClose();
    }
    // Свайп влево (для panel) — dx < -50
    if (direction === 'left' && dx < -50 && Math.abs(dy) < 80) {
      tracking = false;
      onClose();
    }
  }, { passive: true });

  el.addEventListener('touchend', () => { tracking = false; }, { passive: true });
}

addSwipeClose(drawer, 'right', closeDrawerMobile);
addSwipeClose(panel, 'left', closePanelMobile);

/* Escape для десктопа */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeDrawerMobile();
    closePanelMobile();
    if (selectedRegion) {
      selectedRegion = null;
      applyHighlight();
      renderEmptyInfo();
    }
  }
});

/* ==========================================================================
   13. РАЗМЕР И АНИМАЦИЯ
   ========================================================================== */
function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewport);
resize();

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Плавная камера
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 1.9);
    const e = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }

  // Импульсы по путям
  if (pathwaysGroup.visible) {
    pulses.forEach(p => {
      p.t = (p.t + dt * p.speed) % 1;
      const pt = p.curve.getPointAt(p.t);
      p.mesh.position.copy(pt);
      const s = 0.8 + Math.sin(p.t * Math.PI) * 0.9;
      p.mesh.scale.setScalar(s);
      p.mesh.material.opacity = 0.35 + Math.sin(p.t * Math.PI) * 0.6;
    });
  }

  // Пульсация маркеров
  if (markersGroup.visible) {
    const s = 1 + Math.sin(t * 2.1) * 0.10;
    markerMeshes.forEach(m => {
      m.scale.setScalar(s);
      const on = !selectedRegion || SUBAREAS.find(x => x.id === m.userData.id).region === selectedRegion;
      m.material.emissiveIntensity = on ? (0.9 + Math.sin(t * 2.1) * 0.4) : 0.05;
    });
  }

  // Мерцание окончаний
  if (endingsGroup.visible) {
    endingsMat.opacity = 0.62 + Math.sin(t * 1.6) * 0.22;
  }

  // Свечение коры от возбудимости
  const baseGlow = (params.excitability / 100) * 0.30;
  const pulseAmt = Math.sin(t * 1.3) * 0.04 * (params.excitability / 100);
  brainMat.emissiveIntensity = baseGlow + pulseAmt;

  // Лёгкое «дыхание» bottomLight
  bottomLight.intensity = 1.0 + Math.sin(t * 0.8) * 0.3;

  controls.update();
  renderer.render(scene, camera);
}

/* ==========================================================================
   14. ИНИЦИАЛИЗАЦИЯ
   ========================================================================== */
renderParams();
onParamChange('density');
onParamChange('excitability');
onParamChange('conduction');
applyChipState('markers');
applyChipState('endings');
applyHighlight();

camera.position.set(3.6, 2.4, 4.4);
focusOn(new THREE.Vector3(0, 0.15, 0));

animate();
</script>
