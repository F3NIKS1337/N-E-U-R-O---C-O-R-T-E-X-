<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>NeuralMap 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;--bg-1:#0f0f11;--bg-2:#15151a;--bg-3:#1a1a20;
  --panel:#14141a;--border:rgba(255,255,255,0.06);--border-hi:rgba(255,255,255,0.12);
  --text:#f4f4f5;--text-2:#a1a1aa;--text-3:#52525b;
  --accent:#7c5cff;--accent-2:#a78bfa;--accent-glow:rgba(124,92,255,0.4);
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;
  --frontal:#7c5cff;--parietal:#10b981;--temporal:#f59e0b;--occipital:#ec4899;--cerebellum:#64748b;
  --font:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --radius:10px;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}

.app{display:grid;grid-template-rows:52px 1fr;height:100dvh;background:var(--bg);overflow:hidden}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg-1);border-bottom:1px solid var(--border);z-index:100;position:relative}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-icon{width:28px;height:28px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#a78bfa);border-radius:8px;color:#fff}
.brand-icon svg{width:16px;height:16px}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text strong{font-size:13px;font-weight:600;letter-spacing:-0.2px}
.brand-text span{font-size:10px;color:var(--text-3);font-family:var(--mono);letter-spacing:0.3px}
.topbar-sep{width:1px;height:20px;background:var(--border);flex:none}
.topbar-nav{display:flex;gap:2px;flex:1}
.nav-tab{padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--text-2);transition:all .15s ease;white-space:nowrap}
.nav-tab:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.nav-tab.active{color:var(--text);background:rgba(255,255,255,0.06)}
.topbar-actions{display:flex;align-items:center;gap:6px;flex:none}
.lang-switch{display:flex;gap:2px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:6px;padding:2px}
.lang-btn{padding:4px 9px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:0.5px;border-radius:4px;color:var(--text-3);transition:all .15s ease}
.lang-btn.active{background:rgba(124,92,255,0.15);color:var(--accent-2)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--text-2);transition:all .15s ease}
.icon-btn:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.icon-btn svg{width:16px;height:16px}
.mobile-only{display:none}
@media (max-width:900px){.mobile-only{display:grid}}

/* BODY */
.body{display:grid;grid-template-columns:280px 1fr 320px;overflow:hidden;min-height:0}
@media (max-width:1200px){
  .body{grid-template-columns:1fr 320px}
  .panel-left{position:fixed;top:52px;bottom:0;left:0;width:300px;z-index:200;background:var(--panel);transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:20px 0 60px rgba(0,0,0,0.6)}
  .panel-left.open{transform:translateX(0)}
}
@media (max-width:800px){
  .body{grid-template-columns:1fr}
  .panel-right{position:fixed;top:52px;bottom:0;right:0;width:min(340px,90vw);z-index:200;background:var(--panel);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:-20px 0 60px rgba(0,0,0,0.6)}
  .panel-right.open{transform:translateX(0)}
}

/* PANELS */
.panel{overflow-y:auto;padding:16px 14px;min-height:0}
.panel-left{background:var(--bg-1);border-right:1px solid var(--border)}
.panel-right{background:var(--bg-1);border-left:1px solid var(--border)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.panel-head h2{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3)}
.panel-close{width:24px;height:24px;display:grid;place-items:center;border-radius:5px;color:var(--text-3);transition:all .15s ease}
.panel-close:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.panel-close svg{width:14px;height:14px}
@media (min-width:1201px){.panel-left .panel-close{display:none}}
@media (min-width:801px){.panel-right .panel-close{display:none}}

.section{margin-bottom:20px}
.section-title{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;padding-left:2px}

/* REGION LIST */
.region-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px;text-align:left;transition:all .15s ease;margin-bottom:2px;border:1px solid transparent}
.region-item:hover{background:rgba(255,255,255,0.03)}
.region-item.active{background:rgba(124,92,255,0.08);border-color:rgba(124,92,255,0.25)}
.region-dot{width:8px;height:8px;border-radius:50%;flex:none}
.region-item.active .region-dot{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent)}
.region-name{flex:1;font-size:13px;font-weight:500;color:var(--text-2);transition:color .15s ease}
.region-item.active .region-name{color:var(--text)}

/* DISEASE LIST */
.disease-item{display:flex;align-items:flex-start;gap:10px;width:100%;padding:11px 12px;border-radius:8px;text-align:left;transition:all .15s ease;margin-bottom:4px;border:1px solid var(--border);background:rgba(255,255,255,0.01);position:relative;overflow:hidden}
.disease-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--d-color,var(--text-3));opacity:0.3;transition:opacity .15s ease}
.disease-item:hover{background:rgba(255,255,255,0.03)}
.disease-item.active{border-color:color-mix(in srgb,var(--d-color) 40%,transparent);background:color-mix(in srgb,var(--d-color) 5%,transparent)}
.disease-item.active::before{opacity:1}
.disease-icon{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--d-color,var(--text-3));color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;flex:none}
.disease-body{flex:1;min-width:0}
.disease-name{font-size:12.5px;font-weight:500;color:var(--text-2);margin-bottom:2px;display:block}
.disease-item.active .disease-name{color:var(--text)}
.disease-desc{font-size:10.5px;color:var(--text-3);line-height:1.35}

/* SEVERITY */
.severity-box{margin-top:12px;padding:14px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);animation:slideDown .25s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.severity-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.severity-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3)}
.severity-value{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
.severity-slider{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;display:block}
.severity-slider::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,50%),rgba(255,255,255,0.08) var(--p,50%))}
.severity-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:-5.5px;border:2px solid var(--bg-1);box-shadow:0 0 0 1px var(--accent),0 0 16px var(--accent-glow);transition:transform .15s ease}
.severity-slider:active::-webkit-slider-thumb{transform:scale(1.15)}
.severity-slider::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,255,255,0.08)}
.severity-slider::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
.severity-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--bg-1)}
.severity-stages{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--mono);font-size:9.5px;color:var(--text-3);letter-spacing:0.3px}
.severity-stages span{transition:color .2s ease}
.severity-stages span.active{color:var(--accent);font-weight:600}

/* VIEWPORT */
.viewport{position:relative;background:radial-gradient(circle at 50% 40%,rgba(124,92,255,0.05),transparent 60%),var(--bg);overflow:hidden;min-height:0}
#canvas3d{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#canvas3d:active{cursor:grabbing}
.viewport-chips{position:absolute;top:14px;left:14px;display:flex;gap:6px;z-index:10;pointer-events:none;flex-wrap:wrap}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:6px;border:1px solid var(--border);background:rgba(15,15,17,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--text-2);font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:0.3px;transition:all .15s ease;white-space:nowrap}
.chip:hover{border-color:var(--border-hi);color:var(--text)}
.chip.on{background:rgba(124,92,255,0.15);border-color:rgba(124,92,255,0.4);color:var(--accent-2)}
.chip-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0.5;transition:opacity .15s ease}
.chip.on .chip-dot{opacity:1;box-shadow:0 0 6px currentColor}
.tooltip{position::absolute;pointer-events:none;z-index:30;padding:6px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--border-hi);font-family:var(--mono);font-size:10.5px;font-weight:500;colorvar(--accent-2);letter-spacing:0.3px;transform:translate(-50%,-140%);opacity:0;transition:opacity .15s ease;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.tooltip.show{opacity:1}
.viewport-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;color:var(--text-3);letter-spacing:0.5px;background:rgba(15,15,17,0.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:5px 12px;border-radius:6px;border:1px solid var(--border);pointer-events:none;white-space:nowrap;z-index:10}
.viewport-hint .sep{color:var(--text-3);margin:0 6px;opacity:0.5}
.focus-label{position:absolute;top:50%;left:20px;transform:translateY(-50%);pointer-events:none;z-index:10;max-width:160px}
.focus-label .tag{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);margin-bottom:2px}
.focus-label .val{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent-2);letter-spacing:0.2px;line-height:1.3}
.status-indicator{position:absolute;bottom:14px;right:14px;display:flex;align-items:center;gap:6px;padding:5px 10px;background:rgba(15,15,17,0.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:6px;font-family:var(--mono);font-size:10px;letter-spacing:0.8px;text-transform:uppercase;color:var(--text-3);z-index:10}
.status-indicator::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse 2s ease-in-out infinite}
.status-indicator.warn::before{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.status-indicator.danger::before{background:var(--danger);box-shadow:0 0 8px var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

/* ANALYTICS */
.analytics-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.analytics-header h2{font-size:16px;font-weight:600;letter-spacing:-0.2px;margin-bottom:4px;line-height:1.2}
.analytics-header .subtitle{font-family:var(--mono);font-size:10.5px;color:var(--text-3);letter-spacing:0.3px}
.card{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card-title{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.card-title .badge{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:4px;letter-spacing:0.5px;text-transform:uppercase;background:rgba(124,92,255,0.1);color:var(--accent-2)}
.card p{font-size:12.5px;line-height:1.65;color:var(--text-2);margin:0}
.card p strong{color:var(--text);font-weight:500}
.metric-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.metric-row:last-child{border-bottom:none}
.metric-label{color:var(--text-2)}
.metric-value{font-family:var(--mono);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.metric-value.good{color:var(--success)}
.metric-value.warn{color:var(--warn)}
.metric-value.bad{color:var(--danger)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--mono);font-size:10px;padding:4px 8px;border-radius:5px;background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--text-2);letter-spacing:0.2px}
.tag.danger{background:rgba(239,68,68,0.06);border-color:rgba(239,68,68,0.2);color:#f87171}
.tag.warn{background:rgba(245,158,11,0.06);border-color:rgba(245,158,11,0.2);color:#fbbf24}
.empty{text-align:center;padding:48px 20px;color:var(--text-3)}
.empty svg{width:36px;height:36px;margin:0 auto 14px;opacity:0.4}
.empty p{font-size:12px;line-height:1.7;max-width:240px;margin:0 auto}
.sub-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:6px;border:1px solid var(--border);background:var(--bg-3);color:var(--text-2);font-size:12px;text-align:left;transition:all .15s ease;margin-bottom:4px}
.sub-item:hover{border-color:var(--border-hi);color:var(--text)}
.sub-item .pin{width:6px;height:6px;border-radius:50%;flex:none}
.sub-item .go{margin-left:auto;color:var(--text-3);font-family:var(--mono);font-size:10px}
.progression-bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,0.05);margin-bottom:14px}
.progression-step{flex:1;transition:background .3s ease}
.progression-step.past{background:var(--warn)}
.progression-step.current{background:var(--danger)}
.progression-labels{display:flex;gap:2px;margin-bottom:16px;font-family:var(--mono);font-size:9px;letter-spacing:0.2px;text-align:center;color:var(--text-3)}
.progression-labels span{flex:1;padding:0 2px}
.progression-labels span.active{color:var(--text)}

/* SCRIM */
.scrim{position:fixed;inset:52px 0 0 0;background:rgba(0,0,0,0.6);z-index:150;opacity:0;pointer-events:none;transition:opacity .25s ease;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.scrim.show{opacity:1;pointer-events:auto}

/* LOADER */
.loader{position:fixed;inset:0;background:var(--bg);z-index:1000;display:grid;place-items:center;transition:opacity .5s ease}
.loader.hidden{opacity:0;pointer-events:none}
.loader-inner{text-align:center}
.loader-spinner{width:40px;height:40px;margin:0 auto 18px;border:2px solid rgba(124,92,255,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-family:var(--mono);font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--text-3)}

@media (max-width:600px){
  .brand-text strong{font-size:12px}
  .nav-tab{padding:5px 9px;font-size:11.5px}
  .viewport-chips{top:10px;left:10px;gap:4px}
  .chip{height:26px;padding:0 9px;font-size:10px}
  .viewport-hint{font-size:9px;padding:4px 10px;bottom:10px}
  .focus-label{left:12px}
  .status-indicator{bottom:10px;right:10px;font-size:9px;padding:4px 8px}
  .panel{padding:12px 10px}
  .card{padding:12px}
}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-inner">
    <div class="loader-spinner"></div>
    <div class="loader-text">Loading NeuralMap</div>
  </div>
</div>

<div class="app">
  <header class="topbar">
    <button class="icon-btn mobile-only" id="menuBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
      </div>
      <div class="brand-text">
        <strong>NeuralMap</strong>
        <span>v3.0 · 3D</span>
      </div>
    </div>
    <div class="topbar-sep"></div>
    <nav class="topbar-nav">
      <button class="nav-tab active" data-view="atlas">Atlas</button>
      <button class="nav-tab" data-view="analytics">Analytics</button>
      <button class="nav-tab" data-view="simulation">Simulation</button>
    </nav>
    <div class="topbar-actions">
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ru">RU</button>
      </div>
      <button class="icon-btn mobile-only" id="panelBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
    </div>
  </header>

  <div class="body">
    <aside class="panel panel-left" id="panelLeft">
      <div class="panel-head">
        <h2 id="leftTitle">Brain Atlas</h2>
        <button class="panel-close" id="closeLeft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="section">
        <div class="section-title" id="lobesTitle">Cortical Lobes</div>
        <div id="regionList"></div>
      </div>
      <div class="section">
        <div class="section-title" id="diseasesTitle">Pathologies</div>
        <div id="diseaseList"></div>
      </div>
      <div id="severityContainer" style="display:none">
        <div class="severity-box">
          <div class="severity-head">
            <span class="severity-label" id="severityLabel">Severity</span>
            <span class="severity-value" id="severityValue">50%</span>
          </div>
          <input type="range" class="severity-slider" id="severitySlider" min="0" max="100" value="50">
          <div class="severity-stages" id="severityStages">
            <span>Stage I</span>
            <span>Stage II</span>
            <span>Stage III</span>
            <span>Stage IV</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="viewport" id="viewport">
      <canvas id="canvas3d"></canvas>
      <div class="viewport-chips">
        <button class="chip on" data-toggle="labels"><span class="chip-dot"></span><span id="chipLabels">Labels</span></button>
        <button class="chip on" data-toggle="impulses"><span class="chip-dot"></span><span id="chipImpulses">Impulses</span></button>
        <button class="chip" data-toggle="rotate"><span class="chip-dot"></span><span id="chipRotate">Auto-rotate</span></button>
      </div>
      <div class="focus-label">
        <span class="tag" id="focusTag">Focus</span>
        <span class="val" id="focusValue">Full brain</span>
      </div>
      <div class="tooltip" id="tooltip"></div>
      <div class="viewport-hint">
        <span id="hintDrag">Drag to rotate</span>
        <span class="sep">·</span>

const AX = { x: 0.78, y: 0.92, z: 1.12 };

/* Noise function for cortex */
function cortexNoise(x, y, z) {
  const n1 = Math.sin(x * 5.4 + 1.3) * Math.cos(y * 4.6 + 0.7) * Math.sin(z * 5.1 + 2.1) * 0.55;
  const n2 = Math.sin(x * 10.2 + y * 3.1) * Math.cos(z * 8.7 + x * 2.4) * 0.28;
  const n3 = Math.sin(y * 14.6 + z * 5.8) * Math.cos(x * 12.3 + 1.1) * 0.13;
  const n4 = Math.sin(x * 7.5 + z * 6.2) * Math.cos(y * 8.4) * 0.15;
  return n1 + n2 + n3 + n4;
}

function brainSurfacePoint(dir, offset = 0) {
  const v = dir.clone().normalize();
  const n = cortexNoise(v.x, v.y, v.z);
  v.multiplyScalar(1 + n * 0.08 + offset);
  v.x *= AX.x; v.y *= AX.y; v.z *= AX.z;
  return v;
}

function regionAt(p) {
  if (p.y < -0.35 && Math.abs(p.x) > 0.32 && p.z > -0.72) return 'temporal';
  if (p.z < -0.6) return 'occipital';
  if (p.z > 0.12) return 'frontal';
  return 'parietal';
}

/* Cortex mesh — polygonal low-poly style */
const SEG_W = isLowPower ? 48 : 72;
const SEG_H = isLowPower ? 36 : 54;

const cortexGeo = new THREE.SphereGeometry(1, SEG_W, SEG_H);
{
  const pos = cortexGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = cortexNoise(v.x, v.y, v.z);
    v.multiplyScalar(1 + n * 0.08);
    v.x *= AX.x; v.y *= AX.y; v.z *= AX.z;
    const gap = 0.045 * Math.exp(-(v.x * v.x) / 0.005);
    v.x += (v.x >= 0 ? 1 : -1) * gap;
    if (v.y < -0.7) v.y *= 0.92;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  cortexGeo.computeVertexNormals();
  cortexGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(pos.count * 3), 3));
}

/* Material — polygonal flat-shaded */
const cortexMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.55,
  metalness: 0.15,
  flatShading: true,
  emissive: new THREE.Color(0x7c5cff),
  emissiveIntensity: 0.05
});

const cortexMesh = new THREE.Mesh(cortexGeo, cortexMat);
brainGroup.add(cortexMesh);

/* Vertex colors by region */
const baseColors = new Float32Array(cortexGeo.attributes.position.count * 3);
const vertexRegion = new Array(cortexGeo.attributes.position.count);
{
  const pos = cortexGeo.attributes.position;
  const p = new THREE.Vector3();
  const c = new THREE.Color();
  const regionColors = {};
  for (const k in REGIONS) regionColors[k] = new THREE.Color(REGIONS[k].color);
  const grayBase = new THREE.Color(0x8b8b95);

  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i);
    const r = regionAt(p);
    vertexRegion[i] = r;
    // Slight tint from region color mixed with gray
    c.copy(grayBase).lerp(regionColors[r], 0.35);
    baseColors[i * 3] = c.r;
    baseColors[i * 3 + 1] = c.g;
    baseColors[i * 3 + 2] = c.b;
  }
  cortexGeo.attributes.color.array.set(baseColors);
  cortexGeo.attributes.color.needsUpdate = true;
}

/* Brainstem + Cerebellum */
{

{

/* ================================================================
   SUBZONE MARKERS — small polygonal spheres
   ================================================================ */
const subzoneGroup = new THREE.Group();
brainGroup.add(subzoneGroup);

const subzoneMeshes = {};
const markerGeo = new THREE.IcosahedronGeometry(0.045, 1);

SUBZONES.forEach(sz => {
  const dir = new THREE.Vector3(...sz.pos);
  const p = brainSurfacePoint(dir, 0.04);

  const color = new THREE.Color(sz.color);
  const mat = new THREE.MeshStandardMaterial({
    color: color,
    emissive: color,
    emissiveIntensity: 1.2,
    roughness: 0.3,
    metalness: 0.4,
    flatShading: true
  });
  const mesh = new THREE.Mesh(markerGeo, mat);
  mesh.position.copy(p);
  mesh.userData = { type: 'subzone', id: sz.id };
  subzoneGroup.add(mesh);
  subzoneMeshes[sz.id] = mesh;

  // Halo
  const haloGeo = new THREE.SphereGeometry(0.09, 12, 8);
  const haloMat = new THREE.MeshBasicMaterial({
    color: color,
    transparent: true,
    opacity: 0.12,
    depthWrite: false
  });

});

/* ================================================================
   PATHWAYS — tubes with animated impulses
   ================================================================ */
const pathwaysGroup = new THREE.Group();
brainGroup.add(pathwaysGroup);

const pathwayData = [];

PATHWAYS.forEach(([aId, bId], idx) => {
  const szA = SUBZONES.find(s => s.id === aId);
  const szB = SUBZONES.find(s => s.id === bId);
  if (!szA || !szB) return;

  const a = brainSurfacePoint(new THREE.Vector3(...szA.pos), 0.03);
  const b = brainSurfacePoint(new THREE.Vector3(...szB.pos), 0.03);
  const mid = a.clone().add(b).multiplyScalar(0.5).multiplyScalar(0.68);

  const curve = new THREE.CatmullRomCurve3([a, mid, b]);

  const tubeGeo = new THREE.TubeGeometry(curve, 32, 0.008, 5, false);
  const tubeMat = new THREE.MeshBasicMaterial({
    color: 0x7c5cff,
    transparent: true,
    opacity: 0.25,
    depthWrite: false
  });
  const tube = new THREE.Mesh(tubeGeo, tubeMat);
  pathwaysGroup.add(tube);

  pathwayData.push({ curve, tube, a: aId, b: bId });
});

/* Impulses */
const impulses = [];
const impulseGeo = new THREE.SphereGeometry(0.022, 8, 6);
const impulseMat = new THREE.MeshBasicMaterial({
  color: 0xa78bfa,
  transparent: true,
  opacity: 0.9,
  depthWrite: false
});

pathwayData.forEach((pw, idx) => {
  for (let i = 0; i < 2; i++) {
    const mesh = new THREE.Mesh(impulseGeo, impulseMat.clone());
    pathwaysGroup.add(mesh);
    impulses.push({
      curve: pw.curve,
      t: (i * 0.5 + idx * 0.13) % 1,
      mesh,
      speed: 0.15 + Math.random() * 0.05,
      pathwayIdx: idx
    });
  }
});

const state = {
  selectedRegion: null,
  selectedSubzone: null,
  hoveredRegion: null,
  currentDisease: null,
  severity: 50,
  chips: { labels: true, impulses: true, rotate: false }
};

let camTween = null;

/* ================================================================
   RAYCASTING
   ================================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tooltipEl = document.getElementById('tooltip');

function updatePointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function raycast() {
  raycaster.setFromCamera(pointer, camera);
  const objs = [];
  if (subzoneGroup.visible) objs.push(...subzoneGroup.children);
  objs.push(cortexMesh);
  return raycaster.intersectObjects(objs, false);
}

function pickRegion(hit) {
  const local = cortexMesh.worldToLocal(hit.point.clone());
  return regionAt(local);
}

/* Hover */
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  updatePointer(e);
  const hits = raycast();
  let label = null, regionId = null, subzoneId = null;

  if (hits.length) {
    const h = hits[0];
    if (h.object.userData.type === 'subzone') {
      const sz = SUBZONES.find(s => s.id === h.object.userData.id);
      if (sz) { label = sz[LANG].full; regionId = sz.region; subzoneId = sz.id; }
    } else if (h.object === cortexMesh) {
      regionId = pickRegion(h);
      label = REGIONS[regionId][LANG].name;
    }
  }

  if (regionId !== state.hoveredRegion || subzoneId !== state.hoveredSubzone) {
    state.hoveredRegion = regionId;
    state.hoveredSubzone = subzoneId;
    applyHighlight();
  }

  if (label) {
    const r = canvas.getBoundingClientRect();
    tooltipEl.textContent = label;
    tooltipEl.style.left = (e.clientX - r.left) + 'px';
    tooltipEl.style.top = (e.clientY - r.top) + 'px';
    tooltipEl.classList.add('show');
    canvas.style.cursor = 'pointer';
  } else {
    tooltipEl.classList.remove('show');
    canvas.style.cursor = 'grab';
  }
});

canvas.addEventListener('pointerleave', () => {
  tooltipEl.classList.remove('show');
  state.hoveredRegion = null;
  state.hoveredSubzone = null;
  applyHighlight();
});

/* Click */
let downPos = null;
canvas.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 8) return;

  updatePointer(e);
  const hits = raycast();
  if (!hits.length) {
    clearSelection();
    return;
  }

  const h = hits[0];
  if (h.object.userData.type === 'subzone') {
    const sz = SUBZONES.find(s => s.id === h.object.userData.id);
    if (sz) {
      state.selectedSubzone = sz.id;
      state.selectedRegion = sz.region;
      state.currentDisease = null;
      focusOn(subzoneMeshes[sz.id].position.clone());
      updateSeverityUI();
      applyHighlight();
      renderAnalytics();
      updateRegionListUI();
      updateDiseaseListUI();
    }
  } else if (h.object === cortexMesh) {
    const rid = pickRegion(h);
    if (rid) {
      state.selectedRegion = rid;
      state.selectedSubzone = null;
      state.currentDisease = null;
      focusOn(h.point.clone().multiplyScalar(0.9));
      updateSeverityUI();
      applyHighlight();
      renderAnalytics();
      updateRegionListUI();
      updateDiseaseListUI();
    }
  }
});

/* ================================================================
   FOCUS CAMERA
   ================================================================ */
function focusOn(point) {
  const dir = point.clone().normalize();
  const dist = 2.6;
  const toPos = dir.multiplyScalar(dist).add(new THREE.Vector3(0, 0.15, 0));
  camTween = {
    from: camera.position.clone(),
    to: toPos,
    fromT: controls.target.clone(),
    toT: point.clone().multiplyScalar(0.35),
    t: 0
  };
}

function resetCamera() {
  camTween = {
    from: camera.position.clone(),
    to: new THREE.Vector3(2.8, 1.5, 3.2),
    fromT: controls.target.clone(),
    toT: new THREE.Vector3(0, 0, 0),
    t: 0
  };
}

/* ================================================================
   HIGHLIGHT
   ================================================================ */
function applyHighlight() {
  const active = state.selectedRegion || state.hoveredRegion;
  const arr = cortexGeo.attributes.color.array;

  if (!active) {
    arr.set(baseColors);
  } else {
    const hi = new THREE.Color(REGIONS[active].color);
    const dim = 0.35;
    for (let i = 0; i < vertexRegion.length; i++) {
      if (vertexRegion[i] === active) {
        arr[i * 3] = hi.r * 0.9 + 0.1;
        arr[i * 3 + 1] = hi.g * 0.9 + 0.1;
        arr[i * 3 + 2] = hi.b * 0.9 + 0.1;
      } else {
        arr[i * 3] = baseColors[i * 3] * dim;
        arr[i * 3 + 1] = baseColors[i * 3 + 1] * dim;
        arr[i * 3 + 2] = baseColors[i * 3 + 2] * dim;
      }
    }
  }
  cortexGeo.attributes.color.needsUpdate = true;

  // Marker visibility
  Object.entries(subzoneMeshes).forEach(([id, mesh]) => {
    const sz = SUBZONES.find(s => s.id === id);
    const on = !active || sz.region === active;
    mesh.material.opacity = on ? 1 : 0.15;
    mesh.material.transparent = true;
    mesh.visible = on;
    if (mesh.userData.halo) {
      mesh.userData.halo.material.opacity = on ? 0.12 : 0.02;
    }
  });

  // Update focus label
  const fv = document.getElementById('focusValue');
  if (state.selectedSubzone) {
    const sz = SUBZONES.find(s => s.id === state.selectedSubzone);
    fv.textContent = sz[LANG].full;
  } else if (state.selectedRegion) {
    fv.textContent = REGIONS[state.selectedRegion][LANG].name;
  } else if (state.hoveredRegion) {
    fv.textContent = REGIONS[state.hoveredRegion][LANG].name;
  } else {
    fv.textContent = T('fullBrain');
  }
}

/* ================================================================
   DISEASE EFFECTS
   ================================================================ */
function applyDiseaseToBrain() {
  const arr = cortexGeo.attributes.color.array;
  const disease = state.currentDisease;
  const sev = state.severity / 100;

  if (!disease) {
    arr.set(baseColors);
    cortexGeo.attributes.color.needsUpdate = true;
    cortexMat.emissive.setHex(0x7c5cff);
    cortexMat.emissiveIntensity = 0.05;
    return;
  }

  const affected = new Set(disease.regions || disease.affected.map(id => SUBZONES.find(s => s.id === id)?.region).filter(Boolean));
  const dColor = new THREE.Color(disease.hex);

  for (let i = 0; i < vertexRegion.length; i++) {
    const isAffected = affected.has(vertexRegion[i]);
    if (isAffected) {
      const mix = sev * 0.7;
      arr[i * 3] = baseColors[i * 3] * (1 - mix) + dColor.r * mix;
      arr[i * 3 + 1] = baseColors[i * 3 + 1] * (1 - mix) + dColor.g * mix;
      arr[i * 3 + 2] = baseColors[i * 3 + 2] * (1 - mix) + dColor.b * mix;
    } else {
      const dim = 1 - sev * 0.5;
      arr[i * 3] = baseColors[i * 3] * dim;
      arr[i * 3 + 1] = baseColors[i * 3 + 1] * dim;
      arr[i * 3 + 2] = baseColors[i * 3 + 2] * dim;
    }
  }
  cortexGeo.attributes.color.needsUpdate = true;

  cortexMat.emissive.setHex(disease.hex);
  cortexMat.emissiveIntensity = sev * 0.35;

  // Highlight affected markers, dim others
  const affectedSzIds = new Set(disease.affected);
  Object.entries(subzoneMeshes).forEach(([id, mesh]) => {
    if (affectedSzIds.has(id)) {
      mesh.visible = true;
      mesh.material.opacity = 1;
      mesh.material.emissiveIntensity = 1.5 + Math.sin(Date.now() * 0.005) * 0.5;
    } else {
      mesh.material.opacity = Math.max(0.15, 1 - sev * 0.85);
    }
  });
}

/* ================================================================
   ANIMATION LOOP
   ================================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Camera tween
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 2);
    const e = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }

  // Impulses
  if (state.chips.impulses) {
    const disease = state.currentDisease;
    const impulseColor = disease ? new THREE.Color(disease.hex) : new THREE.Color(0xa78bfa);
    impulses.forEach(p => {
      p.t = (p.t + dt * p.speed) % 1;
      const pt = p.curve.getPointAt(p.t);
      p.mesh.position.copy(pt);
      const s = 0.7 + Math.sin(p.t * Math.PI) * 0.8;
      p.mesh.scale.setScalar(s);
      p.mesh.material.opacity = 0.3 + Math.sin(p.t * Math.PI) * 0.6;
      p.mesh.material.color.copy(impulseColor);
    });
  }

  // Subzone markers pulse
  Object.entries(subzoneMeshes).forEach(([id, mesh]) => {
    if (!mesh.visible) return;
    const isSelected = state.selectedSubzone === id;
    const basePulse = 1 + Math.sin(t * 2.5 + id.length) * 0.08;
    mesh.scale.setScalar(isSelected ? basePulse * 1.6 : basePulse);
    if (mesh.userData.halo) {
      const hs = 1 + Math.sin(t * 2.5 + id.length) * 0.15;
      mesh.userData.halo.scale.setScalar(hs);
    }
  });

  // Rotate brain slowly if enabled
  if (state.chips.rotate) {
    brainGroup.rotation.y += dt * 0.15;
  }

  // Bottom light breathing
  bottomLight.intensity = 1.0 + Math.sin(t * 0.9) * 0.3;

  controls.update();
  renderer.render(scene, camera);
}

/* ================================================================
   UI — REGION LIST
   ================================================================ */
function renderRegionList() {
  const el = document.getElementById('regionList');
  el.innerHTML = '';
  Object.values(REGIONS).forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'region-item';
    btn.dataset.region = r.id;
    btn.innerHTML =
      '<span class="region-dot" style="background:' + r.color + '"></span>' +
      '<span class="region-name">' + r[LANG].name + '</span>';
    btn.addEventListener('click', () => {
      state.selectedRegion = (state.selectedRegion === r.id) ? null : r.id;
      state.selectedSubzone = null;
      state.currentDisease = null;
      if (state.selectedRegion) focusOn(brainSurfacePoint(new THREE.Vector3(...r.pos)));
      applyHighlight();
      renderAnalytics();
      updateRegionListUI();
      updateDiseaseListUI();
      updateSeverityUI();
      closeMobilePanels();
    });
    el.appendChild(btn);
  });
  updateRegionListUI();
}

function updateRegionListUI() {
  document.querySelectorAll('.region-item').forEach(el => {
    el.classList.toggle('active', el.dataset.region === state.selectedRegion);
  });
}

/* ================================================================
   UI — DISEASE LIST
   ================================================================ */
function renderDiseaseList() {
  const el = document.getElementById('diseaseList');
  el.innerHTML = '';

  // Healthy
  const h = document.createElement('button');
  h.className = 'disease-item';
  h.dataset.disease = 'healthy';
  h.style.setProperty('--d-color', '#10b981');
  h.innerHTML =
    '<span class="disease-icon" style="background:linear-gradient(135deg,#10b981,#059669)">✓</span>' +
    '<span class="disease-body">' +
      '<span class="disease-name">' + T('healthy') + '</span>' +
      '<span class="disease-desc">' + T('healthyDesc') + '</span>' +
    '</span>';
  h.addEventListener('click', () => selectDisease(null));
  el.appendChild(h);

  // Diseases
  DISEASES.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'disease-item';
    btn.dataset.disease = d.id;
    btn.style.setProperty('--d-color', d.color);
    btn.innerHTML =
      '<span class="disease-icon">' + d.icon + '</span>' +
      '<span class="disease-body">' +
        '<span class="disease-name">' + d[LANG].name + '</span>' +
        '<span class="disease-desc">' + d[LANG].short + '</span>' +
      '</span>';
    btn.addEventListener('click', () => selectDisease(d.id));
    el.appendChild(btn);
  });
  updateDiseaseListUI();
}

function updateDiseaseListUI() {
  const active = state.currentDisease ? state.currentDisease.id : 'healthy';
  document.querySelectorAll('.disease-item').forEach(el => {
    el.classList.toggle('active', el.dataset.disease === active);
  });
}

function selectDisease(id) {
  if (id) {
    state.currentDisease = DISEASES.find(d => d.id === id);
    state.selectedRegion = null;
    state.selectedSubzone = null;
    setStatus('alert', T('alert'));
    document.getElementById('severityContainer').style.display = 'block';
    applySeverity(state.severity);
  } else {
    state.currentDisease = null;
    setStatus('ready', T('ready'));
    document.getElementById('severityContainer').style.display = 'none';
    applyDiseaseToBrain();
    applyHighlight();
  }
  updateDiseaseListUI();
  updateRegionListUI();
  renderAnalytics();
  closeMobilePanels();
}

/* ================================================================
   SEVERITY
   ================================================================ */
function updateSeverityUI() {
  const container = document.getElementById('severityContainer');
  container.style.display = state.currentDisease ? 'block' : 'none';
}

function applySeverity(value) {
  state.severity = value;
  const slider = document.getElementById('severitySlider');
  const valEl = document.getElementById('severityValue');
  const stages = document.getElementById('severityStages');

  slider.value = value;
  slider.style.setProperty('--p', value + '%');
  valEl.textContent = value + '%';

  const stageIdx = Math.min(3, Math.floor(value / 25));
  Array.from(stages.children).forEach((s, i) => {
    s.classList.toggle('active', i === stageIdx);
  });

  applyDiseaseToBrain();
  renderAnalytics();
}

document.getElementById('severitySlider').addEventListener('input', (e) => {
  applySeverity(+e.target.value);
});

/* ================================================================
   ANALYTICS PANEL
   ================================================================ */
function renderAnalytics() {
  const el = document.getElementById('analyticsContent');

  if (state.currentDisease) {
    renderDiseaseAnalytics(el);
    return;
  }
  if (state.selectedSubzone) {
    renderSubzoneAnalytics(el);
    return;
  }
  if (state.selectedRegion) {
    renderRegionAnalytics(el);
    return;
  }

  el.innerHTML =
    '<div class="empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
        '<circle cx="12" cy="12" r="3"/>' +
        '<path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>' +
      '</svg>' +
      '<p><strong>' + T('emptyTitle') + '</strong><br>' + T('emptyText') + '</p>' +
    '</div>';
}

function renderRegionAnalytics(el) {
  const r = REGIONS[state.selectedRegion];
  const d = r[LANG];
  const subs = SUBZONES.filter(s => s.region === r.id);

  el.innerHTML =
    '<div class="analytics-header">' +
      '<div>' +
        '<h2>' + d.name + '</h2>' +
        '<span class="subtitle">' + d.latin + '</span>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">' + T('anatomy') + '</div>' +
      '<p>' + d.desc + '</p>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">' + T('functions') + '</div>' +
      '<div class="tags">' +
        d.functions.map(f => '<span class="tag">' + f + '</span>').join('') +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">' + T('subzones') + '<span class="badge">' + subs.length + '</span></div>' +
      subs.map(s =>
        '<button class="sub-item" data-sub="' + s.id + '">' +
          '<span class="pin" style="background:' + s.color + '"></span>' +
          '<span>' + s[LANG].full + '</span>' +
          '<span class="go">→</span>' +
        '</button>'
      ).join('') +
    '</div>';

  el.querySelectorAll('.sub-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.sub;
      const sz = SUBZONES.find(s => s.id === sid);
      if (!sz) return;
      state.selectedSubzone = sid;
      focusOn(subzoneMeshes[sid].position.clone());
      applyHighlight();
      renderAnalytics();
    });
  });
}

function renderSubzoneAnalytics(el) {
  const sz = SUBZONES.find(s => s.id === state.selectedSubzone);
  if (!sz) return;
  const d = sz[LANG];
  const region = REGIONS[sz.region];

  el.innerHTML =
    '<div class="analytics-header">' +
      '<div>' +
        '<h2>' + d.full + '</h2>' +
        '<span class="subtitle">' + region[LANG].name + '</span>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">' + T('anatomy') + '</div>' +
      '<p>' + d.note + '</p>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">' + T('functions') + '</div>' +
      '<div class="tags">' +
        region[LANG].functions.slice(0, 4).map(f => '<span class="tag">' + f + '</span>').join('') +
      '</div>' +
    '</div>';
}

function renderDiseaseAnalytics(el) {
  const d = state.currentDisease;
  const data = d[LANG];
  const sev = state.severity;
  const stageIdx = Math.min(3, Math.floor(sev / 25));
  const stageLabel = ['I', 'II', 'III', 'IV'][stageIdx];

  const affectedNames = d.affected.map(id => {
    const sz = SUBZONES.find(s => s.id === id);
    return sz ? sz[LANG].name : id;
  });

  const metrics = [
    ['cognitive', 'metricCognitive'],
    ['motor', 'metricMotor'],
    ['language', 'metricLanguage'],
    ['sensory', 'metricSensory'],
    ['memory', 'metricMemory'],
    ['connectivity', 'metricConnectivity']
  ];

  const metricsHtml = metrics.map(([key, labelKey]) => {
    const base = d.en.metrics[key];
    const impairment = 1 - base;
    const current = Math.max(0, base - impairment * (sev / 100));
    const pct = Math.round(current * 100);
    const cls = current > 0.75 ? 'good' : current > 0.5 ? 'warn' : 'bad';
    return '<div class="metric-row">' +
      '<span class="metric-label">' + T(labelKey) + '</span>' +
      '<span class="metric-value ' + cls + '">' + pct + '%</span>' +
    '</div>';
  }).join('');

  const progressionHtml = data.stages.map((stage, i) => {
    const cls = i === stageIdx ? 'current' : (i < stageIdx ? 'past' : '');
    return '<div class="progression-step ' + cls + '"></div>';
  }).join('');

  const progressionLabels = data.stages.map((stage, i) =>
    '<span class="' + (i === stageIdx ? 'active' : '') + '">' + (i + 1) + '</span>'
  ).join('');

  el.innerHTML =
    '<div class="analytics-header">' +
      '<div>' +
        '<h2>' + data.name + '</h2>' +
        '<span class="subtitle">' + data.short + '</span>' +
      '</div>' +
    '</div>' +

    '<div class="card" style="border-left:2px solid ' + d.color + '">' +
      '<div class="card-title">Stage ' + stageLabel + '<span class="badge" style="background:' + d.color + '22;color:' + d.color + '">' + sev + '%</span></div>' +
      '<p>' + data.desc + '</p>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">' + T('progression') + '</div>' +
      '<div class="progression-bar">' + progressionHtml + '</div>' +
      '<div class="progression-labels">' + progressionLabels + '</div>' +
      '<p style="font-size:11.5px;color:var(--text-2)"><strong>' + data.stages[stageIdx] + '</strong></p>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">' + T('mechanism') + '</div>' +
      '<p>' + data.mechanism + '</p>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">' + T('affected') + '</div>' +
      '<div class="tags">' +
        affectedNames.map(n => '<span class="tag danger">' + n + '</span>').join('') +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">' + T('neuro') + '</div>' +
      '<div class="tags">' +
        data.neuro.map(n => '<span class="tag warn">' + n + '</span>').join('') +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">' + T('symptoms') + '</div>' +
      '<div class="tags">' +
        data.symptoms.map(s => '<span class="tag danger">' + s + '</span>').join('') +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">' + T('metrics') + '</div>' +
      metricsHtml +
    '</div>';
}

/* ================================================================
   STATUS
   ================================================================ */
function setStatus(type, text) {
  const el = document.getElementById('statusIndicator');
  el.className = 'status-indicator' + (type === 'warn' ? ' warn' : type === 'alert' ? ' danger' : '');
  el.textContent = text;
}

/* ================================================================
   CLEAR SELECTION
   ================================================================ */
function clearSelection() {
  state.selectedRegion = null;
  state.selectedSubzone = null;
  resetCamera();
  applyHighlight();
  renderAnalytics();
  updateRegionListUI();
}

/* ================================================================
   CHIPS
   ================================================================ */
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const key = chip.dataset.toggle;
    state.chips[key] = !state.chips[key];
    chip.classList.toggle('on', state.chips[key]);

    if (key === 'labels') {
      Object.values(subzoneMeshes).forEach(m => {
        if (m.userData.halo) m.userData.halo.visible = state.chips.labels;
      });
    }
    if (key === 'impulses') {
      impulses.forEach(p => p.mesh.visible = state.chips.impulses);
      pathwayData.forEach(pw => pw.tube.visible = state.chips.impulses);
    }
  });
});

/* ================================================================
   LANGUAGE
   ================================================================ */
function setLanguage(lang) {
  LANG = lang;
  document.documentElement.setAttribute('data-lang', lang);

  // Update static texts
  document.getElementById('chipLabels').textContent = T('labels');
  document.getElementById('chipImpulses').textContent = T('impulses');
  document.getElementById('chipRotate').textContent = T('rotate');
  document.getElementById('focusTag').textContent = T('focus');
  document.getElementById('hintDrag').textContent = T('drag');
  document.getElementById('hintZoom').textContent = T('zoom');
  document.getElementById('hintClick').textContent = T('click');
  document.getElementById('lobesTitle').textContent = T('lobes');
  document.getElementById('diseasesTitle').textContent = T('diseases');
  document.getElementById('severityLabel').textContent = T('severity');
  document.getElementById('leftTitle').textContent = T('atlas');
  document.getElementById('rightTitle').textContent = T('analytics');

  // Topbar tabs
  document.querySelectorAll('.nav-tab').forEach(tab => {
    const view = tab.dataset.view;
    if (view === 'atlas') tab.textContent = T('atlas');
    if (view === 'analytics') tab.textContent = T('analytics');
    if (view === 'simulation') tab.textContent = T('simulation');
  });

  // Re-render lists
  renderRegionList();
  renderDiseaseList();
  applyHighlight();
  renderAnalytics();
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setLanguage(btn.dataset.lang);
  });
});

/* ================================================================
   TOPBAR TABS (visual only)
   ================================================================ */
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});

/* ================================================================
   MOBILE PANELS
   ================================================================ */
const panelLeft = document.getElementById('panelLeft');
const panelRight = document.getElementById('panelRight');
const scrim = document.getElementById('scrim');

function openLeftPanel() {
  panelLeft.classList.add('open');
  panelRight.classList.remove('open');
  scrim.classList.add('show');
}
function openRightPanel() {
  panelRight.classList.add('open');
  panelLeft.classList.remove('open');
  scrim.classList.add('show');
}
function closeMobilePanels() {
  panelLeft.classList.remove('open');
  panelRight.classList.remove('open');
  scrim.classList.remove('show');
}

document.getElementById('menuBtn').addEventListener('click', openLeftPanel);
document.getElementById('panelBtn').addEventListener('click', openRightPanel);
document.getElementById('closeLeft').addEventListener('click', closeMobilePanels);
document.getElementById('closeRight').addEventListener('click', closeMobilePanels);
scrim.addEventListener('click', closeMobilePanels);

/* ================================================================
   INIT
   ================================================================ */
function init() {
  renderRegionList();
  renderDiseaseList();
  applyHighlight();
  renderAnalytics();
  resize();

  setTimeout(() => {
    document.getElementById('loader').classList.add('hidden');
    setStatus('ready', T('ready'));
  }, 400);

  animate();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

console.log('🧠 NeuralMap 3D — initialized');
</script>
