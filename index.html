<!DOCTYPE html>
<html lang="ru" data-lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#040508">
<title>Neuro - Cortex — Clinical 3D Brain Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040508;--bg-1:#080a10;--bg-2:#0e111a;--bg-3:#151a26;
  --border:rgba(255,255,255,.07);--border-hi:rgba(255,255,255,.18);
  --text:#f8fafc;--text-2:rgba(248,250,252,.68);--text-3:rgba(248,250,252,.4);
  --danger:#f43f5e;--warn:#f59e0b;--success:#10b981;--accent:#00e5ff;
  --font:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --topbar-h:56px;
  --panel-l:320px;
  --panel-r:390px;
  --ease:cubic-bezier(0.16, 1, 0.3, 1);
}
[data-theme="light"]{
  --bg:#f1f5f9;--bg-1:#ffffff;--bg-2:#f8fafc;--bg-3:#e2e8f0;
  --border:rgba(15,23,42,.08);--border-hi:rgba(15,23,42,.18);
  --text:#0f172a;--text-2:rgba(15,23,42,.68);--text-3:rgba(15,23,42,.44);
  --accent:#0284c7;
}

/* ═══ ADAPTIVE SCALING FOR 16:9 FHD / QHD / 4K MONITORS ═══ */
@media (min-width:1440px){
  :root{--topbar-h:60px;--panel-l:350px;--panel-r:420px}
  html{font-size:15.5px}
}
@media (min-width:1920px){
  :root{--topbar-h:68px;--panel-l:395px;--panel-r:480px}
  html{font-size:17px}
}
@media (min-width:2560px){
  :root{--topbar-h:78px;--panel-l:460px;--panel-r:560px}
  html{font-size:19.5px}
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  font-size:0.94rem;line-height:1.5;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
input{font-family:inherit;color:inherit}
svg{display:block}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:2px}

.app{
  display:grid;
  grid-template-rows:calc(var(--topbar-h) + var(--safe-top)) 1fr;
  height:100dvh;
  background:var(--bg);
  overflow:hidden;
}

/* ═══ FUTURISTIC MINIMAL TOPBAR ═══ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:var(--safe-top) calc(18px + var(--safe-right)) 0 calc(18px + var(--safe-left));
  height:calc(var(--topbar-h) + var(--safe-top));
  background:var(--bg-1);
  border-bottom:1px solid var(--border);
  z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand-logo{
  width:32px;height:32px;
  display:grid;place-items:center;flex:none;
  color:var(--accent);
  filter:drop-shadow(0 0 10px rgba(0,229,255,.35));
}
.brand-logo svg{width:28px;height:28px}
.brand-name{
  font-size:1.18rem;font-weight:700;letter-spacing:-.3px;white-space:nowrap;
  color:var(--text);
}
.fps-readout{
  font-family:var(--mono);font-size:0.88rem;font-weight:600;
  color:var(--success);letter-spacing:.3px;
  font-variant-numeric:tabular-nums;flex:none;
  padding-left:12px;border-left:1px solid var(--border);
}

/* Smart Anatomical Search */
.search-wrap{position:relative;flex:1;max-width:380px;margin:0 8px}
@media (max-width:700px){.search-wrap{max-width:185px;margin:0 2px}}
@media (max-width:440px){.brand-name{font-size:1rem}.fps-readout{ font-size:0.75rem;padding-left:8px}}
.search-input{
  width:100%;height:36px;padding:0 12px 0 34px;
  border-radius:999px;border:1px solid transparent;
  background:var(--bg-2);color:var(--text);
  font-size:0.82rem;outline:none;
  transition:border-color .18s ease,background .18s ease;
}
.search-input::placeholder{color:var(--text-3)}
.search-input:focus{border-color:var(--border-hi);background:var(--bg-3)}
.search-icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--text-3);pointer-events:none;
}
.search-results{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:var(--bg-1);border:1px solid var(--border-hi);
  border-radius:10px;max-height:290px;overflow-y:auto;
  box-shadow:0 16px 40px rgba(0,0,0,.6);
  display:none;z-index:300;padding:5px;
}
.search-results.open{display:block}
.search-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;padding:8px 10px;border-radius:6px;text-align:left;
  font-size:0.8rem;color:var(--text);
}
.search-item:hover{background:var(--bg-3)}
.search-item-type{
  font-family:var(--mono);font-size:0.64rem;color:var(--accent);
  text-transform:uppercase;flex:none;
}

/* Borderless Large Topbar Controls */
.topbar-actions{display:flex;align-items:center;gap:8px;flex:none}
.lang-switch{display:flex;align-items:center;gap:2px}
.lang-btn{
  padding:6px 11px;border-radius:999px;
  font-family:var(--mono);font-size:0.82rem;font-weight:600;
  letter-spacing:.4px;color:var(--text-3);
  transition:color .18s ease,background .18s ease;
}
.lang-btn:hover{color:var(--text)}
.lang-btn.active{color:var(--text);background:var(--bg-3)}

.action-btn{
  width:38px;height:38px;min-width:38px;
  display:grid;place-items:center;
  border-radius:999px;color:var(--text-2);
  background:transparent;
  transition:background .18s ease,color .18s ease,transform .15s ease;
}
.action-btn:hover{background:var(--bg-3);color:var(--text)}
.action-btn:active{transform:scale(.92)}
.action-btn svg{width:19px;height:19px}
.mobile-only{display:grid}
@media (min-width:1025px){.mobile-only{display:none}}

/* ═══ BODY LAYOUT ═══ */
.body{
  display:grid;grid-template-columns:1fr;
  overflow:hidden;min-height:0;position:relative;
}
@media (min-width:1025px){
  .body{grid-template-columns:var(--panel-l) 1fr}
}

.panel{
  overflow-y:auto;overflow-x:hidden;
  padding:16px 14px;min-height:0;
  background:var(--bg-1);
  -webkit-overflow-scrolling:touch;
  contain:content;
}
@media (min-width:1440px){.panel{padding:18px 16px}}
.panel-left{border-right:1px solid var(--border)}

/* Right Collapsible Curtain */
.panel-right{
  position:fixed;
  top:calc(var(--topbar-h) + var(--safe-top));
  right:0;bottom:0;
  width:min(var(--panel-r), 94vw);
  z-index:180;
  background:rgba(8, 10, 16, 0.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-left:1px solid var(--border);
  transform:translate3d(100%, 0, 0);
  transition:transform .28s var(--ease);
  padding-bottom:calc(18px + var(--safe-bottom));
  box-shadow:-20px 0 50px rgba(0,0,0,.55);
  will-change:transform;
}
[data-theme="light"] .panel-right{
  background:rgba(255, 255, 255, 0.95);
  box-shadow:-12px 0 36px rgba(0,0,0,.08);
}
.panel-right.open{transform:translate3d(0, 0, 0)}

@media (max-width:1024px){
  .panel-left{
    position:fixed;
    top:calc(var(--topbar-h) + var(--safe-top));
    left:0;bottom:0;
    width:min(330px, 88vw);z-index:200;
    background:var(--bg-1);
    transform:translate3d(-100%,0,0);
    transition:transform .28s var(--ease);
    padding-bottom:calc(18px + var(--safe-bottom));
    box-shadow:20px 0 50px rgba(0,0,0,.55);
  }
  .panel-left.open{transform:translate3d(0,0,0)}
}

.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px solid var(--border);
  position:sticky;top:-18px;background:inherit;
  padding-top:16px;margin-top:-16px;z-index:5;
}
.panel-head h2{
  font-family:var(--mono);font-size:0.7rem;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);
}
.panel-close{
  width:30px;height:30px;display:grid;place-items:center;
  border-radius:999px;color:var(--text-2);background:transparent;
}
.panel-close:hover{background:var(--bg-3);color:var(--text)}
.panel-close svg{width:15px;height:15px}
@media (min-width:1025px){#closeLeft{display:none}}

.section{margin-bottom:18px}
.section-title{
  font-family:var(--mono);font-size:0.66rem;font-weight:600;
  letter-spacing:1.3px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}

/* ═══ DEEP-COLORED CLINICAL NAVIGATION ITEMS ═══ */
.region-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 10px;border-radius:8px;text-align:left;
  transition:background .16s ease,transform .15s ease;
  margin-bottom:3px;
  background:transparent;position:relative;
}
.region-item:hover{background:var(--bg-2)}
.region-item.active{
  background:color-mix(in srgb, var(--r-color,#00e5ff) 14%, var(--bg-3));
}
.region-dot{
  width:9px;height:9px;border-radius:50%;flex:none;
  background:var(--r-color,#00e5ff);
  box-shadow:0 0 8px color-mix(in srgb, var(--r-color,#00e5ff) 60%, transparent);
}
.region-dot.cube{border-radius:2px;transform:rotate(45deg)}
.region-item.active .region-dot{
  box-shadow:0 0 12px var(--r-color,#00e5ff), 0 0 0 3px color-mix(in srgb, var(--r-color,#00e5ff) 28%, transparent);
}
.region-info{flex:1;min-width:0}
.region-name{display:block;font-size:0.84rem;font-weight:500;color:var(--text);line-height:1.25}
.region-item.active .region-name{font-weight:600}
.region-meta{display:block;font-size:0.69rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region-ba{
  font-family:var(--mono);font-size:0.62rem;color:var(--text-3);
  padding:2px 6px;border-radius:999px;background:var(--bg-2);flex:none;
}
.region-item.active .region-ba{color:var(--r-color,#00e5ff);font-weight:600}

/* fMRI Task Items */
.task-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:8px 10px;border-radius:8px;text-align:left;
  margin-bottom:4px;background:var(--bg-2);
  transition:background .16s ease;
}
.task-item:hover{background:var(--bg-3)}
.task-item.active{background:rgba(0,229,255,.14)}
.task-play{
  width:22px;height:22px;border-radius:999px;display:grid;place-items:center;
  background:var(--bg-3);color:var(--accent);font-family:var(--mono);font-size:0.66rem;flex:none;
}
.task-item.active .task-play{background:var(--accent);color:#000}

/* Disease Items */
.disease-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 10px;border-radius:8px;text-align:left;
  transition:background .16s ease;
  margin-bottom:3px;background:transparent;
  position:relative;overflow:hidden;
}
.disease-item:hover{background:var(--bg-2)}
.disease-item.active{
  background:color-mix(in srgb, var(--d-color,#ef4444) 15%, var(--bg-3));
}
.disease-icon{
  width:22px;height:22px;border-radius:6px;
  display:grid;place-items:center;
  background:var(--d-color,#666);color:#fff;
  font-family:var(--mono);font-size:0.68rem;font-weight:700;flex:none;
}
.disease-body{flex:1;min-width:0}
.disease-name{font-size:0.82rem;font-weight:500;color:var(--text);display:block;line-height:1.25}
.disease-desc{font-size:0.68rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ═══ SEVERITY ═══ */
.severity-box{
  margin-top:10px;padding:12px;
  background:var(--bg-2);border-radius:10px;
}
.severity-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.severity-label{font-family:var(--mono);font-size:0.66rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3)}
.severity-value{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--text)}
.severity-slider{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;display:block}
.severity-slider::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--danger) var(--p,50%),var(--border) var(--p,50%));
}
.severity-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--text);
  margin-top:-6px;border:none;
}
.severity-stages{display:flex;justify-content:space-between;margin-top:4px;font-family:var(--mono);font-size:0.64rem;color:var(--text-3)}
.severity-stages span.active{color:var(--text);font-weight:700}

/* ═══ VIEWPORT ═══ */
.viewport{
  position:relative;
  background:radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.05) 0%, transparent 72%), var(--bg);
  overflow:hidden;min-height:0;min-width:0;
  display:flex;align-items:center;justify-content:center;
}
#canvas3d{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#canvas3d:active{cursor:grabbing}

/* ═══ LARGE FUTURISTIC VIEWPORT TOGGLES (TOP LEFT) ═══ */
.viewport-controls{
  position:absolute;top:14px;left:14px;
  display:flex;align-items:center;gap:8px;z-index:10;
  pointer-events:none;flex-wrap:wrap;max-width:calc(100% - 260px);
}
@media (max-width:768px){
  .viewport-controls{
    top:auto;bottom:14px;left:12px;right:12px;max-width:none;
    flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;
  }
  .viewport-controls::-webkit-scrollbar{display:none}
}
.mode-switch{
  pointer-events:auto;flex:none;
  display:inline-flex;background:rgba(10,12,20,.82);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:999px;padding:3px;gap:2px;
}
[data-theme="light"] .mode-switch{background:rgba(255,255,255,.88)}
.mode-btn{
  padding:6px 14px;border-radius:999px;
  font-family:var(--mono);font-size:0.74rem;font-weight:500;
  color:var(--text-2);transition:background .18s ease,color .18s ease;
  white-space:nowrap;
}
.mode-btn.active{background:var(--text);color:var(--bg);font-weight:600}

.chip{
  pointer-events:auto;flex:none;
  display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 14px;border-radius:999px;
  background:rgba(10,12,20,.82);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:var(--text-2);
  font-family:var(--mono);font-size:0.74rem;font-weight:500;
  white-space:nowrap;
  transition:background .18s ease,color .18s ease;
}
[data-theme="light"] .chip{background:rgba(255,255,255,.88)}
.chip.on{background:var(--bg-3);color:var(--text)}
.chip-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45}
.chip.on .chip-dot{background:var(--success);opacity:1;box-shadow:0 0 8px var(--success)}

/* Dual Slice Controls */
.slice-bar{
  pointer-events:auto;flex:none;
  display:inline-flex;align-items:center;gap:8px;
  height:34px;padding:0 14px;border-radius:999px;
  background:rgba(10,12,20,.82);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-family:var(--mono);font-size:0.72rem;color:var(--text-2);
}
[data-theme="light"] .slice-bar{background:rgba(255,255,255,.88)}
.slice-slider{
  -webkit-appearance:none;appearance:none;
  width:72px;height:4px;border-radius:2px;
  background:var(--border-hi);cursor:pointer;
}
.slice-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;
  border-radius:50%;background:var(--text);
}
.slice-val{min-width:34px;text-align:right;color:var(--text);font-weight:600}

/* ═══ NON-CLICKABLE FOCUS INDICATOR ═══ */
.focus-indicator{
  position:absolute;top:14px;right:14px;
  pointer-events:none;user-select:none;z-index:10;
  display:flex;align-items:center;gap:9px;
  padding:7px 14px;border-radius:999px;
  background:rgba(10,12,20,.78);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-family:var(--mono);font-size:0.76rem;
}
[data-theme="light"] .focus-indicator{background:rgba(255,255,255,.88)}
.focus-dot{
  width:8px;height:8px;border-radius:50%;flex:none;
  background:var(--f-color, var(--text-3));
  box-shadow:0 0 10px var(--f-color, transparent);
}
.focus-tag{color:var(--text-3);font-size:0.66rem;text-transform:uppercase;letter-spacing:1px}
.focus-val{color:var(--text);font-weight:600}

/* ═══ HTML LABELS ═══ */
.labels-layer{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.zone-label{
  position:absolute;left:0;top:0;
  pointer-events:auto;
  display:flex;align-items:center;gap:6px;
  padding:4px 10px 4px 7px;border-radius:999px;
  background:rgba(8, 10, 16, 0.86);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);
  font-family:var(--mono);font-size:0.68rem;font-weight:500;
  color:#f8fafc;white-space:nowrap;
  transform:translate3d(-9999px,-9999px,0);
  transition:opacity .15s ease,border-color .15s ease,background .15s ease;
  will-change:transform,opacity;
  cursor:pointer;
}
[data-theme="light"] .zone-label{
  background:rgba(255,255,255,.92);
  border-color:rgba(15,23,42,.15);color:#0f172a;
}
.zone-label.hidden{opacity:0;pointer-events:none}
.zone-label:hover{border-color:var(--ldot-color,#fff);z-index:10}
.zone-label.active{
  background:color-mix(in srgb, var(--ldot-color,#00e5ff) 24%, rgba(8,10,16,.95));
  border-color:var(--ldot-color,#fff);
  box-shadow:0 0 16px color-mix(in srgb, var(--ldot-color,#fff) 50%, transparent);
  color:#fff;z-index:12;
}
.zone-label .ldot{
  width:6px;height:6px;border-radius:50%;flex:none;
  background:var(--ldot-color,#00e5ff);
  box-shadow:0 0 6px var(--ldot-color,#00e5ff);
}
.zone-label .lba{font-size:0.6rem;opacity:.6;margin-left:2px}

.status-indicator{
  position:absolute;bottom:14px;left:14px;
  pointer-events:none;
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;background:rgba(10,12,20,.76);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:999px;
  font-family:var(--mono);font-size:0.68rem;
  letter-spacing:.8px;text-transform:uppercase;
  color:var(--text-2);z-index:10;
}
@media (max-width:768px){.status-indicator{display:none}}
[data-theme="light"] .status-indicator{background:rgba(255,255,255,.85)}
.status-indicator::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--success);box-shadow:0 0 8px var(--success);
}
.status-indicator.danger::before{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.status-indicator.fmri::before{background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* ═══ MODEL LOADER ═══ */
.model-loader{
  position:absolute;inset:0;
  display:grid;place-items:center;
  background:var(--bg);z-index:20;
  transition:opacity .35s ease;
}
.model-loader.hidden{opacity:0;pointer-events:none}
.model-loader-spinner{
  width:34px;height:34px;margin:0 auto 12px;
  border:2px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.85s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.model-loader-text{
  font-family:var(--mono);font-size:0.72rem;
  letter-spacing:1.4px;text-transform:uppercase;
  color:var(--text-2);text-align:center;

.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:0.7rem;font-weight:500;
  color:var(--text-2);background:var(--bg-2);

.analytics-header{

.analytics-header h2{font-size:1.08rem;font-weight:600;letter-spacing:-.2px;margin-bottom:3px;line-height:1.25}
.analytics-header .subtitle{font-family:var(--mono);font-size:0.7rem;color:var(--text-3);display:block}
.ba-badge{
  font-family:var(--mono);font-size:0.66rem;font-weight:600;
  padding:4px 9px;border-radius:999px;
  background:var(--bg-2);color:var(--accent);
  white-space:nowrap;flex:none;
}
.card{
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;margin-bottom:10px;
}
.card-title{
  font-family:var(--mono);font-size:0.65rem;font-weight:600;
  letter-spacing:1.3px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.card-title .badge{
  font-family:var(--mono);font-size:0.62rem;
  padding:2px 6px;border-radius:999px;
  background:var(--bg-3);color:var(--text-2);
}
.card p{font-size:0.82rem;line-height:1.6;color:var(--text-2);margin:0}

.metric-row{padding:6px 0;border-bottom:1px solid var(--border)}
.metric-row:last-child{border-bottom:none}
.metric-top{display:flex;align-items:center;justify-content:space-between;font-size:0.78rem;margin-bottom:4px}
.metric-label{color:var(--text-2)}
.metric-value{font-family:var(--mono);font-size:0.78rem;font-weight:600}
.metric-value.good{color:var(--success)}
.metric-value.warn{color:var(--warn)}
.metric-value.bad{color:var(--danger)}
.metric-bar{height:4px;border-radius:2px;background:var(--bg-3);overflow:hidden}
.metric-fill{height:100%;border-radius:2px;transition:width .3s var(--ease)}
.metric-fill.good{background:var(--success)}
.metric-fill.warn{background:var(--warn)}
.metric-fill.bad{background:var(--danger)}

.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{
  font-family:var(--mono);font-size:0.68rem;
  padding:4px 9px;border-radius:999px;
  background:var(--bg-3);color:var(--text-2);
}
.tag.danger{background:rgba(244,63,94,.14);color:#fb7185}
.tag.warn{background:rgba(245,158,11,.14);color:#fbbf24}

.sub-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:8px 11px;border-radius:8px;
  background:var(--bg-3);color:var(--text);
  font-size:0.79rem;text-align:left;
  transition:background .15s ease,transform .15s ease;
  margin-bottom:5px;
}
.sub-item:hover{transform:translateX(2px)}
.sub-item.active-step{background:rgba(0,229,255,.16);border:1px solid var(--accent)}
.sub-item .pin{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
.sub-item-info{flex:1;min-width:0}
.sub-item-title{display:block;font-weight:500;color:var(--text);font-size:0.8rem}
.sub-item-sub{display:block;font-size:0.67rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-item .go{margin-left:auto;color:var(--text-3);font-family:var(--mono);font-size:0.7rem}

.progression-bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--bg-3);margin-bottom:8px;gap:3px}
.progression-step{flex:1;background:var(--border)}
.progression-step.past{background:var(--warn)}
.progression-step.current{background:var(--text)}
.progression-labels{display:flex;gap:3px;margin-bottom:8px;font-family:var(--mono);font-size:0.64rem;text-align:center;color:var(--text-3)}
.progression-labels span{flex:1}
.progression-labels span.active{color:var(--text);font-weight:700}

.scrim{
  position:fixed;inset:calc(var(--topbar-h) + var(--safe-top)) 0 0 0;
  background:rgba(0,0,0,.55);z-index:150;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.scrim.show{opacity:1;pointer-events:auto}

/* ================================================================

   ================================================================ */
const LOBE_INDEX = { frontal: 0, parietal: 1, temporal: 2, occipital: 3, cerebellum: 4, brainstem: 5 };
const LOBE_COLORS = [
  new THREE.Color('#00e5a3'),
  new THREE.Color('#00b8ff'),
  new THREE.Color('#a855f7'),
  new THREE.Color('#f59e0b'),
  new THREE.Color('#ec4899'),
  new THREE.Color('#06b6d4')
];

function classifyLobe(x, y, z) {
  if (y < -0.42 && Math.abs(x) < 0.28 && z < 0.15) return 'brainstem';
  if (y < -0.18 && z < -0.12) return 'cerebellum';
  if (z > 0.08 - y * 0.18 && y > -0.25) return 'frontal';
  if (z < -0.48 && y >= -0.18) return 'occipital';
  if (y < 0.14 && Math.abs(x) > 0.25 && z <= 0.25 && z >= -0.52) return 'temporal';
  if (y >= 0.08) return 'parietal';
  return z >= 0 ? 'frontal' : 'temporal';
}

/* ================================================================
   GLB LOAD + AUTO-ORIENTATION
   ================================================================ */
const MODEL_URL = 'low-poly_human_brain_model.glb';
const modelLoaderEl = document.getElementById('modelLoader');
const loaderTextEl = document.getElementById('loaderText');

let nebulaPoints = null;
let nebulaUniforms = null;

const gltfLoader = new GLTFLoader();
gltfLoader.load(
  MODEL_URL,
  function(gltf) {
    const model = gltf.scene;

    const bbox = new THREE.Box3().setFromObject(model);
    const size = bbox.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 2.15 / maxDim;
    model.scale.setScalar(scale);

    model.position.set(0, 0, 0);
    const bbox2 = new THREE.Box3().setFromObject(model);
    const center2 = bbox2.getCenter(new THREE.Vector3());
    model.position.set(-center2.x, -center2.y, -center2.z);
    model.updateMatrixWorld(true);

    // Auto-orient AP axis & Brainstem
    const allVerts = [];
    const vTmp = new THREE.Vector3();
    model.traverse(function(c) {
      if (c.isMesh && c.geometry) {
        const p = c.geometry.attributes.position;
        for (let i = 0; i < p.count; i += 3) {
          vTmp.fromBufferAttribute(p, i).applyMatrix4(c.matrixWorld);
          allVerts.push(vTmp.clone());
        }
      }
    });

    if (allVerts.length > 0) {
      const fBox = new THREE.Box3().setFromPoints(allVerts);
      const fSize = fBox.getSize(new THREE.Vector3());
      if (fSize.x > fSize.z * 1.08) {
        model.rotation.y = Math.PI * 0.5;
        model.updateMatrixWorld(true);
      }
      let lowZSum = 0, lowCount = 0;
      const minY = fBox.min.y;
      const yThresh = minY + fSize.y * 0.25;
      model.traverse(function(c) {
        if (c.isMesh && c.geometry) {
          const p = c.geometry.attributes.position;
          for (let i = 0; i < p.count; i += 4) {
            vTmp.fromBufferAttribute(p, i).applyMatrix4(c.matrixWorld);
            if (vTmp.y < yThresh) {
              lowZSum += vTmp.z;
              lowCount++;
            }
          }
        }
      });
      if (lowCount > 0 && (lowZSum / lowCount) > 0.05) {
        model.rotation.y += Math.PI;
        model.updateMatrixWorld(true);
      }
    }

    brainState.model = model;
    const finalBox = new THREE.Box3().setFromObject(model);
    brainState.size = finalBox.getSize(new THREE.Vector3());
    brainState.radius = brainState.size.length() * 0.5;
    brainState.loaded = true;

    model.traverse(function(child) {
      if (child.isMesh && child.geometry) {
        brainState.surfaceMeshes.push(child);

        const posAttr = child.geometry.attributes.position;
        const count = posAttr.count;
        const colors = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          vTmp.fromBufferAttribute(posAttr, i).applyMatrix4(child.matrixWorld);
          const lid = classifyLobe(vTmp.x, vTmp.y, vTmp.z);
          const c = LOBE_COLORS[LOBE_INDEX[lid]];
          colors[i * 3] = c.r;
          colors[i * 3 + 1] = c.g;
          colors[i * 3 + 2] = c.b;
        }
        child.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        let surfMat;
        if (child.material) {
          surfMat = child.material.clone();
          surfMat.side = THREE.DoubleSide;
          surfMat.roughness = 0.55;
          surfMat.metalness = 0.1;
          surfMat.clippingPlanes = activeClipPlanes;
        } else {
          surfMat = new THREE.MeshStandardMaterial({
            color: 0xb89aa8,
            roughness: 0.55,
            metalness: 0.1,
            side: THREE.DoubleSide,
            clippingPlanes: activeClipPlanes
          });
        }

        const neurMat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.35,
          metalness: 0.25,
          transparent: true,
          opacity: 0.13,
          depthWrite: false,
          side: THREE.DoubleSide,
          clippingPlanes: activeClipPlanes
        });

        child.userData.surfMat = surfMat;
        child.userData.neurMat = neurMat;
        child.material = surfMat;
      }
    });

    brainGroup.add(model);

    buildSubcorticalMeshes();
    buildUniformCorticalNeurons();
    buildMarkers();
    buildInternalPathways();
    buildHtmlLabels();
    applyDisplayMode();

    modelLoaderEl.classList.add('hidden');

    requestAnimationFrame(function() {
      resize();
      resetCamera();
    });
  },
  function(progress) {
    if (progress.total > 0) {
      loaderTextEl.textContent = T('loadingModel') + ' · ' + Math.round((progress.loaded / progress.total) * 100) + '%';
    }
  },
  function(error) {
    console.error('Model load error:', error);
    loaderTextEl.textContent = T('loadError');
    loaderTextEl.style.color = '#f43f5e';
  }
);

/* ================================================================
   OUTWARD-INWARD RAYCASTING FOR EXACT CORTICAL SURFACE PLACEMENT
   ================================================================ */
const rayHelper = new THREE.Raycaster();

function getSurfaceHit(dirArray) {
  const dir = new THREE.Vector3(dirArray[0], dirArray[1], dirArray[2]).normalize();
  if (!brainState.loaded || brainState.surfaceMeshes.length === 0) {
    return { point: dir.clone().multiplyScalar(0.85), normal: dir.clone() };
  }

  const origin = dir.clone().multiplyScalar(brainState.radius * 3.0);
  const inward = dir.clone().negate();
  rayHelper.set(origin, inward);
  rayHelper.far = brainState.radius * 4.0;

  const hits = rayHelper.intersectObjects(brainState.surfaceMeshes, true);
  if (hits.length > 0) {
    const point = hits[0].point.clone();
    const normal = dir.clone();
    return { point: point.add(normal.clone().multiplyScalar(0.008)), normal: normal };
  }

  return { point: dir.clone().multiplyScalar(brainState.radius * 0.75), normal: dir.clone() };
}

/* ================================================================
   TRIANGLE-AREA WEIGHTED NEURON CLOUD (SINGLE DRAW CALL)
   ================================================================ */
function buildUniformCorticalNeurons() {
  const triangles = [];
  let totalArea = 0;
  const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
  const tri = new THREE.Triangle();

  brainState.surfaceMeshes.forEach(function(mesh) {
    const geo = mesh.geometry;
    const pos = geo.attributes.position;
    const index = geo.index;

    if (index) {
      for (let i = 0; i < index.count; i += 3) {
        vA.fromBufferAttribute(pos, index.getX(i)).applyMatrix4(mesh.matrixWorld);
        vB.fromBufferAttribute(pos, index.getY(i)).applyMatrix4(mesh.matrixWorld);
        vC.fromBufferAttribute(pos, index.getZ(i)).applyMatrix4(mesh.matrixWorld);
        tri.set(vA, vB, vC);
        const area = tri.getArea();
        if (area > 0.000001) {
          totalArea += area;
          triangles.push({ a: vA.clone(), b: vB.clone(), c: vC.clone(), cumArea: totalArea });
        }
      }
    } else {
      for (let i = 0; i < pos.count; i += 3) {
        vA.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
        vB.fromBufferAttribute(pos, i + 1).applyMatrix4(mesh.matrixWorld);
        vC.fromBufferAttribute(pos, i + 2).applyMatrix4(mesh.matrixWorld);
        tri.set(vA, vB, vC);
        const area = tri.getArea();
        if (area > 0.000001) {
          totalArea += area;
          triangles.push({ a: vA.clone(), b: vB.clone(), c: vC.clone(), cumArea: totalArea });
        }
      }
    }
  });

  if (triangles.length === 0) return;

  const NEURON_COUNT = 8000;
  const positions = new Float32Array(NEURON_COUNT * 3);
  const colors = new Float32Array(NEURON_COUNT * 3);
  const scales = new Float32Array(NEURON_COUNT);
  const phases = new Float32Array(NEURON_COUNT);
  const lobeIds = new Float32Array(NEURON_COUNT);

  function sampleTriangle() {
    const r = Math.random() * totalArea;
    let lo = 0, hi = triangles.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (triangles[mid].cumArea < r) lo = mid + 1;
      else hi = mid;
    }
    const t = triangles[lo];
    let r1 = Math.random(), r2 = Math.random();
    if (r1 + r2 > 1) { r1 = 1 - r1; r2 = 1 - r2; }
    const r3 = 1 - r1 - r2;
    return new THREE.Vector3(
      t.a.x * r1 + t.b.x * r2 + t.c.x * r3,
      t.a.y * r1 + t.b.y * r2 + t.c.y * r3,
      t.a.z * r1 + t.b.z * r2 + t.c.z * r3
    );
  }

  for (let i = 0; i < NEURON_COUNT; i++) {
    const surfPt = sampleTriangle();
    const depth = Math.random() < 0.8 ? (0.91 + Math.random() * 0.08) : (0.62 + Math.random() * 0.28);
    positions[i * 3] = surfPt.x * depth;
    positions[i * 3 + 1] = surfPt.y * depth;
    positions[i * 3 + 2] = surfPt.z * depth;

    const lid = classifyLobe(surfPt.x, surfPt.y, surfPt.z);
    const lIdx = LOBE_INDEX[lid];
    const baseCol = LOBE_COLORS[lIdx];

    const whiteMix = Math.random() < 0.12 ? 0.45 : 0.0;
    colors[i * 3] = baseCol.r * (1 - whiteMix) + whiteMix;
    colors[i * 3 + 1] = baseCol.g * (1 - whiteMix) + whiteMix;
    colors[i * 3 + 2] = baseCol.b * (1 - whiteMix) + whiteMix;

    scales[i] = 0.6 + Math.random() * 1.1;
    phases[i] = Math.random() * Math.PI * 2;
    lobeIds[i] = lIdx;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
  geo.setAttribute('aLobe', new THREE.BufferAttribute(lobeIds, 1));

  nebulaUniforms = {
    uTime: { value: 0 },
    uActiveLobe: { value: -1.0 },
    uDiseaseColor: { value: new THREE.Color(0xf43f5e) },
    uDiseaseMix: { value: 0.0 },
    uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
    uClipX: { value: 1.2 },
    uClipY: { value: 1.2 }
  };

  const mat = new THREE.ShaderMaterial({
    uniforms: nebulaUniforms,
    vertexShader: `
      attribute vec3 aColor;
      attribute float aScale;
      attribute float aPhase;
      attribute float aLobe;
      uniform float uTime;
      uniform float uActiveLobe;
      uniform vec3 uDiseaseColor;
      uniform float uDiseaseMix;
      uniform float uPixelRatio;
      uniform float uClipX;
      uniform float uClipY;
      varying vec3 vColor;
      varying float vAlpha;
      varying float vClip;

      void main() {
        vClip = max(position.x - uClipX, position.y - uClipY);
        float pulse = 0.72 + 0.28 * sin(uTime * 2.0 + aPhase);
        float lobeMatch = (uActiveLobe < -0.5) ? 1.0 : (abs(aLobe - uActiveLobe) < 0.1 ? 1.45 : 0.14);

        vec3 finalCol = mix(aColor, uDiseaseColor, uDiseaseMix * 0.72);
        vColor = finalCol * (lobeMatch > 1.0 ? 1.25 : 1.0);
        vAlpha = pulse * lobeMatch;

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = (10.5 * aScale * pulse * uPixelRatio * (lobeMatch > 1.0 ? 1.2 : 1.0)) / -mvPosition.z;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;
      varying float vClip;

      void main() {
        if (vClip > 0.0) discard;
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        float glow = pow(smoothstep(0.5, 0.0, d), 1.6);
        gl_FragColor = vec4(vColor, glow * vAlpha * 0.78);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  nebulaPoints = new THREE.Points(geo, mat);
  brainGroup.add(nebulaPoints);
}

/* ================================================================
   CORTICAL BEACON MARKERS
   ================================================================ */
const subzoneGroup = new THREE.Group();
brainGroup.add(subzoneGroup);
const subzoneAnchors = {};
const subzoneHitProxies = [];

const outerRingGeo = new THREE.RingGeometry(0.025, 0.032, 32);
const innerDotGeo = new THREE.CircleGeometry(0.011, 24);
const hitProxyGeo = new THREE.PlaneGeometry(0.11, 0.11);

function buildMarkers() {
  SUBZONES.forEach(function(sz) {
    const hit = getSurfaceHit(sz.dir);
    const color = new THREE.Color(sz.color);

    const anchor = new THREE.Group();
    anchor.position.copy(hit.point);
    anchor.lookAt(hit.point.clone().add(hit.normal));

    const ringMat = new THREE.MeshBasicMaterial({
      color: color,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.92,
      depthTest: false
    });
    const outerRing = new THREE.Mesh(outerRingGeo, ringMat);
    anchor.add(outerRing);

    const dotMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.95,
      depthTest: false
    });
    const innerDot = new THREE.Mesh(innerDotGeo, dotMat);
    anchor.add(innerDot);

    const proxyMat = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
    const proxy = new THREE.Mesh(hitProxyGeo, proxyMat);
    proxy.userData = { type: 'subzone', id: sz.id };
    anchor.add(proxy);
    subzoneHitProxies.push(proxy);

    subzoneGroup.add(anchor);
    subzoneAnchors[sz.id] = {
      group: anchor,
      outerRing: outerRing,
      innerDot: innerDot,
      color: color,
      region: sz.region,
      normal: hit.normal.clone()
    };
  });
}
