<!DOCTYPE html>
<html lang="en" data-lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NeuralMap — 3D Brain Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;
  --bg-1:#0a0a0a;
  --bg-2:#111111;
  --bg-3:#1a1a1a;
  --border:rgba(255,255,255,0.08);
  --border-hi:rgba(255,255,255,0.16);
  --text:#ffffff;
  --text-2:rgba(255,255,255,0.55);
  --text-3:rgba(255,255,255,0.32);
  --danger:#ef4444;
  --warn:#f59e0b;
  --success:#10b981;
  --font:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --radius:8px;
}
[data-theme="light"]{
  --bg:#ffffff;
  --bg-1:#fafafa;
  --bg-2:#f5f5f5;
  --bg-3:#eeeeee;
  --border:rgba(0,0,0,0.08);
  --border-hi:rgba(0,0,0,0.16);
  --text:#000000;
  --text-2:rgba(0,0,0,0.55);
  --text-3:rgba(0,0,0,0.32);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  -webkit-user-select:none;
  transition:background .25s ease,color .25s ease;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.2);border-radius:3px}

/* ===== APP LAYOUT ===== */
.app{
  display:grid;
  grid-template-rows:52px 1fr;
  height:100dvh;
  background:var(--bg);
  overflow:hidden;
}

/* ===== TOPBAR ===== */
.topbar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  z-index:100;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  flex:none;
}
.brand-icon{
  width:26px;height:26px;
  display:grid;place-items:center;
  background:var(--text);
  color:var(--bg);
  border-radius:6px;
  transition:all .25s ease;
}
.brand-icon svg{width:14px;height:14px}
.brand-text{
  display:flex;
  flex-direction:column;
  line-height:1.1;
}
.brand-text strong{
  font-size:13px;
  font-weight:600;
  letter-spacing:-0.2px;
  color:var(--text);
}
.brand-text span{
  font-size:10px;
  color:var(--text-3);
  font-family:var(--mono);
  letter-spacing:0.5px;
}
.topbar-sep{
  width:1px;
  height:18px;
  background:var(--border);
  flex:none;
}
.topbar-nav{
  display:flex;
  gap:2px;
  flex:1;
}
.nav-tab{
  padding:6px 12px;
  border-radius:6px;
  font-size:12.5px;
  font-weight:500;
  color:var(--text-3);
  transition:all .15s ease;
  white-space:nowrap;
}
.nav-tab:hover{color:var(--text-2)}
.nav-tab.active{
  color:var(--bg);
  background:var(--text);
}
.topbar-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex:none;
}
.lang-switch{
  display:flex;
  gap:1px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:6px;
  padding:2px;
}
.lang-btn{
  padding:4px 9px;
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:0.5px;
  border-radius:4px;
  color:var(--text-3);
  transition:all .15s ease;
}
.lang-btn:hover{color:var(--text-2)}
.lang-btn.active{
  background:var(--text);
  color:var(--bg);
}
.icon-btn{
  width:32px;height:32px;
  display:grid;place-items:center;
  border-radius:6px;
  color:var(--text-2);
  border:1px solid transparent;
  transition:all .15s ease;
}
.icon-btn:hover{
  border-color:var(--border-hi);
  color:var(--text);
}
.icon-btn svg{width:15px;height:15px}
.mobile-only{display:none}
@media (max-width:900px){.mobile-only{display:grid}}

/* ===== BODY ===== */
.body{
  display:grid;
  grid-template-columns:280px 1fr 320px;
  overflow:hidden;
  min-height:0;
}
@media (max-width:1200px){
  .body{grid-template-columns:1fr 320px}
  .panel-left{
    position:fixed;
    top:52px;bottom:0;left:0;
    width:300px;
    z-index:200;
    background:var(--bg-1);
    transform:translateX(-100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    box-shadow:20px 0 60px rgba(0,0,0,0.8);
  }
  .panel-left.open{transform:translateX(0)}
}
@media (max-width:800px){
  .body{grid-template-columns:1fr}
  .panel-right{
    position:fixed;
    top:52px;bottom:0;right:0;
    width:min(340px,90vw);
    z-index:200;
    background:var(--bg-1);
    transform:translateX(100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    box-shadow:-20px 0 60px rgba(0,0,0,0.8);
  }
  .panel-right.open{transform:translateX(0)}
}

/* ===== PANELS ===== */
.panel{
  overflow-y:auto;
  padding:16px 14px;
  min-height:0;
  background:var(--bg-1);
}
.panel-left{border-right:1px solid var(--border)}
.panel-right{border-left:1px solid var(--border)}
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
.panel-head h2{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-3);
}
.panel-close{
  width:24px;height:24px;
  display:grid;place-items:center;
  border-radius:5px;
  color:var(--text-3);
  transition:all .15s ease;
}
.panel-close:hover{background:var(--bg-2);color:var(--text)}
.panel-close svg{width:14px;height:14px}
@media (min-width:1201px){.panel-left .panel-close{display:none}}
@media (min-width:801px){.panel-right .panel-close{display:none}}

.section{margin-bottom:20px}
.section-title{
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-3);
  margin-bottom:8px;
  padding-left:2px;
}

/* ===== REGION ITEMS ===== */
.region-item{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:9px 11px;
  border-radius:6px;
  text-align:left;
  transition:all .15s ease;
  margin-bottom:2px;
  border:1px solid transparent;
  background:transparent;
}
.region-item:hover{background:var(--bg-2)}
.region-item.active{
  background:var(--bg-3);
  border-color:var(--border-hi);
}
.region-dot{
  width:7px;height:7px;
  border-radius:50%;
  flex:none;
  transition:all .2s ease;
}
.region-item.active .region-dot{
  box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent);
}
.region-name{
  flex:1;
  font-size:12.5px;
  font-weight:500;
  color:var(--text-2);
  transition:color .15s ease;
}
.region-item.active .region-name{color:var(--text)}

/* ===== DISEASE ITEMS ===== */
.disease-item{
  display:flex;
  align-items:flex-start;
  gap:10px;
  width:100%;
  padding:10px 11px;
  border-radius:6px;
  text-align:left;
  transition:all .15s ease;
  margin-bottom:4px;
  border:1px solid var(--border);
  background:transparent;
  position:relative;
  overflow:hidden;
}
.disease-item::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:2px;
  background:var(--d-color,#666);
  opacity:0.5;
  transition:opacity .15s ease;
}
.disease-item:hover{background:var(--bg-2)}
.disease-item.active{
  background:var(--bg-3);
  border-color:var(--border-hi);
}
.disease-item.active::before{opacity:1}
.disease-icon{
  width:24px;height:24px;
  border-radius:5px;
  display:grid;place-items:center;
  background:var(--d-color,#666);
  color:#fff;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  flex:none;
}
.disease-body{flex:1;min-width:0}
.disease-name{
  font-size:12px;
  font-weight:500;
  color:var(--text-2);
  margin-bottom:2px;
  display:block;
}
.disease-item.active .disease-name{color:var(--text)}
.disease-desc{
  font-size:10px;
  color:var(--text-3);
  line-height:1.35;
}

/* ===== SEVERITY ===== */
.severity-box{
  margin-top:12px;
  padding:14px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  animation:slideDown .25s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.severity-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:12px;
}
.severity-label{
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-3);
}
.severity-value{
  font-family:var(--mono);
  font-size:18px;
  font-weight:600;
  color:var(--text);
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.5px;
}
.severity-slider{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:24px;
  background:transparent;
  cursor:pointer;
  display:block;
}
.severity-slider::-webkit-slider-runnable-track{
  height:2px;
  border-radius:1px;
  background:linear-gradient(to right,var(--text) var(--p,50%),var(--border) var(--p,50%));
}
.severity-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:14px;height:14px;
  border-radius:50%;
  background:var(--text);
  margin-top:-6px;
  border:none;
  transition:transform .15s ease;
}
.severity-slider:active::-webkit-slider-thumb{transform:scale(1.15)}
.severity-slider::-moz-range-track{
  height:2px;border-radius:1px;background:var(--border);
}
.severity-slider::-moz-range-progress{
  height:2px;border-radius:1px;background:var(--text);
}
.severity-slider::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--text);border:none;
}
.severity-stages{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-family:var(--mono);
  font-size:9px;
  color:var(--text-3);
  letter-spacing:0.3px;
}
.severity-stages span{transition:color .2s ease}
.severity-stages span.active{color:var(--text);font-weight:600}

/* ===== VIEWPORT ===== */
.viewport{
  position:relative;
  background:var(--bg);
  overflow:hidden;
  min-height:0;
}
#canvas3d{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
  cursor:grab;
}
#canvas3d:active{cursor:grabbing}
.viewport-chips{
  position:absolute;
  top:14px;left:14px;
  display:flex;
  gap:6px;
  z-index:10;
  pointer-events:none;
  flex-wrap:wrap;
}
.chip{
  pointer-events:auto;
  display:inline-flex;
  align-items:center;
  gap:6px;
  height:28px;
  padding:0 11px;
  border-radius:6px;
  border:1px solid var(--border);
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--text-2);
  font-family:var(--mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:0.3px;
  transition:all .15s ease;
  white-space:nowrap;
}
[data-theme="light"] .chip{background:rgba(255,255,255,0.7)}
.chip:hover{border-color:var(--border-hi);color:var(--text)}
.chip.on{
  background:var(--text);
  border-color:var(--text);
  color:var(--bg);
}
.chip-dot{
  width:5px;height:5px;
  border-radius:50%;
  background:currentColor;
  opacity:0.6;
  transition:opacity .15s ease;
}
.chip.on .chip-dot{opacity:1}
.tooltip{
  position:absolute;
  pointer-events:none;
  z-index:30;
  padding:5px 10px;
  border-radius:5px;
  background:var(--text);
  color:var(--bg);
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:500;
  letter-spacing:0.3px;
  transform:translate(-50%,-140%);
  opacity:0;
  transition:opacity .15s ease;
  white-space:nowrap;
}
.tooltip.show{opacity:1}
.viewport-hint{
  position:absolute;
  bottom:14px;left:50%;
  transform:translateX(-50%);
  font-family:var(--mono);
  font-size:9.5px;
  color:var(--text-3);
  letter-spacing:0.5px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  padding:5px 12px;
  border-radius:5px;
  border:1px solid var(--border);
  pointer-events:none;
  white-space:nowrap;
  z-index:10;
}
[data-theme="light"] .viewport-hint{background:rgba(255,255,255,0.7)}
.viewport-hint .sep{color:var(--text-3);margin:0 6px;opacity:0.5}
.focus-label{
  position:absolute;
  top:50%;left:20px;
  transform:translateY(-50%);
  pointer-events:none;
  z-index:10;
  max-width:160px;
}
.focus-label .tag{
  display:block;
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-3);
  margin-bottom:2px;
}
.focus-label .val{
  font-family:var(--mono);
  font-size:11.5px;
  font-weight:600;
  color:var(--text);
  letter-spacing:0.2px;
  line-height:1.3;
}
.status-indicator{
  position:absolute;
  bottom:14px;right:14px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);
  border-radius:5px;
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:0.8px;
  text-transform:uppercase;
  color:var(--text-3);
  z-index:10;
}
[data-theme="light"] .status-indicator{background:rgba(255,255,255,0.7)}
.status-indicator::before{
  content:'';
  width:5px;height:5px;
  border-radius:50%;
  background:var(--success);
  animation:pulse 2s ease-in-out infinite;
}
.status-indicator.warn::before{background:var(--warn)}
.status-indicator.danger::before{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* Loading overlay for model */
.model-loader{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:var(--bg);
  z-index:20;
  transition:opacity .5s ease;
}
.model-loader.hidden{opacity:0;pointer-events:none}
.model-loader-inner{text-align:center}
.model-loader-spinner{
  width:32px;height:32px;
  margin:0 auto 14px;
  border:1.5px solid var(--border);
  border-top-color:var(--text);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.model-loader-text{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-3);
}

/* ===== ANALYTICS ===== */
.analytics-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}
.analytics-header h2{
  font-size:15px;
  font-weight:600;
  letter-spacing:-0.2px;
  margin-bottom:4px;
  line-height:1.2;
  color:var(--text);
}
.analytics-header .subtitle{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--text-3);
  letter-spacing:0.3px;
}
.card{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:10px;
  animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card-title{
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-3);
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.card-title .badge{
  font-family:var(--mono);
  font-size:9.5px;
  font-weight:600;
  padding:2px 6px;
  border-radius:4px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  background:var(--bg-3);
  color:var(--text-2);
}
.card p{
  font-size:12.5px;
  line-height:1.65;
  color:var(--text-2);
  margin:0;
}
.card p strong{color:var(--text);font-weight:500}
.metric-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
}
.metric-row:last-child{border-bottom:none}
.metric-label{color:var(--text-2)}
.metric-value{
  font-family:var(--mono);
  font-size:12px;
  font-weight:500;
  font-variant-numeric:tabular-nums;
  color:var(--text);
}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{
  font-family:var(--mono);
  font-size:10px;
  padding:4px 8px;
  border-radius:5px;
  background:var(--bg-3);
  border:1px solid var(--border);
  color:var(--text-2);
  letter-spacing:0.2px;
}
.tag.danger{
  background:rgba(239,68,68,0.1);
  border-color:rgba(239,68,68,0.25);
  color:#f87171;
}
.tag.warn{
  background:rgba(245,158,11,0.1);
  border-color:rgba(245,158,11,0.25);
  color:#fbbf24;
}
.empty{
  text-align:center;
  padding:48px 20px;
  color:var(--text-3);
}
.empty svg{
  width:32px;height:32px;
  margin:0 auto 14px;
  opacity:0.3;
  stroke:var(--text-3);
}
.empty p{
  font-size:12px;
  line-height:1.7;
  max-width:220px;
  margin:0 auto;
}
.sub-item{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:9px 11px;
  border-radius:6px;
  border:1px solid var(--border);
  background:var(--bg-3);
  color:var(--text-2);
  font-size:12px;
  text-align:left;
  transition:all .15s ease;
  margin-bottom:4px;
}
.sub-item:hover{border-color:var(--border-hi);color:var(--text)}
.sub-item .pin{
  width:5px;height:5px;
  border-radius:50%;
  flex:none;
}
.sub-item .go{
  margin-left:auto;
  color:var(--text-3);
  font-family:var(--mono);
  font-size:10px;
}
.progression-bar{
  display:flex;
  height:3px;
  border-radius:2px;
  overflow:hidden;
  background:var(--bg-3);
  margin-bottom:12px;
  gap:2px;
}
.progression-step{
  flex:1;
  transition:background .3s ease;
  background:var(--border);
}
.progression-step.past{background:var(--warn)}
.progression-step.current{background:var(--text)}
.progression-labels{
  display:flex;
  gap:2px;
  margin-bottom:14px;
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:0.2px;
  text-align:center;
  color:var(--text-3);
}
.progression-labels span{flex:1}
.progression-labels span.active{color:var(--text);font-weight:600}

/* ===== SCRIM ===== */
.scrim{
  position:fixed;
  inset:52px 0 0 0;
  background:rgba(0,0,0,0.7);
  z-index:150;
  opacity:0;
  pointer-events:none;

/* ================================================================
   THREE.JS SCENE
   ================================================================ */
const canvas = document.getElementById('canvas3d');
const viewport = document.getElementById('viewport');
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const isLowPower = isMobile || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);

const renderer = new THREE.WebGLRenderer({
  canvas, antialias: !isMobile, alpha: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(isLowPower ? 1.5 : Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(2.8, 1.5, 3.2);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.9;
controls.zoomSpeed = 1.0;
controls.minDistance = 1.6;
controls.maxDistance = 8;
controls.enablePan = false;

/* Lights */
scene.add(new THREE.AmbientLight(0x8899bb, 0.55));
scene.add(new THREE.HemisphereLight(0xaabbff, 0x1a1a2a, 0.75));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
keyLight.position.set(4, 6, 5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x7c5cff, 0.9);
fillLight.position.set(-5, 0, -3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xa78bfa, 1.2);
rimLight.position.set(-2, 4, -7);
scene.add(rimLight);

const bottomLight = new THREE.PointLight(0x7c5cff, 0.8, 6, 2);
bottomLight.position.set(0, -2, 0);
scene.add(bottomLight);

/* Main brain group */
const brainGroup = new THREE.Group();
scene.add(brainGroup);

/* Model state */
const brainState = {
  loaded: false,
  bbox: new THREE.Box3(),
  center: new THREE.Vector3(),
  size: new THREE.Vector3(),
  scale: 1,
  model: null
};

/* Convert normalized direction (-1..1) to point on model surface (bbox-based) */
function dirToPoint(dir, offset = 0.1) {
  if (!brainState.loaded) return new THREE.Vector3(0, 0, 0);
  const v = new THREE.Vector3(dir[0], dir[1], dir[2]).normalize();
  const half = brainState.size.clone().multiplyScalar(0.5 * (1 + offset));
  return new THREE.Vector3(
    brainState.center.x + v.x * half.x,
    brainState.center.y + v.y * half.y,
    brainState.center.z + v.z * half.z
  );
}

/* ================================================================
   GLTF LOADER — load brain model
   ================================================================ */
const MODEL_URL = 'low-poly_human_brain_model.glb';
const modelLoaderEl = document.getElementById('modelLoader');
const loaderTextEl = document.getElementById('loaderText');

const gltfLoader = new GLTFLoader();
gltfLoader.load(
  MODEL_URL,
  (gltf) => {
    const model = gltf.scene;

    // Compute bounding box
    const bbox = new THREE.Box3().setFromObject(model);
    const size = bbox.getSize(new THREE.Vector3());
    const center = bbox.getCenter(new THREE.Vector3());

    // Normalize scale so max dimension = 2 units
    const maxDim = Math.max(size.x, size.y, size.z);
    const targetScale = 2.0 / maxDim;
    model.scale.setScalar(targetScale);

    // Recenter — center at origin
    model.position.sub(center.clone().multiplyScalar(targetScale));

    // Update state
    brainState.model = model;
    brainState.bbox = bbox;
    brainState.center.set(0, 0, 0);
    brainState.size.copy(size).multiplyScalar(targetScale);
    brainState.scale = targetScale;
    brainState.loaded = true;

    // Apply material tweaks + vertex colors for regions if no texture
    model.traverse((child) => {
      if (child.isMesh) {
        const oldMat = child.material;
        // Preserve original if it has a texture map
        if (oldMat && oldMat.map) {
          oldMat.roughness = 0.7;
          oldMat.metalness = 0.15;
        } else {
          child.material = new THREE.MeshStandardMaterial({
            color: 0xb8b8c0,
            roughness: 0.7,
            metalness: 0.12,
            flatShading: false
          });
        }
        child.castShadow = false;
        child.receiveShadow = false;
      }
    });

    brainGroup.add(model);

    // Hide loader
    modelLoaderEl.classList.add('hidden');

    // Build markers + pathways now that we know the bbox
    buildMarkers();
    buildPathways();

    // Fit camera to brain
    resetCamera();

    console.log('✅ Model loaded:', model, brainState.size);
  },
  (progress) => {
    if (progress.total > 0) {
      const pct = Math.round((progress.loaded / progress.total) * 100);
      loaderTextEl.textContent = T('loadingModel') + ' · ' + pct + '%';
    }
  },
  (error) => {
    console.error('❌ Model load error:', error);
    loaderTextEl.textContent = T('loadError');
    loaderTextEl.style.color = '#ef4444';
  }
);

/* ================================================================
   MARKERS — create subzone markers on model surface
   ================================================================ */
const subzoneGroup = new THREE.Group();
brainGroup.add(subzoneGroup);
const subzoneMeshes = {};
const markerGeo = new THREE.IcosahedronGeometry(0.045, 1);

function buildMarkers() {
  SUBZONES.forEach(sz => {
    const p = dirToPoint(sz.dir, 0.02);
    const color = new THREE.Color(sz.color);

    const mat = new THREE.MeshStandardMaterial({
      color: color,
      emissive: color,
      emissiveIntensity: 1.4,
      roughness: 0.3,
      metalness: 0.4,
      flatShading: true
    });
    const mesh = new THREE.Mesh(markerGeo, mat);
    mesh.position.copy(p);
    mesh.userData = { type: 'subzone', id: sz.id };
    subzoneGroup.add(mesh);
    subzoneMeshes[sz.id] = mesh;

    // Halo
    const haloGeo = new THREE.SphereGeometry(0.1, 12, 8);
    const haloMat = new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.14,
      depthWrite: false
    });
    const halo = new THREE.Mesh(haloGeo, haloMat);
    halo.position.copy(p);
    subzoneGroup.add(halo);
    mesh.userData.halo = halo;
  });
}

/* ================================================================
   PATHWAYS — tubes between subzones with moving impulses
   ================================================================ */
const pathwaysGroup = new THREE.Group();
brainGroup.add(pathwaysGroup);
const pathwayData = [];
const impulses = [];

function buildPathways() {
  PATHWAYS.forEach(([aId, bId], idx) => {
    const szA = SUBZONES.find(s => s.id === aId);
    const szB = SUBZONES.find(s => s.id === bId);
    if (!szA || !szB) return;

    const a = dirToPoint(szA.dir, 0.01);
    const b = dirToPoint(szB.dir, 0.01);
    const mid = a.clone().add(b).multiplyScalar(0.5).multiplyScalar(0.72);

    const curve = new THREE.CatmullRomCurve3([a, mid, b]);

    const tubeGeo = new THREE.TubeGeometry(curve, 28, 0.007, 5, false);
    const tubeMat = new THREE.MeshBasicMaterial({
      color: 0x7c5cff,
      transparent: true,
      opacity: 0.28,
      depthWrite: false
    });
    const tube = new THREE.Mesh(tubeGeo, tubeMat);
    pathwaysGroup.add(tube);

    pathwayData.push({ curve, tube, a: aId, b: bId });

    // Impulses
    const impulseGeo = new THREE.SphereGeometry(0.022, 8, 6);
    for (let i = 0; i < 2; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: 0xa78bfa,
        transparent: true,
        opacity: 0.9,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(impulseGeo, mat);
      pathwaysGroup.add(mesh);
      impulses.push({
        curve,
        t: (i * 0.5 + idx * 0.13) % 1,
        mesh,
        speed: 0.15 + Math.random() * 0.05
      });
    }
  });
}

/* ================================================================
   RESIZE
   ================================================================ */
function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
setTimeout(resize, 100);/* ================================================================
   STATE
   ================================================================ */
const state = {
  selectedRegion: null,
  selectedSubzone: null,
  hoveredRegion: null,
  hoveredSubzone: null,
  currentDisease: null,
  severity: 50,
  chips: { labels: true, impulses: true, rotate: false }
};
let camTween = null;

/* ================================================================
   RAYCASTING
   ================================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tooltipEl = document.getElementById('tooltip');

function updatePointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function raycast() {
  raycaster.setFromCamera(pointer, camera);
  const objs = [];
  if (subzoneGroup.visible) objs.push(...subzoneGroup.children.filter(c => c.userData.type === 'subzone'));
  return raycaster.intersectObjects(objs, false);
}

/* Hover */
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  updatePointer(e);
  const hits = raycast();
  let label = null, szId = null, regId = null;

  if (hits.length) {
    const h = hits[0];
    if (h.object.userData.type === 'subzone') {
      const sz = SUBZONES.find(s => s.id === h.object.userData.id);
      if (sz) { label = sz[LANG].full; szId = sz.id; regId = sz.region; }
    }
  }

  if (regId !== state.hoveredRegion || szId !== state.hoveredSubzone) {
    state.hoveredRegion = regId;
    state.hoveredSubzone = szId;
    applyHighlight();
  }

  if (label) {
    const r = canvas.getBoundingClientRect();
    tooltipEl.textContent = label;
    tooltipEl.style.left = (e.clientX - r.left) + 'px';
    tooltipEl.style.top = (e.clientY - r.top) + 'px';
    tooltipEl.classList.add('show');
    canvas.style.cursor = 'pointer';
  } else {
    tooltipEl.classList.remove('show');
    canvas.style.cursor = 'grab';
  }
});

canvas.addEventListener('pointerleave', () => {
  tooltipEl.classList.remove('show');
  state.hoveredRegion = null;
  state.hoveredSubzone = null;
  applyHighlight();
});

/* Click */
let downPos = null;
canvas.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 8) return;

  updatePointer(e);
  const hits = raycast();

  if (!hits.length) {
    // Empty click — deselect
    if (state.selectedSubzone || state.selectedRegion) {
      state.selectedSubzone = null;
      state.selectedRegion = null;
      applyHighlight();
      renderAnalytics();
      updateRegionListUI();
    }
    return;
  }

  const h = hits[0];
  if (h.object.userData.type === 'subzone') {
    const sz = SUBZONES.find(s => s.id === h.object.userData.id);
    if (sz) {
      state.selectedSubzone = sz.id;
      state.selectedRegion = sz.region;
      state.currentDisease = null;
      focusOn(subzoneMeshes[sz.id].position.clone());
      updateSeverityUI();
      applyHighlight();
      renderAnalytics();
      updateRegionListUI();
      updateDiseaseListUI();
    }
  }
});

/* ================================================================
   FOCUS CAMERA
   ================================================================ */
function focusOn(point) {
  const dir = point.clone().normalize();
  const dist = Math.max(1.8, brainState.size.length() * 0.9);
  const toPos = dir.multiplyScalar(dist).add(new THREE.Vector3(0, 0.2, 0));
  camTween = {
    from: camera.position.clone(), to: toPos,
    fromT: controls.target.clone(), toT: point.clone().multiplyScalar(0.4),
    t: 0
  };
}

function resetCamera() {
  const d = Math.max(2.4, brainState.size.length() * 1.1);
  camTween = {
    from: camera.position.clone(),
    to: new THREE.Vector3(d * 0.7, d * 0.35, d * 0.9),
    fromT: controls.target.clone(),
    toT: new THREE.Vector3(0, 0, 0),
    t: 0
  };
}

/* ================================================================
   HIGHLIGHT
   ================================================================ */
function applyHighlight() {
  const active = state.selectedRegion || state.hoveredRegion;

  Object.entries(subzoneMeshes).forEach(([id, mesh]) => {
    const sz = SUBZONES.find(s => s.id === id);
    const on = !active || sz.region === active;
    mesh.material.opacity = on ? 1 : 0.12;
    mesh.material.transparent = true;
    mesh.visible = on;
    if (mesh.userData.halo) mesh.userData.halo.material.opacity = on ? 0.14 : 0.02;
  });

  // Focus label
  const fv = document.getElementById('focusValue');
  if (state.selectedSubzone) {
    const sz = SUBZONES.find(s => s.id === state.selectedSubzone);
    fv.textContent = sz[LANG].full;
  } else if (state.selectedRegion) {
    fv.textContent = REGIONS[state.selectedRegion][LANG].name;
  } else if (state.hoveredSubzone) {
    const sz = SUBZONES.find(s => s.id === state.hoveredSubzone);
    fv.textContent = sz[LANG].full;
  } else if (state.hoveredRegion) {
    fv.textContent = REGIONS[state.hoveredRegion][LANG].name;
  } else {
    fv.textContent = T('fullBrain');
  }
}

/* ================================================================
   DISEASE EFFECTS
   ================================================================ */
function applyDiseaseToBrain() {
  const d = state.currentDisease;
  const sev = state.severity / 100;

  // Reset base color
  if (brainState.model) {
    brainState.model.traverse((child) => {
      if (child.isMesh && child.material && child.material.emissive) {
        if (!d) {
          child.material.emissive.setHex(0x000000);
          child.material.emissiveIntensity = 0;
        } else {
          child.material.emissive.setHex(d.hex);
          child.material.emissiveIntensity = sev * 0.4;
        }
      }
    });
  }

  // Adjust markers
  const affectedSet = new Set(d ? d.affected : []);
  Object.entries(subzoneMeshes).forEach(([id, mesh]) => {
    if (!d) {
      mesh.material.emissiveIntensity = 1.4;
      mesh.material.opacity = 1;
      mesh.visible = true;
    } else if (affectedSet.has(id)) {
      mesh.visible = true;
      mesh.material.opacity = 1;
      mesh.material.emissiveIntensity = 2.0;
    } else {
      mesh.material.opacity = Math.max(0.1, 1 - sev * 0.9);
    }
  });

  // Dim impulses if disease
  impulses.forEach(p => {
    p.mesh.material.color.setHex(d ? d.hex : 0xa78bfa);
  });
}

/* ================================================================
   ANIMATION LOOP
   ================================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Camera tween
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 2);
    const e = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }

  // Impulses
  if (state.chips.impulses) {
    impulses.forEach(p => {
      p.t = (p.t + dt * p.speed) % 1;
      const pt = p.curve.getPointAt(p.t);
      p.mesh.position.copy(pt);
      const s = 0.7 + Math.sin(p.t * Math.PI) * 0.8;
      p.mesh.scale.setScalar(s);
      p.mesh.material.opacity = 0.3 + Math.sin(p.t * Math.PI) * 0.6;
    });
  }

  // Markers pulse
  Object.entries(subzoneMeshes).forEach(([id, mesh]) => {
    if (!mesh.visible) return;
    const isSel = state.selectedSubzone === id;
    const pulse = 1 + Math.sin(t * 2.5 + id.length) * 0.08;
    mesh.scale.setScalar(isSel ? pulse * 1.7 : pulse);
    if (mesh.userData.halo) {
      mesh.userData.halo.scale.setScalar(1 + Math.sin(t * 2.5 + id.length) * 0.18);
    }
  });

  // Auto-rotate
  if (state.chips.rotate && brainState.model) {
    brainGroup.rotation.y += dt * 0.15;
  }

  // Bottom light breathing
  bottomLight.intensity = 0.7 + Math.sin(t * 0.9) * 0.25;

  controls.update();
  renderer.render(scene, camera);
}

/* ================================================================
   UI — REGION LIST
   ================================================================ */
function renderRegionList() {
  const el = document.getElementById('regionList');
  el.innerHTML = '';
  Object.values(REGIONS).forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'region-item';
    btn.dataset.region = r.id;
    btn.innerHTML =
      '<span class="region-dot" style="background:' + r.color + '"></span>' +
      '<span class="region-name">' + r[LANG].name + '</span>';
    btn.addEventListener('click', () => {
      state.selectedRegion = (state.selectedRegion === r.id) ? null : r.id;
      state.selectedSubzone = null;
      state.currentDisease = null;
      if (state.selectedRegion) {
        const p = dirToPoint(r.dir, 0.02);
        focusOn(p);
      } else {
        resetCamera();
      }
      applyHighlight();
      renderAnalytics();
      updateRegionListUI();
      updateDiseaseListUI();
      updateSeverityUI();
      closeMobilePanels();
    });
    el.appendChild(btn);
  });
  updateRegionListUI();
}

function updateRegionListUI() {
  document.querySelectorAll('.region-item').forEach(el => {
    el.classList.toggle('active', el.dataset.region === state.selectedRegion);
  });
}

   UI — DISEASE LIST

  const h = document.createElement('button');

  h.innerHTML =
    '<span class="disease-icon" style="background:linear-gradient(135deg,#10b981,#059669)">✓</span>' +
    '<span class="disease-body">' +
      '<span class="disease-name">' + T('healthy') + '</span>' +
      '<span class="disease-desc">' + T('healthyDesc') + '</span>' +
    '</span>';
  h.addEventListener('click', () => selectDisease(null));
  el.appendChild(h);

  DISEASES.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'disease-item';
    btn.dataset.disease = d.id;
    btn.style.setProperty('--d-color', d.color);
    btn.innerHTML =
      '<span class="disease-icon">' + d.icon + '</span>' +
      '<span class="disease-body">' +
        '<span class="disease-name">' + d[LANG].name + '</span>' +
        '<span class="disease-desc">' + d[LANG].short + '</span>' +
      '</span>';
    btn.addEventListener('click', () => selectDisease(d.id));
    el.appendChild(btn);
  });
  updateDiseaseListUI();
}

function updateDiseaseListUI() {
  const active = state.currentDisease ? state.currentDisease.id : 'healthy';
  document.querySelectorAll('.disease-item').forEach(el => {
    el.classList.toggle('active', el.dataset.disease === active);
  });
}

function selectDisease(id) {
  if (id) {
    state.currentDisease = DISEASES.find(d => d.id === id);
    state.selectedRegion = null;
    state.selectedSubzone = null;
    setStatus('alert', T('alert'));
    document.getElementById('severityContainer').style.display = 'block';
    applySeverity(state.severity);
  } else {
    state.currentDisease = null;
    setStatus('ready', T('ready'));
    document.getElementById('severityContainer').style.display = 'none';
    applyDiseaseToBrain();
    applyHighlight();
  }
  updateDiseaseListUI();
  updateRegionListUI();
  renderAnalytics();
  closeMobilePanels();
}

/* ================================================================
   SEVERITY
   ================================================================ */
function updateSeverityUI() {
  const container = document.getElementById('severityContainer');
  container.style.display = state.currentDisease ? 'block' : 'none';
}

function applySeverity(value) {
  state.severity = value;
  const slider = document.getElementById('severitySlider');
  const valEl = document.getElementById('severityValue');
  const stages = document.getElementById('severityStages');

  slider.value = value;
  slider.style.setProperty('--p', value + '%');
  valEl.textContent = value + '%';

  const idx = Math.min(3, Math.floor(value / 25));
  Array.from(stages.children).forEach((s, i) => s.classList.toggle('active', i === idx));

  applyDiseaseToBrain();
  renderAnalytics();
}

document.getElementById('severitySlider').addEventListener('input', (e) => {
  applySeverity(+e.target.value);
});

/* ================================================================
   ANALYTICS PANEL
   ================================================================ */
function renderAnalytics() {
  const el = document.getElementById('analyticsContent');

  if (state.currentDisease) { renderDiseaseAnalytics(el); return; }
  if (state.selectedSubzone) { renderSubzoneAnalytics(el); return; }
  if (state.selectedRegion) { renderRegionAnalytics(el); return; }

  el.innerHTML =
    '<div class="empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">' +
        '<circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>' +
      '</svg>' +
      '<p><strong>' + T('emptyTitle') + '</strong><br>' + T('emptyText') + '</p>' +
    '</div>';
}

function renderRegionAnalytics(el) {
  const r = REGIONS[state.selectedRegion];
  const d = r[LANG];
  const subs = SUBZONES.filter(s => s.region === r.id);

  el.innerHTML =
    '<div class="analytics-header"><div><h2>' + d.name + '</h2><span class="subtitle">' + d.latin + '</span></div></div>' +
    '<div class="card"><div class="card-title">' + T('anatomy') + '</div><p>' + d.desc + '</p></div>' +
    '<div class="card"><div class="card-title">' + T('functions') + '</div>' +
      '<div class="tags">' + d.functions.map(f => '<span class="tag">' + f + '</span>').join('') + '</div></div>' +
    '<div class="card"><div class="card-title">' + T('subzones') + '<span class="badge">' + subs.length + '</span></div>' +
      subs.map(s => '<button class="sub-item" data-sub="' + s.id + '"><span class="pin" style="background:' + s.color + '"></span><span>' + s[LANG].full + '</span><span class="go">→</span></button>').join('') +
    '</div>';

  el.querySelectorAll('.sub-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.sub;
      state.selectedSubzone = sid;
      focusOn(subzoneMeshes[sid].position.clone());
      applyHighlight();
      renderAnalytics();
    });
  });
}

function renderSubzoneAnalytics(el) {
  const sz = SUBZONES.find(s => s.id === state.selectedSubzone);
  if (!sz) return;
  const d = sz[LANG];
  const region = REGIONS[sz.region];

  el.innerHTML =
    '<div class="analytics-header"><div><h2>' + d.full + '</h2><span class="subtitle">' + region[LANG].name + '</span></div></div>' +
    '<div class="card"><div class="card-title">' + T('anatomy') + '</div><p>' + d.note + '</p></div>' +
    '<div class="card"><div class="card-title">' + T('functions') + '</div>' +
      '<div class="tags">' + region[LANG].functions.slice(0, 4).map(f => '<span class="tag">' + f + '</span>').join('') + '</div></div>';
}

function renderDiseaseAnalytics(el) {
  const d = state.currentDisease;
  const data = d[LANG];
  const sev = state.severity;
  const stageIdx = Math.min(3, Math.floor(sev / 25));
  const stageLabel = ['I', 'II', 'III', 'IV'][stageIdx];

  const affectedNames = d.affected.map(id => {
    const sz = SUBZONES.find(s => s.id === id);
    return sz ? sz[LANG].name : id;
  });

  const metricMap = [
    ['cognitive', 'metricCognitive'], ['motor', 'metricMotor'],
    ['language', 'metricLanguage'], ['sensory', 'metricSensory'],
    ['memory', 'metricMemory'], ['connectivity', 'metricConnectivity']
  ];

  const metricsHtml = metricMap.map(([key, labelKey]) => {
    const base = d.en.metrics[key];
    const impairment = 1 - base;
    const current = Math.max(0, base - impairment * (sev / 100));
    const pct = Math.round(current * 100);
    const cls = current > 0.75 ? 'good' : current > 0.5 ? 'warn' : 'bad';
    return '<div class="metric-row"><span class="metric-label">' + T(labelKey) + '</span><span class="metric-value ' + cls + '">' + pct + '%</span></div>';
  }).join('');

  const progBar = data.stages.map((_, i) =>
    '<div class="progression-step ' + (i === stageIdx ? 'current' : i < stageIdx ? 'past' : '') + '"></div>'
  ).join('');

  const progLabels = data.stages.map((_, i) =>
    '<span class="' + (i === stageIdx ? 'active' : '') + '">' + (i + 1) + '</span>'
  ).join('');

  el.innerHTML =
    '<div class="analytics-header"><div><h2>' + data.name + '</h2><span class="subtitle">' + data.short + '</span></div></div>' +
    '<div class="card" style="border-left:2px solid ' + d.color + '">' +
      '<div class="card-title">Stage ' + stageLabel + '<span class="badge">' + sev + '%</span></div>' +
      '<p>' + data.desc + '</p></div>' +
    '<div class="card"><div class="card-title">' + T('progression') + '</div>' +
      '<div class="progression-bar">' + progBar + '</div>' +
      '<div class="progression-labels">' + progLabels + '</div>' +
      '<p style="font-size:11.5px"><strong>' + data.stages[stageIdx] + '</strong></p></div>' +
    '<div class="card"><div class="card-title">' + T('mechanism') + '</div><p>' + data.mechanism + '</p></div>' +
    '<div class="card"><div class="card-title">' + T('affected') + '</div>' +
      '<div class="tags">' + affectedNames.map(n => '<span class="tag danger">' + n + '</span>').join('') + '</div></div>' +
    '<div class="card"><div class="card-title">' + T('neuro') + '</div>' +
      '<div class="tags">' + data.neuro.map(n => '<span class="tag warn">' + n + '</span>').join('') + '</div></div>' +
    '<div class="card"><div class="card-title">' + T('symptoms') + '</div>' +
      '<div class="tags">' + data.symptoms.map(s => '<span class="tag danger">' + s + '</span>').join('') + '</div></div>' +
    '<div class="card"><div class="card-title">' + T('metrics') + '</div>' + metricsHtml + '</div>';
}

/* ================================================================
   STATUS
   ================================================================ */
function setStatus(type, text) {
  const el = document.getElementById('statusIndicator');
  el.className = 'status-indicator' + (type === 'warn' ? ' warn' : type === 'alert' ? ' danger' : '');
  el.textContent = text;
}

/* ================================================================
   CHIPS
   ================================================================ */
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const key = chip.dataset.toggle;
    state.chips[key] = !state.chips[key];
    chip.classList.toggle('on', state.chips[key]);

    if (key === 'labels') {
      Object.values(subzoneMeshes).forEach(m => {
        if (m.userData.halo) m.userData.halo.visible = state.chips.labels;
      });
    }
    if (key === 'impulses') {
      impulses.forEach(p => p.mesh.visible = state.chips.impulses);
      pathwayData.forEach(pw => pw.tube.visible = state.chips.impulses);
    }
  });
});

/* ================================================================
   THEME
   ================================================================ */
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const icon = document.getElementById('themeIcon');
  if (theme === 'light') {
    icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  } else {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
  try { localStorage.setItem('nm-theme', theme); } catch(e){}
}

document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
});

/* ================================================================
   LANGUAGE
   ================================================================ */
function setLanguage(lang) {
  LANG = lang;
  document.documentElement.setAttribute('data-lang', lang);

  document.getElementById('chipLabels').textContent = T('labels');
  document.getElementById('chipImpulses').textContent = T('impulses');
  document.getElementById('chipRotate').textContent = T('rotate');
  document.getElementById('focusTag').textContent = T('focus');
  document.getElementById('hintDrag').textContent = T('drag');
  document.getElementById('hintZoom').textContent = T('zoom');
  document.getElementById('hintClick').textContent = T('click');
  document.getElementById('lobesTitle').textContent = T('lobes');
  document.getElementById('diseasesTitle').textContent = T('diseases');
  document.getElementById('severityLabel').textContent = T('severity');
  document.getElementById('leftTitle').textContent = T('atlas');
  document.getElementById('rightTitle').textContent = T('analytics');
  document.getElementById('tabAtlas').textContent = T('atlas');
  document.getElementById('tabAnalytics').textContent = T('analytics');
  document.getElementById('tabSimulation').textContent = T('simulation');
  document.getElementById('loaderText').textContent = T('loadingModel');

  renderRegionList();
  renderDiseaseList();
  applyHighlight();
  renderAnalytics();
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setLanguage(btn.dataset.lang);
  });
});

/* ================================================================
   NAV TABS
   ================================================================ */
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});

/* ================================================================
   MOBILE PANELS
   ================================================================ */
const panelLeft = document.getElementById('panelLeft');
const panelRight = document.getElementById('panelRight');
const scrim = document.getElementById('scrim');

function openLeftPanel() { panelLeft.classList.add('open'); panelRight.classList.remove('open'); scrim.classList.add('show'); }
function openRightPanel() { panelRight.classList.add('open'); panelLeft.classList.remove('open'); scrim.classList.add('show'); }
function closeMobilePanels() { panelLeft.classList.remove('open'); panelRight.classList.remove('open'); scrim.classList.remove('show'); }

document.getElementById('menuBtn').addEventListener('click', openLeftPanel);
document.getElementById('panelBtn').addEventListener('click', openRightPanel);
document.getElementById('closeLeft').addEventListener('click', closeMobilePanels);
document.getElementById('closeRight').addEventListener('click', closeMobilePanels);
scrim.addEventListener('click', closeMobilePanels);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeMobilePanels();
    state.selectedRegion = null;
    state.selectedSubzone = null;
    applyHighlight();
    renderAnalytics();
    updateRegionListUI();
  }
});

/* ================================================================
   INIT
   ================================================================ */
function init() {
  // Restore theme
  try {
    const saved = localStorage.getItem('nm-theme');
    if (saved) setTheme(saved);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) setTheme('light');
  } catch(e){}

  renderRegionList();
  renderDiseaseList();
  renderAnalytics();
  resize();

  // Start animation
  animate();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

console.log('🧠 NeuralMap 3D (GLB) — initialized');
</script>
</body>
</html>
