<!DOCTYPE html>
<html lang="ru" data-lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<title>Neuro - Cortex — Clinical 3D Brain Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050508;--bg-1:#0a0b10;--bg-2:#11131c;--bg-3:#191c28;
  --border:rgba(255,255,255,.08);--border-hi:rgba(255,255,255,.22);
  --text:#f8fafc;--text-2:rgba(248,250,252,.68);--text-3:rgba(248,250,252,.38);
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;--accent:#38bdf8;
  --font:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --topbar-h:50px;
  --panel-l:310px;
  --panel-r:410px;
  --ease:cubic-bezier(0.16, 1, 0.3, 1);
}
[data-theme="light"]{
  --bg:#f8fafc;--bg-1:#ffffff;--bg-2:#f1f5f9;--bg-3:#e2e8f0;
  --border:rgba(15,23,42,.08);--border-hi:rgba(15,23,42,.22);
  --text:#0f172a;--text-2:rgba(15,23,42,.68);--text-3:rgba(15,23,42,.42);
}

/* ═══ 16:9 LARGE MONITORS SCALING ═══ */
@media (min-width:1440px){
  :root{--topbar-h:54px;--panel-l:335px;--panel-r:440px}
  html{font-size:15px}
}
@media (min-width:1920px){
  :root{--topbar-h:60px;--panel-l:375px;--panel-r:490px}
  html{font-size:16.5px}
}
@media (min-width:2560px){
  :root{--topbar-h:70px;--panel-l:440px;--panel-r:560px}
  html{font-size:18.5px}
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  font-size:0.92rem;line-height:1.5;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
input{font-family:inherit;color:inherit}
svg{display:block}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:2px}

.app{
  display:grid;
  grid-template-rows:calc(var(--topbar-h) + var(--safe-top)) 1fr;
  height:100dvh;
  background:var(--bg);
  overflow:hidden;
}

/* ═══ TOPBAR ═══ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:var(--safe-top) calc(14px + var(--safe-right)) 0 calc(14px + var(--safe-left));
  height:calc(var(--topbar-h) + var(--safe-top));
  background:var(--bg-1);
  border-bottom:1px solid var(--border);
  z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;flex:none}
.brand-icon{
  width:24px;height:24px;
  display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#10b981,#38bdf8);color:#000;
  border-radius:6px;
}
.brand-icon svg{width:14px;height:14px}
.brand-name{font-size:0.94rem;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.fps-badge{
  font-family:var(--mono);font-size:0.68rem;font-weight:600;
  color:var(--success);padding:2px 7px;border-radius:4px;
  background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);
  font-variant-numeric:tabular-nums;flex:none;
}

.search-wrap{position:relative;flex:1;max-width:340px;margin:0 8px}
@media (max-width:640px){.search-wrap{max-width:160px;margin:0 2px}}
.search-input{
  width:100%;height:30px;padding:0 10px 0 28px;
  border-radius:6px;border:1px solid var(--border);
  background:var(--bg-2);color:var(--text);
  font-size:0.75rem;outline:none;
  transition:border-color .15s ease,background .15s ease;
}
.search-input::placeholder{color:var(--text-3)}
.search-input:focus{border-color:var(--border-hi);background:var(--bg-3)}
.search-icon{
  position:absolute;left:8px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;color:var(--text-3);pointer-events:none;
}
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--bg-1);border:1px solid var(--border-hi);
  border-radius:7px;max-height:260px;overflow-y:auto;
  box-shadow:0 12px 32px rgba(0,0,0,.6);
  display:none;z-index:300;padding:4px;
}
.search-results.open{display:block}
.search-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;padding:7px 9px;border-radius:5px;text-align:left;
  font-size:0.75rem;color:var(--text);
}
.search-item:hover{background:var(--bg-3)}
.search-item-type{
  font-family:var(--mono);font-size:0.58rem;color:var(--text-3);
  text-transform:uppercase;padding:1px 5px;border-radius:3px;
  background:var(--bg-2);border:1px solid var(--border);flex:none;
}

.topbar-actions{display:flex;align-items:center;gap:6px;flex:none}
.lang-switch{
  display:flex;background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:5px;padding:2px;gap:1px;
}
.lang-btn{
  padding:3px 7px;
  font-family:var(--mono);font-size:0.68rem;font-weight:600;
  letter-spacing:.3px;border-radius:3px;
  color:var(--text-3);
  transition:background .15s ease,color .15s ease;
}
.lang-btn.active{background:var(--text);color:var(--bg)}
.icon-btn{
  width:30px;height:30px;min-width:30px;
  display:grid;place-items:center;
  border-radius:5px;color:var(--text-2);
  border:1px solid var(--border);background:var(--bg-2);
  transition:border-color .15s ease,color .15s ease;
}
.icon-btn:hover{border-color:var(--border-hi);color:var(--text)}
.icon-btn svg{width:14px;height:14px}
.mobile-only{display:grid}
@media (min-width:1025px){.mobile-only{display:none}}

/* ═══ BODY LAYOUT ═══ */
.body{
  display:grid;grid-template-columns:1fr;
  overflow:hidden;min-height:0;position:relative;
}
@media (min-width:1025px){
  .body{grid-template-columns:var(--panel-l) 1fr}
}

.panel{
  overflow-y:auto;overflow-x:hidden;
  padding:14px 12px;min-height:0;
  background:var(--bg-1);
  -webkit-overflow-scrolling:touch;
}
@media (min-width:1440px){.panel{padding:16px 14px}}
.panel-left{border-right:1px solid var(--border)}

/* ═══ RIGHT SECTOR: INFORMATIVE CLINICAL DASHBOARD DRAWER ═══ */
.panel-right{
  position:fixed;
  top:calc(var(--topbar-h) + var(--safe-top));
  right:0;bottom:0;
  width:min(var(--panel-r), 94vw);
  z-index:180;
  background:rgba(10, 11, 16, 0.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-left:1px solid var(--border-hi);
  transform:translate3d(100%, 0, 0);
  transition:transform .28s var(--ease);
  padding-bottom:calc(20px + var(--safe-bottom));
  box-shadow:-20px 0 50px rgba(0,0,0,.6);
  will-change:transform;
}
[data-theme="light"] .panel-right{
  background:rgba(255, 255, 255, 0.95);
  box-shadow:-12px 0 32px rgba(0,0,0,.1);
}
.panel-right.open{transform:translate3d(0, 0, 0)}

@media (max-width:1024px){
  .panel-left{
    position:fixed;
    top:calc(var(--topbar-h) + var(--safe-top));
    left:0;bottom:0;
    width:min(320px, 88vw);z-index:200;
    background:var(--bg-1);
    transform:translate3d(-100%,0,0);
    transition:transform .28s var(--ease);
    padding-bottom:calc(16px + var(--safe-bottom));
    box-shadow:16px 0 40px rgba(0,0,0,.5);
  }
  .panel-left.open{transform:translate3d(0,0,0)}
}

.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px solid var(--border);
  position:sticky;top:-16px;background:inherit;
  padding-top:14px;margin-top:-14px;z-index:5;
}
.panel-head h2{
  font-family:var(--mono);font-size:0.66rem;font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);
}
.panel-close{
  width:26px;height:26px;display:grid;place-items:center;
  border-radius:5px;color:var(--text-2);background:var(--bg-2);
  border:1px solid var(--border);
}
.panel-close:hover{color:var(--text);border-color:var(--border-hi)}
.panel-close svg{width:12px;height:12px}
@media (min-width:1025px){#closeLeft{display:none}}

.section{margin-bottom:16px}
.section-title{
  font-family:var(--mono);font-size:0.62rem;font-weight:600;
  letter-spacing:1.3px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:7px;
  display:flex;align-items:center;justify-content:space-between;
}

/* ═══ LEFT PANEL LIST ITEMS ═══ */
.region-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 9px;border-radius:6px;text-align:left;
  transition:background .15s ease,border-color .15s ease;
  margin-bottom:3px;
  border:1px solid transparent;background:transparent;
}
.region-item:hover{background:var(--bg-2);border-color:var(--border)}
.region-item.active{background:var(--bg-3);border-color:var(--border-hi)}
.region-dot{
  width:8px;height:8px;border-radius:50%;flex:none;
  background:var(--r-color,#34d399);
}
.region-dot.cube{border-radius:2px;transform:rotate(45deg)}
.region-item.active .region-dot{
  box-shadow:0 0 0 3px color-mix(in srgb, var(--r-color,#34d399) 28%, transparent);
}
.region-info{flex:1;min-width:0}
.region-name{display:block;font-size:0.79rem;font-weight:500;color:var(--text);line-height:1.2}
.region-meta{display:block;font-size:0.65rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region-ba{
  font-family:var(--mono);font-size:0.58rem;color:var(--text-3);
  padding:2px 5px;border-radius:4px;background:var(--bg-2);border:1px solid var(--border);flex:none;
}

.task-item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:7px 9px;border-radius:6px;text-align:left;
  margin-bottom:4px;border:1px solid var(--border);
  background:var(--bg-2);transition:border-color .15s ease,background .15s ease;
}
.task-item:hover{border-color:var(--border-hi);background:var(--bg-3)}
.task-item.active{border-color:var(--accent);background:rgba(56,189,248,.12)}
.task-play{
  width:20px;height:20px;border-radius:4px;display:grid;place-items:center;
  background:var(--bg-3);color:var(--accent);font-family:var(--mono);font-size:0.62rem;flex:none;
}
.task-item.active .task-play{background:var(--accent);color:#000}

.disease-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 9px;border-radius:6px;text-align:left;
  transition:background .15s ease,border-color .15s ease;
  margin-bottom:3px;
  border:1px solid var(--border);background:transparent;
  position:relative;overflow:hidden;
}
.disease-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:2px;background:var(--d-color,#666);opacity:.6;
}
.disease-item:hover{background:var(--bg-2)}
.disease-item.active{background:var(--bg-3);border-color:var(--border-hi)}
.disease-item.active::before{opacity:1;width:3px}
.disease-icon{
  width:20px;height:20px;border-radius:4px;
  display:grid;place-items:center;
  background:var(--d-color,#666);color:#fff;
  font-family:var(--mono);font-size:0.64rem;font-weight:700;flex:none;
}
.disease-body{flex:1;min-width:0}
.disease-name{font-size:0.78rem;font-weight:500;color:var(--text);display:block;line-height:1.2}
.disease-desc{font-size:0.65rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ═══ SEVERITY ═══ */
.severity-box{
  margin-top:8px;padding:10px 12px;
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:7px;
}
.severity-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.severity-label{font-family:var(--mono);font-size:0.62rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3)}
.severity-value{font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--text)}
.severity-slider{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;display:block}
.severity-slider::-webkit-slider-runnable-track{
  height:3px;border-radius:2px;
  background:linear-gradient(to right,var(--text) var(--p,50%),var(--border) var(--p,50%));
}
.severity-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;
  border-radius:50%;background:var(--text);
  margin-top:-6px;border:none;
}
.severity-stages{display:flex;justify-content:space-between;margin-top:4px;font-family:var(--mono);font-size:0.62rem;color:var(--text-3)}
.severity-stages span.active{color:var(--text);font-weight:600}

/* ═══ VIEWPORT ═══ */
.viewport{
  position:relative;
  background:radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.06) 0%, transparent 70%), var(--bg);
  overflow:hidden;min-height:0;min-width:0;
  display:flex;align-items:center;justify-content:center;
}
#canvas3d{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#canvas3d:active{cursor:grabbing}

.viewport-controls{
  position:absolute;top:12px;left:12px;
  display:flex;align-items:center;gap:6px;z-index:10;
  pointer-events:none;flex-wrap:wrap;max-width:calc(100% - 230px);
}
.mode-switch{
  pointer-events:auto;
  display:inline-flex;background:rgba(10,11,16,.82);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:6px;padding:2px;gap:2px;
}
[data-theme="light"] .mode-switch{background:rgba(255,255,255,.88)}
.mode-btn{
  padding:4px 9px;border-radius:4px;
  font-family:var(--mono);font-size:0.66rem;font-weight:500;
  color:var(--text-2);transition:background .15s ease,color .15s ease;
}
.mode-btn.active{background:var(--text);color:var(--bg);font-weight:600}

.chip{
  pointer-events:auto;
  display:inline-flex;align-items:center;gap:5px;
  height:28px;padding:0 9px;border-radius:6px;
  border:1px solid var(--border);
  background:rgba(10,11,16,.78);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--text-2);
  font-family:var(--mono);font-size:0.66rem;font-weight:500;
  white-space:nowrap;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
[data-theme="light"] .chip{background:rgba(255,255,255,.88)}
.chip.on{background:var(--bg-3);border-color:var(--border-hi);color:var(--text)}
.chip-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
.chip.on .chip-dot{background:var(--success);opacity:1}

.slice-bar{
  pointer-events:auto;
  display:inline-flex;align-items:center;gap:7px;
  height:28px;padding:0 9px;border-radius:6px;
  border:1px solid var(--border);
  background:rgba(10,11,16,.78);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-family:var(--mono);font-size:0.63rem;color:var(--text-2);
}
[data-theme="light"] .slice-bar{background:rgba(255,255,255,.88)}
.slice-slider{
  -webkit-appearance:none;appearance:none;
  width:60px;height:3px;border-radius:2px;
  background:var(--border-hi);cursor:pointer;
}
.slice-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;
  border-radius:50%;background:var(--text);
}
.slice-val{min-width:28px;text-align:right;color:var(--text);font-weight:600}

/* Non-clickable Focus Indicator */
.focus-indicator{
  position:absolute;top:12px;right:12px;
  pointer-events:none;user-select:none;z-index:10;
  display:flex;align-items:center;gap:8px;
  padding:5px 10px;border-radius:6px;
  background:rgba(10,11,16,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--border);
  font-family:var(--mono);font-size:0.68rem;
}
[data-theme="light"] .focus-indicator{background:rgba(255,255,255,.85)}
.focus-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--f-color, var(--text-3));
  box-shadow:0 0 8px var(--f-color, transparent);
}
.focus-tag{color:var(--text-3);font-size:0.6rem;text-transform:uppercase;letter-spacing:1px}
.focus-val{color:var(--text);font-weight:600}

/* HTML Labels */
.labels-layer{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.zone-label{
  position:absolute;left:0;top:0;
  pointer-events:auto;
  display:flex;align-items:center;gap:5px;
  padding:3px 8px 3px 6px;border-radius:4px;
  background:rgba(8, 9, 14, 0.85);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.15);
  font-family:var(--mono);font-size:0.64rem;font-weight:500;
  color:#f8fafc;white-space:nowrap;
  transform:translate3d(-9999px,-9999px,0);
  transition:opacity .15s ease,border-color .15s ease;
  will-change:transform,opacity;
  cursor:pointer;
}
[data-theme="light"] .zone-label{
  background:rgba(255,255,255,.92);
  border-color:rgba(15,23,42,.15);color:#0f172a;
}
.zone-label.hidden{opacity:0;pointer-events:none}
.zone-label:hover{border-color:var(--ldot-color,#fff);z-index:10}
.zone-label.active{
  background:var(--bg-3);
  border-color:var(--ldot-color,#fff);
  box-shadow:0 0 14px color-mix(in srgb, var(--ldot-color,#fff) 45%, transparent);
  color:var(--text);z-index:12;
}
.zone-label .ldot{
  width:5px;height:5px;border-radius:50%;flex:none;
  background:var(--ldot-color,#34d399);
}
.zone-label .lba{font-size:0.56rem;opacity:.55;margin-left:2px}

.status-indicator{
  position:absolute;bottom:12px;left:12px;
  pointer-events:none;
  display:flex;align-items:center;gap:5px;
  padding:4px 9px;background:rgba(10,11,16,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--border);border-radius:5px;
  font-family:var(--mono);font-size:0.64rem;
  letter-spacing:.7px;text-transform:uppercase;
  color:var(--text-3);z-index:10;
}
[data-theme="light"] .status-indicator{background:rgba(255,255,255,.85)}
.status-indicator::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--success);
}
.status-indicator.danger::before{background:var(--danger)}
.status-indicator.fmri::before{background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* Model Loader */
.model-loader{
  position:absolute;inset:0;
  display:grid;place-items:center;
  background:var(--bg);z-index:20;
  transition:opacity .35s ease;
}
.model-loader.hidden{opacity:0;pointer-events:none}
.model-loader-spinner{
  width:30px;height:30px;margin:0 auto 10px;
  border:2px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.85s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.model-loader-text{
  font-family:var(--mono);font-size:0.68rem;
  letter-spacing:1.3px;text-transform:uppercase;
  color:var(--text-3);text-align:center;
}

/* ═══ NEW INFORMATIVE RIGHT PANEL STYLES ═══ */
.back-btn{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:0.65rem;font-weight:500;
  color:var(--text-2);background:var(--bg-2);
  border:1px solid var(--border);border-radius:5px;
  padding:4px 9px;margin-bottom:10px;
  transition:border-color .15s ease,color .15s ease;
}
.back-btn:hover{color:var(--text);border-color:var(--border-hi)}

.dossier-hero{
  background:linear-gradient(135deg, var(--bg-2) 0%, var(--bg-3) 100%);
  border:1px solid var(--border-hi);
  border-left:3px solid var(--hero-color, #38bdf8);
  border-radius:8px;padding:12px 13px;margin-bottom:10px;
}
.dossier-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;
}
.dossier-top h2{font-size:1.02rem;font-weight:700;letter-spacing:-.2px;line-height:1.22;color:var(--text)}
.dossier-latin{font-family:var(--mono);font-size:0.68rem;color:var(--text-3);display:block;margin-top:2px}
.ba-badge{
  font-family:var(--mono);font-size:0.62rem;font-weight:600;
  padding:3px 7px;border-radius:4px;
  background:rgba(255,255,255,.05);border:1px solid var(--border-hi);
  color:var(--hero-color, var(--text));white-space:nowrap;flex:none;
}
.dossier-actions{
  display:flex;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border);
}
.dossier-action-btn{
  flex:1;padding:5px 8px;border-radius:5px;
  font-family:var(--mono);font-size:0.62rem;font-weight:600;
  text-align:center;background:var(--bg-1);border:1px solid var(--border);
  color:var(--text-2);transition:border-color .15s ease,color .15s ease,background .15s ease;
}
.dossier-action-btn:hover{border-color:var(--border-hi);color:var(--text);background:var(--bg-2)}

/* 2x2 Biometric Telemetry Grid */
.bio-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;
}
.bio-cell{
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:7px;padding:8px 10px;
}
.bio-label{
  font-family:var(--mono);font-size:0.58rem;text-transform:uppercase;
  letter-spacing:.8px;color:var(--text-3);display:block;margin-bottom:2px;
}
.bio-val{
  font-family:var(--mono);font-size:0.84rem;font-weight:700;color:var(--text);
}
.bio-unit{font-size:0.62rem;color:var(--text-3);font-weight:400;margin-left:3px}

.card{
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:8px;padding:11px 12px;margin-bottom:9px;
}
.card-title{
  font-family:var(--mono);font-size:0.62rem;font-weight:600;
  letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.card-title .badge{
  font-family:var(--mono);font-size:0.6rem;
  padding:1px 6px;border-radius:4px;
  background:var(--bg-3);color:var(--text-2);border:1px solid var(--border);
}
.card p{font-size:0.79rem;line-height:1.55;color:var(--text-2);margin:0}

/* Neurotransmitter Profile Bars */
.nt-row{margin-bottom:7px}
.nt-row:last-child{margin-bottom:0}
.nt-head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:0.66rem;margin-bottom:3px}
.nt-name{color:var(--text-2)}
.nt-lvl{color:var(--text);font-weight:600}
.nt-bar{height:4px;border-radius:2px;background:var(--bg-3);overflow:hidden}
.nt-fill{height:100%;border-radius:2px}

.metric-row{padding:6px 0;border-bottom:1px solid var(--border)}
.metric-row:last-child{border-bottom:none}
.metric-top{display:flex;align-items:center;justify-content:space-between;font-size:0.75rem;margin-bottom:4px}
.metric-label{color:var(--text-2)}
.metric-value{font-family:var(--mono);font-size:0.75rem;font-weight:600}
.metric-value.good{color:var(--success)}
.metric-value.warn{color:var(--warn)}
.metric-value.bad{color:var(--danger)}
.metric-bar{height:3px;border-radius:2px;background:var(--bg-3);overflow:hidden}
.metric-fill{height:100%;border-radius:2px;transition:width .3s var(--ease)}
.metric-fill.good{background:var(--success)}
.metric-fill.warn{background:var(--warn)}
.metric-fill.bad{background:var(--danger)}

.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{
  font-family:var(--mono);font-size:0.65rem;
  padding:3px 7px;border-radius:4px;
  background:var(--bg-3);border:1px solid var(--border);color:var(--text-2);
}
.tag.danger{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.25);color:#f87171}
.tag.warn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.25);color:#fbbf24}

.sub-item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:7px 9px;border-radius:6px;
  border:1px solid var(--border);
  background:var(--bg-3);color:var(--text);
  font-size:0.76rem;text-align:left;
  transition:border-color .15s ease,transform .15s ease;
  margin-bottom:4px;
}
.sub-item:hover{border-color:var(--border-hi);transform:translateX(2px)}
.sub-item.active-step{border-color:var(--accent);background:rgba(56,189,248,.12)}
.sub-item .pin{width:6px;height:6px;border-radius:50%;flex:none}
.sub-item-info{flex:1;min-width:0}
.sub-item-title{display:block;font-weight:600;color:var(--text);font-size:0.76rem}
.sub-item-sub{display:block;font-size:0.64rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-item .go{margin-left:auto;color:var(--text-3);font-family:var(--mono);font-size:0.66rem}

.progression-bar{display:flex;height:3px;border-radius:2px;overflow:hidden;background:var(--bg-3);margin-bottom:8px;gap:2px}
.progression-step{flex:1;background:var(--border)}
.progression-step.past{background:var(--warn)}
.progression-step.current{background:var(--text)}
.progression-labels{display:flex;gap:2px;margin-bottom:8px;font-family:var(--mono);font-size:0.62rem;text-align:center;color:var(--text-3)}
.progression-labels span{flex:1}
.progression-labels span.active{color:var(--text);font-weight:600}

.scrim{
  position:fixed;inset:calc(var(--topbar-h) + var(--safe-top)) 0 0 0;
  background:rgba(0,0,0,.5);z-index:150;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.scrim.show{opacity:1;pointer-events:auto}
</style>

<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn mobile-only" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>
          </svg>
        </div>
        <span class="brand-name">Neuro - Cortex</span>
      </div>
      <span class="fps-badge" id="fpsCounter">60 FPS</span>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск: Таламус, Желудочки, BA 44..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="topbar-actions">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn active" data-lang="ru">RU</button>
      </div>
      <button class="icon-btn" id="resetCamBtn" title="Сброс вида" aria-label="Reset View">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="themeIcon">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="body">
    <aside class="panel panel-left" id="panelLeft">
      <div class="panel-head">
        <h2 id="leftTitle">Анатомический атлас</h2>
        <button class="panel-close" id="closeLeft" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="section">
        <div class="section-title"><span id="lobesTitle">Отделы и доли коры</span><span>6</span></div>
        <div id="regionList"></div>
      </div>

      <div class="section">
        <div class="section-title"><span id="subcorticalTitle">Глубокие 3D-структуры</span><span>7</span></div>
        <div id="subcorticalList"></div>
      </div>

      <div class="section">
        <div class="section-title"><span id="fmriTitle">фМРТ-Сценарии (Активность)</span><span>4</span></div>
        <div id="fmriList"></div>
      </div>

      <div class="section">
        <div class="section-title"><span id="diseasesTitle">Клинические патологии</span><span>9</span></div>
        <div id="diseaseList"></div>
      </div>

      <div id="severityContainer" style="display:none">
        <div class="severity-box">
          <div class="severity-head">
            <span class="severity-label" id="severityLabel">Тяжесть поражения</span>
            <span class="severity-value" id="severityValue">50%</span>
          </div>
          <input type="range" class="severity-slider" id="severitySlider" min="0" max="100" value="50">
          <div class="severity-stages" id="severityStages">
            <span>I</span><span>II</span><span>III</span><span>IV</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="viewport" id="viewport">
      <canvas id="canvas3d"></canvas>
      <div class="labels-layer" id="labelsLayer"></div>
      <div class="model-loader" id="modelLoader">
        <div>
          <div class="model-loader-spinner"></div>
          <div class="model-loader-text" id="loaderText">Загрузка 3D-модели мозга</div>
        </div>
      </div>

      <div class="viewport-controls">
        <div class="mode-switch">
          <button class="mode-btn active" data-mode="surface" id="modeSurface">Поверхность (Сосуды)</button>
          <button class="mode-btn" data-mode="neural" id="modeNeural">Внутри (3D-Ядра + Нейросеть)</button>
        </div>
        <button class="chip on" data-toggle="labels"><span class="chip-dot"></span><span id="chipLabels">Метки</span></button>
        <button class="chip" data-toggle="rotate"><span class="chip-dot"></span><span id="chipRotate">Вращение</span></button>

        <div class="slice-bar">
          <span id="sliceXLabel">Срез X:</span>
          <input type="range" class="slice-slider" id="sliceXSlider" min="-1.1" max="1.2" step="0.02" value="1.2">
          <span class="slice-val" id="sliceXVal">Выкл</span>
        </div>
        <div class="slice-bar">
          <span id="sliceYLabel">Срез Y:</span>
          <input type="range" class="slice-slider" id="sliceYSlider" min="-1.0" max="1.2" step="0.02" value="1.2">
          <span class="slice-val" id="sliceYVal">Выкл</span>
        </div>
      </div>

      <div class="focus-indicator" id="focusIndicator">
        <span class="focus-dot" id="focusDot"></span>
        <span class="focus-tag" id="focusTag">Фокус:</span>
        <span class="focus-val" id="focusValue">Весь мозг</span>
      </div>

      <div class="status-indicator" id="statusIndicator">Норма</div>
    </main>

    <aside class="panel panel-right" id="panelRight">
      <div class="panel-head">
        <h2 id="rightTitle">Клиническая нейробиология</h2>
        <button class="panel-close" id="closeRight" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="analyticsContent"></div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim"></div>

/* ================================================================
   LOBE CLASSIFICATION
   ================================================================ */
const LOBE_INDEX = { frontal: 0, parietal: 1, temporal: 2, occipital: 3, cerebellum: 4, brainstem: 5 };
const LOBE_COLORS = [
  new THREE.Color('#10b981'),
  new THREE.Color('#38bdf8'),
  new THREE.Color('#a855f7'),
  new THREE.Color('#eab308'),
  new THREE.Color('#ec4899'),
  new THREE.Color('#06b6d4')
];

function classifyLobe(x, y, z) {
  if (y < -0.42 && Math.abs(x) < 0.28 && z < 0.15) return 'brainstem';
  if (y < -0.18 && z < -0.12) return 'cerebellum';
  if (z > 0.08 - y * 0.18 && y > -0.25) return 'frontal';
  if (z < -0.48 && y >= -0.18) return 'occipital';
  if (y < 0.14 && Math.abs(x) > 0.25 && z <= 0.25 && z >= -0.52) return 'temporal';
  if (y >= 0.08) return 'parietal';
  return z >= 0 ? 'frontal' : 'temporal';
}

function setupBrainModel(model) {
  if (brainState.loaded) return;

  const bbox = new THREE.Box3().setFromObject(model);
  const size = bbox.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const scale = 2.15 / maxDim;
  model.scale.setScalar(scale);

  model.position.set(0, 0, 0);
  const bbox2 = new THREE.Box3().setFromObject(model);
  const center2 = bbox2.getCenter(new THREE.Vector3());
  model.position.set(-center2.x, -center2.y, -center2.z);
  model.updateMatrixWorld(true);

  // Auto-calibrate orientation so Frontal is +Z and Stem/Cerebellum is -Z
  const allVerts = [];
  const vTmp = new THREE.Vector3();
  model.traverse(function(c) {
    if (c.isMesh && c.geometry) {
      const p = c.geometry.attributes.position;
      for (let i = 0; i < p.count; i += 4) {
        vTmp.fromBufferAttribute(p, i).applyMatrix4(c.matrixWorld);
        allVerts.push(vTmp.clone());
      }
    }
  });

  if (allVerts.length > 0) {
    const fBox = new THREE.Box3().setFromPoints(allVerts);
    const fSize = fBox.getSize(new THREE.Vector3());
    if (fSize.x > fSize.z * 1.08) {
      model.rotation.y = Math.PI * 0.5;
      model.updateMatrixWorld(true);
    }
    let lowZSum = 0, lowCount = 0;
    const yThresh = fBox.min.y + fSize.y * 0.25;
    model.traverse(function(c) {
      if (c.isMesh && c.geometry) {
        const p = c.geometry.attributes.position;
        for (let i = 0; i < p.count; i += 5) {
          vTmp.fromBufferAttribute(p, i).applyMatrix4(c.matrixWorld);
          if (vTmp.y < yThresh) { lowZSum += vTmp.z; lowCount++; }
        }
      }
    });
    if (lowCount > 0 && (lowZSum / lowCount) > 0.05) {
      model.rotation.y += Math.PI;
      model.updateMatrixWorld(true);
    }
  }

  brainState.model = model;
  const finalBox = new THREE.Box3().setFromObject(model);
  brainState.size = finalBox.getSize(new THREE.Vector3());
  brainState.radius = brainState.size.length() * 0.5;
  brainState.loaded = true;

  model.traverse(function(child) {
    if (child.isMesh && child.geometry) {
      brainState.surfaceMeshes.push(child);

      // 1. Keep 100% ORIGINAL texture & normal map from GLB (vessels, gyri, sulci)
      const surfMat = child.material;
      if (surfMat) {
        surfMat.side = THREE.DoubleSide;
        surfMat.clippingPlanes = activeClipPlanes;
        surfMat.vertexColors = false;
        if (surfMat.map) {
          surfMat.roughness = 0.65;
          surfMat.metalness = 0.12;
        }
        surfMat.needsUpdate = true;
      }

      // 2. Translucent holographic material for Internal 3D Nuclei & Neural mode
      const neurMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        emissive: 0x1e293b,
        emissiveIntensity: 0.35,
        roughness: 0.3,
        metalness: 0.2,
        transparent: true,
        opacity: 0.13,
        depthWrite: false,
        side: THREE.DoubleSide,
        clippingPlanes: activeClipPlanes
      });

      child.userData.surfMat = surfMat;
      child.userData.neurMat = neurMat;
      child.material = surfMat;
    }
  });

  brainGroup.add(model);

  buildUniformCorticalNeurons();
  buildMarkers();
  buildInternalPathways();
  buildHtmlLabels();
  applyDisplayMode();

  modelLoaderEl.classList.add('hidden');
  requestAnimationFrame(function() {
    resize();
    resetCamera();
  });
}

/* ================================================================
   OUTWARD-INWARD RAYCASTING
   ================================================================ */
const rayHelper = new THREE.Raycaster();

function getSurfaceHit(dirArray) {
  const dir = new THREE.Vector3(dirArray[0], dirArray[1], dirArray[2]).normalize();
  if (!brainState.loaded || brainState.surfaceMeshes.length === 0) {
    return { point: dir.clone().multiplyScalar(0.85), normal: dir.clone() };
  }

  const origin = dir.clone().multiplyScalar(brainState.radius * 3.0);
  const inward = dir.clone().negate();
  rayHelper.set(origin, inward);
  rayHelper.far = brainState.radius * 4.0;

  const hits = rayHelper.intersectObjects(brainState.surfaceMeshes, true);
  if (hits.length > 0) {
    const point = hits[0].point.clone();
    return { point: point.add(dir.clone().multiplyScalar(0.008)), normal: dir.clone() };
  }
  return { point: dir.clone().multiplyScalar(brainState.radius * 0.75), normal: dir.clone() };
}

/* ================================================================
   NEURON CLOUD
   ================================================================ */
function buildUniformCorticalNeurons() {
  const triangles = [];
  let totalArea = 0;
  const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
  const tri = new THREE.Triangle();

  brainState.surfaceMeshes.forEach(function(mesh) {
    const geo = mesh.geometry;
    const pos = geo.attributes.position;
    const index = geo.index;

    if (index) {
      for (let i = 0; i < index.count; i += 3) {
        vA.fromBufferAttribute(pos, index.getX(i)).applyMatrix4(mesh.matrixWorld);
        vB.fromBufferAttribute(pos, index.getY(i)).applyMatrix4(mesh.matrixWorld);
        vC.fromBufferAttribute(pos, index.getZ(i)).applyMatrix4(mesh.matrixWorld);
        tri.set(vA, vB, vC);
        const area = tri.getArea();
        if (area > 0.000001) {
          totalArea += area;
          triangles.push({ a: vA.clone(), b: vB.clone(), c: vC.clone(), cumArea: totalArea });
        }
      }
    } else {
      for (let i = 0; i < pos.count; i += 3) {
        vA.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
        vB.fromBufferAttribute(pos, i + 1).applyMatrix4(mesh.matrixWorld);
        vC.fromBufferAttribute(pos, i + 2).applyMatrix4(mesh.matrixWorld);
        tri.set(vA, vB, vC);
        const area = tri.getArea();
        if (area > 0.000001) {
          totalArea += area;
          triangles.push({ a: vA.clone(), b: vB.clone(), c: vC.clone(), cumArea: totalArea });
        }
      }
    }
  });

  if (triangles.length === 0) return;

  const NEURON_COUNT = 8000;
  const positions = new Float32Array(NEURON_COUNT * 3);
  const colors = new Float32Array(NEURON_COUNT * 3);
  const scales = new Float32Array(NEURON_COUNT);
  const phases = new Float32Array(NEURON_COUNT);
  const lobeIds = new Float32Array(NEURON_COUNT);

  function sampleTriangle() {
    const r = Math.random() * totalArea;
    let lo = 0, hi = triangles.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (triangles[mid].cumArea < r) lo = mid + 1;
      else hi = mid;
    }
    const t = triangles[lo];
    let r1 = Math.random(), r2 = Math.random();
    if (r1 + r2 > 1) { r1 = 1 - r1; r2 = 1 - r2; }
    const r3 = 1 - r1 - r2;
    return new THREE.Vector3(
      t.a.x * r1 + t.b.x * r2 + t.c.x * r3,
      t.a.y * r1 + t.b.y * r2 + t.c.y * r3,
      t.a.z * r1 + t.b.z * r2 + t.c.z * r3
    );
  }

  for (let i = 0; i < NEURON_COUNT; i++) {
    const surfPt = sampleTriangle();
    const depth = Math.random() < 0.78 ? (0.9 + Math.random() * 0.09) : (0.55 + Math.random() * 0.34);
    positions[i * 3] = surfPt.x * depth;
    positions[i * 3 + 1] = surfPt.y * depth;
    positions[i * 3 + 2] = surfPt.z * depth;

    const lid = classifyLobe(surfPt.x, surfPt.y, surfPt.z);
    const lIdx = LOBE_INDEX[lid];
    const baseCol = LOBE_COLORS[lIdx];

    const whiteMix = Math.random() < 0.12 ? 0.45 : 0.0;
    colors[i * 3] = baseCol.r * (1 - whiteMix) + whiteMix;
    colors[i * 3 + 1] = baseCol.g * (1 - whiteMix) + whiteMix;
    colors[i * 3 + 2] = baseCol.b * (1 - whiteMix) + whiteMix;

    scales[i] = 0.6 + Math.random() * 1.1;
    phases[i] = Math.random() * Math.PI * 2;
    lobeIds[i] = lIdx;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
  geo.setAttribute('aLobe', new THREE.BufferAttribute(lobeIds, 1));

  nebulaUniforms = {
    uTime: { value: 0 },
    uActiveLobe: { value: -1.0 },
    uDiseaseColor: { value: new THREE.Color(0xef4444) },
    uDiseaseMix: { value: 0.0 },
    uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
    uClipX: { value: 1.2 },
    uClipY: { value: 1.2 }
  };

  const mat = new THREE.ShaderMaterial({
    uniforms: nebulaUniforms,
    vertexShader: `
      attribute vec3 aColor;
      attribute float aScale;
      attribute float aPhase;
      attribute float aLobe;
      uniform float uTime;
      uniform float uActiveLobe;
      uniform vec3 uDiseaseColor;
      uniform float uDiseaseMix;
      uniform float uPixelRatio;
      uniform float uClipX;
      uniform float uClipY;
      varying vec3 vColor;
      varying float vAlpha;
      varying float vClip;

      void main() {
        vClip = max(position.x - uClipX, position.y - uClipY);
        float pulse = 0.7 + 0.3 * sin(uTime * 2.0 + aPhase);
        float lobeMatch = (uActiveLobe < -0.5) ? 1.0 : (abs(aLobe - uActiveLobe) < 0.1 ? 1.4 : 0.15);

        vec3 finalCol = mix(aColor, uDiseaseColor, uDiseaseMix * 0.7);
        vColor = finalCol * (lobeMatch > 1.0 ? 1.25 : 1.0);
        vAlpha = pulse * lobeMatch;

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = (11.0 * aScale * pulse * uPixelRatio * (lobeMatch > 1.0 ? 1.2 : 1.0)) / -mvPosition.z;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;
      varying float vClip;

      void main() {
        if (vClip > 0.0) discard;
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        float glow = pow(smoothstep(0.5, 0.0, d), 1.6);
        gl_FragColor = vec4(vColor, glow * vAlpha * 0.8);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  nebulaPoints = new THREE.Points(geo, mat);
  brainGroup.add(nebulaPoints);
}

/* ================================================================
   CORTICAL MARKERS & DTI TRACTS
   ================================================================ */
const subzoneGroup = new THREE.Group();
brainGroup.add(subzoneGroup);
const subzoneAnchors = {};
const subzoneHitProxies = [];

const outerRingGeo = new THREE.RingGeometry(0.025, 0.032, 32);
const innerDotGeo = new THREE.CircleGeometry(0.011, 24);
const hitProxyGeo = new THREE.PlaneGeometry(0.11, 0.11);

function buildMarkers() {
  SUBZONES.forEach(function(sz) {
    const hit = getSurfaceHit(sz.dir);
    const color = new THREE.Color(sz.color);

    const anchor = new THREE.Group();
    anchor.position.copy(hit.point);
    anchor.lookAt(hit.point.clone().add(hit.normal));

    const ringMat = new THREE.MeshBasicMaterial({
      color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.9, depthTest: false
    });
    const outerRing = new THREE.Mesh(outerRingGeo, ringMat);
    anchor.add(outerRing);

    const dotMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.95, depthTest: false
    });
    const innerDot = new THREE.Mesh(innerDotGeo, dotMat);
    anchor.add(innerDot);

    const proxyMat = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
    const proxy = new THREE.Mesh(hitProxyGeo, proxyMat);
    proxy.userData = { type: 'subzone', id: sz.id };
    anchor.add(proxy);
    subzoneHitProxies.push(proxy);

    subzoneGroup.add(anchor);
    subzoneAnchors[sz.id] = {
      group: anchor, outerRing: outerRing, innerDot: innerDot,
      color: color, region: sz.region, normal: hit.normal.clone()
    };
  });
}

const pathwaysGroup = new THREE.Group();
brainGroup.add(pathwaysGroup);
const pathwayData = [];
let impulseBeamSystem = null;
let impulseUniforms = null;

function buildInternalPathways() {
  const streakPositions = [], streakColors = [], streakProgress = [], streakSpeeds = [], streakOffsets = [];

  PATHWAYS.forEach(function(tract, idx) {
    const aId = tract.a, bId = tract.b;
    const ancA = subzoneAnchors[aId], ancB = subzoneAnchors[bId];
    if (!ancA || !ancB) return;

    const a = ancA.group.position.clone().multiplyScalar(0.92);
    const b = ancB.group.position.clone().multiplyScalar(0.92);
    const mid1 = a.clone().lerp(b, 0.33).multiplyScalar(0.66);
    const mid2 = a.clone().lerp(b, 0.66).multiplyScalar(0.66);

    const curve = new THREE.CatmullRomCurve3([a, mid1, mid2, b]);
    const cA = ancA.color, cB = ancB.color;

    const bundleGroup = new THREE.Group();
    for (let s = 0; s < 3; s++) {
      const pts = curve.getPoints(34);
      const posArr = new Float32Array(pts.length * 3);
      const colArr = new Float32Array(pts.length * 3);

      for (let i = 0; i < pts.length; i++) {
        const u = i / (pts.length - 1);
        const env = Math.sin(u * Math.PI);
        const ang = u * Math.PI * 3 + (s * Math.PI * 2) / 3;
        const off = s === 0 ? 0 : 0.009 * env;

        posArr[i * 3] = pts[i].x + Math.cos(ang) * off;
        posArr[i * 3 + 1] = pts[i].y + Math.sin(ang) * off;
        posArr[i * 3 + 2] = pts[i].z;

        const c = cA.clone().lerp(cB, u);
        colArr[i * 3] = c.r; colArr[i * 3 + 1] = c.g; colArr[i * 3 + 2] = c.b;
      }

      const lGeo = new THREE.BufferGeometry();
      lGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      lGeo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
      const lMat = new THREE.LineBasicMaterial({
        vertexColors: true, transparent: true, opacity: s === 0 ? 0.55 : 0.25,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      bundleGroup.add(new THREE.Line(lGeo, lMat));
    }

    pathwaysGroup.add(bundleGroup);
    pathwayData.push({ group: bundleGroup, a: aId, b: bId });

    const SAMPLES = 60;
    const curvePts = curve.getPoints(SAMPLES);
    const speed = 0.28 + (idx % 3) * 0.06;
    const offset = idx * 0.19;

    for (let i = 0; i <= SAMPLES; i++) {
      const u = i / SAMPLES;
      streakPositions.push(curvePts[i].x, curvePts[i].y, curvePts[i].z);
      const c = cA.clone().lerp(cB, u);
      streakColors.push(c.r, c.g, c.b);
      streakProgress.push(u);
      streakSpeeds.push(speed);
      streakOffsets.push(offset);
    }
  });

  const streakGeo = new THREE.BufferGeometry();
  streakGeo.setAttribute('position', new THREE.Float32BufferAttribute(streakPositions, 3));
  streakGeo.setAttribute('aColor', new THREE.Float32BufferAttribute(streakColors, 3));
  streakGeo.setAttribute('aProgress', new THREE.Float32BufferAttribute(streakProgress, 1));
  streakGeo.setAttribute('aSpeed', new THREE.Float32BufferAttribute(streakSpeeds, 1));
  streakGeo.setAttribute('aOffset', new THREE.Float32BufferAttribute(streakOffsets, 1));

  impulseUniforms = {
    uTime: { value: 0 },
    uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
    uDiseaseColor: { value: new THREE.Color(0xef4444) },
    uDiseaseMix: { value: 0.0 }
  };

  const streakMat = new THREE.ShaderMaterial({
    uniforms: impulseUniforms,
    vertexShader: `
      attribute vec3 aColor;
      attribute float aProgress;
      attribute float aSpeed;
      attribute float aOffset;
      uniform float uTime;
      uniform float uPixelRatio;
      uniform vec3 uDiseaseColor;
      uniform float uDiseaseMix;
      varying vec3 vColor;
      varying float vIntensity;

      void main() {
        float head = fract(uTime * aSpeed + aOffset);
        float dist = fract(head - aProgress);
        float trail = smoothstep(0.2, 0.0, dist);
        vIntensity = pow(trail, 1.5);

        vec3 baseCol = mix(aColor, uDiseaseColor, uDiseaseMix);
        vColor = mix(baseCol, vec3(1.0), pow(trail, 3.0) * 0.75);

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = (15.0 * vIntensity * uPixelRatio + 1.5) / -mvPosition.z;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vIntensity;

      void main() {
        if (vIntensity < 0.02) discard;
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        float glow = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vColor, glow * vIntensity * 0.92);
      }
    `,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });

  impulseBeamSystem = new THREE.Points(streakGeo, streakMat);
  pathwaysGroup.add(impulseBeamSystem);
}

function applyDisplayMode() {
  const isNeural = state.viewMode === 'neural';
  const isSliced = state.sliceX < 1.15 || state.sliceY < 1.15;

  brainState.surfaceMeshes.forEach(function(mesh) {
    if (mesh.userData.surfMat && mesh.userData.neurMat) {
      mesh.material = isNeural ? mesh.userData.neurMat : mesh.userData.surfMat;
    }
  });

  if (nebulaPoints) nebulaPoints.visible = isNeural;
  pathwaysGroup.visible = isNeural;
  subcorticalGroup.visible = isNeural || isSliced || !!state.selectedSubcortical;

  document.getElementById('modeSurface').classList.toggle('active', !isNeural);
  document.getElementById('modeNeural').classList.toggle('active', isNeural);

  applyDiseaseToBrain();
  applyHighlight();
}

document.querySelectorAll('.mode-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    state.viewMode = btn.dataset.mode;
    applyDisplayMode();
  });
});

const sliceXSlider = document.getElementById('sliceXSlider');
const sliceXVal = document.getElementById('sliceXVal');
const sliceYSlider = document.getElementById('sliceYSlider');
const sliceYVal = document.getElementById('sliceYVal');

function updateSlices() {
  state.sliceX = parseFloat(sliceXSlider.value);
  state.sliceY = parseFloat(sliceYSlider.value);

  clipPlaneX.constant = state.sliceX;
  clipPlaneY.constant = state.sliceY;

  if (nebulaUniforms) {
    nebulaUniforms.uClipX.value = state.sliceX;
    nebulaUniforms.uClipY.value = state.sliceY;
  }

  sliceXVal.textContent = state.sliceX >= 1.15 ? T('sliceOff') : Math.round(((1.2 - state.sliceX) / 2.3) * 100) + '%';
  sliceYVal.textContent = state.sliceY >= 1.15 ? T('sliceOff') : Math.round(((1.2 - state.sliceY) / 2.2) * 100) + '%';

  applyDisplayMode();
}

sliceXSlider.addEventListener('input', updateSlices);
sliceYSlider.addEventListener('input', updateSlices);

/* ================================================================
   RESIZE & CAMERA
   ================================================================ */
let vpWidth = 1, vpHeight = 1;

function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  if (w === 0 || h === 0) return;
  vpWidth = w; vpHeight = h;

  renderer.setSize(w, h, false);
  camera.aspect = w / h;

  const aspect = w / h;
  camera.fov = aspect < 0.55 ? 60 : (aspect < 0.8 ? 52 : (aspect < 1.2 ? 45 : 38));
  camera.updateProjectionMatrix();
}

if (window.ResizeObserver) {
  new ResizeObserver(function() { requestAnimationFrame(resize); }).observe(viewport);
} else {
  window.addEventListener('resize', resize);
}

function resetCamera() {
  const aspect = vpWidth / vpHeight;
  const radius = brainState.radius || 1;
  let d = aspect < 0.6 ? radius * 3.1 : (aspect < 0.85 ? radius * 2.65 : (aspect < 1.25 ? radius * 2.25 : radius * 1.95));
  d = Math.max(1.6, Math.min(6.0, d));

  controls.minDistance = radius * 1.1;
  controls.maxDistance = radius * 5.0;

  const targetDir = new THREE.Vector3(-0.78, 0.18, 0.6).normalize();
  camTween = {
    from: camera.position.clone(),
    to: targetDir.multiplyScalar(d),
    fromT: controls.target.clone(),
    toT: new THREE.Vector3(0, 0, 0),
    t: 0
  };
}

document.getElementById('resetCamBtn').addEventListener('click', function() {
  sliceXSlider.value = 1.2;
  sliceYSlider.value = 1.2;
  updateSlices();
  clearSelection();
  resetCamera();
});

function focusOn(point, customDist) {
  const worldPt = point.clone().applyMatrix4(brainGroup.matrixWorld);
  const dir = worldPt.length() > 0.05 ? worldPt.clone().normalize() : new THREE.Vector3(-0.7, 0.25, 0.65).normalize();
  const radius = brainState.radius || 1;
  const dist = customDist || Math.max(radius * 1.75, 1.65);
  camTween = {
    from: camera.position.clone(),
    to: dir.multiplyScalar(dist),
    fromT: controls.target.clone(),
    toT: new THREE.Vector3(0, 0, 0),
    t: 0
  };
}

/* ================================================================
   RAYCASTING & SELECTION
   ================================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function updatePointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function raycastBeacons() {
  raycaster.setFromCamera(pointer, camera);
  const activeProxies = subzoneHitProxies.filter(function(p) {
    return p.parent && p.parent.visible;
  });
  return raycaster.intersectObjects(activeProxies, false);
}

let downPos = null;
canvas.addEventListener('pointerdown', function(e) {
  downPos = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('pointermove', function(e) {
  if (downPos) return;
  updatePointer(e);
  const hits = raycastBeacons();
  if (hits.length > 0) {
    const id = hits[0].object.userData.id;
    if (state.hoveredSubzone !== id) {
      state.hoveredSubzone = id;
      canvas.style.cursor = 'pointer';
    }
  } else if (state.hoveredSubzone) {
    state.hoveredSubzone = null;
    canvas.style.cursor = 'grab';
  }
});

canvas.addEventListener('pointerup', function(e) {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 10) return;

  updatePointer(e);

  const beaconHits = raycastBeacons();
  if (beaconHits.length > 0) {
    onZoneClick(beaconHits[0].object.userData.id);
    return;
  }

  raycaster.setFromCamera(pointer, camera);

  if (subcorticalGroup.visible) {
    const subHits = raycaster.intersectObjects(subcorticalClickMeshes, false);
    if (subHits.length > 0) {
      selectSubcortical(subHits[0].object.userData.id);
      return;
    }
  }

  const surfHits = raycaster.intersectObjects(brainState.surfaceMeshes, true);
  if (surfHits.length > 0) {
    const localPt = surfHits[0].point.clone();
    brainGroup.worldToLocal(localPt);
    const lid = classifyLobe(localPt.x, localPt.y, localPt.z);
    if (REGIONS[lid]) {
      selectRegion(lid);
      return;
    }
  }

  clearSelection();
});

function stopFmriLoop() {
  if (fmriInterval) {
    clearInterval(fmriInterval);
    fmriInterval = null;
  }
  state.activeFmriTask = null;
  state.fmriStepIndex = 0;
}

function clearSelection() {
  stopFmriLoop();
  state.selectedSubzone = null;
  state.selectedRegion = null;
  state.selectedSubcortical = null;
  state.currentDisease = null;
  setStatus('ready', T('ready'));
  applyDiseaseToBrain();
  applyHighlight();
  updateAllListsUI();
  updateSeverityUI();
  closeRightCurtain();
}

function selectRegion(rid) {
  stopFmriLoop();
  state.selectedRegion = rid;
  state.selectedSubzone = null;
  state.selectedSubcortical = null;
  state.currentDisease = null;
  setStatus('ready', T('ready'));
  const hit = getSurfaceHit(REGIONS[rid].dir);
  focusOn(hit.point);
  applyDiseaseToBrain();
  applyHighlight();
  renderAnalytics();
  updateAllListsUI();
  updateSeverityUI();
  openRightCurtain();
  closeLeftMobile();
}

function selectSubcortical(scId) {
  stopFmriLoop();
  const sc = SUBCORTICAL[scId];
  if (!sc) return;
  state.selectedSubcortical = scId;
  state.selectedRegion = null;
  state.selectedSubzone = null;
  state.currentDisease = null;
  if (state.viewMode !== 'neural') {
    state.viewMode = 'neural';
    applyDisplayMode();
  }
  setStatus('ready', T('ready'));
  focusOn(new THREE.Vector3(sc.center[0] - 0.55, sc.center[1] + 0.18, sc.center[2] + 0.45), 1.55);
  applyHighlight();
  renderAnalytics();
  updateAllListsUI();
  updateSeverityUI();
  openRightCurtain();
  closeLeftMobile();
}

function onZoneClick(id) {
  stopFmriLoop();
  const sz = SUBZONES.find(function(s) { return s.id === id; });
  if (!sz) return;
  state.selectedSubzone = id;
  state.selectedRegion = sz.region;
  state.selectedSubcortical = null;
  state.currentDisease = null;
  setStatus('ready', T('ready'));
  if (subzoneAnchors[id]) focusOn(subzoneAnchors[id].group.position.clone());
  applyDiseaseToBrain();
  applyHighlight();
  renderAnalytics();
  updateAllListsUI();
  updateSeverityUI();
  openRightCurtain();
  closeLeftMobile();
}

function startFmriTask(taskId) {
  stopFmriLoop();
  const task = FMRI_TASKS.find(function(t) { return t.id === taskId; });
  if (!task) return;

  state.activeFmriTask = task;
  state.fmriStepIndex = 0;
  state.selectedRegion = null;
  state.selectedSubzone = task.sequence[0];
  state.selectedSubcortical = null;
  state.currentDisease = null;

  if (state.viewMode !== 'neural') {
    state.viewMode = 'neural';
    applyDisplayMode();
  }

  setStatus('fmri', T('fmriActive'));
  applyHighlight();
  renderAnalytics();
  updateAllListsUI();
  updateSeverityUI();
  openRightCurtain();
  closeLeftMobile();

  fmriInterval = setInterval(function() {
    if (!state.activeFmriTask) return;
    state.fmriStepIndex = (state.fmriStepIndex + 1) % state.activeFmriTask.sequence.length;
    state.selectedSubzone = state.activeFmriTask.sequence[state.fmriStepIndex];
    applyHighlight();
    renderAnalytics();
  }, 1600);
}

/* ================================================================
   HIGHLIGHT & FOCUS INDICATOR
   ================================================================ */
function applyHighlight() {
  const activeRegion = state.selectedRegion || state.hoveredRegion;
  const fmriTask = state.activeFmriTask;

  if (nebulaUniforms) {
    nebulaUniforms.uActiveLobe.value = activeRegion ? LOBE_INDEX[activeRegion] : -1.0;
  }

  Object.keys(subcorticalGroups).forEach(function(scId) {
    const grp = subcorticalGroups[scId];
    const isSel = state.selectedSubcortical === scId || (fmriTask && fmriTask.subcortical.indexOf(scId) !== -1);
    const dim = (state.selectedSubcortical && !isSel) || (fmriTask && !isSel);
    grp.traverse(function(c) {
      if (c.isMesh && c.material) {
        c.material.emissiveIntensity = isSel ? 0.85 : 0.22;
        c.material.opacity = dim ? 0.18 : (isSel ? 0.98 : 0.85);
      }
    });
  });

  Object.keys(subzoneAnchors).forEach(function(id) {
    const anc = subzoneAnchors[id];
    const pos = anc.group.position;
    const clipped = pos.x > state.sliceX || pos.y > state.sliceY;
    if (clipped) {
      anc.group.visible = false;
      return;
    }
    if (fmriTask) {
      anc.group.visible = fmriTask.sequence.indexOf(id) !== -1;
    } else if (state.selectedSubcortical) {
      anc.group.visible = false;
    } else {
      anc.group.visible = !activeRegion || anc.region === activeRegion;
    }
  });

  pathwayData.forEach(function(pw) {
    let isConn = true;
    if (fmriTask) {
      isConn = fmriTask.sequence.indexOf(pw.a) !== -1 && fmriTask.sequence.indexOf(pw.b) !== -1;
    } else if (state.selectedSubzone) {
      isConn = pw.a === state.selectedSubzone || pw.b === state.selectedSubzone;
    }
    pw.group.children.forEach(function(line, idx) {
      line.material.opacity = isConn ? (idx === 0 ? 0.72 : 0.35) : 0.07;
    });
  });

  Object.keys(htmlLabels).forEach(function(id) {
    htmlLabels[id].classList.toggle('active', state.selectedSubzone === id);
  });

  const fv = document.getElementById('focusValue');
  const fInd = document.getElementById('focusIndicator');
  if (fmriTask) {
    fv.textContent = fmriTask[LANG].name;
    fInd.style.setProperty('--f-color', '#38bdf8');
  } else if (state.currentDisease) {
    fv.textContent = state.currentDisease[LANG].name;
    fInd.style.setProperty('--f-color', state.currentDisease.color);
  } else if (state.selectedSubcortical) {
    const sc = SUBCORTICAL[state.selectedSubcortical];
    fv.textContent = sc[LANG].name;
    fInd.style.setProperty('--f-color', sc.color);
  } else if (state.selectedSubzone) {
    const sz = SUBZONES.find(function(s) { return s.id === state.selectedSubzone; });
    fv.textContent = sz[LANG].full;
    fInd.style.setProperty('--f-color', sz.color);
  } else if (activeRegion) {
    const r = REGIONS[activeRegion];
    fv.textContent = r[LANG].name;
    fInd.style.setProperty('--f-color', r.color);
  } else {
    fv.textContent = T('fullBrain');
    fInd.style.setProperty('--f-color', 'rgba(255,255,255,0.35)');
  }
}

/* ================================================================
   DISEASE EFFECTS
   ================================================================ */
function applyDiseaseToBrain() {
  const d = state.currentDisease;
  const sev = state.severity / 100;

  brainState.surfaceMeshes.forEach(function(mesh) {
    if (mesh.material && mesh.material.emissive) {
      if (!d) {
        if (mesh.material === mesh.userData.surfMat) {
          mesh.material.emissive.setHex(0x000000);
          mesh.material.emissiveIntensity = 0;
        } else {
          mesh.material.emissive.setHex(0x1e293b);
          mesh.material.emissiveIntensity = 0.35;
        }
      } else {
        mesh.material.emissive.setHex(d.hex);
        mesh.material.emissiveIntensity = sev * 0.38;
      }
    }
  });

  if (nebulaUniforms) {
    if (d) {
      nebulaUniforms.uDiseaseColor.value.setHex(d.hex);
      nebulaUniforms.uDiseaseMix.value = sev;
    } else {
      nebulaUniforms.uDiseaseMix.value = 0.0;
    }
  }

  if (impulseUniforms) {
    if (d) {
      impulseUniforms.uDiseaseColor.value.setHex(d.hex);
      impulseUniforms.uDiseaseMix.value = sev * 0.85;
    } else {
      impulseUniforms.uDiseaseMix.value = 0.0;
    }
  }

  const affectedSet = {};
  if (d) d.affected.forEach(function(id) { affectedSet[id] = true; });

  Object.keys(subzoneAnchors).forEach(function(id) {
    const anc = subzoneAnchors[id];
    if (!d) {
      anc.outerRing.material.color.copy(anc.color);
    } else if (affectedSet[id]) {
      anc.group.visible = true;
      anc.outerRing.material.color.setHex(d.hex);
    } else {
      anc.group.visible = false;
    }
  });
}

/* ================================================================
   PROJECT 3D LABELS
   ================================================================ */
const _v = new THREE.Vector3();
const _camDir = new THREE.Vector3();
const _worldNorm = new THREE.Vector3();

function projectLabels() {
  const w = vpWidth, h = vpHeight;
  const active = state.selectedRegion || state.hoveredRegion;

  Object.keys(htmlLabels).forEach(function(id) {
    const el = htmlLabels[id];
    const anc = subzoneAnchors[id];
    if (!anc || !anc.group.visible || !state.chips.labels) {
      el.classList.add('hidden');
      return;
    }

    const sz = SUBZONES.find(function(s) { return s.id === id; });
    const isActive = active && sz.region === active;
    const isSelected = state.selectedSubzone === id;
    const isHovered = state.hoveredSubzone === id;

    anc.group.getWorldPosition(_v);
    _worldNorm.copy(anc.normal).transformDirection(brainGroup.matrixWorld).normalize();
    _camDir.copy(camera.position).sub(_v).normalize();
    const facing = _worldNorm.dot(_camDir);

    if (facing < -0.15 && !isSelected && !isActive && !state.activeFmriTask) {
      el.classList.add('hidden');
      return;
    }

    _v.project(camera);
    if (_v.z > 1) {
      el.classList.add('hidden');
      return;
    }

    el.classList.remove('hidden');

    let x = (_v.x * 0.5 + 0.5) * w;
    let y = (-_v.y * 0.5 + 0.5) * h - 18;

    x = Math.max(48, Math.min(w - 48, x));
    y = Math.max(28, Math.min(h - 28, y));

    const scale = (isSelected || isHovered) ? 1.07 : 1;
    el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + scale + ')';
  });
}

/* ================================================================
   ANIMATION LOOP
   ================================================================ */
const clock = new THREE.Clock();
const fpsEl = document.getElementById('fpsCounter');
let frameCount = 0, fpsAccum = 0;

function animate() {
  requestAnimationFrame(animate);
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  const t = clock.elapsedTime;

  frameCount++;
  fpsAccum += rawDt;
  if (fpsAccum >= 0.5) {
    if (fpsEl) fpsEl.textContent = Math.round(frameCount / fpsAccum) + ' FPS';
    frameCount = 0;
    fpsAccum = 0;
  }

  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 2.5);
    const e = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }

  if (nebulaUniforms) nebulaUniforms.uTime.value = t;
  if (impulseUniforms) {
    impulseUniforms.uTime.value = state.activeFmriTask ? t * 1.85 : t;
  }

  Object.keys(subzoneAnchors).forEach(function(id) {
    const anc = subzoneAnchors[id];
    if (!anc.group.visible) return;
    const isSel = state.selectedSubzone === id;
    const isHov = state.hoveredSubzone === id;
    const pulse = 1 + Math.sin(t * 3.0 + id.length) * 0.12;
    const s = isSel ? pulse * 1.55 : (isHov ? pulse * 1.25 : pulse);
    anc.outerRing.scale.setScalar(s);
  });

  if (state.chips.rotate && brainState.loaded) {
    brainGroup.rotation.y += dt * 0.18;
  }

  controls.update();
  renderer.render(scene, camera);
  projectLabels();
}

/* ================================================================
   UI - LEFT PANEL LISTS

function renderRegionList() {
  const el = document.getElementById('regionList');
  el.innerHTML = '';
  Object.keys(REGIONS).forEach(function(rid) {
    const r = REGIONS[rid];
    const btn = document.createElement('button');
    btn.className = 'region-item';
    btn.dataset.region = r.id;
    btn.style.setProperty('--r-color', r.color);
    btn.innerHTML =
      '<span class="region-dot"></span>' +
      '<span class="region-info">' +
        '<span class="region-name">' + r[LANG].name + '</span>' +
        '<span class="region-meta">' + r[LANG].short + '</span>' +
      '</span>' +
      '<span class="region-ba">' + r.ba + '</span>';

    btn.addEventListener('pointerenter', function() {
      if (!state.selectedRegion && !state.activeFmriTask) {
        state.hoveredRegion = r.id;
        applyHighlight();
      }
    });
    btn.addEventListener('pointerleave', function() {
      if (state.hoveredRegion === r.id) {
        state.hoveredRegion = null;
        applyHighlight();
      }
    });
    btn.addEventListener('click', function() {
      if (state.selectedRegion === r.id && !state.selectedSubzone) {
        clearSelection();
        resetCamera();
      } else {
        selectRegion(r.id);
      }
    });
    el.appendChild(btn);
  });
}

function updateAllListsUI() {
  document.querySelectorAll('.region-item[data-region]').forEach(function(el) {
    el.classList.toggle('active', el.dataset.region === state.selectedRegion && !state.selectedSubcortical);
  });
  document.querySelectorAll('.subcortical-btn').forEach(function(el) {
    el.classList.toggle('active', el.dataset.subcortical === state.selectedSubcortical);
  });
  document.querySelectorAll('.task-item').forEach(function(el) {
    el.classList.toggle('active', !!(state.activeFmriTask && el.dataset.task === state.activeFmriTask.id));
  });
  const activeDis = state.currentDisease ? state.currentDisease.id : 'healthy';
  document.querySelectorAll('.disease-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.disease === activeDis);
  });

function selectDisease(id) {
  stopFmriLoop();
  if (id) {
    state.currentDisease = DISEASES.find(function(d) { return d.id === id; });
    state.selectedRegion = null;
    state.selectedSubzone = null;
    state.selectedSubcortical = null;
    setStatus('alert', T('alert'));
    document.getElementById('severityContainer').style.display = 'block';
    applySeverity(state.severity);
    openRightCurtain();
  } else {
    clearSelection();
  }
  updateAllListsUI();
  closeLeftMobile();
}

   ================================================================ */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', function() {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    searchResults.classList.remove('open');
    return;
  }

  const matches = [];
  Object.keys(REGIONS).forEach(function(id) {
    const r = REGIONS[id];
    const txt = (r.en.name + ' ' + r.ru.name + ' ' + r.en.latin + ' ' + r.ba).toLowerCase();
    if (txt.indexOf(q) !== -1) matches.push({ title: r[LANG].name, type: 'Lobe', act: function() { selectRegion(id); } });
  });
  Object.keys(SUBCORTICAL).forEach(function(id) {
    const sc = SUBCORTICAL[id];
    const txt = (sc.en.name + ' ' + sc.ru.name + ' ' + sc.latin).toLowerCase();
    if (txt.indexOf(q) !== -1) matches.push({ title: sc[LANG].name, type: '3D Mesh', act: function() { selectSubcortical(id); } });
  });
  SUBZONES.forEach(function(sz) {
    const txt = (sz.en.full + ' ' + sz.ru.full + ' ' + sz.ba + ' ' + sz.en.name + ' ' + sz.ru.name).toLowerCase();
    if (txt.indexOf(q) !== -1) matches.push({ title: sz[LANG].full, type: sz.ba, act: function() { onZoneClick(sz.id); } });
  });
  DISEASES.forEach(function(d) {
    const txt = (d.en.name + ' ' + d.ru.name + ' ' + d.en.short + ' ' + d.ru.short).toLowerCase();
    if (txt.indexOf(q) !== -1) matches.push({ title: d[LANG].name, type: 'Pathology', act: function() { selectDisease(d.id); } });
  });

  if (!matches.length) {
    searchResults.classList.remove('open');
    return;
  }

  searchResults.innerHTML = '';
  matches.slice(0, 8).forEach(function(m) {
    const btn = document.createElement('button');
    btn.className = 'search-item';
    btn.innerHTML = '<span><strong>' + m.title + '</strong></span><span class="search-item-type">' + m.type + '</span>';
    btn.addEventListener('click', function() {
      m.act();
      searchInput.value = '';
      searchResults.classList.remove('open');
    });
    searchResults.appendChild(btn);
  });
  searchResults.classList.add('open');
});

document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-wrap')) searchResults.classList.remove('open');
});

function updateSeverityUI() {
  document.getElementById('severityContainer').style.display = state.currentDisease ? 'block' : 'none';

function applySeverity(value) {
  state.severity = value;
  const slider = document.getElementById('severitySlider');
  const valEl = document.getElementById('severityValue');
  const stages = document.getElementById('severityStages');

  slider.value = value;
  slider.style.setProperty('--p', value + '%');
  valEl.textContent = value + '%';

  const idx = Math.min(3, Math.floor(value / 25));
  const children = stages.children;
  for (let i = 0; i < children.length; i++) {
    children[i].classList.toggle('active', i === idx);
  }

  applyDiseaseToBrain();
  applyHighlight();
  renderAnalytics();
}

document.getElementById('severitySlider').addEventListener('input', function(e) {
  applySeverity(+e.target.value);
});

function renderDiseaseAnalytics(el) {
  const d = state.currentDisease;
  const data = d[LANG];
  const sev = state.severity;
  const stageIdx = Math.min(3, Math.floor(sev / 25));
  const stageLabels = ['I', 'II', 'III', 'IV'];
  const stageLabel = stageLabels[stageIdx];

  const affectedZones = d.affected.map(function(id) {
    return SUBZONES.find(function(s) { return s.id === id; });
  }).filter(Boolean);

  const metricMap = [
    ['cognitive', 'metricCognitive'],
    ['motor', 'metricMotor'],
    ['language', 'metricLanguage'],
    ['sensory', 'metricSensory'],
    ['memory', 'metricMemory'],
    ['connectivity', 'metricConnectivity']
  ];

  const metricsHtml = metricMap.map(function(pair) {
    const key = pair[0], labelKey = pair[1];
    const base = d.en.metrics[key];
    const impairment = 1 - base;
    const current = Math.max(0, base - impairment * (sev / 100));
    const pct = Math.round(current * 100);
    const cls = current > 0.72 ? 'good' : (current > 0.45 ? 'warn' : 'bad');
    return '<div class="metric-row">' +
      '<div class="metric-top">' +
        '<span class="metric-label">' + T(labelKey) + '</span>' +
        '<span class="metric-value ' + cls + '">' + pct + '%</span>' +
      '</div>' +
      '<div class="metric-bar"><div class="metric-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }).join('');

  const progBar = data.stages.map(function(_, i) {
    const cls = i === stageIdx ? 'current' : (i < stageIdx ? 'past' : '');
    return '<div class="progression-step ' + cls + '"></div>';
  }).join('');

  const progLabels = data.stages.map(function(_, i) {
    return '<span class="' + (i === stageIdx ? 'active' : '') + '">' + (i + 1) + '</span>';
  }).join('');

  el.innerHTML =
    '<div class="dossier-hero" style="--hero-color:' + d.color + '">' +
      '<div class="dossier-top">' +
        '<div><h2>' + data.name + '</h2><span class="dossier-latin">' + data.short + '</span></div>' +
        '<span class="ba-badge">STAGE ' + stageLabel + ' · ' + sev + '%</span>' +
      '</div>' +
    '</div>' +
    '<div class="card"><div class="card-title">' + T('progression') + '</div>' +
      '<div class="progression-bar">' + progBar + '</div>' +
      '<div class="progression-labels">' + progLabels + '</div>' +
      '<p style="font-size:0.78rem"><strong>' + data.stages[stageIdx] + '</strong> — ' + data.desc + '</p></div>' +
    '<div class="card"><div class="card-title">' + T('mechanism') + '</div><p>' + data.mechanism + '</p></div>' +
    '<div class="card"><div class="card-title">' + T('affected') + '</div>' +
      affectedZones.map(function(sz) {
        return '<button class="sub-item" data-sub="' + sz.id + '">' +
          '<span class="pin" style="background:' + d.color + '"></span>' +
          '<span class="sub-item-info">' +
            '<span class="sub-item-title">' + sz[LANG].full + '</span>' +
            '<span class="sub-item-sub">' + sz.ba + '</span>' +
          '</span>' +
          '<span class="go">→</span>' +
        '</button>';
      }).join('') +
    '</div>' +
    '<div class="card"><div class="card-title">' + T('neuro') + '</div>' +
      '<div class="tags">' + data.neuro.map(function(n) { return '<span class="tag warn">' + n + '</span>'; }).join('') + '</div></div>' +
    '<div class="card"><div class="card-title">' + T('symptoms') + '</div>' +
      '<div class="tags">' + data.symptoms.map(function(s) { return '<span class="tag danger">' + s + '</span>'; }).join('') + '</div></div>' +
    '<div class="card"><div class="card-title">' + T('metrics') + '</div>' + metricsHtml + '</div>';

  el.querySelectorAll('.sub-item').forEach(function(btn) {
    btn.addEventListener('click', function() { onZoneClick(btn.dataset.sub); });
  });
}

  el.textContent = text;
}

document.querySelectorAll('.chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    const key = chip.dataset.toggle;
    state.chips[key] = !state.chips[key];
    chip.classList.toggle('on', state.chips[key]);
    if (key === 'labels') projectLabels();
  });
});

function setTheme(theme, save) {
  if (save === undefined) save = true;
  document.documentElement.setAttribute('data-theme', theme);
  const icon = document.getElementById('themeIcon');
  if (theme === 'light') {
    icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  } else {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
  if (save) {
    try { localStorage.setItem('nc-theme', theme); } catch (e) {}
  }
}

document.getElementById('themeBtn').addEventListener('click', function() {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
});

function setLanguage(lang) {
  LANG = lang;
  document.documentElement.setAttribute('data-lang', lang);

  document.getElementById('modeSurface').textContent = T('modeSurface');
  document.getElementById('modeNeural').textContent = T('modeNeural');
  document.getElementById('chipLabels').textContent = T('labels');
  document.getElementById('chipRotate').textContent = T('rotate');
  document.getElementById('sliceXLabel').textContent = T('sliceX');
  document.getElementById('sliceYLabel').textContent = T('sliceY');
  document.getElementById('searchInput').placeholder = T('searchPlaceholder');
  document.getElementById('focusTag').textContent = T('focus');
  document.getElementById('lobesTitle').textContent = T('lobes');
  document.getElementById('subcorticalTitle').textContent = T('subcortical');
  document.getElementById('fmriTitle').textContent = T('fmri');
  document.getElementById('diseasesTitle').textContent = T('diseases');
  document.getElementById('severityLabel').textContent = T('severity');
  document.getElementById('leftTitle').textContent = T('atlas');
  document.getElementById('rightTitle').textContent = T('analytics');

  Object.keys(htmlLabels).forEach(function(id) {
    const el = htmlLabels[id];
    const sz = SUBZONES.find(function(s) { return s.id === id; });
    if (sz) {
      const nameEl = el.querySelector('.lname');
      if (nameEl) nameEl.textContent = sz[LANG].name;
    }
  });

  updateSlices();
  renderRegionList();
  renderSubcorticalList();
  renderFmriList();
  renderDiseaseList();
  updateAllListsUI();
  applyHighlight();
  renderAnalytics();
}

document.querySelectorAll('.lang-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    setLanguage(btn.dataset.lang);
  });
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeLeftMobile();
    clearSelection();
  }
});

/* ================================================================
   INIT (LOADS FULL-RESOLUTION GLB MODEL WITHOUT TIMEOUT FALLBACK)
   ================================================================ */
function init() {
  let savedTheme = 'dark';
  try {
    const stored = localStorage.getItem('nc-theme');
    if (stored === 'light' || stored === 'dark') savedTheme = stored;
  } catch (e) {}
  setTheme(savedTheme, false);

  buildSubcorticalMeshes();
  setLanguage('ru');
  resize();
  animate();

  const gltfLoader = new GLTFLoader();
  gltfLoader.load(
    MODEL_URL,
    function(gltf) {
      setupBrainModel(gltf.scene);
    },
    function(progress) {
      if (progress.total > 0) {
        const pct = Math.round((progress.loaded / progress.total) * 100);
        loaderTextEl.textContent = T('loadingModel') + ' · ' + pct + '%';
      }
    },
    function(err) {
      console.error('Ошибка загрузки файла low-poly_human_brain_model.glb:', err);
      loaderTextEl.textContent = 'Ошибка загрузки ' + MODEL_URL;
      loaderTextEl.style.color = '#ef4444';
    }
  );
}

init();
</script>
