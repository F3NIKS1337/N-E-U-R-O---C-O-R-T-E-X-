<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NeuroCortex — интерактивный атлас коры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#7C5CFF; --on-primary:#fff;
  --primary-container:#2A1F55; --on-primary-container:#DAD0FF;
  --secondary-container:#25213A; --on-secondary-container:#D5CDFF;
  --surface:#0F0D13; --surface-container:#17141F; --surface-container-high:#221E2E;
  --surface-container-low:#131019;
  --on-surface:#ECE7F2; --on-surface-variant:#A79FBF;
  --outline:#3A3350; --outline-variant:#2A2440;
  --bg:#0B0910;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
  --shadow-lg:0 4px 12px rgba(0,0,0,.55),0 8px 32px rgba(0,0,0,.5);
  --accent-frontal:#7C8DFF; --accent-parietal:#4ADFC4;
  --accent-temporal:#FFB259; --accent-occipital:#C79BFF;
  --danger:#FF6B70; --danger-container:#2E1014;
}
[data-theme="light"]{
  --primary:#6750A4; --on-primary:#fff;
  --primary-container:#EADDFF; --on-primary-container:#21005D;
  --secondary-container:#E8DEF8; --on-secondary-container:#1D192B;
  --surface:#FEF7FF; --surface-container:#F3EDF7; --surface-container-high:#ECE6F0;
  --surface-container-low:#F7F2FA;
  --on-surface:#1D1B20; --on-surface-variant:#49454F;
  --outline:#79747E; --outline-variant:#CAC4D0;
  --bg:#F5EFF9;
  --shadow:0 1px 2px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:0 4px 12px rgba(0,0,0,.15),0 8px 32px rgba(0,0,0,.10);
  --accent-frontal:#5B7CFA; --accent-parietal:#2FB79B;
  --accent-temporal:#F29B30; --accent-occipital:#A96BF0;
  --danger:#E5484D; --danger-container:#FFE0E2;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Roboto','Noto Sans JP',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--on-surface);
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
  user-select:none;-webkit-user-select:none;
}
svg{width:24px;height:24px;fill:currentColor;display:block}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}

.app{display:grid;grid-template-rows:64px 1fr;height:100dvh}

.app-bar{
  display:flex;align-items:center;gap:8px;padding:0 8px;
  background:var(--surface-container);color:var(--on-surface);
  border-bottom:1px solid var(--outline-variant);
  z-index:40;position:relative;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{
  width:36px;height:36px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--primary),var(--accent-occipital));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;
  box-shadow:0 0 20px color-mix(in srgb,var(--primary) 40%,transparent);
}
.brand h1{font-size:16px;font-weight:500;margin:0;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--on-surface-variant);font-weight:400}
.spacer{flex:1}

.icon-btn{
  width:42px;height:42px;border-radius:50%;
  color:var(--on-surface-variant);display:grid;place-items:center;
  transition:background .18s ease,color .18s ease;flex:none;
}
.icon-btn:active{background:color-mix(in srgb,var(--on-surface) 14%,transparent)}

.lang-switch{
  display:flex;align-items:center;gap:2px;
  background:var(--surface-container-high);
  border-radius:12px;padding:3px;margin-right:4px;
}
.lang-switch button{
  font-size:11px;font-weight:700;letter-spacing:.5px;
  padding:6px 8px;border-radius:9px;color:var(--on-surface-variant);
  transition:all .18s ease;
}
.lang-switch button.active{
  background:var(--primary);color:var(--on-primary);
  box-shadow:0 0 12px color-mix(in srgb,var(--primary) 50%,transparent);
}
@media (max-width:640px){ .lang-switch button{padding:6px 6px;font-size:10px} }

.body{display:grid;grid-template-columns:296px 1fr 380px;overflow:hidden;position:relative}

.drawer{
  background:var(--surface-container-low);border-right:1px solid var(--outline-variant);
  overflow-y:auto;padding:12px 12px 24px;scrollbar-width:thin;
}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 4px 8px 12px;
}
.drawer-head .title{
  font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--on-surface-variant);
  display:flex;align-items:center;gap:6px;
}
.close-btn{
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;color:var(--on-surface-variant);
}
.close-btn:active{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
@media (min-width:1241px){ .close-btn{display:none} }

.info-btn{
  width:18px;height:18px;border-radius:50%;flex:none;
  display:inline-grid;place-items:center;font-size:11px;font-weight:700;
  background:var(--surface-container-high);color:var(--on-surface-variant);
  border:1px solid var(--outline-variant);line-height:1;
  transition:all .18s ease;
}
.info-btn:hover{background:var(--primary);color:#fff}

.region-item{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:12px;border-radius:14px;text-align:left;color:var(--on-surface);
  transition:background .18s ease;
}
.region-item:active{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.region-item.selected{background:var(--secondary-container);color:var(--on-secondary-container)}
.region-dot{
  width:14px;height:14px;border-radius:50%;flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent),
             0 0 12px currentColor;
}
.region-item .txt{min-width:0}
.region-item .txt b{display:block;font-size:14px;font-weight:500}
.region-item .txt span{display:block;font-size:11.5px;opacity:.7;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.legend{margin-top:18px;padding:14px 12px;border-top:1px solid var(--outline-variant)}
.legend-row{display:flex;align-items:center;gap:10px;font-size:12px;
  color:var(--on-surface-variant);padding:5px 0}
.legend-row i{width:10px;height:10px;border-radius:3px;flex:none;
  box-shadow:0 0 8px currentColor}

.viewport{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%, rgba(124,92,255,.14), transparent 60%),
    radial-gradient(circle at 50% 100%, rgba(199,155,255,.08), transparent 55%),
    var(--bg);
}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}

.loader{
  position:absolute;inset:0;display:grid;place-items:center;
  background:var(--bg);z-index:10;transition:opacity .4s ease;
  color:var(--on-surface-variant);font-size:13px;
}
.loader.hide{opacity:0;pointer-events:none}
.loader .spin{
  width:44px;height:44px;border-radius:50%;
  border:3px solid var(--outline-variant);
  border-top-color:var(--primary);
  animation:spin 1s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.overlay-top{
  position:absolute;top:12px;left:12px;right:12px;
  display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;
  z-index:5;
}
.chip{
  pointer-events:auto;
  display:inline-flex;align-items:center;gap:7px;
  height:34px;padding:0 14px;border-radius:10px;
  border:1px solid var(--outline-variant);
  background:color-mix(in srgb,var(--surface-container) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--on-surface-variant);font-size:12.5px;font-weight:500;
  transition:all .18s ease;white-space:nowrap;
}
.chip.on{
  background:var(--secondary-container);color:var(--on-secondary-container);
  border-color:transparent;
  box-shadow:0 0 14px color-mix(in srgb,var(--primary) 25%,transparent);
}
.chip.danger-on{background:var(--danger-container);color:var(--danger);border-color:transparent;
  box-shadow:0 0 14px color-mix(in srgb,var(--danger) 35%,transparent)}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.chip.on i{opacity:1;box-shadow:0 0 6px currentColor}

.hint{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:11.5px;color:var(--on-surface-variant);
  background:color-mix(in srgb,var(--surface-container) 85%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:8px 14px;border-radius:20px;border:1px solid var(--outline-variant);
  pointer-events:none;text-align:center;max-width:90%;z-index:5;
}

.tooltip{
  position:absolute;pointer-events:none;z-index:20;
  padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;
  background:var(--surface-container-high);color:var(--on-surface);
  border:1px solid var(--outline-variant);box-shadow:var(--shadow);
  transform:translate(-50%,-140%);opacity:0;transition:opacity .15s ease;
  white-space:nowrap;
}
.tooltip.show{opacity:1}

.popover{
  position:fixed;z-index:80;max-width:300px;
  padding:14px 16px;border-radius:14px;
  background:var(--surface-container-high);color:var(--on-surface);
  border:1px solid var(--outline-variant);box-shadow:var(--shadow-lg);
  font-size:12.5px;line-height:1.55;
  opacity:0;transform:translateY(-6px);pointer-events:none;
  transition:opacity .16s ease,transform .16s ease;
}
.popover.show{opacity:1;transform:none;pointer-events:auto}
.popover h4{margin:0 0 6px;font-size:13px;color:var(--primary)}
.popover p{margin:0;color:var(--on-surface-variant)}

.panel{
  background:var(--surface-container-low);border-left:1px solid var(--outline-variant);
  display:flex;flex-direction:column;overflow:hidden;
}
.tabs{display:flex;padding:8px 8px 0;gap:4px;
  border-bottom:1px solid var(--outline-variant);flex:none;align-items:center}
.tab{
  flex:1;padding:14px 6px 12px;font-size:12.5px;font-weight:500;
  color:var(--on-surface-variant);border-bottom:3px solid transparent;
  transition:color .18s,border-color .18s;margin-bottom:-1px;
  border-radius:12px 12px 0 0;white-space:nowrap;
}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.panel-close{
  width:36px;height:36px;border-radius:50%;margin:0 4px 0 0;
  display:grid;place-items:center;color:var(--on-surface-variant);flex:none;
}
.panel-close:active{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
@media (min-width:881px){ .panel-close{display:none} }

.panel-scroll{overflow-y:auto;padding:20px;flex:1;scrollbar-width:thin}
.pane{display:none}
.pane.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.region-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.region-head .big-dot{
  width:44px;height:44px;border-radius:14px;flex:none;
  display:grid;place-items:center;font-size:19px;font-weight:700;color:#fff;
  box-shadow:0 0 24px color-mix(in srgb,currentColor 45%,transparent);
}
.region-head h2{margin:0;font-size:20px;font-weight:500;line-height:1.2}
.region-head .latin{margin:3px 0 0;font-size:12px;font-style:italic;
  color:var(--on-surface-variant)}

.desc{font-size:13.5px;line-height:1.65;color:var(--on-surface-variant);margin:0 0 20px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.stat-card{
  background:var(--surface-container);border-radius:14px;padding:12px 14px;
  border:1px solid var(--outline-variant);
}
.stat-card span{display:block;font-size:10.5px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--on-surface-variant);margin-bottom:4px}
.stat-card b{font-size:14px;font-weight:500}

.section-h{
  font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--on-surface-variant);margin:0 0 10px;
  display:flex;align-items:center;gap:8px;
}
.fn-list{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 22px;padding:0;list-style:none}
.fn-list li{font-size:12px;padding:6px 12px;border-radius:8px;
  background:var(--secondary-container);color:var(--on-secondary-container)}

.sub-list{margin:0 0 18px;padding:0;list-style:none;
  display:flex;flex-direction:column;gap:6px}
.sub-item{
  display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;
  border-radius:12px;border:1px solid var(--outline-variant);
  background:var(--surface-container);text-align:left;color:var(--on-surface);
  font-size:13px;transition:all .16s ease;
}
.sub-item:active{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.sub-item .pin{width:9px;height:9px;border-radius:50%;flex:none;background:var(--primary);
  box-shadow:0 0 8px var(--primary)}
.sub-item .go{margin-left:auto;opacity:.4;font-size:11px}

.disease-card{
  background:var(--surface-container);
  border:1px solid var(--outline-variant);
  border-radius:14px;padding:14px;margin-bottom:10px;
  border-left:4px solid var(--danger);
  transition:all .18s ease;cursor:pointer;
}
.disease-card:active,.disease-card.active{background:var(--surface-container-high)}
.disease-card.active{
  border-left-color:var(--danger);
  box-shadow:0 0 0 2px var(--danger-container),
             0 0 22px color-mix(in srgb,var(--danger) 30%,transparent);
}
.disease-card h4{
  margin:0 0 4px;font-size:14px;font-weight:500;
  color:var(--on-surface);
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
}
.disease-card .latin-sub{
  font-size:11px;font-style:italic;color:var(--on-surface-variant);
  margin:0 0 4px;
}
.disease-card .badge{
  font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:3px 7px;border-radius:6px;background:var(--danger-container);color:var(--danger);
  flex:none;text-align:right;line-height:1.3;max-width:60%;
}
.disease-body{display:none;margin-top:12px}
.disease-card.active .disease-body{display:block;animation:fade .2s ease}
.disease-card .row{
  display:flex;gap:10px;font-size:12px;margin-top:6px;line-height:1.5;
}
.disease-card .row b{
  flex:none;width:100px;color:var(--on-surface-variant);font-weight:500;
}
.disease-card .row span{color:var(--on-surface)}

.symptom-list{margin:0;padding:0 0 0 16px;font-size:12.5px;line-height:1.7;
  color:var(--on-surface-variant)}
.symptom-list li{margin-bottom:4px}

.cog-bar{
  display:flex;align-items:center;gap:10px;font-size:12px;
  margin-top:6px;
}
.cog-bar .lbl{width:130px;flex:none;color:var(--on-surface-variant)}
.cog-bar .track{flex:1;height:6px;border-radius:3px;
  background:var(--surface-container-high);overflow:hidden}
.cog-bar .track i{display:block;height:100%;background:var(--danger);
  border-radius:3px;transition:width .35s ease;
  box-shadow:0 0 8px var(--danger)}
.cog-bar .pct{width:42px;text-align:right;font-weight:700;font-size:11px;
  color:var(--danger)}

.empty{text-align:center;padding:56px 20px;color:var(--on-surface-variant)}
.empty .ico{
  width:64px;height:64px;margin:0 auto 18px;border-radius:20px;
  background:var(--surface-container);display:grid;place-items:center;
}
.empty .ico svg{width:32px;height:32px;opacity:.55}
.empty p{margin:0;font-size:13.5px;line-height:1.6}

.param{margin-bottom:24px}
.param-head{display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:9px;gap:10px}
.param-head label{font-size:13.5px;font-weight:500;
  display:flex;align-items:center;gap:6px}
.param-head .val{
  font-size:12.5px;font-weight:700;color:var(--primary);
  background:var(--secondary-container);padding:2px 9px;border-radius:7px;
}
.param .sub{font-size:11.5px;color:var(--on-surface-variant);margin:7px 0 0;line-height:1.5}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;
  background:transparent;display:block;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--primary) var(--p,50%),var(--outline-variant) var(--p,50%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--primary);margin-top:-8px;border:none;
  box-shadow:0 0 10px var(--primary),0 1px 4px rgba(0,0,0,.3);
}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--outline-variant)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--primary)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
  background:var(--primary);border:none;box-shadow:0 0 10px var(--primary)}

.meter{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.meter-row{display:flex;align-items:center;gap:12px;font-size:12.5px}
.meter-row .name{width:112px;color:var(--on-surface-variant);flex:none}
.meter-bar{flex:1;height:7px;border-radius:4px;
  background:var(--surface-container-high);overflow:hidden}
.meter-bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--primary),var(--accent-occipital));
  transition:width .3s ease;box-shadow:0 0 10px var(--primary)}
.meter-row b{width:42px;text-align:right;font-size:12px}

.note{
  font-size:11.5px;line-height:1.6;color:var(--on-surface-variant);
  background:var(--surface-container);border-left:3px solid var(--primary);
  padding:12px 14px;border-radius:0 10px 10px 0;margin-top:8px;
}

.scrim{
  position:fixed;inset:64px 0 0 0;background:rgba(0,0,0,.5);z-index:34;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.scrim.show{opacity:1;pointer-events:auto}

@media (max-width:1240px){
  .body{grid-template-columns:1fr 348px}
  .drawer{
    position:fixed;top:64px;bottom:0;left:0;width:296px;z-index:35;
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow-lg);background:var(--surface-container-low);
  }
  .drawer.open{transform:none}
  #menuBtn{display:grid!important}
}
@media (min-width:1241px){
  #menuBtn{display:none}
  .scrim{display:none}
}
@media (max-width:880px){
  .body{grid-template-columns:1fr}
  .panel{
    position:fixed;top:64px;bottom:0;right:0;width:min(390px,94vw);z-index:35;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow-lg);background:var(--surface-container-low);
  }
  .panel.open{transform:none}
  #panelBtn{display:grid!important}
  .brand small{display:none}
}
@media (min-width:881px){ #panelBtn{display:none} }
@media (max-width:520px){
  .app{grid-template-rows:56px 1fr}
  .brand h1{font-size:15px}
  .overlay-top{gap:6px;top:10px;left:10px;right:10px}
  .chip{height:32px;padding:0 11px;font-size:11.5px}
  .hint{font-size:10.5px;padding:6px 12px;bottom:10px}
  .panel-scroll{padding:16px}
  .scrim{inset:56px 0 0 0}
  .drawer,.panel{top:56px}
  .tab{font-size:11px;padding:12px 3px 10px}
  .lang-switch button{padding:5px 5px;font-size:9.5px}
}
</style>
</head>
<body><div class="app">
  <header class="app-bar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <div class="brand">
      <div class="brand-logo">NC</div>
      <div>
        <h1>NeuroCortex</h1>
        <small id="brandSub"></small>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="ru">RU</button>
      <button data-lang="en">EN</button>
      <button data-lang="es">ES</button>
      <button data-lang="fr">FR</button>
      <button data-lang="ja">JA</button>
    </div>

/* Анатомическая классификация по нормализованным координатам (Y-up).
   Оси после разворота: Z+ = перед (лобная), Z- = зад (затылочная),
   Y+ = верх (теменная), Y- = низ (височная по бокам). */
function regionAtNormalized(p){
  // височная — нижне-боковые отделы, не слишком впереди и не слишком сзади
  if (p.y < -0.10 && Math.abs(p.x) > 0.35 && p.z > -0.55 && p.z < 0.30) return 'temporal';
  // затылочная — задняя треть
  if (p.z < -0.35) return 'occipital';
  // лобная — передняя треть
  if (p.z > 0.20) return 'frontal';
  // остальное — теменная
  return 'parietal';
}

function segmentAndColor(mesh){
  const geo = mesh.geometry;
  const pos = geo.attributes.position;
  const count = pos.count;

  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const size = new THREE.Vector3(); bb.getSize(size);
  const center = new THREE.Vector3(); bb.getCenter(center);

  const maxDim = Math.max(size.x, size.y, size.z);
  const targetSize = 2.2;
  const scale = targetSize / maxDim;

  geo.translate(-center.x, -center.y, -center.z);
  geo.scale(scale, scale, scale);

  // Разворот в Y-up, если модель из Blender (Z-up).
  // Проверяем: если высота (Y) заметно больше ширины (X) или глубины (Z) — модель уже стоит. Иначе — ложим.
  geo.computeBoundingBox();
  const bb2 = geo.boundingBox;
  const sz2 = new THREE.Vector3(); bb2.getSize(sz2);

  // Если глубина (Z) примерно равна высоте (Y) и заметно больше ширины (X) — модель лежит «плашмя».
  // В таком случае развернём её на 90° вокруг X.
  if (sz2.z > sz2.y * 1.15) {
    geo.rotateX(-Math.PI / 2);
    geo.computeBoundingBox();
    bb2.copy(geo.boundingBox);
    sz2.set(0,0,0); bb2.getSize(sz2);
  }

  // Пересчитываем нормализованные координаты после всех трансформаций
  const cx = (bb2.min.x + bb2.max.x) / 2;
  const cy = (bb2.min.y + bb2.max.y) / 2;
  const cz = (bb2.min.z + bb2.max.z) / 2;
  const rx = (bb2.max.x - bb2.min.x) / 2 || 1;
  const ry = (bb2.max.y - bb2.min.y) / 2 || 1;
  const rz = (bb2.max.z - bb2.min.z) / 2 || 1;

  if (!geo.attributes.color) {
    geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
  }
  const colors = geo.attributes.color.array;
  vertexRegion = new Uint8Array(count);
  baseColors = new Float32Array(count * 3);

  const v = new THREE.Vector3();
  const col = new THREE.Color();
  const regColors = {
    frontal: new THREE.Color(REGIONS.frontal.color),
    parietal: new THREE.Color(REGIONS.parietal.color),
    temporal: new THREE.Color(REGIONS.temporal.color),
    occipital: new THREE.Color(REGIONS.occipital.color)
  };

  for (let i = 0; i < count; i++) {
    v.fromBufferAttribute(pos, i);
    const nx = (v.x - cx) / rx;
    const ny = (v.y - cy) / ry;
    const nz = (v.z - cz) / rz;
    const rid = regionAtNormalized({ x:nx, y:ny, z:nz });
    vertexRegion[i] = REGION_INDEX[rid];
    col.copy(regColors[rid]);
    baseColors[i*3] = col.r; baseColors[i*3+1] = col.g; baseColors[i*3+2] = col.b;
    colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
  }
  geo.attributes.color.needsUpdate = true;
  if (!geo.attributes.normal || geo.attributes.normal.count !== count) {
    geo.computeVertexNormals();
  }
  return bb2;
}

function setupMarkerSystems(){
  if (!brainMesh) return;
  const geo = brainMesh.geometry;
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const size = new THREE.Vector3(); bb.getSize(size);
  const center = new THREE.Vector3(); bb.getCenter(center);
  const rx = size.x / 2, ry = size.y / 2, rz = size.z / 2;

  // Полуоси для попадания в габариты модели
  const AXES = { x: rx * 1.03, y: ry * 1.03, z: rz * 1.03 };

  // === Маркеры зон ===
  markersGroup = new THREE.Group();
  brainGroup.add(markersGroup);

  SUBAREAS.forEach(sa => {
    const dir = new THREE.Vector3(...sa.dir).normalize();
    const p = new THREE.Vector3(dir.x * AXES.x, dir.y * AXES.y, dir.z * AXES.z);
    p.add(center);
    subareaPos[sa.id] = p.clone();

    const col = new THREE.Color(REGIONS[sa.region].color);
    const mat = new THREE.MeshStandardMaterial({
      color: col, emissive: col, emissiveIntensity: 1.4,
      roughness: 0.25, metalness: 0.15, transparent:true
    });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 16), mat);
    mesh.position.copy(p);
    mesh.userData = { type:'subarea', id: sa.id };
    markersGroup.add(mesh);
    markerMeshes.push(mesh);

    const halo = new THREE.Mesh(
      new THREE.SphereGeometry(0.11, 14, 14),
      new THREE.MeshBasicMaterial({ color: col, transparent:true, opacity:0.20, depthWrite:false })
    );
    halo.position.copy(p);
    halo.userData = { type:'subarea', id: sa.id, halo:true };
    markersGroup.add(halo);
    mesh.userData.halo = halo;
  });

  // === Проводящие пути ===
  pathwaysGroup = new THREE.Group();
  pathwaysGroup.visible = false;
  brainGroup.add(pathwaysGroup);

  const pathColor = new THREE.Color(0x9b7cff);
  const pulseColor = new THREE.Color(0xffc23d);

  PATHWAYS.forEach(pw => {
    const a = subareaPos[pw.a], b = subareaPos[pw.b];
    if (!a || !b) return;
    const mid = a.clone().add(b).multiplyScalar(0.5).multiplyScalar(0.65);
    const curve = new THREE.CatmullRomCurve3([a.clone(), mid, b.clone()]);
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 60, 0.014, 6, false),
      new THREE.MeshBasicMaterial({ color: pathColor, transparent:true, opacity:0.55, depthWrite:false })
    );
    pathwaysGroup.add(tube);
    pathCurves.push({ curve });
  });

  const pulseGeo = new THREE.SphereGeometry(0.026, 10, 10);
  pathCurves.forEach((pc, idx) => {
    for (let i = 0; i < 2; i++) {
      const mesh = new THREE.Mesh(pulseGeo, new THREE.MeshBasicMaterial({
        color: pulseColor, transparent:true, opacity:0.95, depthWrite:false
      }));
      pathwaysGroup.add(mesh);
      pulses.push({ curve: pc.curve, t: (i / 2 + idx * 0.13) % 1, mesh, speed: 0.11 });
    }
  });

  // === Нервные окончания ===
  endingsGroup = new THREE.Group();
  brainGroup.add(endingsGroup);

  const endingsGeo = new THREE.SphereGeometry(0.016, 6, 6);
  endingsMat = new THREE.MeshBasicMaterial({
    color: 0xffd166, transparent:true, opacity:0.9, depthWrite:false
  });
  endings = new THREE.InstancedMesh(endingsGeo, endingsMat, MAX_ENDINGS);

  const dummy = new THREE.Object3D();
  let seed = 1337;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

  for (let i = 0; i < MAX_ENDINGS; i++) {
    // случайная точка на эллипсоиде
    const u = rnd() * 2 - 1;
    const th = rnd() * Math.PI * 2;
    const s = Math.sqrt(1 - u * u);
    const nx = s * Math.cos(th), ny = u, nz = s * Math.sin(th);
    const p = new THREE.Vector3(nx * AXES.x * 1.005, ny * AXES.y * 1.005, nz * AXES.z * 1.005);
    p.add(center);
    dummy.position.copy(p);
    dummy.scale.setScalar(0.6 + rnd() * 0.8);
    dummy.updateMatrix();
    endings.setMatrixAt(i, dummy.matrix);
  }
  endings.instanceMatrix.needsUpdate = true;
  endingsGroup.add(endings);
}

function finalizeModel(mesh){
  brainMat = new THREE.MeshPhysicalMaterial({
    vertexColors:true,
    roughness:0.55, metalness:0.10,
    clearcoat:0.35, clearcoatRoughness:0.6,
    sheen:0.6, sheenColor:new THREE.Color(0xb8a6ff), sheenRoughness:0.5,
    emissive:new THREE.Color(0x7c5cff), emissiveIntensity:0.06,

  });

  controls.maxDistance = 9;

  loaderEl.classList.add('hide');

  applyChipState('markers');

  onParamChange('density');

loader.load(
  MODEL_URL,
  (gltf) => {
    const model = gltf.scene;
    const meshes = [];
    model.traverse(o => { if (o.isMesh) meshes.push(o); });
    if (!meshes.length) { loaderEl.classList.add('hide'); return; }

    // Берём самый крупный меш
    meshes.sort((a, b) => {
      a.geometry.computeBoundingBox(); b.geometry.computeBoundingBox();
      const sa = a.geometry.boundingBox.getSize(new THREE.Vector3()).length();
      const sb = b.geometry.boundingBox.getSize(new THREE.Vector3()).length();
      return sb - sa;
    });
    const main = meshes[0];
    main.updateWorldMatrix(true, false);
    main.geometry.applyMatrix4(main.matrixWorld);
    finalizeModel(main);
  },
  undefined,
  (err) => {
    console.warn('Model load failed:', err);
    loaderEl.classList.add('hide');
  }

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tooltipEl = document.getElementById('tooltip');
let selectedRegion = null;
let selectedDisease = null;
let hoveredRegion = null;
let camTween = null;
let pathologyOverlay = null;

function setPointerFromEvent(e){
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function intersectAll(){
  raycaster.setFromCamera(pointer, camera);
  const objs = [];
  if (markersGroup && markersGroup.visible) objs.push(...markersGroup.children);
  if (brainMesh) objs.push(brainMesh);
  return raycaster.intersectObjects(objs, false);
}

function pickRegionFromMesh(hit){
  if (!brainMesh) return null;
  const local = brainMesh.worldToLocal(hit.point.clone());
  const bb = brainMesh.geometry.boundingBox;
  const cx = (bb.min.x + bb.max.x) / 2;
  const cy = (bb.min.y + bb.max.y) / 2;
  const cz = (bb.min.z + bb.max.z) / 2;
  const rx = (bb.max.x - bb.min.x) / 2 || 1;
  const ry = (bb.max.y - bb.min.y) / 2 || 1;
  const rz = (bb.max.z - bb.min.z) / 2 || 1;
  return regionAtNormalized({
    x: (local.x - cx) / rx,
    y: (local.y - cy) / ry,
    z: (local.z - cz) / rz
  });
}

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  setPointerFromEvent(e);
  const hits = intersectAll();
  let label = null, regionId = null;
  if (hits.length) {
    const h = hits[0];
    if (h.object.userData.type === 'subarea') {
      const sa = SUBAREAS.find(s => s.id === h.object.userData.id);
      if (sa) { label = pick(sa.name); regionId = sa.region; }
    } else if (h.object === brainMesh) {
      regionId = pickRegionFromMesh(h);
      if (regionId) label = pick(REGIONS[regionId].name);
    }
  }
  if (regionId !== hoveredRegion) {
    hoveredRegion = regionId;
    if (!pathologyOverlay) applyHighlight();
    canvas.style.cursor = regionId ? 'pointer' : 'grab';
  }
  if (label && regionId) {
    const r = canvas.getBoundingClientRect();
    tooltipEl.textContent = label;
    tooltipEl.style.left = (e.clientX - r.left) + 'px';
    tooltipEl.style.top  = (e.clientY - r.top) + 'px';
    tooltipEl.classList.add('show');
  } else tooltipEl.classList.remove('show');
});

canvas.addEventListener('pointerleave', () => {
  tooltipEl.classList.remove('show');
  hoveredRegion = null;
  if (!pathologyOverlay) applyHighlight();
});

let downPos = null;
canvas.addEventListener('pointerdown', (e) => { downPos = { x:e.clientX, y:e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 8) return;
  setPointerFromEvent(e);
  const hits = intersectAll();
  if (!hits.length) {
    if (selectedRegion) {
      selectedRegion = null;
      clearPathology();
      applyHighlight();
      renderEmptyInfo();
      closePanelMobile();
    }
    return;
  }
  const h = hits[0];
  if (h.object.userData.type === 'subarea') {
    const sa = SUBAREAS.find(s => s.id === h.object.userData.id);
    if (sa) { selectRegion(sa.region, true); focusOn(subareaPos[sa.id]); }
  } else if (h.object === brainMesh) {
    const rid = pickRegionFromMesh(h);
    if (rid) { selectRegion(rid, false); focusOn(h.point.clone().multiplyScalar(0.85)); }
  }
});

function applyHighlight(){
  if (!brainMesh || !vertexRegion || !baseColors) return;
  const arr = brainMesh.geometry.attributes.color.array;
  const active = selectedRegion || hoveredRegion;
  if (!active) {
    arr.set(baseColors);
  } else {
    const hi = new THREE.Color(REGIONS[active].color).multiplyScalar(1.55);
    const dim = 0.40;
    const activeIdx = REGION_INDEX[active];
    for (let i = 0; i < vertexRegion.length; i++) {
      if (vertexRegion[i] === activeIdx) {
        arr[i*3] = hi.r; arr[i*3+1] = hi.g; arr[i*3+2] = hi.b;
      } else {
        arr[i*3]   = baseColors[i*3]   * dim;
        arr[i*3+1] = baseColors[i*3+1] * dim;
        arr[i*3+2] = baseColors[i*3+2] * dim;
      }
    }
  }
  brainMesh.geometry.attributes.color.needsUpdate = true;

  markerMeshes.forEach(m => {
    const sa = SUBAREAS.find(s => s.id === m.userData.id);
    const on = !active || sa.region === active;
    m.material.opacity = on ? 1 : 0.3;
    m.material.transparent = true;
    if (m.userData.halo) m.userData.halo.material.opacity = on ? 0.20 : 0.05;
  });
  if (brainMat) {
    if (active) brainMat.emissive.setHex(REGIONS[active].color);
    else brainMat.emissive.setHex(0x7c5cff);
  }
}

function applyPathology(regions){
  if (!brainMesh || !vertexRegion || !baseColors) return;
  const arr = brainMesh.geometry.attributes.color.array;
  const bright = new THREE.Color(0xFF6B70);
  const dim = 0.32;
  const idxs = regions.map(r => REGION_INDEX[r]);
  for (let i = 0; i < vertexRegion.length; i++) {
    if (idxs.includes(vertexRegion[i])) {
      arr[i*3] = bright.r; arr[i*3+1] = bright.g; arr[i*3+2] = bright.b;
    } else {
      arr[i*3]   = baseColors[i*3]   * dim;
      arr[i*3+1] = baseColors[i*3+1] * dim;
      arr[i*3+2] = baseColors[i*3+2] * dim;
    }
  }
  brainMesh.geometry.attributes.color.needsUpdate = true;
  if (brainMat) {
    brainMat.emissive.setHex(0xE5484D);
    brainMat.emissiveIntensity = 0.35;
  }
  if (markersGroup) markersGroup.visible = false;
  if (endingsGroup) endingsGroup.visible = false;
}

function clearPathology(){
  pathologyOverlay = null;
  if (markersGroup) markersGroup.visible = chipState.markers;
  if (endingsGroup) endingsGroup.visible = chipState.endings;
  applyHighlight();
}

function focusOn(point){
  const dir = point.clone().normalize();
  const dist = 2.6;
  const toPos = dir.multiplyScalar(dist).add(new THREE.Vector3(0, 0.15, 0));
  camTween = {
    from: camera.position.clone(), to: toPos,
    fromT: controls.target.clone(), toT: point.clone().multiplyScalar(0.35),
    t: 0
  };
}

function updateMeters(){
  const el = document.getElementById('meters'); if (!el) return;
  const rows = [
    [LANG==='ru'?'Дофамин':LANG==='es'?'Dopamina':LANG==='fr'?'Dopamine':LANG==='ja'?'ドーパミン':'Dopamine', params.dopamine],
    [LANG==='ru'?'Серотонин':LANG==='es'?'Serotonina':LANG==='fr'?'Sérotonine':LANG==='ja'?'セロトニン':'Serotonin', params.serotonin],
    [LANG==='ru'?'Возбудимость':LANG==='es'?'Excitabilidad':LANG==='fr'?'Excitabilité':LANG==='ja'?'興奮性':'Excitability', params.excitability]
  ];
  el.innerHTML = rows.map(([n, v]) => `
    <div class="meter-row">
      <span class="name">${n}</span>
      <span class="meter-bar"><i style="width:${v}%"></i></span>
      <b>${v}%</b>
    </div>
  `).join('');
}

function onParamChange(key){
  if (key === 'density' && endings) {
    endings.count = Math.round(MAX_ENDINGS * (params.density / 100));
    endings.instanceMatrix.needsUpdate = true;
  }
  if (key === 'excitability' && brainMat && !pathologyOverlay) {
    brainMat.emissiveIntensity = (params.excitability / 100) * 0.30;
  }
  if (key === 'dopamine' || key === 'serotonin' || key === 'excitability') updateMeters();
  if (key === 'myelin' || key === 'conduction') {
    const f = (params.conduction / 65) * (0.45 + params.myelin / 100 * 0.9);
    pulses.forEach(p => p.speed = 0.10 * f);
  }
}

      <button class="info-btn" data-term="subarea">i</button>
    </p>
    <div class="sub-list" id="subList">
      ${subs.map(s => `
        <button class="sub-item" data-sub="${s.id}">
          <span class="pin"></span>
          <span>${pick(s.name)}</span>
          <span class="go">→</span>
        </button>
      `).join('')}
    </div>
    <div class="note" id="subNote" style="display:none"></div>
  `;

  paneInfo.querySelectorAll('.sub-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const sa = SUBAREAS.find(s => s.id === btn.dataset.sub);
      if (!sa) return;
      focusOn(subareaPos[sa.id]);
      const note = document.getElementById('subNote');
      note.style.display = 'block';
      note.innerHTML = `<b>${pick(sa.name)}</b><br>${pick(sa.note)}`;
    });
  });

  bindInfoButtons(paneInfo);
  applyHighlight();
  openPanelMobile();
}

/* ===== UI: ПАТОЛОГИИ ===== */
const panePath = document.getElementById('pane-pathology');
function renderPathologyList(){
  if (!panePath) return;
  panePath.innerHTML = `
    <p class="section-h"><span>${t('tabPathology')}</span><button class="info-btn" data-term="pathology">i</button></p>
    <p class="desc" style="margin-bottom:14px">${t('selectHint')}</p>
    <div id="diseaseList"></div>
  `;
  const list = panePath.querySelector('#diseaseList');
  DISEASES.forEach(d => {
    const card = document.createElement('div');
    card.className = 'disease-card' + (selectedDisease === d.id ? ' active' : '');
    card.dataset.id = d.id;
    card.innerHTML = `
      <h4>
        <span>${pick(d.name)}</span>
        <span class="badge">${d.regions.map(r => pick(REGIONS[r].name)).join(' · ')}</span>
      </h4>
      <p class="latin-sub">${d.latin}</p>
      <div class="disease-body">
        <div class="row"><b>${t('sectionMechanism')}</b><span>${pick(d.mechanism)}</span></div>
        <div class="row"><b>${t('sectionRegionsAffected')}</b><span>${d.regions.map(r => pick(REGIONS[r].name)).join(', ')}</span></div>
        <div style="margin-top:12px">
          <p class="section-h" style="margin-bottom:6px">${t('sectionSymptoms')}</p>
          <ul class="symptom-list">${pick(d.symptoms).map(s => `<li>${s}</li>`).join('')}</ul>
        </div>
        <div style="margin-top:12px">
          <p class="section-h" style="margin-bottom:6px">${t('sectionCognition')}</p>
          ${renderCogBars(d.cognition)}
        </div>
      </div>
    `;
    card.addEventListener('click', () => toggleDisease(d.id));
    list.appendChild(card);
  });
  bindInfoButtons(panePath);
}

function renderCogBars(cog){
  const rows = [
    ['memory', t('cogMemory')], ['speech', t('cogSpeech')], ['attention', t('cogAttention')],
    ['motor', t('cogMotor')], ['perception', t('cogPerception')]
  ];
  return rows.map(([k, lbl]) => `
    <div class="cog-bar">
      <span class="lbl">${lbl}</span>
      <span class="track"><i style="width:${cog[k]}%"></i></span>
      <span class="pct">${cog[k]}%</span>
    </div>
  `).join('');
}

function toggleDisease(id){
  if (selectedDisease === id) {
    selectedDisease = null;
    clearPathology();
    renderPathologyList();
    return;
  }
  selectedDisease = id;
  selectedRegion = null;
  const d = DISEASES.find(x => x.id === id);
  pathologyOverlay = d;
  applyPathology(d.regions);
  renderPathologyList();

  const card = panePath.querySelector(`[data-id="${id}"]`);
  if (card) card.scrollIntoView({ behavior:'smooth', block:'nearest' });

  if (d.regions.length) {
    const r = d.regions[0];
    const p = new THREE.Vector3(
      r==='frontal' ? -0.2 : r==='parietal' ? -0.2 : r==='temporal' ? -0.7 : -0.1,
      r==='frontal' ? 0.3  : r==='parietal' ? 0.6  : r==='temporal' ? -0.35 : 0,
      r==='frontal' ? 0.8  : r==='parietal' ? -0.3 : r==='temporal' ? 0.1  : -1.0
    );
    focusOn(p);
  }
}

/* ===== ПОПОВЕРЫ-ПОДСКАЗКИ ===== */
const popover = document.getElementById('popover');
let popoverFor = null;
function bindInfoButtons(scope){
  if (!scope) return;
  scope.querySelectorAll('.info-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const term = btn.dataset.term;
      const data = I18N[LANG].terms[term];
      if (!data) return;
      if (popoverFor === btn && popover.classList.contains('show')) {
        popover.classList.remove('show'); popoverFor = null; return;
      }
      popover.innerHTML = `<h4>${data.t}</h4><p>${data.d}</p>`;
      const r = btn.getBoundingClientRect();
      popover.style.left = Math.min(r.left, window.innerWidth - 320) + 'px';
      popover.style.top  = (r.bottom + 8) + 'px';
      popover.classList.add('show');
      popoverFor = btn;
    });
  });
}
document.addEventListener('click', (e) => {
  if (!popover.classList.contains('show')) return;
  if (popoverFor && popoverFor.contains(e.target)) return;
  if (popover.contains(e.target)) return;
  popover.classList.remove('show'); popoverFor = null;
});

/* ===== ТАБЫ ===== */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('pane-' + tab.dataset.pane).classList.add('active');
  });
});

/* ===== ЧИПЫ ===== */
const chipState = { markers:true, pathways:false, endings:true, rotate:false, pathology:false };
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const key = chip.dataset.toggle;
    chipState[key] = !chipState[key];
    chip.classList.toggle('on', chipState[key]);
    if (key === 'pathology') {
      chip.classList.toggle('danger-on', chipState[key]);
      if (chipState[key]) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
        const pt = document.querySelector('.tab[data-pane="pathology"]');
        if (pt) pt.classList.add('active');
        if (panePath) panePath.classList.add('active');
        openPanelMobile();
      } else {
        selectedDisease = null;
        clearPathology();
        renderPathologyList();
      }
    }
    applyChipState(key);
  });
});

function applyChipState(key){
  if (key === 'markers' && markersGroup) markersGroup.visible = chipState.markers && !pathologyOverlay;
  if (key === 'endings' && endingsGroup) {
    endingsGroup.visible = chipState.endings && !pathologyOverlay;
    if (endings && chipState.endings) endings.count = Math.round(MAX_ENDINGS * (params.density / 100));
  }
  if (key === 'pathways' && pathwaysGroup) {
    pathwaysGroup.visible = chipState.pathways;
    if (brainMat) {
      if (chipState.pathways) {
        brainMat.opacity = 0.32; brainMat.transparent = true; brainMat.depthWrite = false;
        if (brainMesh) brainMesh.renderOrder = 3;
      } else {
        brainMat.opacity = 1; brainMat.transparent = false; brainMat.depthWrite = true;
        if (brainMesh) brainMesh.renderOrder = 2;
      }
      brainMat.needsUpdate = true;
    }
  }
  if (key === 'rotate') {
    controls.autoRotate = chipState.rotate;
    controls.autoRotateSpeed = 0.9;
  }
}

/* ===== ЯЗЫК ===== */
document.getElementById('langSwitch').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn) return;
  LANG = btn.dataset.lang;
  try { localStorage.setItem('nc-lang', LANG); } catch(_) {}
  applyI18n();
  renderRegionList();
  if (selectedRegion) selectRegion(selectedRegion, false);
  else renderEmptyInfo();
  renderPathologyList();
  renderParams();
});
function initLang(){
  let saved = null;
  try { saved = localStorage.getItem('nc-lang'); } catch(_) {}
  if (saved && I18N[saved]) LANG = saved;
  else {
    const b = (navigator.language || 'ru').slice(0,2).toLowerCase();
    LANG = I18N[b] ? b : 'ru';
  }
}

/* ===== ТЕМА ===== */
const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');
const SUN = '<path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 2 3h-4l2-3zm0 20-2-3h4l-2 3zM2 12l3-2v4l-3-2zm20 0-3 2v-4l3 2zM5.6 5.6l3.2.8-2.4 2.4-.8-3.2zm12.8 12.8-3.2-.8 2.4-2.4.8 3.2zM5.6 18.4l.8-3.2 2.4 2.4-3.2.8zm12.8-12.8-.8 3.2-2.4-2.4 3.2-.8z"/>';
const MOON = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A6.5 6.5 0 0 1 12 3z"/>';
function setTheme(t){
  document.documentElement.dataset.theme = t;
  themeIcon.innerHTML = t === 'dark' ? SUN : MOON;
  try { localStorage.setItem('nc-theme', t); } catch(_) {}
}
themeBtn.addEventListener('click', () => {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
try {
  const saved = localStorage.getItem('nc-theme');
  if (saved) setTheme(saved);
} catch(_) {}

/* ===== ПАНЕЛИ / МОБИЛЬНОЕ ===== */
const drawer = document.getElementById('drawer');
const panel  = document.getElementById('panel');
const scrim  = document.getElementById('scrim');
function openDrawerMobile(){ drawer.classList.add('open'); panel.classList.remove('open'); scrim.classList.add('show'); }
function closeDrawerMobile(){ drawer.classList.remove('open'); if (!panel.classList.contains('open')) scrim.classList.remove('show'); }
function openPanelMobile(){ if (innerWidth <= 880) { panel.classList.add('open'); drawer.classList.remove('open'); scrim.classList.add('show'); } }
function closePanelMobile(){ panel.classList.remove('open'); if (!drawer.classList.contains('open')) scrim.classList.remove('show'); }

document.getElementById('menuBtn').addEventListener('click', () => {
  drawer.classList.contains('open') ? closeDrawerMobile() : openDrawerMobile();
});
document.getElementById('panelBtn').addEventListener('click', () => {
  panel.classList.contains('open') ? closePanelMobile() : openPanelMobile();
});
document.getElementById('closeDrawer').addEventListener('click', closeDrawerMobile);
document.getElementById('closePanel').addEventListener('click', closePanelMobile);
scrim.addEventListener('click', () => { closeDrawerMobile(); closePanelMobile(); });

function addSwipeClose(el, direction, onClose){
  let startX=0, startY=0, tracking=false;
  el.addEventListener('touchstart', e => {
    const t = e.touches[0]; startX = t.clientX; startY = t.clientY; tracking = true;
  }, { passive:true });
  el.addEventListener('touchmove', e => {
    if (!tracking) return;
    const t = e.touches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if (direction === 'right' && dx > 50 && Math.abs(dy) < 80) { tracking = false; onClose(); }
    if (direction === 'left'  && dx < -50 && Math.abs(dy) < 80) { tracking = false; onClose(); }
  }, { passive:true });
  el.addEventListener('touchend', () => { tracking = false; }, { passive:true });
}
addSwipeClose(drawer, 'right', closeDrawerMobile);
addSwipeClose(panel, 'left', closePanelMobile);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeDrawerMobile(); closePanelMobile();
    if (popover.classList.contains('show')) { popover.classList.remove('show'); popoverFor = null; }
    if (selectedRegion) { selectedRegion = null; applyHighlight(); renderEmptyInfo(); }
  }
});

/* ===== РАЗМЕР + АНИМАЦИЯ ===== */
function resize(){
  const w = viewport.clientWidth, h = viewport.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewport);
resize();

const clock = new THREE.Clock();
let pulsePhase = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 1.9);
    const e = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }

  if (pathwaysGroup && pathwaysGroup.visible) {
    pulses.forEach(p => {
      p.t = (p.t + dt * p.speed) % 1;
      p.mesh.position.copy(p.curve.getPointAt(p.t));
      p.mesh.scale.setScalar(0.8 + Math.sin(p.t * Math.PI) * 0.9);
      p.mesh.material.opacity = 0.35 + Math.sin(p.t * Math.PI) * 0.6;
    });
  }

  if (markersGroup && markersGroup.visible) {
    const s = 1 + Math.sin(time * 2.1) * 0.10;    markerMeshes.forEach(m => {
      m.scale.setScalar(s);
      const sa = SUBAREAS.find(x => x.id === m.userData.id);
      const on = !selectedRegion || sa.region === selectedRegion;
      m.material.emissiveIntensity = on ? (0.9 + Math.sin(time * 2.1) * 0.4) : 0.05;
    });
  }

  if (endingsGroup && endingsGroup.visible && endingsMat) {
    endingsMat.opacity = 0.62 + Math.sin(time * 1.6) * 0.22;
  }

  if (pathologyOverlay && brainMat) {
    pulsePhase += dt * 2.6;
    brainMat.emissiveIntensity = 0.35 + Math.sin(pulsePhase) * 0.22;
  } else if (brainMat) {
    brainMat.emissiveIntensity =
      (params.excitability / 100) * 0.30 +
      Math.sin(time * 1.3) * 0.04 * (params.excitability / 100);
  }

  bottomLight.intensity = 1.0 + Math.sin(time * 0.8) * 0.3;

  controls.update();
  renderer.render(scene, camera);
}

/* ===== ИНИЦИАЛИЗАЦИЯ ===== */
initLang();
applyI18n();
renderRegionList();
renderEmptyInfo();
renderPathologyList();
renderParams();
animate();
</script>
