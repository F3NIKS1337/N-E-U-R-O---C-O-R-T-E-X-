<!DOCTYPE html>
<html lang="en" data-lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NeuralMap — 3D Brain Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--bg-1:#0a0a0c;--bg-2:#121216;--bg-3:#1a1a20;
  --border:rgba(255,255,255,.08);--border-hi:rgba(255,255,255,.22);
  --text:#fff;--text-2:rgba(255,255,255,.65);--text-3:rgba(255,255,255,.38);
  --accent:#7c5cff;
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;
  --font:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --topbar-h:52px;
  --panel-l:290px;
  --panel-r:350px;
  --ease-out:cubic-bezier(0.16, 1, 0.3, 1);
}
[data-theme="light"]{
  --bg:#f8fafc;--bg-1:#ffffff;--bg-2:#f1f5f9;--bg-3:#e2e8f0;
  --border:rgba(0,0,0,.08);--border-hi:rgba(0,0,0,.2);
  --text:#0f172a;--text-2:rgba(15,23,42,.65);--text-3:rgba(15,23,42,.42);
}

/* ═══ 16:9 LARGE MONITORS SCALING (FHD / QHD / 4K) ═══ */
@media (min-width:1440px){
  :root{
    --topbar-h:58px;
    --panel-l:330px;
    --panel-r:400px;
  }
  html{font-size:15px}
}
@media (min-width:1920px){
  :root{
    --topbar-h:66px;
    --panel-l:380px;
    --panel-r:460px;
  }
  html{font-size:16.5px}
}
@media (min-width:2560px){
  :root{
    --topbar-h:76px;
    --panel-l:440px;
    --panel-r:540px;
  }
  html{font-size:19px}
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  font-size:0.95rem;line-height:1.5;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  transition:background .25s ease,color .25s ease;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
svg{display:block}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.28);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.45)}

.app{
  display:grid;
  grid-template-rows:calc(var(--topbar-h) + var(--safe-top)) 1fr;
  height:100dvh;
  background:var(--bg);
  overflow:hidden;
}

/* ═══ TOPBAR ═══ */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:var(--safe-top) calc(14px + var(--safe-right)) 0 calc(14px + var(--safe-left));
  height:calc(var(--topbar-h) + var(--safe-top));
  background:var(--bg-1);
  border-bottom:1px solid var(--border);
  z-index:100;
  overflow:hidden;
}
.brand{display:flex;align-items:center;gap:9px;flex:none;min-width:0}
.brand-icon{
  width:28px;height:28px;
  display:grid;place-items:center;flex:none;
  background:var(--text);color:var(--bg);
  border-radius:7px;
  transition:transform .2s var(--ease-out);
}
.brand:hover .brand-icon{transform:rotate(15deg) scale(1.05)}
.brand-icon svg{width:15px;height:15px}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text strong{font-size:0.95rem;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.brand-text span{font-size:0.68rem;color:var(--text-3);font-family:var(--mono)}
.topbar-sep{width:1px;height:20px;background:var(--border);flex:none;margin:0 4px}
.topbar-nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.topbar-nav::-webkit-scrollbar{display:none}
.nav-tab{
  padding:6px 12px;border-radius:6px;
  font-size:0.82rem;font-weight:500;
  color:var(--text-2);
  transition:background .18s ease,color .18s ease,transform .15s ease;
  white-space:nowrap;flex:none;
}
.nav-tab:hover{background:var(--bg-2);color:var(--text)}
.nav-tab.active{color:var(--bg);background:var(--text);font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:6px;flex:none}
.lang-switch{
  display:flex;background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:6px;padding:2px;gap:2px;
}
.lang-btn{
  padding:4px 8px;
  font-family:var(--mono);font-size:0.72rem;font-weight:600;
  letter-spacing:.4px;border-radius:4px;
  color:var(--text-3);
  transition:background .15s ease,color .15s ease;
}
.lang-btn:hover{color:var(--text)}
.lang-btn.active{background:var(--text);color:var(--bg)}
.icon-btn{
  width:34px;height:34px;min-width:34px;
  display:grid;place-items:center;
  border-radius:6px;
  color:var(--text-2);
  border:1px solid var(--border);
  background:var(--bg-2);
  transition:background .15s ease,border-color .15s ease,transform .15s ease;
}
.icon-btn:hover{border-color:var(--border-hi);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:16px;height:16px}
.mobile-only{display:grid}
@media (min-width:1025px){.mobile-only{display:none}}

/* ═══ BODY LAYOUT ═══ */
.body{
  display:grid;
  grid-template-columns:1fr;
  overflow:hidden;
  min-height:0;
  position:relative;
}
@media (min-width:1025px){
  .body{grid-template-columns:var(--panel-l) 1fr var(--panel-r)}
}
@media (min-width:641px) and (max-width:1024px){
  .body{grid-template-columns:1fr 320px}
}

.panel{
  overflow-y:auto;overflow-x:hidden;
  padding:16px 14px;min-height:0;
  background:var(--bg-1);
  -webkit-overflow-scrolling:touch;
  contain:content;
}
@media (min-width:1440px){
  .panel{padding:20px 18px}
}
.panel-left{border-right:1px solid var(--border)}
.panel-right{border-left:1px solid var(--border)}

/* ═══ MOBILE + TABLET DRAWERS ═══ */
@media (max-width:1024px){
  .panel-left,.panel-right{
    position:fixed;
    top:calc(var(--topbar-h) + var(--safe-top));
    bottom:0;
    width:min(330px,86vw);
    z-index:200;
    background:var(--bg-1);
    transition:transform .3s var(--ease-out);
    padding-bottom:calc(18px + var(--safe-bottom));
    overflow-y:auto;
    will-change:transform;
  }
  .panel-left{
    left:0;
    transform:translate3d(-100%,0,0);
    box-shadow:20px 0 50px rgba(0,0,0,.55);
  }
  .panel-right{
    right:0;
    transform:translate3d(100%,0,0);
    box-shadow:-20px 0 50px rgba(0,0,0,.55);
  }
  .panel-left.open,.panel-right.open{transform:translate3d(0,0,0)}
}

.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:12px;margin-bottom:14px;
  border-bottom:1px solid var(--border);
  position:sticky;top:-20px;background:var(--bg-1);
  padding-top:16px;margin-top:-16px;z-index:5;
}
.panel-head h2{
  font-family:var(--mono);font-size:0.75rem;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);
}
.panel-close{
  width:30px;height:30px;display:grid;place-items:center;
  border-radius:6px;color:var(--text-2);background:var(--bg-2);
}
.panel-close svg{width:14px;height:14px}
@media (min-width:1025px){.panel-close{display:none}}

.section{margin-bottom:22px}
.section-title{
  font-family:var(--mono);font-size:0.7rem;font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;
}

/* ═══ DETAILED REGION ITEMS ═══ */
.region-item{
  display:flex;flex-direction:column;gap:5px;width:100%;
  padding:11px 12px;border-radius:8px;text-align:left;
  transition:background .18s ease,border-color .18s ease,transform .15s var(--ease-out);
  margin-bottom:6px;
  border:1px solid var(--border);background:var(--bg-2);
  position:relative;overflow:hidden;
}
.region-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--r-color,#7c5cff);opacity:.35;
  transition:opacity .2s ease,width .2s ease;
}
.region-item:hover{
  background:var(--bg-3);
  border-color:var(--border-hi);
  transform:translateX(2px);
}
.region-item:hover::before{opacity:.85}
.region-item:active{transform:scale(.985)}
.region-item.active{
  background:var(--bg-3);
  border-color:var(--r-color,#7c5cff);
  box-shadow:0 4px 20px -4px rgba(0,0,0,.4);
}
.region-item.active::before{opacity:1;width:4px}
.region-top{display:flex;align-items:center;gap:9px;width:100%}
.region-dot{
  width:9px;height:9px;border-radius:50%;flex:none;
  background:var(--r-color,#7c5cff);
  transition:box-shadow .2s ease,transform .2s ease;
}
.region-item:hover .region-dot,.region-item.active .region-dot{
  box-shadow:0 0 10px var(--r-color,#7c5cff);
  transform:scale(1.15);
}
.region-name{flex:1;font-size:0.9rem;font-weight:600;color:var(--text)}
.region-count{
  font-family:var(--mono);font-size:0.68rem;font-weight:600;
  padding:2px 6px;border-radius:4px;
  background:var(--bg-1);color:var(--text-3);
  border:1px solid var(--border);
}
.region-item.active .region-count{color:var(--text);border-color:var(--border-hi)}
.region-meta{
  display:flex;align-items:center;justify-content:space-between;
  padding-left:18px;font-size:0.75rem;color:var(--text-3);
}
.region-latin{font-family:var(--mono);font-size:0.68rem;opacity:.75}

/* ═══ DISEASE ITEMS ═══ */
.disease-item{
  display:flex;align-items:flex-start;gap:10px;width:100%;
  padding:11px 12px;border-radius:8px;text-align:left;
  transition:background .18s ease,border-color .18s ease,transform .15s var(--ease-out);
  margin-bottom:5px;
  border:1px solid var(--border);background:var(--bg-2);
  position:relative;overflow:hidden;
}
.disease-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--d-color,#666);
  opacity:.45;transition:opacity .18s ease;
}
.disease-item:hover{background:var(--bg-3);border-color:var(--border-hi);transform:translateX(2px)}
.disease-item:active{transform:scale(.985)}
.disease-item.active{background:var(--bg-3);border-color:var(--d-color,#fff)}
.disease-item.active::before{opacity:1}
.disease-icon{
  width:26px;height:26px;border-radius:6px;
  display:grid;place-items:center;
  background:var(--d-color,#666);color:#fff;
  font-family:var(--mono);font-size:0.75rem;font-weight:700;flex:none;
}
.disease-body{flex:1;min-width:0}
.disease-name{
  font-size:0.86rem;font-weight:600;color:var(--text);
  margin-bottom:2px;display:block;
}
.disease-desc{font-size:0.74rem;color:var(--text-3);line-height:1.35}

/* ═══ SEVERITY ═══ */
.severity-box{
  margin-top:12px;padding:14px;
  background:var(--bg-2);border:1px solid var(--border-hi);
  border-radius:10px;animation:slideDown .25s var(--ease-out);
}
@keyframes slideDown{
  from{opacity:0;transform:translateY(-6px)}
  to{opacity:1;transform:none}
}
.severity-head{
  display:flex;justify-content:space-between;
  align-items:baseline;margin-bottom:8px;
}
.severity-label{
  font-family:var(--mono);font-size:0.7rem;font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);
}
.severity-value{
  font-family:var(--mono);font-size:1.25rem;font-weight:700;
  color:var(--text);font-variant-numeric:tabular-nums;
}
.severity-slider{
  -webkit-appearance:none;appearance:none;
  width:100%;height:30px;background:transparent;
  cursor:pointer;display:block;
}
.severity-slider::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--text) var(--p,50%),var(--border) var(--p,50%));
}
.severity-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;
  border-radius:50%;background:var(--text);
  margin-top:-8px;border:2px solid var(--bg-1);
  box-shadow:0 2px 6px rgba(0,0,0,.4);
  transition:transform .15s ease;
}
.severity-slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
.severity-stages{
  display:flex;justify-content:space-between;
  margin-top:6px;font-family:var(--mono);font-size:0.7rem;color:var(--text-3);
}
.severity-stages span.active{color:var(--text);font-weight:700}

/* ═══ VIEWPORT (16:9 OPTIMIZED) ═══ */
.viewport{
  position:relative;
  background:radial-gradient(circle at 50% 50%, rgba(124,92,255,0.07) 0%, transparent 70%), var(--bg);
  overflow:hidden;min-height:0;min-width:0;
  display:flex;align-items:center;justify-content:center;
}
#canvas3d{
  display:block;width:100%;height:100%;
  touch-action:none;cursor:grab;
}
#canvas3d:active{cursor:grabbing}

/* ═══ GPU-ACCELERATED HTML LABELS ═══ */
.labels-layer{
  position:absolute;inset:0;
  pointer-events:none;z-index:5;overflow:hidden;
}
.zone-label{
  position:absolute;left:0;top:0;
  pointer-events:auto;
  display:flex;align-items:center;gap:6px;
  padding:5px 11px 5px 8px;border-radius:999px;
  background:rgba(10,10,14,.82);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.16);
  font-family:var(--mono);font-size:0.74rem;font-weight:600;
  letter-spacing:.3px;color:#fff;white-space:nowrap;
  transform:translate3d(-9999px,-9999px,0);
  transition:opacity .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;
  will-change:transform,opacity;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}
[data-theme="light"] .zone-label{
  background:rgba(255,255,255,.88);
  border-color:rgba(0,0,0,.15);color:#0f172a;
}
.zone-label.hidden{opacity:0;pointer-events:none}
.zone-label:hover{
  border-color:var(--ldot-color,#7c5cff);
  box-shadow:0 0 16px color-mix(in srgb, var(--ldot-color,#7c5cff) 45%, transparent);
  z-index:10;
}
.zone-label.active{
  background:var(--ldot-color,#7c5cff);
  border-color:#fff;color:#fff;
  box-shadow:0 0 22px var(--ldot-color,#7c5cff);
  z-index:12;
}
.zone-label .ldot{
  width:7px;height:7px;border-radius:50%;flex:none;
  background:var(--ldot-color,#7c5cff);
  box-shadow:0 0 8px var(--ldot-color,#7c5cff);
}
.zone-label.active .ldot{background:#fff;box-shadow:0 0 8px #fff}
.zone-label .lba{
  font-size:0.64rem;opacity:.65;font-weight:400;margin-left:2px;
}
.zone-label.active .lba{opacity:.9}

/* ═══ VIEWPORT CHIPS & HUD ═══ */
.viewport-chips{
  position:absolute;top:14px;left:14px;right:14px;
  display:flex;gap:7px;z-index:10;
  pointer-events:none;flex-wrap:wrap;
  max-width:calc(100% - 200px);
}
.chip{
  pointer-events:auto;
  display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 13px;border-radius:8px;
  border:1px solid var(--border);
  background:rgba(10,10,14,.72);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:var(--text-2);
  font-family:var(--mono);font-size:0.74rem;font-weight:500;
  letter-spacing:.3px;white-space:nowrap;
  transition:background .18s ease,border-color .18s ease,color .18s ease,transform .15s ease;
}
.chip:hover{border-color:var(--border-hi);color:var(--text)}
.chip:active{transform:scale(.95)}
[data-theme="light"] .chip{background:rgba(255,255,255,.8)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
.chip-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
.chip.on .chip-dot{opacity:1}

.focus-label{
  position:absolute;top:14px;right:14px;
  pointer-events:none;z-index:10;
  max-width:240px;text-align:right;
  background:rgba(10,10,14,.65);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:7px 12px;border-radius:8px;
  border:1px solid var(--border);
}
[data-theme="light"] .focus-label{background:rgba(255,255,255,.8)}
.focus-label .tag{
  display:block;font-family:var(--mono);font-size:0.65rem;
  letter-spacing:1.3px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:2px;
}
.focus-label .val{
  font-family:var(--mono);font-size:0.82rem;font-weight:600;
  color:var(--text);line-height:1.25;display:block;
}

.viewport-hint{
  position:absolute;bottom:14px;left:50%;
  transform:translateX(-50%);
  font-family:var(--mono);font-size:0.72rem;
  color:var(--text-2);letter-spacing:.4px;
  background:rgba(10,10,14,.68);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:6px 14px;border-radius:8px;
  border:1px solid var(--border);
  pointer-events:none;white-space:nowrap;z-index:10;
}
[data-theme="light"] .viewport-hint{background:rgba(255,255,255,.8)}
.viewport-hint .sep{opacity:.4;margin:0 6px}

.status-indicator{
  position:absolute;bottom:14px;right:14px;
  display:flex;align-items:center;gap:6px;
  padding:6px 11px;background:rgba(10,10,14,.68);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:8px;
  font-family:var(--mono);font-size:0.7rem;
  letter-spacing:.8px;text-transform:uppercase;
  color:var(--text-2);z-index:10;
}
[data-theme="light"] .status-indicator{background:rgba(255,255,255,.8)}
.status-indicator::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--success);
  box-shadow:0 0 8px var(--success);
  animation:pulse 2s ease-in-out infinite;
}
.status-indicator.warn::before{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.status-indicator.danger::before{background:var(--danger);box-shadow:0 0 8px var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ═══ MODEL LOADER ═══ */
.model-loader{
  position:absolute;inset:0;
  display:grid;place-items:center;
  background:var(--bg);z-index:20;
  transition:opacity .4s ease;
}
.model-loader.hidden{opacity:0;pointer-events:none}
.model-loader-spinner{
  width:36px;height:36px;margin:0 auto 14px;
  border:2px solid var(--border);
  border-top-color:var(--text);
  border-radius:50%;
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.model-loader-text{
  font-family:var(--mono);font-size:0.75rem;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-2);text-align:center;
}

/* ═══ ANALYTICS PANEL & DETAILED CARDS ═══ */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:0.72rem;font-weight:600;
  color:var(--text-2);background:var(--bg-2);
  border:1px solid var(--border);border-radius:6px;
  padding:5px 10px;margin-bottom:12px;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.back-btn:hover{background:var(--bg-3);color:var(--text);border-color:var(--border-hi)}

.analytics-header{
  display:flex;align-items:flex-start;
  justify-content:space-between;gap:10px;margin-bottom:14px;
}
.analytics-header h2{
  font-size:1.15rem;font-weight:700;
  letter-spacing:-.2px;margin-bottom:3px;line-height:1.25;
}
.analytics-header .subtitle{
  font-family:var(--mono);font-size:0.74rem;
  color:var(--text-3);letter-spacing:.3px;display:block;
}
.ba-badge{
  font-family:var(--mono);font-size:0.7rem;font-weight:600;
  padding:4px 8px;border-radius:6px;
  background:var(--bg-3);border:1px solid var(--border-hi);
  color:var(--text);white-space:nowrap;flex:none;
}
.card{
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:10px;padding:14px;margin-bottom:11px;
  animation:fadeIn .25s var(--ease-out);
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:none}
}
.card-title{
  font-family:var(--mono);font-size:0.7rem;font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;
}
.card-title .badge{
  font-family:var(--mono);font-size:0.68rem;font-weight:600;
  padding:2px 7px;border-radius:4px;
  background:var(--bg-3);color:var(--text-2);
  border:1px solid var(--border);
}
.card p{font-size:0.86rem;line-height:1.6;color:var(--text-2);margin:0}
.card p strong{color:var(--text);font-weight:600}

/* ═══ METRIC BARS ═══ */
.metric-row{
  padding:8px 0;border-bottom:1px solid var(--border);
}
.metric-row:last-child{border-bottom:none}
.metric-top{
  display:flex;align-items:center;justify-content:space-between;
  font-size:0.82rem;margin-bottom:5px;
}
.metric-label{color:var(--text-2);font-weight:500}
.metric-value{
  font-family:var(--mono);font-size:0.82rem;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.metric-value.good{color:var(--success)}
.metric-value.warn{color:var(--warn)}
.metric-value.bad{color:var(--danger)}
.metric-bar{
  height:4px;border-radius:2px;background:var(--bg-3);overflow:hidden;
}
.metric-fill{
  height:100%;border-radius:2px;transition:width .35s var(--ease-out);
}
.metric-fill.good{background:var(--success)}
.metric-fill.warn{background:var(--warn)}
.metric-fill.bad{background:var(--danger)}

.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{
  font-family:var(--mono);font-size:0.72rem;
  padding:4px 8px;border-radius:5px;
  background:var(--bg-3);border:1px solid var(--border);
  color:var(--text-2);letter-spacing:.2px;
}
.tag.danger{
  background:rgba(239,68,68,.12);
  border-color:rgba(239,68,68,.3);color:#f87171;
}
.tag.warn{
  background:rgba(245,158,11,.12);
  border-color:rgba(245,158,11,.3);color:#fbbf24;
}
.empty{text-align:center;padding:48px 18px;color:var(--text-3)}
.empty svg{width:34px;height:34px;margin:0 auto 14px;opacity:.35}
.empty p{font-size:0.84rem;line-height:1.6;max-width:230px;margin:0 auto}

/* ═══ INTERACTIVE SUBZONE ITEMS ═══ */
.sub-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 12px;border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg-3);color:var(--text);
  font-size:0.84rem;text-align:left;
  transition:background .15s ease,border-color .15s ease,transform .15s ease;
  margin-bottom:5px;
}
.sub-item:hover{
  border-color:var(--border-hi);
  transform:translateX(3px);
}
.sub-item:active{transform:scale(.98)}
.sub-item .pin{
  width:8px;height:8px;border-radius:50%;flex:none;
  box-shadow:0 0 8px currentColor;
}
.sub-item-info{flex:1;min-width:0}
.sub-item-title{display:block;font-weight:600;color:var(--text);font-size:0.84rem}
.sub-item-sub{display:block;font-size:0.72rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-item .go{
  margin-left:auto;color:var(--text-3);
  font-family:var(--mono);font-size:0.72rem;
}

.progression-bar{
  display:flex;height:4px;border-radius:2px;
  overflow:hidden;background:var(--bg-3);
  margin-bottom:10px;gap:3px;
}
.progression-step{
  flex:1;background:var(--border);
  transition:background .3s ease;
}
.progression-step.past{background:var(--warn)}
.progression-step.current{background:var(--text)}
.progression-labels{
  display:flex;gap:3px;margin-bottom:12px;
  font-family:var(--mono);font-size:0.68rem;
  text-align:center;color:var(--text-3);
}
.progression-labels span{flex:1}
.progression-labels span.active{color:var(--text);font-weight:700}

/* ═══ SCRIM ═══ */
.scrim{
  position:fixed;
  inset:calc(var(--topbar-h) + var(--safe-top)) 0 0 0;
  background:rgba(0,0,0,.6);z-index:150;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.scrim.show{opacity:1;pointer-events:auto}

@media (max-height:500px) and (orientation:landscape){
  .viewport-hint{display:none}
  .status-indicator{font-size:0.65rem;padding:4px 8px;bottom:8px;right:8px}
  .viewport-chips{top:8px;left:8px;gap:4px}
  .chip{height:28px;padding:0 9px;font-size:0.68rem}
  .focus-label{top:8px;right:8px;padding:4px 8px}
}

/* ================================================================
   GLB LOAD
   ================================================================ */
const MODEL_URL = 'low-poly_human_brain_model.glb';
const modelLoaderEl = document.getElementById('modelLoader');
const loaderTextEl = document.getElementById('loaderText');
loaderTextEl.textContent = T('loadingModel');

const gltfLoader = new GLTFLoader();
gltfLoader.load(
  MODEL_URL,
  function(gltf) {
    const model = gltf.scene;

    const bbox = new THREE.Box3().setFromObject(model);
    const size = bbox.getSize(new THREE.Vector3());

    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 2.15 / maxDim;
    model.scale.setScalar(scale);

    model.position.set(0, 0, 0);
    const bbox2 = new THREE.Box3().setFromObject(model);
    const center2 = bbox2.getCenter(new THREE.Vector3());
    model.position.set(-center2.x, -center2.y, -center2.z);

    brainState.model = model;
    const finalBox = new THREE.Box3().setFromObject(model);
    brainState.size = finalBox.getSize(new THREE.Vector3());
    brainState.radius = brainState.size.length() * 0.5;
    brainState.loaded = true;

    model.traverse(function(child) {
      if (child.isMesh) {
        brainState.surfaceMeshes.push(child);
        const mat = child.material;
        if (mat) {
          if (mat.map) {
            mat.roughness = 0.65;
            mat.metalness = 0.15;
          } else {
            child.material = new THREE.MeshStandardMaterial({
              color: 0xc2c4d0,
              roughness: 0.62,
              metalness: 0.16
            });
          }
        }
      }
    });

    brainGroup.add(model);

    buildMarkers();
    buildPathways();
    buildHtmlLabels();

    modelLoaderEl.classList.add('hidden');

    requestAnimationFrame(function() {
      resize();
      resetCamera();
    });
  },
  function(progress) {
    if (progress.total > 0) {
      loaderTextEl.textContent = T('loadingModel') + ' · ' + Math.round((progress.loaded / progress.total) * 100) + '%';
    }
  },
  function(error) {
    console.error('Model load error:', error);
    loaderTextEl.textContent = T('loadError');
    loaderTextEl.style.color = '#ef4444';
  }
);

/* ================================================================
   SURFACE POINT
   ================================================================ */
const rayHelper = new THREE.Raycaster();

function getSurfacePoint(dirArray, offset) {
  if (offset === undefined) offset = 0.05;
  if (!brainState.loaded || brainState.surfaceMeshes.length === 0) {
    return new THREE.Vector3(0, 0, 0);
  }

  const dir = new THREE.Vector3(dirArray[0], dirArray[1], dirArray[2]).normalize();
  rayHelper.set(new THREE.Vector3(0, 0, 0), dir);
  rayHelper.far = brainState.radius * 4;

  const hits = rayHelper.intersectObjects(brainState.surfaceMeshes, true);

  if (hits.length > 0) {
    const hit = hits[0];
    const point = hit.point.clone();
    const outward = point.clone().normalize();
    return point.add(outward.multiplyScalar(offset * 0.1));
  }

  return dir.multiplyScalar(brainState.radius * 0.9);
}

const subzoneMeshes = {};
const subzoneHalos = {};
const markerGeo = new THREE.IcosahedronGeometry(0.03, 2);
const haloGeo = new THREE.SphereGeometry(0.062, 16, 16);

function buildMarkers() {
  SUBZONES.forEach(function(sz) {
    const p = getSurfacePoint(sz.dir, 0.05);
    const color = new THREE.Color(sz.color);

    const mat = new THREE.MeshStandardMaterial({
      color: color,
      emissive: color,
      emissiveIntensity: 1.5,
      roughness: 0.25,
      metalness: 0.4
    });
    const mesh = new THREE.Mesh(markerGeo, mat);
    mesh.position.copy(p);
    mesh.userData = { type: 'subzone', id: sz.id };

    const haloMat = new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.22,
      depthWrite: false
    });
    const halo = new THREE.Mesh(haloGeo, haloMat);
    mesh.add(halo);

    subzoneGroup.add(mesh);
    subzoneMeshes[sz.id] = mesh;
    subzoneHalos[sz.id] = halo;
  });
}

/* ================================================================
   HTML LABELS (GPU TRANSLATE3D)
   ================================================================ */
const labelsLayer = document.getElementById('labelsLayer');
const htmlLabels = {};

function buildHtmlLabels() {
  labelsLayer.innerHTML = '';
  SUBZONES.forEach(function(sz) {
    const el = document.createElement('button');
    el.className = 'zone-label';
    el.dataset.id = sz.id;
    el.style.setProperty('--ldot-color', sz.color);
    el.innerHTML =
      '<span class="ldot"></span>' +
      '<span class="lname">' + sz[LANG].name + '</span>' +
      '<span class="lba">' + sz.ba + '</span>';
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      onZoneClick(sz.id);
    });
    el.addEventListener('pointerenter', function() {
      state.hoveredSubzone = sz.id;
    });
    el.addEventListener('pointerleave', function() {
      if (state.hoveredSubzone === sz.id) state.hoveredSubzone = null;
    });
    el.addEventListener('touchstart', function(e) {
      e.stopPropagation();
    }, { passive: true });
    labelsLayer.appendChild(el);
    htmlLabels[sz.id] = el;
  });
}

/* ================================================================
   PATHWAYS
   ================================================================ */
const pathwaysGroup = new THREE.Group();
brainGroup.add(pathwaysGroup);
const pathwayData = [];
const impulses = [];

function buildPathways() {
  PATHWAYS.forEach(function(pair, idx) {
    const aId = pair[0];
    const bId = pair[1];
    if (!subzoneMeshes[aId] || !subzoneMeshes[bId]) return;

    const a = subzoneMeshes[aId].position.clone();
    const b = subzoneMeshes[bId].position.clone();
    const mid = a.clone().add(b).multiplyScalar(0.5).multiplyScalar(0.55);

    const curve = new THREE.CatmullRomCurve3([a, mid, b]);

    const tubeGeo = new THREE.TubeGeometry(curve, 24, 0.0055, 6, false);
    const tubeMat = new THREE.MeshBasicMaterial({
      color: 0x7c5cff,
      transparent: true,
      opacity: 0.28,
      depthWrite: false
    });
    const tube = new THREE.Mesh(tubeGeo, tubeMat);
    pathwaysGroup.add(tube);

    pathwayData.push({ curve: curve, tube: tube, a: aId, b: bId });

    const impulseGeo = new THREE.SphereGeometry(0.019, 8, 6);
    for (let i = 0; i < 2; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: 0xa78bfa,
        transparent: true,
        opacity: 0.9,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(impulseGeo, mat);
      pathwaysGroup.add(mesh);
      impulses.push({
        curve: curve,
        t: (i * 0.5 + idx * 0.13) % 1,
        mesh: mesh,
        a: aId,
        b: bId,
        speed: 0.19 + Math.random() * 0.06
      });
    }
  });
}

/* ================================================================
   RESIZE (OPTIMIZED FOR 16:9 WIDE VIEWPORTS)
   ================================================================ */
let vpWidth = 1;
let vpHeight = 1;

function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  if (w === 0 || h === 0) return;
  vpWidth = w;
  vpHeight = h;

  renderer.setSize(w, h, false);
  camera.aspect = w / h;

  const aspect = w / h;
  if (aspect < 0.55) {
    camera.fov = 64;
  } else if (aspect < 0.8) {
    camera.fov = 56;
  } else if (aspect < 1.2) {
    camera.fov = 48;
  } else {
    // 16:9 widescreen optimal framing
    camera.fov = 40;
  }

  camera.updateProjectionMatrix();
}

if (window.ResizeObserver) {
  new ResizeObserver(function() {
    requestAnimationFrame(resize);
  }).observe(viewport);
} else {
  window.addEventListener('resize', resize);
}

/* ================================================================
   STATE
   ================================================================ */
const state = {
  selectedRegion: null,
  selectedSubzone: null,
  hoveredRegion: null,
  hoveredSubzone: null,
  currentDisease: null,
  severity: 50,
  chips: { labels: true, impulses: true, rotate: false }
};
let camTween = null;

/* ================================================================
   CAMERA
   ================================================================ */
function resetCamera() {
  const aspect = vpWidth / vpHeight;
  const radius = brainState.radius || 1;

  let d;
  if (aspect < 0.6) {
    d = radius * 3.3;
  } else if (aspect < 0.85) {
    d = radius * 2.8;
  } else if (aspect < 1.25) {
    d = radius * 2.35;
  } else {
    // Closer & larger brain presence on 16:9 monitors
    d = radius * 2.05;
  }

  d = Math.max(1.7, Math.min(6.2, d));

  controls.minDistance = radius * 1.25;
  controls.maxDistance = radius * 5.2;

  camTween = {
    from: camera.position.clone(),
    to: new THREE.Vector3(0, 0.1, d),
    fromT: controls.target.clone(),
    toT: new THREE.Vector3(0, 0, 0),
    t: 0
  };
}

document.getElementById('resetCamBtn').addEventListener('click', function() {
  state.selectedRegion = null;
  state.selectedSubzone = null;
  applyHighlight();
  renderAnalytics();
  updateRegionListUI();
  resetCamera();
});

function focusOn(point) {
  const worldPt = point.clone().applyMatrix4(brainGroup.matrixWorld);
  const dir = worldPt.normalize();
  const radius = brainState.radius || 1;
  const dist = Math.max(radius * 1.85, 1.75);
  const toPos = dir.multiplyScalar(dist);
  camTween = {
    from: camera.position.clone(),
    to: toPos,
    fromT: controls.target.clone(),
    toT: new THREE.Vector3(0, 0, 0),
    t: 0
  };
}

/* ================================================================
   RAYCASTING (CLICK + SMOOTH HOVER)
   ================================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function updatePointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function raycastMarkers() {
  raycaster.setFromCamera(pointer, camera);
  const markers = [];
  Object.keys(subzoneMeshes).forEach(function(id) {
    if (subzoneMeshes[id].visible) markers.push(subzoneMeshes[id]);
  });
  return raycaster.intersectObjects(markers, false);
}

let downPos = null;
canvas.addEventListener('pointerdown', function(e) {
  downPos = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('pointermove', function(e) {
  if (downPos) return;
  updatePointer(e);
  const hits = raycastMarkers();
  if (hits.length > 0) {
    const id = hits[0].object.userData.id;
    if (state.hoveredSubzone !== id) {
      state.hoveredSubzone = id;
      canvas.style.cursor = 'pointer';
    }
  } else if (state.hoveredSubzone) {
    state.hoveredSubzone = null;
    canvas.style.cursor = 'grab';
  }
});

canvas.addEventListener('pointerup', function(e) {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 10) return;

  updatePointer(e);
  const hits = raycastMarkers();

  if (!hits.length) {
    if (state.selectedSubzone || state.selectedRegion) {
      state.selectedSubzone = null;
      state.selectedRegion = null;
      state.currentDisease = null;
      applyHighlight();
      renderAnalytics();
      updateRegionListUI();
      updateDiseaseListUI();
      updateSeverityUI();
    }
    return;
  }

  const found = SUBZONES.find(function(s) { return s.id === hits[0].object.userData.id; });
  if (found) onZoneClick(found.id);
});

/* ================================================================
   ZONE CLICK
   ================================================================ */
function onZoneClick(id) {
  const sz = SUBZONES.find(function(s) { return s.id === id; });
  if (!sz) return;
  state.selectedSubzone = id;
  state.selectedRegion = sz.region;
  state.currentDisease = null;
  if (subzoneMeshes[id]) focusOn(subzoneMeshes[id].position.clone());
  applyHighlight();
  renderAnalytics();
  updateRegionListUI();
  updateDiseaseListUI();
  updateSeverityUI();
}

/* ================================================================
   HIGHLIGHT
   ================================================================ */
function applyHighlight() {
  const active = state.selectedRegion || state.hoveredRegion;

  Object.keys(subzoneMeshes).forEach(function(id) {
    const mesh = subzoneMeshes[id];
    const sz = SUBZONES.find(function(s) { return s.id === id; });
    const on = !active || sz.region === active;
    mesh.visible = on;
    mesh.material.opacity = on ? 1 : 0.18;
    mesh.material.transparent = true;
  });

  pathwayData.forEach(function(pw) {
    if (!state.chips.impulses) {
      pw.tube.visible = false;
      return;
    }
    pw.tube.visible = true;
    if (state.selectedSubzone) {
      const connected = pw.a === state.selectedSubzone || pw.b === state.selectedSubzone;
      pw.tube.material.opacity = connected ? 0.75 : 0.1;
    } else {
      pw.tube.material.opacity = 0.28;
    }
  });

  Object.keys(htmlLabels).forEach(function(id) {
    if (state.selectedSubzone === id) htmlLabels[id].classList.add('active');
    else htmlLabels[id].classList.remove('active');
  });

  const fv = document.getElementById('focusValue');
  if (state.selectedSubzone) {
    const sz = SUBZONES.find(function(s) { return s.id === state.selectedSubzone; });
    fv.textContent = sz[LANG].full;
  } else if (state.selectedRegion) {
    fv.textContent = REGIONS[state.selectedRegion][LANG].name;
  } else if (state.hoveredRegion) {
    fv.textContent = REGIONS[state.hoveredRegion][LANG].name;
  } else {
    fv.textContent = T('fullBrain');
  }
}

/* ================================================================
   DISEASE EFFECTS
   ================================================================ */
function applyDiseaseToBrain() {
  const d = state.currentDisease;
  const sev = state.severity / 100;

  if (brainState.model) {
    brainState.model.traverse(function(child) {
      if (child.isMesh && child.material && child.material.emissive) {
        if (!d) {
          child.material.emissive.setHex(0x000000);
          child.material.emissiveIntensity = 0;
        } else {
          child.material.emissive.setHex(d.hex);
          child.material.emissiveIntensity = sev * 0.48;
        }
      }
    });
  }

  const affectedSet = {};
  if (d) {
    d.affected.forEach(function(id) { affectedSet[id] = true; });
  }

  Object.keys(subzoneMeshes).forEach(function(id) {
    const mesh = subzoneMeshes[id];
    const sz = SUBZONES.find(function(s) { return s.id === id; });
    if (!d) {
      mesh.material.emissiveIntensity = 1.5;
      mesh.visible = true;
    } else if (affectedSet[id]) {
      mesh.visible = true;
      mesh.material.emissiveIntensity = 2.4;
    } else {
      mesh.visible = state.selectedRegion ? (sz.region === state.selectedRegion) : false;
    }
  });

  impulses.forEach(function(p) {
    if (d) p.mesh.material.color.setHex(d.hex);
    else p.mesh.material.color.setHex(0xa78bfa);
  });
}

/* ================================================================
   PROJECT 3D TO 2D (HARDWARE-ACCELERATED)
   ================================================================ */
const _v = new THREE.Vector3();

function projectLabels() {
  const w = vpWidth;
  const h = vpHeight;
  const active = state.selectedRegion || state.hoveredRegion;

  const isWide = w >= 1200;
  const MAIN = isWide
    ? { m1: 1, s1: 1, wern: 1, v1: 1, pfc: 1, broca: 1, hip: 1, a1: 1 }
    : { m1: 1, s1: 1, wern: 1, v1: 1, pfc: 1 };

  const isSmall = w < 500;
  const pad = isSmall ? 44 : 68;
  const pushAmt = isSmall ? 52 : (isWide ? 88 : 72);

  Object.keys(htmlLabels).forEach(function(id) {
    const el = htmlLabels[id];
    const mesh = subzoneMeshes[id];
    if (!mesh || !mesh.visible) {
      el.classList.add('hidden');
      return;
    }

    const sz = SUBZONES.find(function(s) { return s.id === id; });
    const isMain = MAIN[id];
    const isActive = active && sz.region === active;
    const isSelected = state.selectedSubzone === id;
    const isHovered = state.hoveredSubzone === id;

    const shouldShow = state.chips.labels && (isSelected || isHovered || isActive || (!active && isMain));

    if (!shouldShow) {
      el.classList.add('hidden');
      return;
    }

    mesh.getWorldPosition(_v);
    _v.y += 0.08;
    _v.project(camera);

    if (_v.z > 1) {
      el.classList.add('hidden');
      return;
    }

    el.classList.remove('hidden');

    let x = (_v.x * 0.5 + 0.5) * w;
    let y = (-_v.y * 0.5 + 0.5) * h;

    const cx = w * 0.5;
    const cy = h * 0.5;
    const dx = x - cx;
    const dy = y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const push = Math.min(pushAmt, 28 + dist * 0.35);
    x += (dx / dist) * push;
    y += (dy / dist) * push;

    x = Math.max(pad, Math.min(w - pad, x));
    y = Math.max(34, Math.min(h - 34, y));

    const scale = (isSelected || isHovered) ? 1.08 : 1;
    el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + scale + ')';
  });
}

/* ================================================================
   ANIMATION LOOP
   ================================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 2.4);
    const e = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }

  if (state.chips.impulses) {
    impulses.forEach(function(p) {
      p.t = (p.t + dt * p.speed) % 1;
      const pt = p.curve.getPointAt(p.t);
      p.mesh.position.copy(pt);
      const s = 0.7 + Math.sin(p.t * Math.PI) * 0.75;
      p.mesh.scale.setScalar(s);
      p.mesh.material.opacity = 0.3 + Math.sin(p.t * Math.PI) * 0.65;
    });
  }

  Object.keys(subzoneMeshes).forEach(function(id) {
    const mesh = subzoneMeshes[id];
    if (!mesh.visible) return;
    const isSel = state.selectedSubzone === id;
    const isHov = state.hoveredSubzone === id;
    const pulse = 1 + Math.sin(t * 2.8 + id.length) * 0.1;
    const targetScale = isSel ? pulse * 1.65 : (isHov ? pulse * 1.38 : pulse);
    mesh.scale.setScalar(targetScale);

    const halo = subzoneHalos[id];
    if (halo) {
      halo.material.opacity = isSel ? 0.42 : (isHov ? 0.32 : 0.18);
    }
  });

  if (state.chips.rotate && brainState.model) {
    brainGroup.rotation.y += dt * 0.18;
  }

  bottomLight.intensity = 0.65 + Math.sin(t * 0.9) * 0.2;

  controls.update();
  renderer.render(scene, camera);

  projectLabels();
}

/* ================================================================
   UI - DETAILED REGION LIST
   ================================================================ */
function renderRegionList() {
  const el = document.getElementById('regionList');
  el.innerHTML = '';
  Object.keys(REGIONS).forEach(function(rid) {
    const r = REGIONS[rid];
    const subCount = SUBZONES.filter(function(s) { return s.region === rid; }).length;
    const btn = document.createElement('button');
    btn.className = 'region-item';
    btn.dataset.region = r.id;
    btn.style.setProperty('--r-color', r.color);
    btn.innerHTML =
      '<div class="region-top">' +
        '<span class="region-dot"></span>' +
        '<span class="region-name">' + r[LANG].name + '</span>' +
        (subCount ? '<span class="region-count">' + subCount + '</span>' : '') +
      '</div>' +
      '<div class="region-meta">' +
        '<span>' + r[LANG].short + '</span>' +
      '</div>';

    btn.addEventListener('pointerenter', function() {
      if (!state.selectedRegion) {
        state.hoveredRegion = r.id;
        applyHighlight();
      }
    });
    btn.addEventListener('pointerleave', function() {
      if (state.hoveredRegion === r.id) {
        state.hoveredRegion = null;
        applyHighlight();
      }
    });
    btn.addEventListener('click', function() {
      state.selectedRegion = (state.selectedRegion === r.id) ? null : r.id;
      state.selectedSubzone = null;
      state.currentDisease = null;
      if (state.selectedRegion) {
        const p = getSurfacePoint(r.dir, 0.05);
        focusOn(p);
      } else {
        resetCamera();
      }
      applyHighlight();
      renderAnalytics();
      updateRegionListUI();
      updateDiseaseListUI();
      updateSeverityUI();
      closeMobilePanels();
    });
    el.appendChild(btn);
  });
  updateRegionListUI();
}

function updateRegionListUI() {
  const items = document.querySelectorAll('.region-item');
  items.forEach(function(el) {
    if (el.dataset.region === state.selectedRegion) {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });
}

/* ================================================================
   UI - DISEASE LIST
   ================================================================ */
function renderDiseaseList() {
  const el = document.getElementById('diseaseList');
  el.innerHTML = '';

  const h = document.createElement('button');
  h.className = 'disease-item';
  h.dataset.disease = 'healthy';
  h.style.setProperty('--d-color', '#10b981');
  h.innerHTML =
    '<span class="disease-icon" style="background:linear-gradient(135deg,#10b981,#059669)">+</span>' +
    '<span class="disease-body">' +
      '<span class="disease-name">' + T('healthy') + '</span>' +
      '<span class="disease-desc">' + T('healthyDesc') + '</span>' +
    '</span>';
  h.addEventListener('click', function() { selectDisease(null); });
  el.appendChild(h);

  DISEASES.forEach(function(d) {
    const btn = document.createElement('button');
    btn.className = 'disease-item';
    btn.dataset.disease = d.id;
    btn.style.setProperty('--d-color', d.color);
    btn.innerHTML =
      '<span class="disease-icon">' + d.icon + '</span>' +
      '<span class="disease-body">' +
        '<span class="disease-name">' + d[LANG].name + '</span>' +
        '<span class="disease-desc">' + d[LANG].short + '</span>' +
      '</span>';
    btn.addEventListener('click', function() { selectDisease(d.id); });
    el.appendChild(btn);
  });
  updateDiseaseListUI();
}

function updateDiseaseListUI() {
  const active = state.currentDisease ? state.currentDisease.id : 'healthy';
  const items = document.querySelectorAll('.disease-item');
  items.forEach(function(el) {
    if (el.dataset.disease === active) {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });
}

function selectDisease(id) {
  if (id) {
    state.currentDisease = DISEASES.find(function(d) { return d.id === id; });
    state.selectedRegion = null;
    state.selectedSubzone = null;
    setStatus('alert', T('alert'));
    document.getElementById('severityContainer').style.display = 'block';
    applySeverity(state.severity);
  } else {
    state.currentDisease = null;
    setStatus('ready', T('ready'));
    document.getElementById('severityContainer').style.display = 'none';
    applyDiseaseToBrain();
    applyHighlight();
  }
  updateDiseaseListUI();
  updateRegionListUI();
  renderAnalytics();
  closeMobilePanels();
}

/* ================================================================
   SEVERITY
   ================================================================ */
function updateSeverityUI() {
  document.getElementById('severityContainer').style.display = state.currentDisease ? 'block' : 'none';
}

function applySeverity(value) {
  state.severity = value;
  const slider = document.getElementById('severitySlider');
  const valEl = document.getElementById('severityValue');
  const stages = document.getElementById('severityStages');

  slider.value = value;
  slider.style.setProperty('--p', value + '%');
  valEl.textContent = value + '%';

  const idx = Math.min(3, Math.floor(value / 25));
  const children = stages.children;
  for (let i = 0; i < children.length; i++) {
    if (i === idx) children[i].classList.add('active');
    else children[i].classList.remove('active');
  }

  applyDiseaseToBrain();
  renderAnalytics();
}

document.getElementById('severitySlider').addEventListener('input', function(e) {
  applySeverity(+e.target.value);
});

/* ================================================================
   ANALYTICS PANEL (ENHANCED DETAILS & INTERACTIVITY)
   ================================================================ */
function renderAnalytics() {
  const el = document.getElementById('analyticsContent');

  if (state.currentDisease) { renderDiseaseAnalytics(el); return; }
  if (state.selectedSubzone) { renderSubzoneAnalytics(el); return; }
  if (state.selectedRegion) { renderRegionAnalytics(el); return; }

  el.innerHTML =
    '<div class="empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">' +
        '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>' +
      '</svg>' +
      '<p><strong>' + T('emptyTitle') + '</strong><br><br>' + T('emptyText') + '</p>' +
    '</div>';
}

  const r = REGIONS[state.selectedRegion];
  const d = r[LANG];
  const subs = SUBZONES.filter(function(s) { return s.region === r.id; });

  el.innerHTML =
    '<div class="analytics-header">' +
      '<div><h2>' + d.name + '</h2><span class="subtitle">' + d.latin + '</span></div>' +
      '<span class="ba-badge" style="border-color:' + r.color + '">' + subs.length + ' zones</span>' +
    '</div>' +
    '<div class="card" style="border-left:3px solid ' + r.color + '">' +
      '<div class="card-title">' + T('anatomy') + '</div>' +
      '<p>' + d.desc + '</p>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">' + T('functions') + '</div>' +
      '<div class="tags">' + d.functions.map(function(f) { return '<span class="tag">' + f + '</span>'; }).join('') + '</div>' +
    '</div>' +
    (subs.length ? (
      '<div class="card">' +
        '<div class="card-title">' + T('subzones') + '<span class="badge">' + subs.length + '</span></div>' +
        subs.map(function(s) {
          return '<button class="sub-item" data-sub="' + s.id + '">' +
            '<span class="pin" style="background:' + s.color + ';color:' + s.color + '"></span>' +
            '<span class="sub-item-info">' +
              '<span class="sub-item-title">' + s[LANG].full + '</span>' +
              '<span class="sub-item-sub">' + s.ba + ' · ' + s[LANG].note + '</span>' +
            '</span>' +
            '<span class="go">→</span>' +
          '</button>';
        }).join('') +
      '</div>'
    ) : '');

  el.querySelectorAll('.sub-item').forEach(function(btn) {
    btn.addEventListener('click', function() {
      onZoneClick(btn.dataset.sub);
    });
  });
}

function renderSubzoneAnalytics(el) {
  const sz = SUBZONES.find(function(s) { return s.id === state.selectedSubzone; });
  if (!sz) return;
  const d = sz[LANG];
  const region = REGIONS[sz.region];

  // Find connected zones via PATHWAYS
  const connectedIds = [];
  PATHWAYS.forEach(function(pair) {
    if (pair[0] === sz.id) connectedIds.push(pair[1]);
    else if (pair[1] === sz.id) connectedIds.push(pair[0]);
  });
  const connectedZones = connectedIds.map(function(cid) {
    return SUBZONES.find(function(s) { return s.id === cid; });
  }).filter(Boolean);

  el.innerHTML =
    '<button class="back-btn" id="backToLobeBtn">← ' + T('backToLobe') + ' (' + region[LANG].name + ')</button>' +
    '<div class="analytics-header">' +
      '<div><h2>' + d.full + '</h2><span class="subtitle">' + region[LANG].name + ' · ' + region[LANG].latin + '</span></div>' +
      '<span class="ba-badge" style="border-color:' + sz.color + '">' + sz.ba + '</span>' +
    '</div>' +
    '<div class="card" style="border-left:3px solid ' + sz.color + '">' +
      '<div class="card-title">' + T('anatomy') + '</div>' +
      '<p>' + d.note + '</p>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">' + T('functions') + '</div>' +
      '<div class="tags">' + region[LANG].functions.map(function(f) { return '<span class="tag">' + f + '</span>'; }).join('') + '</div>' +
    '</div>' +
    (connectedZones.length ? (
      '<div class="card">' +
        '<div class="card-title">' + T('connections') + '<span class="badge">' + connectedZones.length + '</span></div>' +
        connectedZones.map(function(csz) {
          return '<button class="sub-item" data-sub="' + csz.id + '">' +
            '<span class="pin" style="background:' + csz.color + ';color:' + csz.color + '"></span>' +
            '<span class="sub-item-info">' +
              '<span class="sub-item-title">' + csz[LANG].full + '</span>' +
              '<span class="sub-item-sub">' + csz.ba + ' · ' + REGIONS[csz.region][LANG].name + '</span>' +
            '</span>' +
            '<span class="go">→</span>' +
          '</button>';
        }).join('') +
      '</div>'
    ) : '');

  const backBtn = document.getElementById('backToLobeBtn');
  if (backBtn) {
    backBtn.addEventListener('click', function() {
      state.selectedSubzone = null;
      const p = getSurfacePoint(region.dir, 0.05);
      focusOn(p);
      applyHighlight();
      renderAnalytics();
    });
  }

  el.querySelectorAll('.sub-item').forEach(function(btn) {
    btn.addEventListener('click', function() {
      onZoneClick(btn.dataset.sub);
    });
  });
}

function renderDiseaseAnalytics(el) {
  const d = state.currentDisease;
  const data = d[LANG];
  const sev = state.severity;
  const stageIdx = Math.min(3, Math.floor(sev / 25));
  const stageLabels = ['I', 'II', 'III', 'IV'];
  const stageLabel = stageLabels[stageIdx];

  const affectedZones = d.affected.map(function(id) {
    return SUBZONES.find(function(s) { return s.id === id; });
  }).filter(Boolean);

  const metricMap = [
    ['cognitive', 'metricCognitive'],
    ['motor', 'metricMotor'],
    ['language', 'metricLanguage'],
    ['sensory', 'metricSensory'],
    ['memory', 'metricMemory'],
    ['connectivity', 'metricConnectivity']
  ];

  const metricsHtml = metricMap.map(function(pair) {
    const key = pair[0];
    const labelKey = pair[1];
    const base = d.en.metrics[key];
    const impairment = 1 - base;
    const current = Math.max(0, base - impairment * (sev / 100));
    const pct = Math.round(current * 100);
    const cls = current > 0.72 ? 'good' : (current > 0.45 ? 'warn' : 'bad');
    return '<div class="metric-row">' +
      '<div class="metric-top">' +
        '<span class="metric-label">' + T(labelKey) + '</span>' +
        '<span class="metric-value ' + cls + '">' + pct + '%</span>' +
      '</div>' +
      '<div class="metric-bar"><div class="metric-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }).join('');

  const progBar = data.stages.map(function(_, i) {
    const cls = i === stageIdx ? 'current' : (i < stageIdx ? 'past' : '');
    return '<div class="progression-step ' + cls + '"></div>';
  }).join('');

  const progLabels = data.stages.map(function(_, i) {
    return '<span class="' + (i === stageIdx ? 'active' : '') + '">' + (i + 1) + '</span>';
  }).join('');

  el.innerHTML =
    '<div class="analytics-header"><div><h2>' + data.name + '</h2><span class="subtitle">' + data.short + '</span></div></div>' +
    '<div class="card" style="border-left:3px solid ' + d.color + '">' +
      '<div class="card-title">Stage ' + stageLabel + '<span class="badge">' + sev + '%</span></div>' +
      '<p>' + data.desc + '</p></div>' +
    '<div class="card"><div class="card-title">' + T('progression') + '</div>' +
      '<div class="progression-bar">' + progBar + '</div>' +
      '<div class="progression-labels">' + progLabels + '</div>' +
      '<p style="font-size:0.84rem"><strong>' + data.stages[stageIdx] + '</strong></p></div>' +
    '<div class="card"><div class="card-title">' + T('mechanism') + '</div><p>' + data.mechanism + '</p></div>' +
    '<div class="card"><div class="card-title">' + T('affected') + '</div>' +
      affectedZones.map(function(sz) {
        return '<button class="sub-item" data-sub="' + sz.id + '">' +
          '<span class="pin" style="background:' + d.color + ';color:' + d.color + '"></span>' +
          '<span class="sub-item-info">' +
            '<span class="sub-item-title">' + sz[LANG].full + '</span>' +
            '<span class="sub-item-sub">' + sz.ba + '</span>' +
          '</span>' +
          '<span class="go">→</span>' +
        '</button>';
      }).join('') +
    '</div>' +
    '<div class="card"><div class="card-title">' + T('neuro') + '</div>' +
      '<div class="tags">' + data.neuro.map(function(n) { return '<span class="tag warn">' + n + '</span>'; }).join('') + '</div></div>' +
    '<div class="card"><div class="card-title">' + T('symptoms') + '</div>' +
      '<div class="tags">' + data.symptoms.map(function(s) { return '<span class="tag danger">' + s + '</span>'; }).join('') + '</div></div>' +
    '<div class="card"><div class="card-title">' + T('metrics') + '</div>' + metricsHtml + '</div>';

  el.querySelectorAll('.sub-item').forEach(function(btn) {
    btn.addEventListener('click', function() {
      onZoneClick(btn.dataset.sub);
    });
  });
}

/* ================================================================
   STATUS
   ================================================================ */
function setStatus(type, text) {
  const el = document.getElementById('statusIndicator');
  let cls = 'status-indicator';
  if (type === 'warn') cls += ' warn';
  else if (type === 'alert') cls += ' danger';
  el.className = cls;
  el.textContent = text;
}

/* ================================================================
   CHIPS
   ================================================================ */
document.querySelectorAll('.chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    const key = chip.dataset.toggle;
    state.chips[key] = !state.chips[key];
    if (state.chips[key]) chip.classList.add('on');
    else chip.classList.remove('on');

    if (key === 'labels') {
      projectLabels();
    }
    if (key === 'impulses') {
      impulses.forEach(function(p) { p.mesh.visible = state.chips.impulses; });
      pathwayData.forEach(function(pw) { pw.tube.visible = state.chips.impulses; });
    }
  });
});

/* ================================================================
   THEME
   ================================================================ */
function setTheme(theme, save) {
  if (save === undefined) save = true;
  document.documentElement.setAttribute('data-theme', theme);
  const icon = document.getElementById('themeIcon');
  if (theme === 'light') {
    icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  } else {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
  if (save) {
    try { localStorage.setItem('nm-theme', theme); } catch (e) {}
  }
  renderer.setClearColor(theme === 'light' ? 0xf8fafc : 0x000000, 0);
}

document.getElementById('themeBtn').addEventListener('click', function() {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
});

/* ================================================================
   LANGUAGE
   ================================================================ */
function setLanguage(lang) {
  LANG = lang;
  document.documentElement.setAttribute('data-lang', lang);

  document.getElementById('chipLabels').textContent = T('labels');
  document.getElementById('chipImpulses').textContent = T('impulses');
  document.getElementById('chipRotate').textContent = T('rotate');
  document.getElementById('focusTag').textContent = T('focus');
  document.getElementById('hintDrag').textContent = T('drag');
  document.getElementById('hintZoom').textContent = T('zoom');
  document.getElementById('hintClick').textContent = T('click');
  document.getElementById('lobesTitle').textContent = T('lobes');
  document.getElementById('diseasesTitle').textContent = T('diseases');
  document.getElementById('severityLabel').textContent = T('severity');
  document.getElementById('leftTitle').textContent = T('atlas');
  document.getElementById('rightTitle').textContent = T('analytics');
  document.getElementById('tabAtlas').textContent = T('atlas');
  document.getElementById('tabAnalytics').textContent = T('analytics');
  document.getElementById('tabSimulation').textContent = T('simulation');
  setStatus(state.currentDisease ? 'alert' : 'ready', state.currentDisease ? T('alert') : T('ready'));

  Object.keys(htmlLabels).forEach(function(id) {
    const el = htmlLabels[id];
    const sz = SUBZONES.find(function(s) { return s.id === id; });
    if (sz) {
      const nameEl = el.querySelector('.lname');
      if (nameEl) nameEl.textContent = sz[LANG].name;
    }
  });

  renderRegionList();
  renderDiseaseList();
  applyHighlight();
  renderAnalytics();
}

document.querySelectorAll('.lang-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    setLanguage(btn.dataset.lang);
  });
});

/* ================================================================
   NAV TABS
   ================================================================ */
document.querySelectorAll('.nav-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
  });
});

/* ================================================================
   MOBILE PANELS
   ================================================================ */
const panelLeft = document.getElementById('panelLeft');
const panelRight = document.getElementById('panelRight');
const scrim = document.getElementById('scrim');

function openLeftPanel() {
  panelLeft.classList.add('open');
  panelRight.classList.remove('open');
  scrim.classList.add('show');
}
function openRightPanel() {
  panelRight.classList.add('open');
  panelLeft.classList.remove('open');
  scrim.classList.add('show');
}
function closeMobilePanels() {
  panelLeft.classList.remove('open');
  panelRight.classList.remove('open');
  scrim.classList.remove('show');
}

document.getElementById('menuBtn').addEventListener('click', openLeftPanel);
document.getElementById('panelBtn').addEventListener('click', openRightPanel);
document.getElementById('closeLeft').addEventListener('click', closeMobilePanels);
document.getElementById('closeRight').addEventListener('click', closeMobilePanels);
scrim.addEventListener('click', closeMobilePanels);

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeMobilePanels();
    state.selectedRegion = null;
    state.selectedSubzone = null;
    applyHighlight();
    renderAnalytics();
    updateRegionListUI();
    resetCamera();
  }
});

/* ================================================================
   INIT
   ================================================================ */
function init() {
  let savedTheme = 'dark';
  try {
    const stored = localStorage.getItem('nm-theme');
    if (stored === 'light' || stored === 'dark') savedTheme = stored;
  } catch (e) {}
  setTheme(savedTheme, false);

  renderRegionList();
  renderDiseaseList();
  renderAnalytics();
  resize();

  animate();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
