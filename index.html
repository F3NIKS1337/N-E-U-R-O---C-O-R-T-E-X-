<!DOCTYPE html>
<html lang="ru" data-lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030308">
<title>NeuralMap — Neuro Cosmos Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030308;--bg-1:#070810;--bg-2:#0d0f1a;--bg-3:#141726;
  --border:rgba(255,255,255,.07);--border-hi:rgba(255,255,255,.2);
  --text:#f8fafc;--text-2:rgba(248,250,252,.65);--text-3:rgba(248,250,252,.36);
  --accent:#7c5cff;
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;
  --font:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --topbar-h:52px;
  --panel-l:310px;
  --panel-r:360px;
  --ease-out:cubic-bezier(0.16, 1, 0.3, 1);
}
[data-theme="light"]{
  --bg:#f1f5f9;--bg-1:#ffffff;--bg-2:#f8fafc;--bg-3:#e2e8f0;
  --border:rgba(15,23,42,.08);--border-hi:rgba(15,23,42,.22);
  --text:#0f172a;--text-2:rgba(15,23,42,.68);--text-3:rgba(15,23,42,.42);
}

/* ═══ 16:9 LARGE MONITORS SCALING (FHD / QHD / 4K) ═══ */
@media (min-width:1440px){
  :root{--topbar-h:56px;--panel-l:340px;--panel-r:400px}
  html{font-size:15px}
}
@media (min-width:1920px){
  :root{--topbar-h:64px;--panel-l:390px;--panel-r:460px}
  html{font-size:16.5px}
}
@media (min-width:2560px){
  :root{--topbar-h:74px;--panel-l:450px;--panel-r:540px}
  html{font-size:19px}
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  font-size:0.94rem;line-height:1.5;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
svg{display:block}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:2px}

.app{
  display:grid;
  grid-template-rows:calc(var(--topbar-h) + var(--safe-top)) 1fr;
  height:100dvh;
  background:var(--bg);
  overflow:hidden;
}

/* ═══ TOPBAR ═══ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:var(--safe-top) calc(16px + var(--safe-right)) 0 calc(16px + var(--safe-left));
  height:calc(var(--topbar-h) + var(--safe-top));
  background:var(--bg-1);
  border-bottom:1px solid var(--border);
  z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-icon{
  width:28px;height:28px;
  display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#7c5cff,#38bdf8);color:#fff;
  border-radius:7px;
  box-shadow:0 0 16px rgba(124,92,255,.45);
}
.brand-icon svg{width:15px;height:15px}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-size:0.95rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-family:var(--mono)}
.brand-text span{font-size:0.65rem;color:var(--text-3);font-family:var(--mono);letter-spacing:.4px}

.telemetry-bar{
  display:none;align-items:center;gap:18px;
  padding-left:14px;border-left:1px solid var(--border);
  font-family:var(--mono);font-size:0.7rem;color:var(--text-3);
}
@media (min-width:900px){.telemetry-bar{display:flex}}
.telemetry-item strong{color:var(--text);font-weight:600;margin-left:4px}

.topbar-actions{display:flex;align-items:center;gap:6px;flex:none}
.lang-switch{
  display:flex;background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:6px;padding:2px;gap:2px;
}
.lang-btn{
  padding:4px 8px;
  font-family:var(--mono);font-size:0.7rem;font-weight:600;
  letter-spacing:.4px;border-radius:4px;
  color:var(--text-3);
  transition:background .15s ease,color .15s ease;
}
.lang-btn.active{background:var(--text);color:var(--bg)}
.icon-btn{
  width:34px;height:34px;min-width:34px;
  display:grid;place-items:center;
  border-radius:6px;color:var(--text-2);
  border:1px solid var(--border);background:var(--bg-2);
  transition:border-color .15s ease,color .15s ease,transform .15s ease;
}
.icon-btn:hover{border-color:var(--border-hi);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:15px;height:15px}
.mobile-only{display:grid}
@media (min-width:1025px){.mobile-only{display:none}}

/* ═══ BODY ═══ */
.body{
  display:grid;grid-template-columns:1fr;
  overflow:hidden;min-height:0;position:relative;
}
@media (min-width:1025px){
  .body{grid-template-columns:var(--panel-l) 1fr var(--panel-r)}
}
@media (min-width:641px) and (max-width:1024px){
  .body{grid-template-columns:1fr 330px}
}

.panel{
  overflow-y:auto;overflow-x:hidden;
  padding:16px 14px;min-height:0;
  background:var(--bg-1);
  -webkit-overflow-scrolling:touch;
  contain:content;
}
@media (min-width:1440px){.panel{padding:20px 18px}}
.panel-left{border-right:1px solid var(--border)}
.panel-right{border-left:1px solid var(--border)}

@media (max-width:1024px){
  .panel-left,.panel-right{
    position:fixed;
    top:calc(var(--topbar-h) + var(--safe-top));bottom:0;
    width:min(340px,88vw);z-index:200;
    background:var(--bg-1);
    transition:transform .28s var(--ease-out);
    padding-bottom:calc(18px + var(--safe-bottom));
    will-change:transform;
  }
  .panel-left{left:0;transform:translate3d(-100%,0,0);box-shadow:20px 0 50px rgba(0,0,0,.6)}
  .panel-right{right:0;transform:translate3d(100%,0,0);box-shadow:-20px 0 50px rgba(0,0,0,.6)}
  .panel-left.open,.panel-right.open{transform:translate3d(0,0,0)}
}

.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:11px;margin-bottom:14px;
  border-bottom:1px solid var(--border);
  position:sticky;top:-20px;background:var(--bg-1);
  padding-top:16px;margin-top:-16px;z-index:5;
}
.panel-head h2{
  font-family:var(--mono);font-size:0.72rem;font-weight:700;
  letter-spacing:1.6px;text-transform:uppercase;color:var(--text-3);
}
.panel-close{
  width:28px;height:28px;display:grid;place-items:center;
  border-radius:6px;color:var(--text-2);background:var(--bg-2);
}
.panel-close svg{width:14px;height:14px}
@media (min-width:1025px){.panel-close{display:none}}

.section{margin-bottom:22px}
.section-title{
  font-family:var(--mono);font-size:0.68rem;font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;
}

/* ═══ STRUCTURAL LOBE CARDS ═══ */
.region-item{
  display:flex;flex-direction:column;gap:7px;width:100%;
  padding:12px 13px;border-radius:9px;text-align:left;
  transition:background .18s ease,border-color .18s ease,transform .15s var(--ease-out),box-shadow .2s ease;
  margin-bottom:7px;
  border:1px solid var(--border);
  background:linear-gradient(135deg, var(--bg-2) 0%, rgba(20,23,38,.5) 100%);
  position:relative;overflow:hidden;
}
.region-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--r-color,#7c5cff);opacity:.5;
  transition:opacity .2s ease,width .2s ease,box-shadow .2s ease;
}
.region-item:hover{
  background:var(--bg-3);
  border-color:color-mix(in srgb, var(--r-color,#7c5cff) 50%, var(--border-hi));
  transform:translateX(2px);
}
.region-item:hover::before{opacity:1;box-shadow:0 0 12px var(--r-color,#7c5cff)}
.region-item.active{
  background:linear-gradient(135deg, color-mix(in srgb, var(--r-color,#7c5cff) 16%, var(--bg-3)) 0%, var(--bg-2) 100%);
  border-color:var(--r-color,#7c5cff);
  box-shadow:0 6px 22px -6px color-mix(in srgb, var(--r-color,#7c5cff) 35%, transparent);
}
.region-item.active::before{opacity:1;width:4px;box-shadow:0 0 14px var(--r-color,#7c5cff)}

.region-top{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.region-title-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.region-glyph{
  width:14px;height:14px;border-radius:3px;flex:none;
  border:1.5px solid var(--r-color,#7c5cff);
  display:grid;place-items:center;
}
.region-glyph::after{
  content:'';width:5px;height:5px;border-radius:1px;
  background:var(--r-color,#7c5cff);
  box-shadow:0 0 8px var(--r-color,#7c5cff);
}
.region-name{font-size:0.88rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region-ba{
  font-family:var(--mono);font-size:0.64rem;font-weight:600;
  padding:2px 6px;border-radius:4px;
  background:rgba(255,255,255,.04);color:var(--text-2);
  border:1px solid var(--border);flex:none;
}
.region-sub{
  font-size:0.74rem;color:var(--text-3);line-height:1.3;
  display:flex;align-items:center;justify-content:space-between;gap:6px;
}
.region-neurons{font-family:var(--mono);font-size:0.66rem;color:var(--r-color,#7c5cff);opacity:.9}
.region-bar{
  height:2px;width:100%;background:rgba(255,255,255,.06);
  border-radius:2px;overflow:hidden;margin-top:1px;
}
.region-bar-fill{
  height:100%;background:var(--r-color,#7c5cff);
  opacity:.65;transition:width .3s var(--ease-out),opacity .2s ease;
}
.region-item.active .region-bar-fill{opacity:1}

/* ═══ DISEASE ITEMS ═══ */
.disease-item{
  display:flex;align-items:flex-start;gap:10px;width:100%;
  padding:10px 12px;border-radius:8px;text-align:left;
  transition:background .18s ease,border-color .18s ease,transform .15s var(--ease-out);
  margin-bottom:5px;
  border:1px solid var(--border);background:var(--bg-2);
  position:relative;overflow:hidden;
}
.disease-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--d-color,#666);opacity:.45;
}
.disease-item:hover{background:var(--bg-3);border-color:var(--border-hi);transform:translateX(2px)}
.disease-item.active{background:var(--bg-3);border-color:var(--d-color,#fff)}
.disease-item.active::before{opacity:1}
.disease-icon{
  width:24px;height:24px;border-radius:5px;
  display:grid;place-items:center;
  background:var(--d-color,#666);color:#fff;
  font-family:var(--mono);font-size:0.72rem;font-weight:700;flex:none;
}
.disease-body{flex:1;min-width:0}
.disease-name{font-size:0.84rem;font-weight:600;color:var(--text);display:block}
.disease-desc{font-size:0.72rem;color:var(--text-3);line-height:1.3}

/* ═══ SEVERITY ═══ */
.severity-box{
  margin-top:12px;padding:14px;
  background:var(--bg-2);border:1px solid var(--border-hi);
  border-radius:10px;
}
.severity-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.severity-label{font-family:var(--mono);font-size:0.68rem;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3)}
.severity-value{font-family:var(--mono);font-size:1.2rem;font-weight:700;color:var(--text)}
.severity-slider{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;display:block}
.severity-slider::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--text) var(--p,50%),var(--border) var(--p,50%));
}
.severity-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;
  border-radius:50%;background:var(--text);
  margin-top:-7px;border:2px solid var(--bg-1);
}
.severity-stages{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:0.68rem;color:var(--text-3)}
.severity-stages span.active{color:var(--text);font-weight:700}

/* ═══ VIEWPORT (NEURO COSMOS) ═══ */
.viewport{
  position:relative;
  background:
    radial-gradient(circle at 50% 46%, rgba(88, 62, 255, 0.14) 0%, rgba(16, 185, 129, 0.05) 38%, transparent 72%),
    var(--bg);
  overflow:hidden;min-height:0;min-width:0;
  display:flex;align-items:center;justify-content:center;
}
#canvas3d{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#canvas3d:active{cursor:grabbing}

/* ═══ STRUCTURAL HUD LABELS (CALLOUT STYLE) ═══ */
.labels-layer{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.zone-label{
  position:absolute;left:0;top:0;
  pointer-events:auto;
  display:flex;align-items:center;gap:7px;
  padding:4px 10px 4px 7px;border-radius:4px;
  background:rgba(6, 8, 16, 0.78);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.14);
  border-left:2.5px solid var(--ldot-color,#7c5cff);
  font-family:var(--mono);font-size:0.7rem;font-weight:600;
  letter-spacing:.5px;text-transform:uppercase;color:#f8fafc;white-space:nowrap;
  transform:translate3d(-9999px,-9999px,0);
  transition:opacity .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
  will-change:transform,opacity;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.45);
}
[data-theme="light"] .zone-label{
  background:rgba(255,255,255,.88);
  border-color:rgba(15,23,42,.15);
  border-left:2.5px solid var(--ldot-color,#7c5cff);
  color:#0f172a;
}
.zone-label.hidden{opacity:0;pointer-events:none}
.zone-label:hover{
  background:rgba(16, 20, 36, 0.95);
  border-color:var(--ldot-color,#7c5cff);
  box-shadow:0 0 18px color-mix(in srgb, var(--ldot-color,#7c5cff) 50%, transparent);
  z-index:10;
}
.zone-label.active{
  background:color-mix(in srgb, var(--ldot-color,#7c5cff) 28%, rgba(8,10,20,.94));
  border-color:var(--ldot-color,#7c5cff);
  color:#fff;
  box-shadow:0 0 24px color-mix(in srgb, var(--ldot-color,#7c5cff) 65%, transparent);
  z-index:12;
}
.zone-label .ldot{
  width:5px;height:5px;border-radius:1px;flex:none;
  background:var(--ldot-color,#7c5cff);
  box-shadow:0 0 8px var(--ldot-color,#7c5cff);
  transform:rotate(45deg);
}
.zone-label .lba{font-size:0.6rem;opacity:.6;font-weight:500}

/* ═══ VIEWPORT CHIPS & HUD ═══ */
.viewport-chips{
  position:absolute;top:14px;left:14px;
  display:flex;gap:6px;z-index:10;
  pointer-events:none;flex-wrap:wrap;
}
.chip{
  pointer-events:auto;
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 12px;border-radius:6px;
  border:1px solid var(--border);
  background:rgba(7,8,16,.76);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--text-2);
  font-family:var(--mono);font-size:0.7rem;font-weight:500;
  letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.chip:hover{border-color:var(--border-hi);color:var(--text)}
[data-theme="light"] .chip{background:rgba(255,255,255,.82)}
.chip.on{
  background:rgba(124,92,255,.18);
  border-color:rgba(124,92,255,.65);
  color:#fff;
  box-shadow:0 0 14px rgba(124,92,255,.25);
}
[data-theme="light"] .chip.on{color:#0f172a;background:rgba(124,92,255,.15)}
.chip-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5}
.chip.on .chip-dot{background:#a78bfa;opacity:1;box-shadow:0 0 6px #a78bfa}

.focus-label{
  position:absolute;top:14px;right:14px;
  pointer-events:none;z-index:10;
  max-width:250px;text-align:right;
  background:rgba(7,8,16,.72);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:7px 12px;border-radius:6px;
  border:1px solid var(--border);
}
[data-theme="light"] .focus-label{background:rgba(255,255,255,.82)}
.focus-label .tag{
  display:block;font-family:var(--mono);font-size:0.62rem;
  letter-spacing:1.4px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:2px;
}
.focus-label .val{
  font-family:var(--mono);font-size:0.8rem;font-weight:600;
  color:var(--text);line-height:1.25;display:block;
}

.cosmos-stats{
  position:absolute;bottom:14px;left:16px;
  display:none;gap:18px;z-index:10;pointer-events:none;
  font-family:var(--mono);
}
@media (min-width:768px){.cosmos-stats{display:flex}}
.stat-block strong{
  display:block;font-size:1.1rem;font-weight:700;color:var(--text);
  letter-spacing:-.5px;line-height:1.1;
}
.stat-block span{font-size:0.62rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px}

.status-indicator{
  position:absolute;bottom:14px;right:14px;
  display:flex;align-items:center;gap:6px;
  padding:6px 11px;background:rgba(7,8,16,.72);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:6px;
  font-family:var(--mono);font-size:0.68rem;
  letter-spacing:.8px;text-transform:uppercase;
  color:var(--text-2);z-index:10;
}
[data-theme="light"] .status-indicator{background:rgba(255,255,255,.82)}
.status-indicator::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--success);box-shadow:0 0 8px var(--success);
}
.status-indicator.danger::before{background:var(--danger);box-shadow:0 0 8px var(--danger)}

/* ═══ MODEL LOADER ═══ */
.model-loader{
  position:absolute;inset:0;
  display:grid;place-items:center;
  background:var(--bg);z-index:20;
  transition:opacity .4s ease;
}
.model-loader.hidden{opacity:0;pointer-events:none}
.model-loader-spinner{
  width:36px;height:36px;margin:0 auto 14px;
  border:2px solid var(--border);
  border-top-color:#7c5cff;
  border-radius:50%;
  animation:spin 0.85s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.model-loader-text{
  font-family:var(--mono);font-size:0.72rem;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-2);text-align:center;
}

/* ═══ ANALYTICS PANEL ═══ */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:0.7rem;font-weight:600;
  color:var(--text-2);background:var(--bg-2);
  border:1px solid var(--border);border-radius:6px;
  padding:5px 10px;margin-bottom:12px;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.back-btn:hover{background:var(--bg-3);color:var(--text);border-color:var(--border-hi)}

.analytics-header{
  display:flex;align-items:flex-start;
  justify-content:space-between;gap:10px;margin-bottom:14px;
}
.analytics-header h2{font-size:1.1rem;font-weight:700;letter-spacing:-.2px;margin-bottom:3px;line-height:1.25}
.analytics-header .subtitle{font-family:var(--mono);font-size:0.72rem;color:var(--text-3);display:block}
.ba-badge{
  font-family:var(--mono);font-size:0.68rem;font-weight:600;
  padding:4px 8px;border-radius:5px;
  background:var(--bg-3);border:1px solid var(--border-hi);
  color:var(--text);white-space:nowrap;flex:none;
}
.card{
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:9px;padding:13px;margin-bottom:10px;
}
.card-title{
  font-family:var(--mono);font-size:0.68rem;font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:9px;
  display:flex;align-items:center;justify-content:space-between;
}
.card-title .badge{
  font-family:var(--mono);font-size:0.65rem;font-weight:600;
  padding:2px 6px;border-radius:4px;
  background:var(--bg-3);color:var(--text-2);
  border:1px solid var(--border);
}
.card p{font-size:0.84rem;line-height:1.6;color:var(--text-2);margin:0}

.metric-row{padding:7px 0;border-bottom:1px solid var(--border)}
.metric-row:last-child{border-bottom:none}
.metric-top{display:flex;align-items:center;justify-content:space-between;font-size:0.8rem;margin-bottom:5px}
.metric-label{color:var(--text-2);font-weight:500}
.metric-value{font-family:var(--mono);font-size:0.8rem;font-weight:600}
.metric-value.good{color:var(--success)}
.metric-value.warn{color:var(--warn)}
.metric-value.bad{color:var(--danger)}
.metric-bar{height:4px;border-radius:2px;background:var(--bg-3);overflow:hidden}
.metric-fill{height:100%;border-radius:2px;transition:width .3s var(--ease-out)}
.metric-fill.good{background:var(--success)}
.metric-fill.warn{background:var(--warn)}
.metric-fill.bad{background:var(--danger)}

.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{
  font-family:var(--mono);font-size:0.7rem;
  padding:4px 8px;border-radius:5px;
  background:var(--bg-3);border:1px solid var(--border);color:var(--text-2);
}
.tag.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#f87171}
.tag.warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3);color:#fbbf24}

.empty{text-align:center;padding:48px 18px;color:var(--text-3)}
.empty svg{width:34px;height:34px;margin:0 auto 14px;opacity:.35}
.empty p{font-size:0.82rem;line-height:1.6;max-width:230px;margin:0 auto}

.sub-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 11px;border-radius:7px;
  border:1px solid var(--border);
  background:var(--bg-3);color:var(--text);
  font-size:0.82rem;text-align:left;
  transition:border-color .15s ease,transform .15s ease;
  margin-bottom:5px;
}
.sub-item:hover{border-color:var(--border-hi);transform:translateX(3px)}
.sub-item .pin{
  width:7px;height:7px;border-radius:1px;flex:none;
  transform:rotate(45deg);
  box-shadow:0 0 8px currentColor;
}
.sub-item-info{flex:1;min-width:0}
.sub-item-title{display:block;font-weight:600;color:var(--text);font-size:0.82rem}
.sub-item-sub{display:block;font-size:0.7rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-item .go{margin-left:auto;color:var(--text-3);font-family:var(--mono);font-size:0.72rem}

.progression-bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--bg-3);margin-bottom:10px;gap:3px}
.progression-step{flex:1;background:var(--border)}
.progression-step.past{background:var(--warn)}
.progression-step.current{background:var(--text)}
.progression-labels{display:flex;gap:3px;margin-bottom:12px;font-family:var(--mono);font-size:0.68rem;text-align:center;color:var(--text-3)}
.progression-labels span{flex:1}
.progression-labels span.active{color:var(--text);font-weight:700}

.scrim{
  position:fixed;inset:calc(var(--topbar-h) + var(--safe-top)) 0 0 0;
  background:rgba(0,0,0,.6);z-index:150;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.scrim.show{opacity:1;pointer-events:auto}
</style>
</head>

/* ================================================================
   DEEP SPACE AMBIENT STARFIELD (1 DRAW CALL)
   ================================================================ */
function createAmbientSpace() {
  const count = 700;
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 3.2 + Math.random() * 6.5;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i * 3 + 2] = r * Math.cos(phi);

    const c = new THREE.Color().setHSL(0.58 + Math.random() * 0.2, 0.7, 0.65);
    col[i * 3] = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.022,
    vertexColors: true,
    transparent: true,
    opacity: 0.45,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  scene.add(new THREE.Points(geo, mat));
}
createAmbientSpace();

/* ================================================================
   CLASSIFY POINT TO LOBE
   ================================================================ */
const LOBE_INDEX = { frontal: 0, parietal: 1, temporal: 2, occipital: 3, cerebellum: 4 };
const LOBE_COLORS = [
  new THREE.Color('#34d399'), // frontal
  new THREE.Color('#38bdf8'), // parietal
  new THREE.Color('#a855f7'), // temporal
  new THREE.Color('#eab308'), // occipital
  new THREE.Color('#ec4899')  // cerebellum
];

function classifyLobe(x, y, z) {
  if (y < -0.25 && z < -0.1) return 'cerebellum';
  if (z > 0.16) return 'frontal';
  if (z < -0.45 && y >= -0.25) return 'occipital';
  if (Math.abs(x) > 0.36 && y < 0.18 && z <= 0.22) return 'temporal';
  if (y >= 0.1) return 'parietal';
  return z >= 0 ? 'frontal' : 'temporal';
}

/* ================================================================
   GLB LOAD + HOLOGRAPHIC CORTEX + COSMIC DUST NEBULA
   ================================================================ */
const MODEL_URL = 'low-poly_human_brain_model.glb';
const modelLoaderEl = document.getElementById('modelLoader');
const loaderTextEl = document.getElementById('loaderText');

let nebulaPoints = null;
let nebulaUniforms = null;

const gltfLoader = new GLTFLoader();
gltfLoader.load(
  MODEL_URL,
  function(gltf) {
    const model = gltf.scene;

    const bbox = new THREE.Box3().setFromObject(model);
    const size = bbox.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 2.15 / maxDim;
    model.scale.setScalar(scale);

    model.position.set(0, 0, 0);
    const bbox2 = new THREE.Box3().setFromObject(model);
    const center2 = bbox2.getCenter(new THREE.Vector3());
    model.position.set(-center2.x, -center2.y, -center2.z);

    brainState.model = model;
    const finalBox = new THREE.Box3().setFromObject(model);
    brainState.size = finalBox.getSize(new THREE.Vector3());
    brainState.radius = brainState.size.length() * 0.5;
    brainState.loaded = true;

    // Bake lobe vertex colors into mesh & make it translucent holographic
    const vTemp = new THREE.Vector3();
    model.updateMatrixWorld(true);

    model.traverse(function(child) {
      if (child.isMesh && child.geometry) {
        brainState.surfaceMeshes.push(child);
        const posAttr = child.geometry.attributes.position;
        const count = posAttr.count;
        const colors = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
          vTemp.fromBufferAttribute(posAttr, i).applyMatrix4(child.matrixWorld);
          const lid = classifyLobe(vTemp.x, vTemp.y, vTemp.z);
          const c = LOBE_COLORS[LOBE_INDEX[lid]];
          colors[i * 3] = c.r * 0.55 + 0.15;
          colors[i * 3 + 1] = c.g * 0.55 + 0.15;
          colors[i * 3 + 2] = c.b * 0.55 + 0.2;
        }
        child.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        child.material = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.38,
          metalness: 0.3,
          transparent: true,
          opacity: 0.34,
          depthWrite: false
        });
      }
    });

    brainGroup.add(model);

    buildCosmicDustNebula();
    buildMarkers();
    buildLaserPathways();
    buildHtmlLabels();

    modelLoaderEl.classList.add('hidden');

    requestAnimationFrame(function() {
      resize();
      resetCamera();
    });
  },
  function(progress) {
    if (progress.total > 0) {
      loaderTextEl.textContent = T('loadingModel') + ' · ' + Math.round((progress.loaded / progress.total) * 100) + '%';
    }
  },
  function(error) {
    console.error('Model load error:', error);
    loaderTextEl.textContent = T('loadError');
    loaderTextEl.style.color = '#ef4444';
  }
);

/* ================================================================
   NEURO COSMOS DUST CLOUD (8,500 GPU PARTICLES IN 1 DRAW CALL)
   ================================================================ */
function buildCosmicDustNebula() {
  const sampled = [];
  const v = new THREE.Vector3();

  brainState.surfaceMeshes.forEach(function(mesh) {
    const pos = mesh.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
      sampled.push(v.clone());
    }
  });

  if (sampled.length === 0) return;

  const DUST_COUNT = 8500;
  const positions = new Float32Array(DUST_COUNT * 3);
  const colors = new Float32Array(DUST_COUNT * 3);
  const scales = new Float32Array(DUST_COUNT);
  const phases = new Float32Array(DUST_COUNT);
  const lobeIds = new Float32Array(DUST_COUNT);

  for (let i = 0; i < DUST_COUNT; i++) {
    const base = sampled[Math.floor(Math.random() * sampled.length)];
    // Volumetric scatter: mostly near cortex, some deeper inside nebula
    const depth = Math.random() < 0.78 ? (0.92 + Math.random() * 0.14) : (0.35 + Math.random() * 0.55);
    const jitter = 0.045;
    const px = base.x * depth + (Math.random() - 0.5) * jitter;
    const py = base.y * depth + (Math.random() - 0.5) * jitter;
    const pz = base.z * depth + (Math.random() - 0.5) * jitter;

    positions[i * 3] = px;
    positions[i * 3 + 1] = py;
    positions[i * 3 + 2] = pz;

    const lid = classifyLobe(px, py, pz);
    const lIdx = LOBE_INDEX[lid];
    const baseCol = LOBE_COLORS[lIdx];

    // Slight chromatic variation for cosmic nebula richness
    const mixWhite = Math.random() < 0.14 ? 0.55 : 0.0;
    colors[i * 3] = baseCol.r * (1 - mixWhite) + mixWhite;
    colors[i * 3 + 1] = baseCol.g * (1 - mixWhite) + mixWhite;
    colors[i * 3 + 2] = baseCol.b * (1 - mixWhite) + mixWhite;

    scales[i] = Math.random() < 0.12 ? (1.8 + Math.random() * 1.4) : (0.55 + Math.random() * 0.9);
    phases[i] = Math.random() * Math.PI * 2;
    lobeIds[i] = lIdx;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
  geo.setAttribute('aLobe', new THREE.BufferAttribute(lobeIds, 1));

  nebulaUniforms = {
    uTime: { value: 0 },
    uActiveLobe: { value: -1.0 },
    uDiseaseColor: { value: new THREE.Color(0xef4444) },
    uDiseaseMix: { value: 0.0 },
    uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) }
  };

  const mat = new THREE.ShaderMaterial({
    uniforms: nebulaUniforms,
    vertexShader: `
      attribute vec3 aColor;
      attribute float aScale;
      attribute float aPhase;
      attribute float aLobe;
      uniform float uTime;
      uniform float uActiveLobe;
      uniform vec3 uDiseaseColor;
      uniform float uDiseaseMix;
      uniform float uPixelRatio;
      varying vec3 vColor;
      varying float vAlpha;

      void main() {
        float pulse = 0.72 + 0.28 * sin(uTime * 2.2 + aPhase);
        float lobeMatch = (uActiveLobe < -0.5) ? 1.0 : (abs(aLobe - uActiveLobe) < 0.1 ? 1.35 : 0.18);

        vec3 finalCol = mix(aColor, uDiseaseColor, uDiseaseMix * 0.65);
        vColor = finalCol * (lobeMatch > 1.0 ? 1.25 : 1.0);
        vAlpha = pulse * lobeMatch;

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = (13.0 * aScale * pulse * uPixelRatio * (lobeMatch > 1.0 ? 1.2 : 1.0)) / -mvPosition.z;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;

      void main() {
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        float core = smoothstep(0.5, 0.0, d);
        float glow = pow(core, 1.7);
        gl_FragColor = vec4(vColor, glow * vAlpha * 0.85);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  nebulaPoints = new THREE.Points(geo, mat);
  brainGroup.add(nebulaPoints);
}

/* ================================================================
   SURFACE POINT & NORMAL
   ================================================================ */
const rayHelper = new THREE.Raycaster();

function getSurfaceHit(dirArray) {
  const dir = new THREE.Vector3(dirArray[0], dirArray[1], dirArray[2]).normalize();
  if (!brainState.loaded || brainState.surfaceMeshes.length === 0) {
    return { point: dir.clone().multiplyScalar(0.9), normal: dir.clone() };
  }

  rayHelper.set(new THREE.Vector3(0, 0, 0), dir);
  rayHelper.far = brainState.radius * 4;
  const hits = rayHelper.intersectObjects(brainState.surfaceMeshes, true);

  if (hits.length > 0) {
    const point = hits[0].point.clone();
    const normal = point.clone().normalize();
    return { point: point.add(normal.clone().multiplyScalar(0.012)), normal: normal };
  }
  return { point: dir.clone().multiplyScalar(brainState.radius * 0.9), normal: dir.clone() };
}

/* ================================================================
   STRUCTURAL CORTICAL BEACONS (NO SPHERES!)
   ================================================================ */
const subzoneGroup = new THREE.Group();
brainGroup.add(subzoneGroup);
const subzoneAnchors = {};
const subzoneHitProxies = [];

const outerRingGeo = new THREE.RingGeometry(0.036, 0.044, 32);
const innerRingGeo = new THREE.RingGeometry(0.014, 0.02, 24);
const hitProxyGeo = new THREE.PlaneGeometry(0.11, 0.11);

function buildMarkers() {
  SUBZONES.forEach(function(sz) {
    const hit = getSurfaceHit(sz.dir);
    const color = new THREE.Color(sz.color);

    const anchor = new THREE.Group();
    anchor.position.copy(hit.point);
    anchor.lookAt(hit.point.clone().add(hit.normal));

    // Outer technical reticle ring
    const ringMat = new THREE.MeshBasicMaterial({
      color: color,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const outerRing = new THREE.Mesh(outerRingGeo, ringMat);
    anchor.add(outerRing);

    // Inner core ring
    const innerMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const innerRing = new THREE.Mesh(innerRingGeo, innerMat);
    anchor.add(innerRing);

    // Normal vector laser spike protruding from cortex
    const beamPts = [new THREE.Vector3(0, 0, -0.02), new THREE.Vector3(0, 0, 0.085)];
    const beamGeo = new THREE.BufferGeometry().setFromPoints(beamPts);
    const beamMat = new THREE.LineBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });
    const beamLine = new THREE.Line(beamGeo, beamMat);
    anchor.add(beamLine);

    // Invisible hit proxy for effortless clicking/hovering
    const proxyMat = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
    const proxy = new THREE.Mesh(hitProxyGeo, proxyMat);
    proxy.userData = { type: 'subzone', id: sz.id };
    anchor.add(proxy);
    subzoneHitProxies.push(proxy);

    subzoneGroup.add(anchor);
    subzoneAnchors[sz.id] = {
      group: anchor,
      outerRing: outerRing,
      innerRing: innerRing,
      beamLine: beamLine,
      color: color,
      region: sz.region
    };
  });
}

/* ================================================================
   RAY-LIKE LASER TUNNELS & GPU COMET STREAKS
   ================================================================ */
const pathwaysGroup = new THREE.Group();
brainGroup.add(pathwaysGroup);
const pathwayData = [];
let impulseBeamSystem = null;
let impulseUniforms = null;

function buildLaserPathways() {
  const streakPositions = [];
  const streakColors = [];
  const streakProgress = [];
  const streakSpeeds = [];
  const streakOffsets = [];

  PATHWAYS.forEach(function(pair, idx) {
    const aId = pair[0];
    const bId = pair[1];
    const ancA = subzoneAnchors[aId];
    const ancB = subzoneAnchors[bId];
    if (!ancA || !ancB) return;

    const a = ancA.group.position.clone();
    const b = ancB.group.position.clone();
    // Deep white-matter arc
    const mid = a.clone().add(b).multiplyScalar(0.5).multiplyScalar(0.48);

    const curve = new THREE.CatmullRomCurve3([a, mid, b]);
    const cA = ancA.color;
    const cB = ancB.color;

    // Multi-strand laser tunnel (3 braided filaments per tract)
    const strandGroup = new THREE.Group();
    for (let s = 0; s < 3; s++) {
      const pts = curve.getPoints(44);
      const posArr = new Float32Array(pts.length * 3);
      const colArr = new Float32Array(pts.length * 3);

      for (let i = 0; i < pts.length; i++) {
        const u = i / (pts.length - 1);
        const env = Math.sin(u * Math.PI);
        const angle = u * Math.PI * 4 + (s * Math.PI * 2) / 3;
        const spread = s === 0 ? 0 : 0.008 * env;

        posArr[i * 3] = pts[i].x + Math.cos(angle) * spread;
        posArr[i * 3 + 1] = pts[i].y + Math.sin(angle) * spread;
        posArr[i * 3 + 2] = pts[i].z;

        const c = cA.clone().lerp(cB, u);
        colArr[i * 3] = c.r;
        colArr[i * 3 + 1] = c.g;
        colArr[i * 3 + 2] = c.b;
      }

      const lGeo = new THREE.BufferGeometry();
      lGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      lGeo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
      const lMat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: s === 0 ? 0.55 : 0.22,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      strandGroup.add(new THREE.Line(lGeo, lMat));
    }

    pathwaysGroup.add(strandGroup);
    pathwayData.push({ group: strandGroup, a: aId, b: bId });

    // Sample dense points along curve for GPU ray-comet impulses
    const SAMPLES = 90;
    const curvePts = curve.getPoints(SAMPLES);
    const speed = 0.28 + (idx % 4) * 0.05;
    const offset = idx * 0.17;

    for (let i = 0; i <= SAMPLES; i++) {
      const u = i / SAMPLES;
      streakPositions.push(curvePts[i].x, curvePts[i].y, curvePts[i].z);
      const c = cA.clone().lerp(cB, u);
      streakColors.push(c.r, c.g, c.b);
      streakProgress.push(u);
      streakSpeeds.push(speed);
      streakOffsets.push(offset);
    }
  });

  const streakGeo = new THREE.BufferGeometry();
  streakGeo.setAttribute('position', new THREE.Float32BufferAttribute(streakPositions, 3));
  streakGeo.setAttribute('aColor', new THREE.Float32BufferAttribute(streakColors, 3));
  streakGeo.setAttribute('aProgress', new THREE.Float32BufferAttribute(streakProgress, 1));
  streakGeo.setAttribute('aSpeed', new THREE.Float32BufferAttribute(streakSpeeds, 1));
  streakGeo.setAttribute('aOffset', new THREE.Float32BufferAttribute(streakOffsets, 1));

  impulseUniforms = {
    uTime: { value: 0 },
    uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
    uDiseaseColor: { value: new THREE.Color(0xef4444) },
    uDiseaseMix: { value: 0.0 }
  };

  const streakMat = new THREE.ShaderMaterial({
    uniforms: impulseUniforms,
    vertexShader: `
      attribute vec3 aColor;
      attribute float aProgress;
      attribute float aSpeed;
      attribute float aOffset;
      uniform float uTime;
      uniform float uPixelRatio;
      uniform vec3 uDiseaseColor;
      uniform float uDiseaseMix;
      varying vec3 vColor;
      varying float vIntensity;

      void main() {
        // Two counter-propagating laser pulses per tunnel
        float head1 = fract(uTime * aSpeed + aOffset);
        float dist1 = fract(head1 - aProgress);
        float trail1 = smoothstep(0.22, 0.0, dist1);

        float head2 = fract(uTime * aSpeed + aOffset + 0.5);
        float dist2 = fract(head2 - aProgress);
        float trail2 = smoothstep(0.22, 0.0, dist2);

        float intensity = max(trail1, trail2);
        vIntensity = pow(intensity, 1.5);

        vec3 baseCol = mix(aColor, uDiseaseColor, uDiseaseMix);
        // Bright white-hot laser tip
        vColor = mix(baseCol, vec3(1.0), pow(intensity, 3.0) * 0.75);

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = (18.0 * vIntensity * uPixelRatio + 2.0) / -mvPosition.z;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vIntensity;

      void main() {
        if (vIntensity < 0.02) discard;
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        float glow = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vColor, glow * vIntensity * 0.95);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  impulseBeamSystem = new THREE.Points(streakGeo, streakMat);
  pathwaysGroup.add(impulseBeamSystem);
}

   HTML LABELS (GPU TRANSLATE3D)

const labelsLayer = document.getElementById('labelsLayer');

  labelsLayer.innerHTML = '';

/* ================================================================
   RESIZE
   ================================================================ */
let vpWidth = 1;
let vpHeight = 1;

function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  if (w === 0 || h === 0) return;
  vpWidth = w;
  vpHeight = h;

  renderer.setSize(w, h, false);
  camera.aspect = w / h;

  const aspect = w / h;
  if (aspect < 0.55) camera.fov = 62;
  else if (aspect < 0.8) camera.fov = 54;
  else if (aspect < 1.2) camera.fov = 46;
  else camera.fov = 39;

  camera.updateProjectionMatrix();
}

if (window.ResizeObserver) {
  new ResizeObserver(function() {
    requestAnimationFrame(resize);
  }).observe(viewport);
} else {
  window.addEventListener('resize', resize);
}

/* ================================================================
   STATE
   ================================================================ */
const state = {
  selectedRegion: null,
  selectedSubzone: null,
  hoveredRegion: null,
  hoveredSubzone: null,
  currentDisease: null,
  severity: 50,
  chips: { nebula: true, impulses: true, labels: true, rotate: false }
};
let camTween = null;

/* ================================================================
   CAMERA
   ================================================================ */
function resetCamera() {
  const aspect = vpWidth / vpHeight;
  const radius = brainState.radius || 1;

  let d;
  if (aspect < 0.6) d = radius * 3.2;
  else if (aspect < 0.85) d = radius * 2.75;
  else if (aspect < 1.25) d = radius * 2.3;
  else d = radius * 2.0;

  d = Math.max(1.65, Math.min(6.0, d));

  controls.minDistance = radius * 1.2;
  controls.maxDistance = radius * 5.0;

  camTween = {
    from: camera.position.clone(),
    to: new THREE.Vector3(0, 0.12, d),
    fromT: controls.target.clone(),
    toT: new THREE.Vector3(0, 0, 0),
    t: 0
  };
}

document.getElementById('resetCamBtn').addEventListener('click', function() {
  state.selectedRegion = null;
  state.selectedSubzone = null;
  applyHighlight();
  renderAnalytics();
  updateRegionListUI();
  resetCamera();
});

function focusOn(point) {
  const worldPt = point.clone().applyMatrix4(brainGroup.matrixWorld);
  const dir = worldPt.normalize();
  const radius = brainState.radius || 1;
  const dist = Math.max(radius * 1.8, 1.7);
  camTween = {
    from: camera.position.clone(),
    to: dir.multiplyScalar(dist),
    fromT: controls.target.clone(),
    toT: new THREE.Vector3(0, 0, 0),
    t: 0
  };
}

/* ================================================================
   RAYCASTING
   ================================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function updatePointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function raycastBeacons() {
  raycaster.setFromCamera(pointer, camera);
  const activeProxies = subzoneHitProxies.filter(function(p) {
    return p.parent && p.parent.visible;
  });
  return raycaster.intersectObjects(activeProxies, false);
}

let downPos = null;
canvas.addEventListener('pointerdown', function(e) {
  downPos = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('pointermove', function(e) {
  if (downPos) return;
  updatePointer(e);
  const hits = raycastBeacons();
  if (hits.length > 0) {
    const id = hits[0].object.userData.id;
    if (state.hoveredSubzone !== id) {
      state.hoveredSubzone = id;
      canvas.style.cursor = 'pointer';
    }
  } else if (state.hoveredSubzone) {
    state.hoveredSubzone = null;
    canvas.style.cursor = 'grab';
  }
});

canvas.addEventListener('pointerup', function(e) {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 10) return;

  updatePointer(e);
  const hits = raycastBeacons();

  if (!hits.length) {
    if (state.selectedSubzone || state.selectedRegion) {
      state.selectedSubzone = null;
      state.selectedRegion = null;
      state.currentDisease = null;
      applyHighlight();
      renderAnalytics();
      updateRegionListUI();
      updateDiseaseListUI();
      updateSeverityUI();
    }
    return;
  }

  const id = hits[0].object.userData.id;
  if (id) onZoneClick(id);
});

/* ================================================================
   ZONE CLICK & HIGHLIGHT
   ================================================================ */
function onZoneClick(id) {
  const sz = SUBZONES.find(function(s) { return s.id === id; });
  if (!sz) return;
  state.selectedSubzone = id;
  state.selectedRegion = sz.region;
  state.currentDisease = null;
  if (subzoneAnchors[id]) focusOn(subzoneAnchors[id].group.position.clone());
  applyHighlight();
  renderAnalytics();
  updateRegionListUI();
  updateDiseaseListUI();
  updateSeverityUI();
}

function applyHighlight() {
  const activeRegion = state.selectedRegion || state.hoveredRegion;

  if (nebulaUniforms) {
    nebulaUniforms.uActiveLobe.value = activeRegion ? LOBE_INDEX[activeRegion] : -1.0;
  }

  Object.keys(subzoneAnchors).forEach(function(id) {
    const anc = subzoneAnchors[id];
    const on = !activeRegion || anc.region === activeRegion;
    anc.group.visible = on;
  });

  pathwayData.forEach(function(pw) {
    if (!state.chips.impulses) {
      pw.group.visible = false;
      return;
    }
    pw.group.visible = true;
    const isConn = !state.selectedSubzone || pw.a === state.selectedSubzone || pw.b === state.selectedSubzone;
    pw.group.children.forEach(function(line, idx) {
      line.material.opacity = isConn ? (idx === 0 ? 0.72 : 0.3) : 0.08;
    });
  });

  Object.keys(htmlLabels).forEach(function(id) {
    if (state.selectedSubzone === id) htmlLabels[id].classList.add('active');
    else htmlLabels[id].classList.remove('active');
  });

  const fv = document.getElementById('focusValue');
  if (state.selectedSubzone) {
    const sz = SUBZONES.find(function(s) { return s.id === state.selectedSubzone; });
    fv.textContent = sz[LANG].full;
  } else if (activeRegion) {
    fv.textContent = REGIONS[activeRegion][LANG].name;
  } else {
    fv.textContent = T('fullBrain');
  }
}

/* ================================================================
   DISEASE EFFECTS
   ================================================================ */
function applyDiseaseToBrain() {
  const d = state.currentDisease;
  const sev = state.severity / 100;

  if (nebulaUniforms) {
    if (d) {
      nebulaUniforms.uDiseaseColor.value.setHex(d.hex);
      nebulaUniforms.uDiseaseMix.value = sev;
    } else {
      nebulaUniforms.uDiseaseMix.value = 0.0;
    }
  }

  if (impulseUniforms) {
    if (d) {
      impulseUniforms.uDiseaseColor.value.setHex(d.hex);
      impulseUniforms.uDiseaseMix.value = sev * 0.85;
    } else {
      impulseUniforms.uDiseaseMix.value = 0.0;
    }
  }

  const affectedSet = {};
  if (d) d.affected.forEach(function(id) { affectedSet[id] = true; });

  Object.keys(subzoneAnchors).forEach(function(id) {
    const anc = subzoneAnchors[id];
    if (!d) {
      anc.group.visible = true;
      anc.outerRing.material.color.copy(anc.color);
    } else if (affectedSet[id]) {
      anc.group.visible = true;
      anc.outerRing.material.color.setHex(d.hex);
    } else {
      anc.group.visible = false;
    }
  });
}

/* ================================================================
   PROJECT 3D TO 2D (GPU TRANSLATE3D)
   ================================================================ */
const _v = new THREE.Vector3();

function projectLabels() {
  const w = vpWidth;
  const h = vpHeight;
  const active = state.selectedRegion || state.hoveredRegion;

  const isWide = w >= 1150;
  const MAIN = isWide
    ? { m1: 1, s1: 1, wern: 1, v1: 1, pfc: 1, broca: 1, hip: 1, a1: 1 }
    : { m1: 1, s1: 1, wern: 1, v1: 1, pfc: 1 };

  const isSmall = w < 500;
  const pad = isSmall ? 46 : 70;
  const pushAmt = isSmall ? 50 : (isWide ? 84 : 68);

  Object.keys(htmlLabels).forEach(function(id) {
    const el = htmlLabels[id];
    const anc = subzoneAnchors[id];
    if (!anc || !anc.group.visible) {
      el.classList.add('hidden');
      return;
    }

    const sz = SUBZONES.find(function(s) { return s.id === id; });
    const isMain = MAIN[id];
    const isActive = active && sz.region === active;
    const isSelected = state.selectedSubzone === id;
    const isHovered = state.hoveredSubzone === id;

    const shouldShow = state.chips.labels && (isSelected || isHovered || isActive || (!active && isMain));
    if (!shouldShow) {
      el.classList.add('hidden');
      return;
    }

    anc.group.getWorldPosition(_v);
    _v.y += 0.06;
    _v.project(camera);

    if (_v.z > 1) {
      el.classList.add('hidden');
      return;
    }

    el.classList.remove('hidden');

    let x = (_v.x * 0.5 + 0.5) * w;
    let y = (-_v.y * 0.5 + 0.5) * h;

    const cx = w * 0.5;
    const cy = h * 0.5;
    const dx = x - cx;
    const dy = y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const push = Math.min(pushAmt, 26 + dist * 0.32);
    x += (dx / dist) * push;
    y += (dy / dist) * push;

    x = Math.max(pad, Math.min(w - pad, x));
    y = Math.max(34, Math.min(h - 34, y));

    const scale = (isSelected || isHovered) ? 1.07 : 1;
    el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + scale + ')';
  });
}

/* ================================================================
   ANIMATION LOOP & FPS TELEMETRY
   ================================================================ */
const clock = new THREE.Clock();
const fpsEl = document.getElementById('fpsCounter');
let frameCount = 0;
let fpsAccum = 0;

function animate() {
  requestAnimationFrame(animate);
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  const t = clock.elapsedTime;

  frameCount++;
  fpsAccum += rawDt;
  if (fpsAccum >= 0.5) {
    if (fpsEl) fpsEl.textContent = Math.round(frameCount / fpsAccum) + ' FPS';
    frameCount = 0;
    fpsAccum = 0;
  }

  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 2.4);
    const e = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }

  if (nebulaUniforms) nebulaUniforms.uTime.value = t;
  if (impulseUniforms) impulseUniforms.uTime.value = t;

  Object.keys(subzoneAnchors).forEach(function(id) {
    const anc = subzoneAnchors[id];
    if (!anc.group.visible) return;
    const isSel = state.selectedSubzone === id;
    const isHov = state.hoveredSubzone === id;
    const pulse = 1 + Math.sin(t * 3.0 + id.length) * 0.12;
    const s = isSel ? pulse * 1.55 : (isHov ? pulse * 1.3 : pulse);
    anc.outerRing.scale.setScalar(s);
    anc.outerRing.rotation.z = t * 0.8;
  });

  if (state.chips.rotate && brainState.loaded) {
    brainGroup.rotation.y += dt * 0.2;
  }

  controls.update();
  renderer.render(scene, camera);
  projectLabels();
}

/* ================================================================
   UI - STRUCTURAL REGION LIST
   ================================================================ */
function renderRegionList() {
  const el = document.getElementById('regionList');
  el.innerHTML = '';
  Object.keys(REGIONS).forEach(function(rid) {
    const r = REGIONS[rid];
    const btn = document.createElement('button');
    btn.className = 'region-item';
    btn.dataset.region = r.id;
    btn.style.setProperty('--r-color', r.color);
    btn.innerHTML =
      '<div class="region-top">' +
        '<div class="region-title-wrap">' +
          '<span class="region-glyph"></span>' +
          '<span class="region-name">' + r[LANG].name + '</span>' +
        '</div>' +
        '<span class="region-ba">' + r.ba + '</span>' +
      '</div>' +
      '<div class="region-sub">' +
        '<span>' + r[LANG].short + '</span>' +
        '<span class="region-neurons">' + r.neurons + '</span>' +
      '</div>' +
      '<div class="region-bar"><div class="region-bar-fill" style="width:' + r.share + '%"></div></div>';

    btn.addEventListener('pointerenter', function() {
      if (!state.selectedRegion) {
        state.hoveredRegion = r.id;
        applyHighlight();
      }
    });
    btn.addEventListener('pointerleave', function() {
      if (state.hoveredRegion === r.id) {
        state.hoveredRegion = null;
        applyHighlight();
      }
    });
    btn.addEventListener('click', function() {
      state.selectedRegion = (state.selectedRegion === r.id) ? null : r.id;
      state.selectedSubzone = null;
      state.currentDisease = null;
      if (state.selectedRegion) {
        const hit = getSurfaceHit(r.dir);
        focusOn(hit.point);
      } else {
        resetCamera();
      }
      applyHighlight();
      renderAnalytics();
      updateRegionListUI();
      updateDiseaseListUI();
      updateSeverityUI();
      closeMobilePanels();
    });
    el.appendChild(btn);
  });
  updateRegionListUI();
}

function updateRegionListUI() {
  document.querySelectorAll('.region-item').forEach(function(el) {
    if (el.dataset.region === state.selectedRegion) el.classList.add('active');
    else el.classList.remove('active');
  });
}

/* ================================================================
   UI - DISEASE LIST
   ================================================================ */
function renderDiseaseList() {
  const el = document.getElementById('diseaseList');
  el.innerHTML = '';

  const h = document.createElement('button');
  h.className = 'disease-item';
  h.dataset.disease = 'healthy';
  h.style.setProperty('--d-color', '#10b981');
  h.innerHTML =
    '<span class="disease-icon" style="background:linear-gradient(135deg,#10b981,#059669)">+</span>' +
    '<span class="disease-body">' +
      '<span class="disease-name">' + T('healthy') + '</span>' +
      '<span class="disease-desc">' + T('healthyDesc') + '</span>' +
    '</span>';
  h.addEventListener('click', function() { selectDisease(null); });
  el.appendChild(h);

  DISEASES.forEach(function(d) {
    const btn = document.createElement('button');
    btn.className = 'disease-item';
    btn.dataset.disease = d.id;
    btn.style.setProperty('--d-color', d.color);
    btn.innerHTML =
      '<span class="disease-icon">' + d.icon + '</span>' +
      '<span class="disease-body">' +
        '<span class="disease-name">' + d[LANG].name + '</span>' +
        '<span class="disease-desc">' + d[LANG].short + '</span>' +
      '</span>';
    btn.addEventListener('click', function() { selectDisease(d.id); });
    el.appendChild(btn);
  });
  updateDiseaseListUI();
}

function updateDiseaseListUI() {
  const active = state.currentDisease ? state.currentDisease.id : 'healthy';
  document.querySelectorAll('.disease-item').forEach(function(el) {
    if (el.dataset.disease === active) el.classList.add('active');
    else el.classList.remove('active');
  });
}

function selectDisease(id) {
  if (id) {
    state.currentDisease = DISEASES.find(function(d) { return d.id === id; });
    state.selectedRegion = null;
    state.selectedSubzone = null;
    setStatus('alert', T('alert'));
    document.getElementById('severityContainer').style.display = 'block';
    applySeverity(state.severity);
  } else {
    state.currentDisease = null;
    setStatus('ready', T('ready'));
    document.getElementById('severityContainer').style.display = 'none';
    applyDiseaseToBrain();
    applyHighlight();
  }
  updateDiseaseListUI();
  updateRegionListUI();
  renderAnalytics();
  closeMobilePanels();
}

/* ================================================================
   SEVERITY
   ================================================================ */
function updateSeverityUI() {
  document.getElementById('severityContainer').style.display = state.currentDisease ? 'block' : 'none';
}

function applySeverity(value) {
  state.severity = value;
  const slider = document.getElementById('severitySlider');
  const valEl = document.getElementById('severityValue');
  const stages = document.getElementById('severityStages');

  slider.value = value;
  slider.style.setProperty('--p', value + '%');
  valEl.textContent = value + '%';

  const idx = Math.min(3, Math.floor(value / 25));
  const children = stages.children;
  for (let i = 0; i < children.length; i++) {
    if (i === idx) children[i].classList.add('active');
    else children[i].classList.remove('active');
  }

  applyDiseaseToBrain();
  renderAnalytics();
}

document.getElementById('severitySlider').addEventListener('input', function(e) {
  applySeverity(+e.target.value);
});

/* ================================================================
   ANALYTICS PANEL
   ================================================================ */
function renderAnalytics() {
  const el = document.getElementById('analyticsContent');

  if (state.currentDisease) { renderDiseaseAnalytics(el); return; }
  if (state.selectedSubzone) { renderSubzoneAnalytics(el); return; }
  if (state.selectedRegion) { renderRegionAnalytics(el); return; }

  el.innerHTML =
    '<div class="empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">' +
        '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>' +
      '</svg>' +
      '<p><strong>' + T('emptyTitle') + '</strong><br><br>' + T('emptyText') + '</p>' +
    '</div>';
}

  const r = REGIONS[state.selectedRegion];

  const subs = SUBZONES.filter(function(s) { return s.region === r.id; });

  el.innerHTML =

      '<span class="ba-badge" style="border-color:' + r.color + '">' + r.ba + '</span>' +
    '</div>' +
    '<div class="card" style="border-left:3px solid ' + r.color + '">' +
      '<div class="card-title">' + T('anatomy') + '</div>' +
      '<p>' + d.desc + '</p>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">' + T('functions') + '</div>' +
      '<div class="tags">' + d.functions.map(function(f) { return '<span class="tag">' + f + '</span>'; }).join('') + '</div>' +
    '</div>' +
    (subs.length ? (
      '<div class="card">' +
        '<div class="card-title">' + T('subzones') + '<span class="badge">' + subs.length + '</span></div>' +
        subs.map(function(s) {
          return '<button class="sub-item" data-sub="' + s.id + '">' +
            '<span class="pin" style="background:' + s.color + ';color:' + s.color + '"></span>' +
            '<span class="sub-item-info">' +
              '<span class="sub-item-title">' + s[LANG].full + '</span>' +
              '<span class="sub-item-sub">' + s.ba + ' · ' + s[LANG].note + '</span>' +
            '</span>' +
            '<span class="go">→</span>' +
          '</button>';
        }).join('') +

  el.querySelectorAll('.sub-item').forEach(function(btn) {
    btn.addEventListener('click', function() {
      onZoneClick(btn.dataset.sub);
    });

}

function renderSubzoneAnalytics(el) {
  const sz = SUBZONES.find(function(s) { return s.id === state.selectedSubzone; });
  if (!sz) return;
  const d = sz[LANG];
  const region = REGIONS[sz.region];

  const connectedIds = [];
  PATHWAYS.forEach(function(pair) {
    if (pair[0] === sz.id) connectedIds.push(pair[1]);
    else if (pair[1] === sz.id) connectedIds.push(pair[0]);
  });
  const connectedZones = connectedIds.map(function(cid) {
    return SUBZONES.find(function(s) { return s.id === cid; });
  }).filter(Boolean);

  el.innerHTML =
    '<button class="back-btn" id="backToLobeBtn">← ' + T('backToLobe') + ' (' + region[LANG].name + ')</button>' +
    '<div class="analytics-header">' +
      '<div><h2>' + d.full + '</h2><span class="subtitle">' + region[LANG].name + ' · ' + region[LANG].latin + '</span></div>' +
      '<span class="ba-badge" style="border-color:' + sz.color + '">' + sz.ba + '</span>' +
    '</div>' +
    '<div class="card" style="border-left:3px solid ' + sz.color + '">' +
      '<div class="card-title">' + T('anatomy') + '</div>' +
      '<p>' + d.note + '</p>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">' + T('functions') + '</div>' +
      '<div class="tags">' + region[LANG].functions.map(function(f) { return '<span class="tag">' + f + '</span>'; }).join('') + '</div>' +
    '</div>' +
    (connectedZones.length ? (
      '<div class="card">' +
        '<div class="card-title">' + T('connections') + '<span class="badge">' + connectedZones.length + '</span></div>' +
        connectedZones.map(function(csz) {
          return '<button class="sub-item" data-sub="' + csz.id + '">' +
            '<span class="pin" style="background:' + csz.color + ';color:' + csz.color + '"></span>' +
            '<span class="sub-item-info">' +
              '<span class="sub-item-title">' + csz[LANG].full + '</span>' +
              '<span class="sub-item-sub">' + csz.ba + ' · ' + REGIONS[csz.region][LANG].name + '</span>' +
            '</span>' +
            '<span class="go">→</span>' +
          '</button>';
        }).join('') +
      '</div>'
    ) : '');

  const backBtn = document.getElementById('backToLobeBtn');
  if (backBtn) {
    backBtn.addEventListener('click', function() {
      state.selectedSubzone = null;
      const hit = getSurfaceHit(region.dir);
      focusOn(hit.point);
      applyHighlight();
      renderAnalytics();
    });
  }

  el.querySelectorAll('.sub-item').forEach(function(btn) {
    btn.addEventListener('click', function() {
      onZoneClick(btn.dataset.sub);
    });
  });
}

function renderDiseaseAnalytics(el) {
  const d = state.currentDisease;
  const data = d[LANG];
  const sev = state.severity;
  const stageIdx = Math.min(3, Math.floor(sev / 25));
  const stageLabels = ['I', 'II', 'III', 'IV'];
  const stageLabel = stageLabels[stageIdx];

  const affectedZones = d.affected.map(function(id) {
    return SUBZONES.find(function(s) { return s.id === id; });
  }).filter(Boolean);

  const metricMap = [
    ['cognitive', 'metricCognitive'],
    ['motor', 'metricMotor'],
    ['language', 'metricLanguage'],
    ['sensory', 'metricSensory'],
    ['memory', 'metricMemory'],
    ['connectivity', 'metricConnectivity']
  ];

  const metricsHtml = metricMap.map(function(pair) {
    const key = pair[0];
    const labelKey = pair[1];
    const base = d.en.metrics[key];
    const impairment = 1 - base;
    const current = Math.max(0, base - impairment * (sev / 100));
    const pct = Math.round(current * 100);
    const cls = current > 0.72 ? 'good' : (current > 0.45 ? 'warn' : 'bad');
    return '<div class="metric-row">' +
      '<div class="metric-top">' +
        '<span class="metric-label">' + T(labelKey) + '</span>' +
        '<span class="metric-value ' + cls + '">' + pct + '%</span>' +
      '</div>' +
      '<div class="metric-bar"><div class="metric-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }).join('');

  const progBar = data.stages.map(function(_, i) {
    const cls = i === stageIdx ? 'current' : (i < stageIdx ? 'past' : '');
    return '<div class="progression-step ' + cls + '"></div>';
  }).join('');

  const progLabels = data.stages.map(function(_, i) {
    return '<span class="' + (i === stageIdx ? 'active' : '') + '">' + (i + 1) + '</span>';
  }).join('');

  el.innerHTML =
    '<div class="analytics-header"><div><h2>' + data.name + '</h2><span class="subtitle">' + data.short + '</span></div></div>' +
    '<div class="card" style="border-left:3px solid ' + d.color + '">' +
      '<div class="card-title">Stage ' + stageLabel + '<span class="badge">' + sev + '%</span></div>' +
      '<p>' + data.desc + '</p></div>' +
    '<div class="card"><div class="card-title">' + T('progression') + '</div>' +
      '<div class="progression-bar">' + progBar + '</div>' +
      '<div class="progression-labels">' + progLabels + '</div>' +
      '<p style="font-size:0.84rem"><strong>' + data.stages[stageIdx] + '</strong></p></div>' +
    '<div class="card"><div class="card-title">' + T('mechanism') + '</div><p>' + data.mechanism + '</p></div>' +
    '<div class="card"><div class="card-title">' + T('affected') + '</div>' +
      affectedZones.map(function(sz) {
        return '<button class="sub-item" data-sub="' + sz.id + '">' +
          '<span class="pin" style="background:' + d.color + ';color:' + d.color + '"></span>' +
          '<span class="sub-item-info">' +
            '<span class="sub-item-title">' + sz[LANG].full + '</span>' +
            '<span class="sub-item-sub">' + sz.ba + '</span>' +
          '</span>' +
          '<span class="go">→</span>' +
        '</button>';
      }).join('') +
    '</div>' +
    '<div class="card"><div class="card-title">' + T('neuro') + '</div>' +
      '<div class="tags">' + data.neuro.map(function(n) { return '<span class="tag warn">' + n + '</span>'; }).join('') + '</div></div>' +
    '<div class="card"><div class="card-title">' + T('symptoms') + '</div>' +
      '<div class="tags">' + data.symptoms.map(function(s) { return '<span class="tag danger">' + s + '</span>'; }).join('') + '</div></div>' +
    '<div class="card"><div class="card-title">' + T('metrics') + '</div>' + metricsHtml + '</div>';

  el.querySelectorAll('.sub-item').forEach(function(btn) {
    btn.addEventListener('click', function() {
      onZoneClick(btn.dataset.sub);
    });
  });
}

/* ================================================================
   STATUS & CHIPS
   ================================================================ */
function setStatus(type, text) {
  const el = document.getElementById('statusIndicator');
  el.className = 'status-indicator' + (type === 'alert' ? ' danger' : '');
  el.textContent = text;
}

document.querySelectorAll('.chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    const key = chip.dataset.toggle;
    state.chips[key] = !state.chips[key];
    chip.classList.toggle('on', state.chips[key]);

    if (key === 'nebula' && nebulaPoints) {
      nebulaPoints.visible = state.chips.nebula;
    }
    if (key === 'impulses') {
      if (impulseBeamSystem) impulseBeamSystem.visible = state.chips.impulses;
      pathwayData.forEach(function(pw) { pw.group.visible = state.chips.impulses; });
    }
    if (key === 'labels') {
      projectLabels();
    }
  });
});

/* ================================================================
   THEME & LANGUAGE
   ================================================================ */
function setTheme(theme, save) {
  if (save === undefined) save = true;
  document.documentElement.setAttribute('data-theme', theme);
  const icon = document.getElementById('themeIcon');
  if (theme === 'light') {
    icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  } else {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
  if (save) {
    try { localStorage.setItem('nm-theme', theme); } catch (e) {}
  }
}

document.getElementById('themeBtn').addEventListener('click', function() {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
});

function setLanguage(lang) {
  LANG = lang;
  document.documentElement.setAttribute('data-lang', lang);

  document.getElementById('chipNebula').textContent = T('nebula');
  document.getElementById('chipImpulses').textContent = T('impulses');
  document.getElementById('chipLabels').textContent = T('labels');
  document.getElementById('chipRotate').textContent = T('rotate');
  document.getElementById('focusTag').textContent = T('focus');
  document.getElementById('lobesTitle').textContent = T('lobes');
  document.getElementById('diseasesTitle').textContent = T('diseases');
  document.getElementById('severityLabel').textContent = T('severity');
  document.getElementById('leftTitle').textContent = T('atlas');
  document.getElementById('rightTitle').textContent = T('analytics');
  document.getElementById('statTotal').textContent = T('statTotal');
  document.getElementById('statCortex').textContent = T('statCortex');
  document.getElementById('statCereb').textContent = T('statCereb');
  setStatus(state.currentDisease ? 'alert' : 'ready', state.currentDisease ? T('alert') : T('ready'));

  Object.keys(htmlLabels).forEach(function(id) {
    const el = htmlLabels[id];
    const sz = SUBZONES.find(function(s) { return s.id === id; });
    if (sz) {
      const nameEl = el.querySelector('.lname');
      if (nameEl) nameEl.textContent = sz[LANG].name;
    }
  });

  renderRegionList();
  renderDiseaseList();
  applyHighlight();
  renderAnalytics();
}

document.querySelectorAll('.lang-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    setLanguage(btn.dataset.lang);
  });
});

/* ================================================================
   MOBILE PANELS
   ================================================================ */
const panelLeft = document.getElementById('panelLeft');
const panelRight = document.getElementById('panelRight');
const scrim = document.getElementById('scrim');

function openLeftPanel() {
  panelLeft.classList.add('open');
  panelRight.classList.remove('open');
  scrim.classList.add('show');
}
function openRightPanel() {
  panelRight.classList.add('open');
  panelLeft.classList.remove('open');
  scrim.classList.add('show');
}
function closeMobilePanels() {
  panelLeft.classList.remove('open');
  panelRight.classList.remove('open');
  scrim.classList.remove('show');
}

document.getElementById('menuBtn').addEventListener('click', openLeftPanel);
document.getElementById('panelBtn').addEventListener('click', openRightPanel);
document.getElementById('closeLeft').addEventListener('click', closeMobilePanels);
document.getElementById('closeRight').addEventListener('click', closeMobilePanels);
scrim.addEventListener('click', closeMobilePanels);

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeMobilePanels();
    state.selectedRegion = null;
    state.selectedSubzone = null;
    applyHighlight();
    renderAnalytics();
    updateRegionListUI();
    resetCamera();
  }
});

/* ================================================================
   INIT
   ================================================================ */
function init() {
  let savedTheme = 'dark';
  try {
    const stored = localStorage.getItem('nm-theme');
    if (stored === 'light' || stored === 'dark') savedTheme = stored;
  } catch (e) {}
  setTheme(savedTheme, false);
  setLanguage('ru');

  resize();
  animate();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
