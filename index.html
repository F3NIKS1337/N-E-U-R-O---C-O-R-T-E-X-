<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NeuroCortex — интерактивный атлас коры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#6750A4; --on-primary:#fff;
  --primary-container:#EADDFF; --on-primary-container:#21005D;
  --secondary-container:#E8DEF8; --on-secondary-container:#1D192B;
  --surface:#FEF7FF; --surface-container:#F3EDF7; --surface-container-high:#ECE6F0;
  --surface-container-low:#F7F2FA;
  --on-surface:#1D1B20; --on-surface-variant:#49454F;
  --outline:#79747E; --outline-variant:#CAC4D0;
  --bg:#F5EFF9;
  --shadow:0 1px 2px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:0 4px 12px rgba(0,0,0,.15),0 8px 32px rgba(0,0,0,.10);
  --accent-frontal:#5B7CFA; --accent-parietal:#2FB79B;
  --accent-temporal:#F29B30; --accent-occipital:#A96BF0;
  --danger:#E5484D; --danger-container:#FFE0E2;
}
[data-theme="dark"]{
  --primary:#D0BCFF; --on-primary:#381E72;
  --primary-container:#4F378B; --on-primary-container:#EADDFF;
  --secondary-container:#4A4458; --on-secondary-container:#E8DEF8;
  --surface:#141218; --surface-container:#211F26; --surface-container-high:#2B2930;
  --surface-container-low:#1D1B20;
  --on-surface:#E6E0E9; --on-surface-variant:#CAC4D0;
  --outline:#938F99; --outline-variant:#49454F;
  --bg:#0F0D13;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
  --shadow-lg:0 4px 12px rgba(0,0,0,.6),0 8px 32px rgba(0,0,0,.5);
  --accent-frontal:#8FA6FF; --accent-parietal:#5FD9C0;
  --accent-temporal:#FFBB66; --accent-occipital:#C79BFF;
  --danger:#FF6B70; --danger-container:#4A1F22;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Roboto','Noto Sans JP',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--on-surface);
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
  user-select:none;-webkit-user-select:none;
}
svg{width:24px;height:24px;fill:currentColor;display:block}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}

.app{display:grid;grid-template-rows:64px 1fr;height:100dvh}

.app-bar{
  display:flex;align-items:center;gap:8px;padding:0 8px;
  background:var(--surface-container);color:var(--on-surface);
  border-bottom:1px solid var(--outline-variant);
  z-index:40;position:relative;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{
  width:36px;height:36px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--primary),var(--accent-occipital));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;
  box-shadow:var(--shadow);
}
.brand h1{font-size:16px;font-weight:500;margin:0;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--on-surface-variant);font-weight:400}
.spacer{flex:1}

.icon-btn{
  width:42px;height:42px;border-radius:50%;
  color:var(--on-surface-variant);display:grid;place-items:center;
  transition:background .18s ease,color .18s ease;flex:none;
}
.icon-btn:active{background:color-mix(in srgb,var(--on-surface) 14%,transparent)}

/* Language switcher */
.lang-switch{
  display:flex;align-items:center;gap:2px;
  background:var(--surface-container-high);
  border-radius:12px;padding:3px;margin-right:4px;
}
.lang-switch button{
  font-size:11px;font-weight:700;letter-spacing:.5px;
  padding:6px 8px;border-radius:9px;color:var(--on-surface-variant);
  transition:all .18s ease;
}
.lang-switch button.active{
  background:var(--primary);color:var(--on-primary);
}
@media (max-width:640px){
  .lang-switch button{padding:6px 6px;font-size:10px}
}

.body{display:grid;grid-template-columns:296px 1fr 372px;overflow:hidden;position:relative}

/* ==== DRAWER ==== */
.drawer{
  background:var(--surface-container-low);border-right:1px solid var(--outline-variant);
  overflow-y:auto;padding:12px 12px 24px;scrollbar-width:thin;
}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 4px 8px 12px;
}
.drawer-head .title{
  font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--on-surface-variant);
  display:flex;align-items:center;gap:6px;
}
.close-btn{
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;color:var(--on-surface-variant);
}
.close-btn:active{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
@media (min-width:1241px){ .close-btn{display:none} }

/* Info icon (tooltip for terms) */
.info-btn{
  width:18px;height:18px;border-radius:50%;flex:none;
  display:inline-grid;place-items:center;font-size:11px;font-weight:700;
  background:var(--surface-container-high);color:var(--on-surface-variant);
  border:1px solid var(--outline-variant);line-height:1;
  transition:all .18s ease;
}
.info-btn:hover{background:var(--secondary-container);color:var(--on-secondary-container)}

.region-item{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:12px;border-radius:14px;text-align:left;color:var(--on-surface);
  transition:background .18s ease;
}
.region-item:active{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.region-item.selected{background:var(--secondary-container);color:var(--on-secondary-container)}
.region-dot{
  width:14px;height:14px;border-radius:50%;flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,currentColor 12%,transparent);
}
.region-item .txt{min-width:0}
.region-item .txt b{display:block;font-size:14px;font-weight:500}
.region-item .txt span{display:block;font-size:11.5px;opacity:.7;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.legend{margin-top:18px;padding:14px 12px;border-top:1px solid var(--outline-variant)}
.legend-row{display:flex;align-items:center;gap:10px;font-size:12px;
  color:var(--on-surface-variant);padding:5px 0}
.legend-row i{width:10px;height:10px;border-radius:3px;flex:none}

/* ==== VIEWPORT ==== */
.viewport{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb,var(--primary) 10%,transparent), transparent 65%),
    var(--bg);
}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}

.overlay-top{
  position:absolute;top:12px;left:12px;right:12px;
  display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;
  z-index:5;
}
.chip{
  pointer-events:auto;
  display:inline-flex;align-items:center;gap:7px;
  height:34px;padding:0 14px;border-radius:10px;
  border:1px solid var(--outline-variant);
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--on-surface-variant);font-size:12.5px;font-weight:500;
  transition:all .18s ease;white-space:nowrap;
}
.chip.on{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chip.danger-on{background:var(--danger-container);color:var(--danger);border-color:transparent}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.chip.on i{opacity:1}

.hint{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:11.5px;color:var(--on-surface-variant);
  background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:8px 14px;border-radius:20px;border:1px solid var(--outline-variant);
  pointer-events:none;text-align:center;max-width:90%;z-index:5;
}

.tooltip{
  position:absolute;pointer-events:none;z-index:20;
  padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;
  background:var(--surface-container-high);color:var(--on-surface);
  border:1px solid var(--outline-variant);box-shadow:var(--shadow);
  transform:translate(-50%,-140%);opacity:0;transition:opacity .15s ease;
  white-space:nowrap;
}
.tooltip.show{opacity:1}

/* Floating popover for term descriptions */
.popover{
  position:fixed;z-index:80;max-width:300px;
  padding:14px 16px;border-radius:14px;
  background:var(--surface-container-high);color:var(--on-surface);
  border:1px solid var(--outline-variant);box-shadow:var(--shadow-lg);
  font-size:12.5px;line-height:1.55;
  opacity:0;transform:translateY(-6px);pointer-events:none;
  transition:opacity .16s ease,transform .16s ease;
}
.popover.show{opacity:1;transform:none;pointer-events:auto}
.popover h4{margin:0 0 6px;font-size:13px;color:var(--primary)}
.popover p{margin:0;color:var(--on-surface-variant)}

/* ==== PANEL ==== */
.panel{
  background:var(--surface-container-low);border-left:1px solid var(--outline-variant);
  display:flex;flex-direction:column;overflow:hidden;
}
.tabs{display:flex;padding:8px 8px 0;gap:4px;
  border-bottom:1px solid var(--outline-variant);flex:none;align-items:center}
.tab{
  flex:1;padding:14px 6px 12px;font-size:12.5px;font-weight:500;
  color:var(--on-surface-variant);border-bottom:3px solid transparent;
  transition:color .18s,border-color .18s;margin-bottom:-1px;
  border-radius:12px 12px 0 0;white-space:nowrap;
}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.panel-close{
  width:36px;height:36px;border-radius:50%;margin:0 4px 0 0;
  display:grid;place-items:center;color:var(--on-surface-variant);flex:none;
}
.panel-close:active{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
@media (min-width:881px){ .panel-close{display:none} }

.panel-scroll{overflow-y:auto;padding:20px;flex:1;scrollbar-width:thin}
.pane{display:none}
.pane.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.region-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.region-head .big-dot{
  width:44px;height:44px;border-radius:14px;flex:none;
  display:grid;place-items:center;font-size:19px;font-weight:700;color:#fff;
  box-shadow:var(--shadow);
}
.region-head h2{margin:0;font-size:20px;font-weight:500;line-height:1.2}
.region-head .latin{margin:3px 0 0;font-size:12px;font-style:italic;
  color:var(--on-surface-variant)}

.desc{font-size:13.5px;line-height:1.65;color:var(--on-surface-variant);margin:0 0 20px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.stat-card{
  background:var(--surface-container);border-radius:14px;padding:12px 14px;
  border:1px solid var(--outline-variant);
}
.stat-card span{display:block;font-size:10.5px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--on-surface-variant);margin-bottom:4px}
.stat-card b{font-size:14px;font-weight:500}

.section-h{
  font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--on-surface-variant);margin:0 0 10px;
  display:flex;align-items:center;gap:8px;
}
.fn-list{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 22px;padding:0;list-style:none}
.fn-list li{font-size:12px;padding:6px 12px;border-radius:8px;
  background:var(--secondary-container);color:var(--on-secondary-container)}

.sub-list{margin:0 0 18px;padding:0;list-style:none;
  display:flex;flex-direction:column;gap:6px}
.sub-item{
  display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;
  border-radius:12px;border:1px solid var(--outline-variant);
  background:var(--surface-container);text-align:left;color:var(--on-surface);
  font-size:13px;transition:all .16s ease;
}
.sub-item:active{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,transparent)}
.sub-item .pin{width:9px;height:9px;border-radius:50%;flex:none;background:var(--primary)}
.sub-item .go{margin-left:auto;opacity:.4;font-size:11px}

/* ==== DISEASE CARDS ==== */
.disease-card{
  background:var(--surface-container);
  border:1px solid var(--outline-variant);
  border-radius:14px;padding:14px;margin-bottom:10px;
  border-left:4px solid var(--danger);
  transition:all .18s ease;
}
.disease-card:active{background:var(--surface-container-high)}
.disease-card h4{
  margin:0 0 4px;font-size:14px;font-weight:500;
  color:var(--on-surface);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.disease-card .latin-sub{
  font-size:11px;font-style:italic;color:var(--on-surface-variant);
  margin:0 0 10px;
}
.disease-card .badge{
  font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;background:var(--danger-container);color:var(--danger);
  flex:none;
}
.disease-card .row{
  display:flex;gap:10px;font-size:12px;margin-top:6px;line-height:1.5;
}
.disease-card .row b{
  flex:none;width:96px;color:var(--on-surface-variant);font-weight:500;
}
.disease-card .row span{color:var(--on-surface)}

.symptom-list{margin:0;padding:0 0 0 16px;font-size:12.5px;line-height:1.7;
  color:var(--on-surface-variant)}
.symptom-list li{margin-bottom:4px}

.cog-impact{
  display:grid;grid-template-columns:1fr;gap:8px;margin:14px 0 0;
}
.cog-bar{
  display:flex;align-items:center;gap:10px;font-size:12px;
}
.cog-bar .lbl{width:130px;flex:none;color:var(--on-surface-variant)}
.cog-bar .track{flex:1;height:6px;border-radius:3px;
  background:var(--surface-container-high);overflow:hidden}
.cog-bar .track i{display:block;height:100%;background:var(--danger);
  border-radius:3px;transition:width .35s ease}
.cog-bar .pct{width:42px;text-align:right;font-weight:700;font-size:11px;
  color:var(--danger)}

.empty{text-align:center;padding:56px 20px;color:var(--on-surface-variant)}
.empty .ico{
  width:64px;height:64px;margin:0 auto 18px;border-radius:20px;
  background:var(--surface-container);display:grid;place-items:center;
}
.empty .ico svg{width:32px;height:32px;opacity:.55}
.empty p{margin:0;font-size:13.5px;line-height:1.6}

.param{margin-bottom:24px}
.param-head{display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:9px;gap:10px}
.param-head label{font-size:13.5px;font-weight:500;
  display:flex;align-items:center;gap:6px}
.param-head .val{
  font-size:12.5px;font-weight:700;color:var(--primary);
  background:var(--secondary-container);padding:2px 9px;border-radius:7px;
}
.param .sub{font-size:11.5px;color:var(--on-surface-variant);margin:7px 0 0;line-height:1.5}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;
  background:transparent;display:block;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--primary) var(--p,50%),var(--outline-variant) var(--p,50%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--primary);margin-top:-8px;border:none;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--outline-variant)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--primary)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
  background:var(--primary);border:none}

.meter{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.meter-row{display:flex;align-items:center;gap:12px;font-size:12.5px}
.meter-row .name{width:112px;color:var(--on-surface-variant);flex:none}
.meter-bar{flex:1;height:7px;border-radius:4px;
  background:var(--surface-container-high);overflow:hidden}
.meter-bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--primary),var(--accent-occipital));
  transition:width .3s ease}
.meter-row b{width:42px;text-align:right;font-size:12px}

.note{
  font-size:11.5px;line-height:1.6;color:var(--on-surface-variant);
  background:var(--surface-container);border-left:3px solid var(--primary);
  padding:12px 14px;border-radius:0 10px 10px 0;margin-top:8px;
}

/* ==== SCRIM ==== */
.scrim{
  position:fixed;inset:64px 0 0 0;background:rgba(0,0,0,.5);z-index:34;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.scrim.show{opacity:1;pointer-events:auto}

/* ==== RESPONSIVE ==== */
@media (max-width:1240px){
  .body{grid-template-columns:1fr 348px}
  .drawer{
    position:fixed;top:64px;bottom:0;left:0;width:296px;z-index:35;
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow-lg);background:var(--surface-container-low);
  }
  .drawer.open{transform:none}
  #menuBtn{display:grid!important}
}
@media (min-width:1241px){
  #menuBtn{display:none}
  .scrim{display:none}
}
@media (max-width:880px){
  .body{grid-template-columns:1fr}
  .panel{
    position:fixed;top:64px;bottom:0;right:0;width:min(380px,92vw);z-index:35;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow-lg);background:var(--surface-container-low);
  }
  .panel.open{transform:none}
  #panelBtn{display:grid!important}
  .brand small{display:none}
}
@media (min-width:881px){
  #panelBtn{display:none}
}
@media (max-width:520px){
  .app{grid-template-rows:56px 1fr}
  .brand h1{font-size:15px}
  .overlay-top{gap:6px;top:10px;left:10px;right:10px}
  .chip{height:32px;padding:0 11px;font-size:11.5px}
  .hint{font-size:10.5px;padding:6px 12px;bottom:10px}
  .panel-scroll{padding:16px}
  .scrim{inset:56px 0 0 0}
  .drawer,.panel{top:56px}
  .tab{font-size:11.5px;padding:12px 4px 10px}
  .lang-switch button{padding:5px 5px;font-size:9.5px}
}
</style>
</head>
<body>

<div class="app">
  <header class="app-bar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <div class="brand">
      <div class="brand-logo">NC</div>
      <div>
        <h1>NeuroCortex</h1>
        <small id="brandSub">Интерактивный атлас коры</small>
      </div>
    </div>
    <div class="spacer"></div>

    <div class="lang-switch" id="langSwitch" role="tablist" aria-label="Language">
      <button data-lang="ru" class="active">RU</button>
      <button data-lang="en">EN</button>
      <button data-lang="es">ES</button>
      <button data-lang="fr">FR</button>
      <button data-lang="ja">JA</button>
    </div>

    <button class="icon-btn" id="themeBtn" aria-label="Theme">
      <svg viewBox="0 0 24 24" id="themeIcon"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A6.5 6.5 0 0 1 12 3z"/></svg>
    </button>
    <button class="icon-btn" id="panelBtn" aria-label="Panel">
      <svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2V7zm0 4h2v6h-2v-6zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
    </button>
  </header>

  <div class="body">
    <nav class="drawer" id="drawer">
      <div class="drawer-head">
        <span class="title">
          <span data-i18n="lobesTitle"></span>
          <button class="info-btn" data-term="lobes">i</button>
        </span>
        <button class="close-btn" id="closeDrawer" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div id="regionList"></div>
      <div class="legend">
        <div class="drawer-head" style="padding:0 4px 8px 12px">
