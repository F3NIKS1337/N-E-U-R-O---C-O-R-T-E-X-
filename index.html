<!DOCTYPE html>
<html lang="ru" data-lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<title>Neuro - Cortex — 3D Brain Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050508;--bg-1:#0a0a0e;--bg-2:#111116;--bg-3:#181820;
  --border:rgba(255,255,255,.08);--border-hi:rgba(255,255,255,.2);
  --text:#f8fafc;--text-2:rgba(248,250,252,.64);--text-3:rgba(248,250,252,.36);
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;
  --font:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --topbar-h:48px;
  --panel-l:290px;
  --panel-r:350px;
  --ease:cubic-bezier(0.16, 1, 0.3, 1);
}
[data-theme="light"]{
  --bg:#f8fafc;--bg-1:#ffffff;--bg-2:#f1f5f9;--bg-3:#e2e8f0;
  --border:rgba(15,23,42,.08);--border-hi:rgba(15,23,42,.2);
  --text:#0f172a;--text-2:rgba(15,23,42,.65);--text-3:rgba(15,23,42,.4);
}

/* ═══ 16:9 LARGE MONITORS SCALING ═══ */
@media (min-width:1440px){
  :root{--topbar-h:52px;--panel-l:320px;--panel-r:380px}
  html{font-size:15px}
}
@media (min-width:1920px){
  :root{--topbar-h:58px;--panel-l:360px;--panel-r:430px}
  html{font-size:16.5px}
}
@media (min-width:2560px){
  :root{--topbar-h:68px;--panel-l:420px;--panel-r:500px}
  html{font-size:18.5px}
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  font-size:0.92rem;line-height:1.5;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
svg{display:block}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:2px}

.app{
  display:grid;
  grid-template-rows:calc(var(--topbar-h) + var(--safe-top)) 1fr;
  height:100dvh;
  background:var(--bg);
  overflow:hidden;
}

/* ═══ MINIMAL TOPBAR ═══ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:var(--safe-top) calc(14px + var(--safe-right)) 0 calc(14px + var(--safe-left));
  height:calc(var(--topbar-h) + var(--safe-top));
  background:var(--bg-1);
  border-bottom:1px solid var(--border);
  z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;flex:none}
.brand-icon{
  width:24px;height:24px;
  display:grid;place-items:center;flex:none;
  background:var(--text);color:var(--bg);
  border-radius:6px;
}
.brand-icon svg{width:13px;height:13px}
.brand-name{
  font-size:0.9rem;font-weight:600;letter-spacing:-.2px;white-space:nowrap;
}
.fps-badge{
  font-family:var(--mono);font-size:0.68rem;font-weight:500;
  color:var(--text-3);padding:2px 6px;border-radius:4px;
  background:var(--bg-2);border:1px solid var(--border);
  font-variant-numeric:tabular-nums;
}

.topbar-actions{display:flex;align-items:center;gap:6px;flex:none}
.lang-switch{
  display:flex;background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:5px;padding:2px;gap:1px;
}
.lang-btn{
  padding:3px 7px;
  font-family:var(--mono);font-size:0.68rem;font-weight:600;
  letter-spacing:.3px;border-radius:3px;
  color:var(--text-3);
  transition:background .15s ease,color .15s ease;
}
.lang-btn.active{background:var(--text);color:var(--bg)}
.icon-btn{
  width:32px;height:32px;min-width:32px;
  display:grid;place-items:center;
  border-radius:5px;color:var(--text-2);
  border:1px solid var(--border);background:var(--bg-2);
  transition:border-color .15s ease,color .15s ease;
}
.icon-btn:hover{border-color:var(--border-hi);color:var(--text)}
.icon-btn svg{width:14px;height:14px}
.mobile-only{display:grid}
@media (min-width:1025px){.mobile-only{display:none}}

/* ═══ BODY LAYOUT (LEFT FIXED, RIGHT SLIDE-OVER DRAWER) ═══ */
.body{
  display:grid;
  grid-template-columns:1fr;
  overflow:hidden;min-height:0;position:relative;
}
@media (min-width:1025px){
  .body{grid-template-columns:var(--panel-l) 1fr}
}

.panel{
  overflow-y:auto;overflow-x:hidden;
  padding:14px 12px;min-height:0;
  background:var(--bg-1);
  -webkit-overflow-scrolling:touch;
  contain:content;
}
@media (min-width:1440px){.panel{padding:18px 16px}}
.panel-left{border-right:1px solid var(--border)}

/* Right Panel is ALWAYS a sleek collapsible curtain drawer */
.panel-right{
  position:fixed;
  top:calc(var(--topbar-h) + var(--safe-top));
  right:0;bottom:0;
  width:min(var(--panel-r), 90vw);
  z-index:180;
  background:rgba(10, 10, 14, 0.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-left:1px solid var(--border);
  transform:translate3d(100%, 0, 0);
  transition:transform .28s var(--ease);
  padding-bottom:calc(16px + var(--safe-bottom));
  box-shadow:-16px 0 40px rgba(0,0,0,.45);
  will-change:transform;
}
[data-theme="light"] .panel-right{
  background:rgba(255, 255, 255, 0.94);
  box-shadow:-12px 0 32px rgba(0,0,0,.08);
}
.panel-right.open{transform:translate3d(0, 0, 0)}

@media (max-width:1024px){
  .panel-left{
    position:fixed;
    top:calc(var(--topbar-h) + var(--safe-top));
    left:0;bottom:0;
    width:min(310px, 86vw);z-index:200;
    background:var(--bg-1);
    transform:translate3d(-100%,0,0);
    transition:transform .28s var(--ease);
    padding-bottom:calc(16px + var(--safe-bottom));
    box-shadow:16px 0 40px rgba(0,0,0,.5);
  }
  .panel-left.open{transform:translate3d(0,0,0)}
}

.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px solid var(--border);
  position:sticky;top:-18px;background:inherit;
  padding-top:14px;margin-top:-14px;z-index:5;
}
.panel-head h2{
  font-family:var(--mono);font-size:0.68rem;font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);
}
.panel-close{
  width:26px;height:26px;display:grid;place-items:center;
  border-radius:5px;color:var(--text-2);background:var(--bg-2);
  border:1px solid var(--border);
}
.panel-close:hover{color:var(--text);border-color:var(--border-hi)}
.panel-close svg{width:12px;height:12px}
@media (min-width:1025px){#closeLeft{display:none}}

.section{margin-bottom:18px}
.section-title{
  font-family:var(--mono);font-size:0.65rem;font-weight:600;
  letter-spacing:1.3px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}

/* ═══ MINIMALIST & STRUCTURAL LOBE ITEMS ═══ */
.region-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 11px;border-radius:6px;text-align:left;
  transition:background .15s ease,border-color .15s ease;
  margin-bottom:4px;
  border:1px solid transparent;
  background:transparent;
}
.region-item:hover{background:var(--bg-2);border-color:var(--border)}
.region-item.active{background:var(--bg-3);border-color:var(--border-hi)}
.region-dot{
  width:8px;height:8px;border-radius:50%;flex:none;
  background:var(--r-color,#34d399);
}
.region-item.active .region-dot{
  box-shadow:0 0 0 3px color-mix(in srgb, var(--r-color,#34d399) 28%, transparent);
}
.region-info{flex:1;min-width:0}
.region-name{display:block;font-size:0.84rem;font-weight:500;color:var(--text);line-height:1.25}
.region-meta{display:block;font-size:0.7rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region-ba{
  font-family:var(--mono);font-size:0.62rem;color:var(--text-3);
  padding:2px 5px;border-radius:4px;background:var(--bg-2);border:1px solid var(--border);flex:none;
}

/* ═══ DISEASE ITEMS ═══ */
.disease-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:8px 10px;border-radius:6px;text-align:left;
  transition:background .15s ease,border-color .15s ease;
  margin-bottom:4px;
  border:1px solid var(--border);background:transparent;
  position:relative;overflow:hidden;
}
.disease-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:2px;background:var(--d-color,#666);opacity:.6;
}
.disease-item:hover{background:var(--bg-2)}
.disease-item.active{background:var(--bg-3);border-color:var(--border-hi)}
.disease-item.active::before{opacity:1;width:3px}
.disease-icon{
  width:22px;height:22px;border-radius:4px;
  display:grid;place-items:center;
  background:var(--d-color,#666);color:#fff;
  font-family:var(--mono);font-size:0.68rem;font-weight:700;flex:none;
}
.disease-body{flex:1;min-width:0}
.disease-name{font-size:0.8rem;font-weight:500;color:var(--text);display:block;line-height:1.2}
.disease-desc{font-size:0.68rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ═══ SEVERITY ═══ */
.severity-box{
  margin-top:10px;padding:12px;
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:7px;
}
.severity-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.severity-label{font-family:var(--mono);font-size:0.65rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3)}
.severity-value{font-family:var(--mono);font-size:1.05rem;font-weight:600;color:var(--text)}
.severity-slider{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;display:block}
.severity-slider::-webkit-slider-runnable-track{
  height:3px;border-radius:2px;
  background:linear-gradient(to right,var(--text) var(--p,50%),var(--border) var(--p,50%));
}
.severity-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--text);
  margin-top:-6.5px;border:none;
}
.severity-stages{display:flex;justify-content:space-between;margin-top:4px;font-family:var(--mono);font-size:0.64rem;color:var(--text-3)}
.severity-stages span.active{color:var(--text);font-weight:600}

/* ═══ VIEWPORT ═══ */
.viewport{
  position:relative;
  background:radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.05) 0%, transparent 70%), var(--bg);
  overflow:hidden;min-height:0;min-width:0;
  display:flex;align-items:center;justify-content:center;
}
#canvas3d{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#canvas3d:active{cursor:grabbing}

/* ═══ VIEWPORT CONTROLS (TOP LEFT) ═══ */
.viewport-controls{
  position:absolute;top:12px;left:12px;
  display:flex;align-items:center;gap:8px;z-index:10;
  pointer-events:none;flex-wrap:wrap;
}
.mode-switch{
  pointer-events:auto;
  display:inline-flex;background:rgba(10,10,14,.78);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:6px;padding:2px;gap:2px;
}
[data-theme="light"] .mode-switch{background:rgba(255,255,255,.85)}
.mode-btn{
  padding:4px 10px;border-radius:4px;
  font-family:var(--mono);font-size:0.68rem;font-weight:500;
  color:var(--text-2);transition:background .15s ease,color .15s ease;
}
.mode-btn.active{background:var(--text);color:var(--bg);font-weight:600}

.chip{
  pointer-events:auto;
  display:inline-flex;align-items:center;gap:5px;
  height:28px;padding:0 10px;border-radius:6px;
  border:1px solid var(--border);
  background:rgba(10,10,14,.75);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--text-2);
  font-family:var(--mono);font-size:0.68rem;font-weight:500;
  white-space:nowrap;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
[data-theme="light"] .chip{background:rgba(255,255,255,.85)}
.chip.on{background:var(--bg-3);border-color:var(--border-hi);color:var(--text)}
.chip-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
.chip.on .chip-dot{background:var(--success);opacity:1}

/* ═══ NON-CLICKABLE FOCUS INDICATOR ═══ */
.focus-indicator{
  position:absolute;top:12px;right:12px;
  pointer-events:none;user-select:none;z-index:10;
  display:flex;align-items:center;gap:8px;
  padding:5px 10px;border-radius:6px;
  background:rgba(10,10,14,.65);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--border);
  font-family:var(--mono);font-size:0.7rem;
  transition:border-color .2s ease,transform .2s ease;
}
[data-theme="light"] .focus-indicator{background:rgba(255,255,255,.8)}
.focus-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--f-color, var(--text-3));
  box-shadow:0 0 8px var(--f-color, transparent);
}
.focus-tag{color:var(--text-3);font-size:0.62rem;text-transform:uppercase;letter-spacing:1px}
.focus-val{color:var(--text);font-weight:600}

/* ═══ HTML LABELS ON CORTEX ═══ */
.labels-layer{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.zone-label{
  position:absolute;left:0;top:0;
  pointer-events:auto;
  display:flex;align-items:center;gap:5px;
  padding:3px 8px 3px 6px;border-radius:4px;
  background:rgba(8, 8, 12, 0.82);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.14);
  font-family:var(--mono);font-size:0.66rem;font-weight:500;
  color:#f8fafc;white-space:nowrap;
  transform:translate3d(-9999px,-9999px,0);
  transition:opacity .15s ease,border-color .15s ease,background .15s ease;
  will-change:transform,opacity;
  cursor:pointer;
}
[data-theme="light"] .zone-label{
  background:rgba(255,255,255,.9);
  border-color:rgba(15,23,42,.15);color:#0f172a;
}
.zone-label.hidden{opacity:0;pointer-events:none}
.zone-label:hover{border-color:var(--ldot-color,#fff);z-index:10}
.zone-label.active{
  background:var(--bg-3);
  border-color:var(--ldot-color,#fff);
  color:var(--text);
  z-index:12;
}
.zone-label .ldot{
  width:5px;height:5px;border-radius:50%;flex:none;
  background:var(--ldot-color,#34d399);
}
.zone-label .lba{font-size:0.58rem;opacity:.55;margin-left:2px}

.status-indicator{
  position:absolute;bottom:12px;left:12px;
  pointer-events:none;
  display:flex;align-items:center;gap:5px;
  padding:4px 9px;background:rgba(10,10,14,.65);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--border);border-radius:5px;
  font-family:var(--mono);font-size:0.64rem;
  letter-spacing:.7px;text-transform:uppercase;
  color:var(--text-3);z-index:10;
}
[data-theme="light"] .status-indicator{background:rgba(255,255,255,.8)}
.status-indicator::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--success);
}
.status-indicator.danger::before{background:var(--danger)}

/* ═══ MODEL LOADER ═══ */
.model-loader{
  position:absolute;inset:0;
  display:grid;place-items:center;
  background:var(--bg);z-index:20;
  transition:opacity .35s ease;
}
.model-loader.hidden{opacity:0;pointer-events:none}
.model-loader-spinner{
  width:30px;height:30px;margin:0 auto 10px;
  border:2px solid var(--border);
  border-top-color:var(--text);
  border-radius:50%;
  animation:spin 0.85s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.model-loader-text{
  font-family:var(--mono);font-size:0.68rem;
  letter-spacing:1.3px;text-transform:uppercase;
  color:var(--text-3);text-align:center;
}

/* ═══ MINIMALIST ANALYTICS PANEL (RIGHT CURTAIN) ═══ */
.back-btn{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:0.66rem;font-weight:500;
  color:var(--text-2);background:var(--bg-2);
  border:1px solid var(--border);border-radius:5px;
  padding:4px 8px;margin-bottom:10px;
}
.back-btn:hover{color:var(--text);border-color:var(--border-hi)}

.analytics-header{
  display:flex;align-items:flex-start;
  justify-content:space-between;gap:8px;margin-bottom:12px;
}
.analytics-header h2{font-size:1rem;font-weight:600;letter-spacing:-.2px;margin-bottom:2px;line-height:1.25}
.analytics-header .subtitle{font-family:var(--mono);font-size:0.68rem;color:var(--text-3);display:block}
.ba-badge{
  font-family:var(--mono);font-size:0.64rem;font-weight:500;
  padding:3px 7px;border-radius:4px;
  background:var(--bg-2);border:1px solid var(--border);
  color:var(--text-2);white-space:nowrap;flex:none;
}
.card{
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:7px;padding:11px 12px;margin-bottom:8px;
}
.card-title{
  font-family:var(--mono);font-size:0.64rem;font-weight:600;
  letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:7px;
  display:flex;align-items:center;justify-content:space-between;
}
.card-title .badge{
  font-family:var(--mono);font-size:0.62rem;
  padding:1px 5px;border-radius:3px;
  background:var(--bg-3);color:var(--text-2);
}
.card p{font-size:0.8rem;line-height:1.55;color:var(--text-2);margin:0}

.metric-row{padding:6px 0;border-bottom:1px solid var(--border)}
.metric-row:last-child{border-bottom:none}
.metric-top{display:flex;align-items:center;justify-content:space-between;font-size:0.76rem;margin-bottom:4px}
.metric-label{color:var(--text-2)}
.metric-value{font-family:var(--mono);font-size:0.76rem;font-weight:600}
.metric-value.good{color:var(--success)}
.metric-value.warn{color:var(--warn)}
.metric-value.bad{color:var(--danger)}
.metric-bar{height:3px;border-radius:2px;background:var(--bg-3);overflow:hidden}
.metric-fill{height:100%;border-radius:2px;transition:width .3s var(--ease)}
.metric-fill.good{background:var(--success)}
.metric-fill.warn{background:var(--warn)}
.metric-fill.bad{background:var(--danger)}

.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{
  font-family:var(--mono);font-size:0.66rem;
  padding:3px 7px;border-radius:4px;
  background:var(--bg-3);border:1px solid var(--border);color:var(--text-2);
}
.tag.danger{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.25);color:#f87171}
.tag.warn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.25);color:#fbbf24}

.sub-item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 10px;border-radius:5px;
  border:1px solid var(--border);
  background:var(--bg-3);color:var(--text);
  font-size:0.78rem;text-align:left;
  transition:border-color .15s ease;
  margin-bottom:4px;
}
.sub-item:hover{border-color:var(--border-hi)}
.sub-item .pin{width:6px;height:6px;border-radius:50%;flex:none}
.sub-item-info{flex:1;min-width:0}
.sub-item-title{display:block;font-weight:500;color:var(--text);font-size:0.78rem}
.sub-item-sub{display:block;font-size:0.66rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-item .go{margin-left:auto;color:var(--text-3);font-family:var(--mono);font-size:0.68rem}

.progression-bar{display:flex;height:3px;border-radius:2px;overflow:hidden;background:var(--bg-3);margin-bottom:8px;gap:2px}

.scrim{
  position:fixed;inset:calc(var(--topbar-h) + var(--safe-top)) 0 0 0;
  background:rgba(0,0,0,.5);z-index:150;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.scrim.show{opacity:1;pointer-events:auto}

renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(-2.3, 0.4, 1.8);

const controls = new OrbitControls(camera, canvas);

controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 1.05;
controls.minDistance = 1.35;
controls.maxDistance = 8.5;
controls.enablePan = false;
controls.target.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0x99aacc, 0.75));
scene.add(new THREE.HemisphereLight(0xddeeff, 0x10121a, 0.9));

const brainState = {
  loaded: false,
  size: new THREE.Vector3(2, 2, 2),
  radius: 1,
  model: null,
  surfaceMeshes: [],
  surfaceMaterials: [],
  neuralMaterials: []

/* ================================================================
   LOBE CLASSIFICATION (MATCHING TEXTBOOK TOPOGRAPHY)
   ================================================================ */
const LOBE_INDEX = { frontal: 0, parietal: 1, temporal: 2, occipital: 3, cerebellum: 4, brainstem: 5 };
const LOBE_COLORS = [
  new THREE.Color('#10b981'), // frontal
  new THREE.Color('#38bdf8'), // parietal
  new THREE.Color('#a855f7'), // temporal
  new THREE.Color('#eab308'), // occipital
  new THREE.Color('#ec4899'), // cerebellum
  new THREE.Color('#06b6d4')  // brainstem
];

function classifyLobe(x, y, z) {
  // Brainstem: lowest central-posterior stalk
  if (y < -0.42 && Math.abs(x) < 0.28 && z < 0.15) return 'brainstem';
  // Cerebellum: posterior inferior fossa
  if (y < -0.18 && z < -0.12) return 'cerebellum';
  // Frontal lobe: anterior to central sulcus (slanted plane z > 0.08 - y*0.18)
  if (z > 0.08 - y * 0.18 && y > -0.25) return 'frontal';
  // Occipital lobe: posterior pole
  if (z < -0.48 && y >= -0.18) return 'occipital';
  // Temporal lobe: lateral inferior below Sylvian fissure
  if (y < 0.14 && Math.abs(x) > 0.25 && z <= 0.25 && z >= -0.52) return 'temporal';
  // Parietal lobe: superior posterior
  if (y >= 0.08) return 'parietal';
  return z >= 0 ? 'frontal' : 'temporal';
}

/* ================================================================
   GLB LOAD + AUTO-ORIENTATION + DUAL DISPLAY MODES
   ================================================================ */
const MODEL_URL = 'low-poly_human_brain_model.glb';
const modelLoaderEl = document.getElementById('modelLoader');
const loaderTextEl = document.getElementById('loaderText');

let nebulaPoints = null;
let nebulaUniforms = null;

const gltfLoader = new GLTFLoader();
gltfLoader.load(
  MODEL_URL,
  function(gltf) {
    const model = gltf.scene;

    // 1. Scale and center model at origin
    const bbox = new THREE.Box3().setFromObject(model);
    const size = bbox.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 2.15 / maxDim;
    model.scale.setScalar(scale);

    model.position.set(0, 0, 0);
    const bbox2 = new THREE.Box3().setFromObject(model);
    const center2 = bbox2.getCenter(new THREE.Vector3());
    model.position.set(-center2.x, -center2.y, -center2.z);
    model.updateMatrixWorld(true);

    // 2. Auto-detect brainstem & AP axis so Frontal is ALWAYS +Z and Left Hemisphere is -X
    const allVerts = [];
    const vTmp = new THREE.Vector3();
    model.traverse(function(c) {
      if (c.isMesh && c.geometry) {
        const p = c.geometry.attributes.position;
        for (let i = 0; i < p.count; i += 3) {
          vTmp.fromBufferAttribute(p, i).applyMatrix4(c.matrixWorld);
          allVerts.push(vTmp.clone());
        }
      }
    });

    if (allVerts.length > 0) {
      const fBox = new THREE.Box3().setFromPoints(allVerts);
      const fSize = fBox.getSize(new THREE.Vector3());
      // If X is longer than Z, the model's nose-to-back axis is along X
      if (fSize.x > fSize.z * 1.08) {
        model.rotation.y = Math.PI * 0.5;
        model.updateMatrixWorld(true);
      }
      // Check lowest vertices (brainstem): in human anatomy, brainstem/cerebellum is posterior (-Z)
      let lowZSum = 0;
      let lowCount = 0;
      const minY = fBox.min.y;
      const yThresh = minY + fSize.y * 0.25;
      model.traverse(function(c) {
        if (c.isMesh && c.geometry) {
          const p = c.geometry.attributes.position;
          for (let i = 0; i < p.count; i += 4) {
            vTmp.fromBufferAttribute(p, i).applyMatrix4(c.matrixWorld);
            if (vTmp.y < yThresh) {
              lowZSum += vTmp.z;
              lowCount++;
            }
          }
        }
      });
      if (lowCount > 0 && (lowZSum / lowCount) > 0.05) {
        // Stem is at +Z, rotate 180 deg around Y so Frontal is +Z and Stem/Cerebellum is -Z
        model.rotation.y += Math.PI;
        model.updateMatrixWorld(true);
      }
    }

    brainState.model = model;
    const finalBox = new THREE.Box3().setFromObject(model);
    brainState.size = finalBox.getSize(new THREE.Vector3());
    brainState.radius = brainState.size.length() * 0.5;
    brainState.loaded = true;

    // 3. Prepare BOTH materials for each mesh:
    //    - Surface Material: preserves original texture (veins/sulci) + DoubleSide for accurate raycasting
    //    - Neural Material: translucent holographic lobe-tinted shell
    model.traverse(function(child) {
      if (child.isMesh && child.geometry) {
        brainState.surfaceMeshes.push(child);

        // Bake lobe vertex colors onto geometry
        const posAttr = child.geometry.attributes.position;
        const count = posAttr.count;
        const colors = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          vTmp.fromBufferAttribute(posAttr, i).applyMatrix4(child.matrixWorld);
          const lid = classifyLobe(vTmp.x, vTmp.y, vTmp.z);
          const c = LOBE_COLORS[LOBE_INDEX[lid]];
          colors[i * 3] = c.r;
          colors[i * 3 + 1] = c.g;
          colors[i * 3 + 2] = c.b;
        }
        child.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Original Vascular Surface Material
        let surfMat;
        if (child.material) {
          surfMat = child.material.clone();
          surfMat.side = THREE.DoubleSide;
          surfMat.roughness = 0.55;
          surfMat.metalness = 0.1;
        } else {
          surfMat = new THREE.MeshStandardMaterial({
            color: 0xb89aa8,
            roughness: 0.55,
            metalness: 0.1,
            side: THREE.DoubleSide
          });
        }

        // Internal Neural Holographic Material
        const neurMat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.35,
          metalness: 0.25,
          transparent: true,
          opacity: 0.18,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        child.userData.surfMat = surfMat;
        child.userData.neurMat = neurMat;
        child.material = surfMat;
      }
    });

    brainGroup.add(model);

    buildUniformCorticalNeurons();
    buildMarkers();
    buildInternalPathways();
    buildHtmlLabels();
    applyDisplayMode();

    modelLoaderEl.classList.add('hidden');

    requestAnimationFrame(function() {
      resize();
      resetCamera();
    });
  },
  function(progress) {
    if (progress.total > 0) {
      loaderTextEl.textContent = T('loadingModel') + ' · ' + Math.round((progress.loaded / progress.total) * 100) + '%';
    }
  },
  function(error) {
    console.error('Model load error:', error);
    loaderTextEl.textContent = T('loadError');
    loaderTextEl.style.color = '#ef4444';
  }
);

/* ================================================================
   OUTWARD-INWARD RAYCASTING (GUARANTEES POINTS SIT ON CORTEX!)
   ================================================================ */
const rayHelper = new THREE.Raycaster();

function getSurfaceHit(dirArray) {
  const dir = new THREE.Vector3(dirArray[0], dirArray[1], dirArray[2]).normalize();
  if (!brainState.loaded || brainState.surfaceMeshes.length === 0) {
    return { point: dir.clone().multiplyScalar(0.85), normal: dir.clone() };
  }

  // Cast from OUTSIDE the brain INWARD toward the anatomical center
  const origin = dir.clone().multiplyScalar(brainState.radius * 3.0);
  const inward = dir.clone().negate();
  rayHelper.set(origin, inward);
  rayHelper.far = brainState.radius * 4.0;

  const hits = rayHelper.intersectObjects(brainState.surfaceMeshes, true);
  if (hits.length > 0) {
    // First hit from outside is guaranteed to be the outer cortical pial surface
    const point = hits[0].point.clone();
    const normal = dir.clone();
    return { point: point.add(normal.clone().multiplyScalar(0.008)), normal: normal };
  }

  return { point: dir.clone().multiplyScalar(brainState.radius * 0.75), normal: dir.clone() };
}

/* ================================================================
   TRIANGLE-AREA WEIGHTED NEURON SAMPLING (NO CLUMPING AT STEM!)
   ================================================================ */
function buildUniformCorticalNeurons() {
  const triangles = [];
  let totalArea = 0;
  const vA = new THREE.Vector3();
  const vB = new THREE.Vector3();
  const vC = new THREE.Vector3();
  const tri = new THREE.Triangle();

  brainState.surfaceMeshes.forEach(function(mesh) {
    const geo = mesh.geometry;
    const pos = geo.attributes.position;
    const index = geo.index;

    if (index) {
      for (let i = 0; i < index.count; i += 3) {
        vA.fromBufferAttribute(pos, index.getX(i)).applyMatrix4(mesh.matrixWorld);
        vB.fromBufferAttribute(pos, index.getY(i)).applyMatrix4(mesh.matrixWorld);
        vC.fromBufferAttribute(pos, index.getZ(i)).applyMatrix4(mesh.matrixWorld);
        tri.set(vA, vB, vC);
        const area = tri.getArea();
        if (area > 0.000001) {
          totalArea += area;
          triangles.push({ a: vA.clone(), b: vB.clone(), c: vC.clone(), cumArea: totalArea });
        }
      }
    } else {
      for (let i = 0; i < pos.count; i += 3) {
        vA.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
        vB.fromBufferAttribute(pos, i + 1).applyMatrix4(mesh.matrixWorld);
        vC.fromBufferAttribute(pos, i + 2).applyMatrix4(mesh.matrixWorld);
        tri.set(vA, vB, vC);
        const area = tri.getArea();
        if (area > 0.000001) {
          totalArea += area;
          triangles.push({ a: vA.clone(), b: vB.clone(), c: vC.clone(), cumArea: totalArea });
        }
      }
    }
  });

  if (triangles.length === 0) return;

  const NEURON_COUNT = 9000;
  const positions = new Float32Array(NEURON_COUNT * 3);
  const colors = new Float32Array(NEURON_COUNT * 3);
  const scales = new Float32Array(NEURON_COUNT);
  const phases = new Float32Array(NEURON_COUNT);
  const lobeIds = new Float32Array(NEURON_COUNT);

  function sampleTriangle() {
    const r = Math.random() * totalArea;
    let lo = 0, hi = triangles.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (triangles[mid].cumArea < r) lo = mid + 1;
      else hi = mid;
    }
    const t = triangles[lo];
    let r1 = Math.random(), r2 = Math.random();
    if (r1 + r2 > 1) { r1 = 1 - r1; r2 = 1 - r2; }
    const r3 = 1 - r1 - r2;
    return new THREE.Vector3(
      t.a.x * r1 + t.b.x * r2 + t.c.x * r3,
      t.a.y * r1 + t.b.y * r2 + t.c.y * r3,
      t.a.z * r1 + t.b.z * r2 + t.c.z * r3
    );
  }

  for (let i = 0; i < NEURON_COUNT; i++) {
    const surfPt = sampleTriangle();
    // Place neurons uniformly inside cortical gray matter & subcortical layers (0.55 to 0.98 depth)
    const depth = Math.random() < 0.72 ? (0.88 + Math.random() * 0.11) : (0.48 + Math.random() * 0.4);
    const px = surfPt.x * depth;
    const py = surfPt.y * depth;
    const pz = surfPt.z * depth;

    positions[i * 3] = px;
    positions[i * 3 + 1] = py;
    positions[i * 3 + 2] = pz;

    const lid = classifyLobe(surfPt.x, surfPt.y, surfPt.z);
    const lIdx = LOBE_INDEX[lid];
    const baseCol = LOBE_COLORS[lIdx];

    const whiteMix = Math.random() < 0.12 ? 0.45 : 0.0;
    colors[i * 3] = baseCol.r * (1 - whiteMix) + whiteMix;
    colors[i * 3 + 1] = baseCol.g * (1 - whiteMix) + whiteMix;
    colors[i * 3 + 2] = baseCol.b * (1 - whiteMix) + whiteMix;

    scales[i] = 0.65 + Math.random() * 1.15;
    phases[i] = Math.random() * Math.PI * 2;
    lobeIds[i] = lIdx;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
  geo.setAttribute('aLobe', new THREE.BufferAttribute(lobeIds, 1));

  nebulaUniforms = {
    uTime: { value: 0 },
    uActiveLobe: { value: -1.0 },
    uDiseaseColor: { value: new THREE.Color(0xef4444) },
    uDiseaseMix: { value: 0.0 },
    uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) }
  };

  const mat = new THREE.ShaderMaterial({
    uniforms: nebulaUniforms,
    vertexShader: `
      attribute vec3 aColor;
      attribute float aScale;
      attribute float aPhase;
      attribute float aLobe;
      uniform float uTime;
      uniform float uActiveLobe;
      uniform vec3 uDiseaseColor;
      uniform float uDiseaseMix;
      uniform float uPixelRatio;
      varying vec3 vColor;
      varying float vAlpha;

      void main() {
        float pulse = 0.7 + 0.3 * sin(uTime * 2.0 + aPhase);
        float lobeMatch = (uActiveLobe < -0.5) ? 1.0 : (abs(aLobe - uActiveLobe) < 0.1 ? 1.4 : 0.15);

        vec3 finalCol = mix(aColor, uDiseaseColor, uDiseaseMix * 0.7);
        vColor = finalCol * (lobeMatch > 1.0 ? 1.25 : 1.0);
        vAlpha = pulse * lobeMatch;

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = (11.5 * aScale * pulse * uPixelRatio * (lobeMatch > 1.0 ? 1.2 : 1.0)) / -mvPosition.z;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;

      void main() {
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        float glow = pow(smoothstep(0.5, 0.0, d), 1.6);
        gl_FragColor = vec4(vColor, glow * vAlpha * 0.85);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  nebulaPoints = new THREE.Points(geo, mat);
  brainGroup.add(nebulaPoints);
}

/* ================================================================
   CLEAN FLUSH CORTICAL MARKERS (NO PROTRUDING SPIKES!)
   ================================================================ */
const subzoneGroup = new THREE.Group();
brainGroup.add(subzoneGroup);
const subzoneAnchors = {};
const subzoneHitProxies = [];

const outerRingGeo = new THREE.RingGeometry(0.026, 0.033, 32);
const innerDotGeo = new THREE.CircleGeometry(0.011, 24);
const hitProxyGeo = new THREE.PlaneGeometry(0.11, 0.11);

function buildMarkers() {
  SUBZONES.forEach(function(sz) {
    const hit = getSurfaceHit(sz.dir);
    const color = new THREE.Color(sz.color);

    const anchor = new THREE.Group();
    anchor.position.copy(hit.point);
    anchor.lookAt(hit.point.clone().add(hit.normal));

    const ringMat = new THREE.MeshBasicMaterial({
      color: color,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.9,
      depthTest: false
    });
    const outerRing = new THREE.Mesh(outerRingGeo, ringMat);
    anchor.add(outerRing);

    const dotMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.95,
      depthTest: false
    });
    const innerDot = new THREE.Mesh(innerDotGeo, dotMat);
    anchor.add(innerDot);

    const proxyMat = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
    const proxy = new THREE.Mesh(hitProxyGeo, proxyMat);
    proxy.userData = { type: 'subzone', id: sz.id };
    anchor.add(proxy);
    subzoneHitProxies.push(proxy);

    subzoneGroup.add(anchor);
    subzoneAnchors[sz.id] = {
      group: anchor,
      outerRing: outerRing,
      innerDot: innerDot,
      color: color,
      region: sz.region,
      normal: hit.normal.clone()
    };
  });
}

/* ================================================================
   INTERNAL WHITE MATTER TRACTS (SMOOTH SUBCORTICAL ARCS)
   ================================================================ */
const pathwaysGroup = new THREE.Group();
brainGroup.add(pathwaysGroup);
const pathwayData = [];
let impulseBeamSystem = null;
let impulseUniforms = null;

function buildInternalPathways() {
  const streakPositions = [];
  const streakColors = [];
  const streakProgress = [];
  const streakSpeeds = [];
  const streakOffsets = [];

  PATHWAYS.forEach(function(tract, idx) {
    const aId = tract.a;
    const bId = tract.b;
    const ancA = subzoneAnchors[aId];
    const ancB = subzoneAnchors[bId];
    if (!ancA || !ancB) return;

    // Start and end slightly inside the cortex (white matter layer)
    const a = ancA.group.position.clone().multiplyScalar(0.92);
    const b = ancB.group.position.clone().multiplyScalar(0.92);
    // Curve dips anatomically into subcortical white matter (corona radiata / centrum semiovale)
    const mid1 = a.clone().lerp(b, 0.33).multiplyScalar(0.68);
    const mid2 = a.clone().lerp(b, 0.66).multiplyScalar(0.68);

    const curve = new THREE.CatmullRomCurve3([a, mid1, mid2, b]);
    const cA = ancA.color;
    const cB = ancB.color;

    const pts = curve.getPoints(40);
    const posArr = new Float32Array(pts.length * 3);
    const colArr = new Float32Array(pts.length * 3);

    for (let i = 0; i < pts.length; i++) {
      const u = i / (pts.length - 1);
      posArr[i * 3] = pts[i].x;
      posArr[i * 3 + 1] = pts[i].y;
      posArr[i * 3 + 2] = pts[i].z;

      const c = cA.clone().lerp(cB, u);
      colArr[i * 3] = c.r;
      colArr[i * 3 + 1] = c.g;
      colArr[i * 3 + 2] = c.b;
    }

    const lGeo = new THREE.BufferGeometry();
    lGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    lGeo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
    const lMat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.45,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const line = new THREE.Line(lGeo, lMat);
    pathwaysGroup.add(line);
    pathwayData.push({ line: line, a: aId, b: bId });

    // Synaptic pulse particles along internal tract
    const SAMPLES = 70;
    const curvePts = curve.getPoints(SAMPLES);
    const speed = 0.25 + (idx % 3) * 0.05;
    const offset = idx * 0.19;

    for (let i = 0; i <= SAMPLES; i++) {
      const u = i / SAMPLES;
      streakPositions.push(curvePts[i].x, curvePts[i].y, curvePts[i].z);
      const c = cA.clone().lerp(cB, u);
      streakColors.push(c.r, c.g, c.b);
      streakProgress.push(u);
      streakSpeeds.push(speed);
      streakOffsets.push(offset);
    }
  });

  const streakGeo = new THREE.BufferGeometry();
  streakGeo.setAttribute('position', new THREE.Float32BufferAttribute(streakPositions, 3));
  streakGeo.setAttribute('aColor', new THREE.Float32BufferAttribute(streakColors, 3));
  streakGeo.setAttribute('aProgress', new THREE.Float32BufferAttribute(streakProgress, 1));
  streakGeo.setAttribute('aSpeed', new THREE.Float32BufferAttribute(streakSpeeds, 1));
  streakGeo.setAttribute('aOffset', new THREE.Float32BufferAttribute(streakOffsets, 1));

  impulseUniforms = {
    uTime: { value: 0 },
    uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
    uDiseaseColor: { value: new THREE.Color(0xef4444) },
    uDiseaseMix: { value: 0.0 }
  };

  const streakMat = new THREE.ShaderMaterial({
    uniforms: impulseUniforms,
    vertexShader: `
      attribute vec3 aColor;
      attribute float aProgress;
      attribute float aSpeed;
      attribute float aOffset;
      uniform float uTime;
      uniform float uPixelRatio;
      uniform vec3 uDiseaseColor;
      uniform float uDiseaseMix;
      varying vec3 vColor;
      varying float vIntensity;

      void main() {
        float head = fract(uTime * aSpeed + aOffset);
        float dist = fract(head - aProgress);
        float trail = smoothstep(0.18, 0.0, dist);
        vIntensity = pow(trail, 1.5);

        vec3 baseCol = mix(aColor, uDiseaseColor, uDiseaseMix);
        vColor = mix(baseCol, vec3(1.0), pow(trail, 3.0) * 0.7);

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = (14.0 * vIntensity * uPixelRatio + 1.5) / -mvPosition.z;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vIntensity;

      void main() {
        if (vIntensity < 0.02) discard;
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        float glow = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vColor, glow * vIntensity * 0.9);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  impulseBeamSystem = new THREE.Points(streakGeo, streakMat);
  pathwaysGroup.add(impulseBeamSystem);
}

/* ================================================================
   HTML LABELS (POSITIONED TIGHTLY OVER CORTEX BEACONS)
   ================================================================ */
const labelsLayer = document.getElementById('labelsLayer');
const htmlLabels = {};

function buildHtmlLabels() {
  labelsLayer.innerHTML = '';
  SUBZONES.forEach(function(sz) {
    const el = document.createElement('button');
    el.className = 'zone-label';
    el.dataset.id = sz.id;
    el.style.setProperty('--ldot-color', sz.color);
    el.innerHTML =
      '<span class="ldot"></span>' +
      '<span class="lname">' + sz[LANG].name + '</span>' +
      '<span class="lba">' + sz.ba + '</span>';
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      onZoneClick(sz.id);
    });
    el.addEventListener('pointerenter', function() {
      state.hoveredSubzone = sz.id;
    });
    el.addEventListener('pointerleave', function() {
      if (state.hoveredSubzone === sz.id) state.hoveredSubzone = null;
    });
    el.addEventListener('touchstart', function(e) {
      e.stopPropagation();
    }, { passive: true });
    labelsLayer.appendChild(el);
    htmlLabels[sz.id] = el;
  });
}

/* ================================================================
   STATE & DISPLAY MODES (SURFACE VESSELS vs INTERNAL NEURONS)
   ================================================================ */
const state = {
  viewMode: 'surface', // 'surface' | 'neural'

/* ================================================================
   RESIZE & CAMERA
   ================================================================ */
let vpWidth = 1;
let vpHeight = 1;

function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  if (w === 0 || h === 0) return;
  vpWidth = w;
  vpHeight = h;

  renderer.setSize(w, h, false);
  camera.aspect = w / h;

  const aspect = w / h;
  if (aspect < 0.55) camera.fov = 60;
  else if (aspect < 0.8) camera.fov = 52;
  else if (aspect < 1.2) camera.fov = 45;
  else camera.fov = 38;

  camera.updateProjectionMatrix();
}

if (window.ResizeObserver) {
  new ResizeObserver(function() {
    requestAnimationFrame(resize);
  }).observe(viewport);
} else {
  window.addEventListener('resize', resize);
}

function resetCamera() {
  const aspect = vpWidth / vpHeight;
  const radius = brainState.radius || 1;

  let d;
  if (aspect < 0.6) d = radius * 3.1;
  else if (aspect < 0.85) d = radius * 2.65;
  else if (aspect < 1.25) d = radius * 2.25;
  else d = radius * 1.95;

  d = Math.max(1.6, Math.min(6.0, d));

  controls.minDistance = radius * 1.15;
  controls.maxDistance = radius * 5.0;

  // Position camera at lateral-anterior angle to clearly view left hemisphere lobes
  const targetDir = new THREE.Vector3(-0.78, 0.18, 0.6).normalize();
  camTween = {
    from: camera.position.clone(),
    to: targetDir.multiplyScalar(d),
    fromT: controls.target.clone(),
    toT: new THREE.Vector3(0, 0, 0),
    t: 0
  };
}

document.getElementById('resetCamBtn').addEventListener('click', function() {
  clearSelection();
  resetCamera();
});

function focusOn(point) {
  const worldPt = point.clone().applyMatrix4(brainGroup.matrixWorld);
  const dir = worldPt.normalize();
  const radius = brainState.radius || 1;
  const dist = Math.max(radius * 1.75, 1.65);
  camTween = {
    from: camera.position.clone(),
    to: dir.multiplyScalar(dist),
    fromT: controls.target.clone(),
    toT: new THREE.Vector3(0, 0, 0),
    t: 0
  };
}

/* ================================================================
   RAYCASTING & SELECTION
   ================================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function updatePointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function raycastBeacons() {
  raycaster.setFromCamera(pointer, camera);
  const activeProxies = subzoneHitProxies.filter(function(p) {
    return p.parent && p.parent.visible;
  });
  return raycaster.intersectObjects(activeProxies, false);
}

let downPos = null;
canvas.addEventListener('pointerdown', function(e) {
  downPos = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('pointermove', function(e) {
  if (downPos) return;
  updatePointer(e);
  const hits = raycastBeacons();
  if (hits.length > 0) {
    const id = hits[0].object.userData.id;
    if (state.hoveredSubzone !== id) {
      state.hoveredSubzone = id;
      canvas.style.cursor = 'pointer';
    }
  } else if (state.hoveredSubzone) {
    state.hoveredSubzone = null;
    canvas.style.cursor = 'grab';
  }
});

canvas.addEventListener('pointerup', function(e) {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 10) return;

  updatePointer(e);
  const hits = raycastBeacons();

  if (hits.length > 0) {
    onZoneClick(hits[0].object.userData.id);
    return;
  }

  // Click directly on brain surface mesh to select corresponding lobe!
  raycaster.setFromCamera(pointer, camera);
  const surfHits = raycaster.intersectObjects(brainState.surfaceMeshes, true);
  if (surfHits.length > 0) {
    const localPt = surfHits[0].point.clone();
    brainGroup.worldToLocal(localPt);
    const lid = classifyLobe(localPt.x, localPt.y, localPt.z);
    if (REGIONS[lid]) {
      selectRegion(lid);
      return;
    }
  }

  // Clicked empty background -> clear selection & hide right curtain
  clearSelection();
});

function clearSelection() {
  state.selectedSubzone = null;
  state.selectedRegion = null;
  state.currentDisease = null;
  setStatus('ready', T('ready'));
  applyDiseaseToBrain();
  applyHighlight();
  updateRegionListUI();
  updateDiseaseListUI();
  updateSeverityUI();
  closeRightCurtain();
}

function selectRegion(rid) {
  state.selectedRegion = rid;
  state.selectedSubzone = null;
  state.currentDisease = null;
  setStatus('ready', T('ready'));
  const hit = getSurfaceHit(REGIONS[rid].dir);
  focusOn(hit.point);
  applyDiseaseToBrain();
  applyHighlight();
  renderAnalytics();
  updateRegionListUI();
  updateDiseaseListUI();
  updateSeverityUI();
  openRightCurtain();
  closeLeftMobile();
}

function onZoneClick(id) {
  const sz = SUBZONES.find(function(s) { return s.id === id; });
  if (!sz) return;
  state.selectedSubzone = id;
  state.selectedRegion = sz.region;
  state.currentDisease = null;
  setStatus('ready', T('ready'));
  if (subzoneAnchors[id]) focusOn(subzoneAnchors[id].group.position.clone());
  applyDiseaseToBrain();
  applyHighlight();
  renderAnalytics();
  updateRegionListUI();
  updateDiseaseListUI();
  updateSeverityUI();
  openRightCurtain();
  closeLeftMobile();
}

/* ================================================================
   HIGHLIGHT & FOCUS INDICATOR
   ================================================================ */
function applyHighlight() {
  const activeRegion = state.selectedRegion || state.hoveredRegion;

  if (nebulaUniforms) {
    nebulaUniforms.uActiveLobe.value = activeRegion ? LOBE_INDEX[activeRegion] : -1.0;
  }

  Object.keys(subzoneAnchors).forEach(function(id) {
    const anc = subzoneAnchors[id];
    const on = !activeRegion || anc.region === activeRegion;
    anc.group.visible = on;
  });

  pathwayData.forEach(function(pw) {
    const isConn = !state.selectedSubzone || pw.a === state.selectedSubzone || pw.b === state.selectedSubzone;
    pw.line.material.opacity = isConn ? 0.65 : 0.1;
  });

  Object.keys(htmlLabels).forEach(function(id) {
    htmlLabels[id].classList.toggle('active', state.selectedSubzone === id);
  });

  // Update non-clickable Focus Indicator
  const fv = document.getElementById('focusValue');
  const fInd = document.getElementById('focusIndicator');
  if (state.currentDisease) {
    fv.textContent = state.currentDisease[LANG].name;
    fInd.style.setProperty('--f-color', state.currentDisease.color);
  } else if (state.selectedSubzone) {
    const sz = SUBZONES.find(function(s) { return s.id === state.selectedSubzone; });
    fv.textContent = sz[LANG].full;
    fInd.style.setProperty('--f-color', sz.color);
  } else if (activeRegion) {
    const r = REGIONS[activeRegion];
    fv.textContent = r[LANG].name;
    fInd.style.setProperty('--f-color', r.color);
  } else {
    fv.textContent = T('fullBrain');
    fInd.style.setProperty('--f-color', 'rgba(255,255,255,0.35)');
  }
}

/* ================================================================
   DISEASE EFFECTS
   ================================================================ */
function applyDiseaseToBrain() {
  const d = state.currentDisease;
  const sev = state.severity / 100;

  brainState.surfaceMeshes.forEach(function(mesh) {
    if (mesh.material && mesh.material.emissive) {
      if (!d) {
        mesh.material.emissive.setHex(0x000000);
        mesh.material.emissiveIntensity = 0;
      } else {
        mesh.material.emissive.setHex(d.hex);
        mesh.material.emissiveIntensity = sev * 0.38;
      }
    }
  });

  if (nebulaUniforms) {
    if (d) {
      nebulaUniforms.uDiseaseColor.value.setHex(d.hex);
      nebulaUniforms.uDiseaseMix.value = sev;
    } else {
      nebulaUniforms.uDiseaseMix.value = 0.0;
    }
  }

  if (impulseUniforms) {
    if (d) {
      impulseUniforms.uDiseaseColor.value.setHex(d.hex);
      impulseUniforms.uDiseaseMix.value = sev * 0.85;
    } else {
      impulseUniforms.uDiseaseMix.value = 0.0;
    }
  }

  const affectedSet = {};
  if (d) d.affected.forEach(function(id) { affectedSet[id] = true; });

  Object.keys(subzoneAnchors).forEach(function(id) {
    const anc = subzoneAnchors[id];
    if (!d) {
      anc.group.visible = true;
      anc.outerRing.material.color.copy(anc.color);
    } else if (affectedSet[id]) {
      anc.group.visible = true;
      anc.outerRing.material.color.setHex(d.hex);
    } else {
      anc.group.visible = false;
    }
  });
}

/* ================================================================
   PROJECT 3D LABELS DIRECTLY ONTO ANATOMICAL CORTEX POINTS
   ================================================================ */
const _v = new THREE.Vector3();
const _camDir = new THREE.Vector3();
const _worldNorm = new THREE.Vector3();

function projectLabels() {
  const w = vpWidth;
  const h = vpHeight;
  const active = state.selectedRegion || state.hoveredRegion;

  Object.keys(htmlLabels).forEach(function(id) {
    const el = htmlLabels[id];
    const anc = subzoneAnchors[id];
    if (!anc || !anc.group.visible || !state.chips.labels) {
      el.classList.add('hidden');
      return;
    }

    const sz = SUBZONES.find(function(s) { return s.id === id; });
    const isActive = active && sz.region === active;
    const isSelected = state.selectedSubzone === id;
    const isHovered = state.hoveredSubzone === id;

    // Occlusion check: hide labels on the far side of the brain unless selected
    anc.group.getWorldPosition(_v);
    _worldNorm.copy(anc.normal).transformDirection(brainGroup.matrixWorld).normalize();
    _camDir.copy(camera.position).sub(_v).normalize();
    const facing = _worldNorm.dot(_camDir);

    if (facing < -0.15 && !isSelected && !isActive) {
      el.classList.add('hidden');
      return;
    }

    _v.project(camera);
    if (_v.z > 1) {
      el.classList.add('hidden');
      return;
    }

    el.classList.remove('hidden');

    // Exact screen projection right above the cortical point (no wild radial push!)
    let x = (_v.x * 0.5 + 0.5) * w;
    let y = (-_v.y * 0.5 + 0.5) * h - 18;

    x = Math.max(48, Math.min(w - 48, x));
    y = Math.max(28, Math.min(h - 28, y));

    const scale = (isSelected || isHovered) ? 1.06 : 1;
    el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + scale + ')';
  });
}

/* ================================================================
   ANIMATION LOOP & FPS COUNTER
   ================================================================ */
const clock = new THREE.Clock();
const fpsEl = document.getElementById('fpsCounter');
let frameCount = 0;
let fpsAccum = 0;

function animate() {
  requestAnimationFrame(animate);
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  const t = clock.elapsedTime;

  frameCount++;
  fpsAccum += rawDt;
  if (fpsAccum >= 0.5) {
    if (fpsEl) fpsEl.textContent = Math.round(frameCount / fpsAccum) + ' FPS';
    frameCount = 0;
    fpsAccum = 0;
  }

  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 2.5);
    const e = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }

  if (nebulaUniforms) nebulaUniforms.uTime.value = t;
  if (impulseUniforms) impulseUniforms.uTime.value = t;

  Object.keys(subzoneAnchors).forEach(function(id) {
    const anc = subzoneAnchors[id];
    if (!anc.group.visible) return;
    const isSel = state.selectedSubzone === id;
    const isHov = state.hoveredSubzone === id;
    const pulse = 1 + Math.sin(t * 2.8 + id.length) * 0.1;
    const s = isSel ? pulse * 1.45 : (isHov ? pulse * 1.25 : pulse);
    anc.outerRing.scale.setScalar(s);
  });

  if (state.chips.rotate && brainState.loaded) {
    brainGroup.rotation.y += dt * 0.18;
  }

  controls.update();
  renderer.render(scene, camera);
  projectLabels();
}

  const d = state.currentDisease;
  const data = d[LANG];
  const sev = state.severity;
  const stageIdx = Math.min(3, Math.floor(sev / 25));
  const stageLabels = ['I', 'II', 'III', 'IV'];
  const stageLabel = stageLabels[stageIdx];

  const affectedZones = d.affected.map(function(id) {
    return SUBZONES.find(function(s) { return s.id === id; });
  }).filter(Boolean);

  const metricMap = [
    ['cognitive', 'metricCognitive'],
    ['motor', 'metricMotor'],
    ['language', 'metricLanguage'],
    ['sensory', 'metricSensory'],
    ['memory', 'metricMemory'],
    ['connectivity', 'metricConnectivity']
  ];

  const metricsHtml = metricMap.map(function(pair) {
    const key = pair[0];
    const labelKey = pair[1];
    const base = d.en.metrics[key];
    const impairment = 1 - base;
    const current = Math.max(0, base - impairment * (sev / 100));
    const pct = Math.round(current * 100);
    const cls = current > 0.72 ? 'good' : (current > 0.45 ? 'warn' : 'bad');
    return '<div class="metric-row">' +
      '<div class="metric-top">' +
        '<span class="metric-label">' + T(labelKey) + '</span>' +
        '<span class="metric-value ' + cls + '">' + pct + '%</span>' +
      '</div>' +
      '<div class="metric-bar"><div class="metric-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }).join('');

  const progBar = data.stages.map(function(_, i) {
    const cls = i === stageIdx ? 'current' : (i < stageIdx ? 'past' : '');
    return '<div class="progression-step ' + cls + '"></div>';
  }).join('');

  const progLabels = data.stages.map(function(_, i) {
    return '<span class="' + (i === stageIdx ? 'active' : '') + '">' + (i + 1) + '</span>';
  }).join('');

  el.innerHTML =
    '<div class="analytics-header"><div><h2>' + data.name + '</h2><span class="subtitle">' + data.short + '</span></div></div>' +
    '<div class="card">' +
      '<div class="card-title">Stage ' + stageLabel + '<span class="badge">' + sev + '%</span></div>' +
      '<p>' + data.desc + '</p></div>' +
    '<div class="card"><div class="card-title">' + T('progression') + '</div>' +
      '<div class="progression-bar">' + progBar + '</div>' +
      '<div class="progression-labels">' + progLabels + '</div>' +
      '<p style="font-size:0.78rem"><strong>' + data.stages[stageIdx] + '</strong></p></div>' +
    '<div class="card"><div class="card-title">' + T('mechanism') + '</div><p>' + data.mechanism + '</p></div>' +
    '<div class="card"><div class="card-title">' + T('affected') + '</div>' +
      affectedZones.map(function(sz) {
        return '<button class="sub-item" data-sub="' + sz.id + '">' +
          '<span class="pin" style="background:' + d.color + '"></span>' +
          '<span class="sub-item-info">' +
            '<span class="sub-item-title">' + sz[LANG].full + '</span>' +
            '<span class="sub-item-sub">' + sz.ba + '</span>' +
          '</span>' +
          '<span class="go">→</span>' +
        '</button>';
      }).join('') +
    '</div>' +
    '<div class="card"><div class="card-title">' + T('neuro') + '</div>' +
      '<div class="tags">' + data.neuro.map(function(n) { return '<span class="tag warn">' + n + '</span>'; }).join('') + '</div></div>' +
    '<div class="card"><div class="card-title">' + T('symptoms') + '</div>' +
      '<div class="tags">' + data.symptoms.map(function(s) { return '<span class="tag danger">' + s + '</span>'; }).join('') + '</div></div>' +
    '<div class="card"><div class="card-title">' + T('metrics') + '</div>' + metricsHtml + '</div>';

  el.querySelectorAll('.sub-item').forEach(function(btn) {
    btn.addEventListener('click', function() {
      onZoneClick(btn.dataset.sub);
    });
  });
}

/* ================================================================
   STATUS, CHIPS, THEME & LANGUAGE
   ================================================================ */
function setStatus(type, text) {
  const el = document.getElementById('statusIndicator');
  el.className = 'status-indicator' + (type === 'alert' ? ' danger' : '');
  el.textContent = text;
}

document.querySelectorAll('.chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    const key = chip.dataset.toggle;
    state.chips[key] = !state.chips[key];
    chip.classList.toggle('on', state.chips[key]);
    if (key === 'labels') projectLabels();
  });
});

function setTheme(theme, save) {
  if (save === undefined) save = true;
  document.documentElement.setAttribute('data-theme', theme);
  const icon = document.getElementById('themeIcon');
  if (theme === 'light') {
    icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  } else {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
  if (save) {
    try { localStorage.setItem('nc-theme', theme); } catch (e) {}
  }
}

document.getElementById('themeBtn').addEventListener('click', function() {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
});

function setLanguage(lang) {
  LANG = lang;
  document.documentElement.setAttribute('data-lang', lang);

  document.getElementById('modeSurface').textContent = T('modeSurface');
  document.getElementById('modeNeural').textContent = T('modeNeural');
  document.getElementById('chipLabels').textContent = T('labels');
  document.getElementById('chipRotate').textContent = T('rotate');
  document.getElementById('focusTag').textContent = T('focus');
  document.getElementById('lobesTitle').textContent = T('lobes');
  document.getElementById('diseasesTitle').textContent = T('diseases');
  document.getElementById('severityLabel').textContent = T('severity');
  document.getElementById('leftTitle').textContent = T('atlas');
  document.getElementById('rightTitle').textContent = T('analytics');
  setStatus(state.currentDisease ? 'alert' : 'ready', state.currentDisease ? T('alert') : T('ready'));

  Object.keys(htmlLabels).forEach(function(id) {
    const el = htmlLabels[id];
    const sz = SUBZONES.find(function(s) { return s.id === id; });
    if (sz) {
      const nameEl = el.querySelector('.lname');
      if (nameEl) nameEl.textContent = sz[LANG].name;
    }
  });

  renderRegionList();
  renderDiseaseList();
  applyHighlight();
  renderAnalytics();
}

document.querySelectorAll('.lang-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    setLanguage(btn.dataset.lang);
  });
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeLeftMobile();
    clearSelection();
  }
});

/* ================================================================
   INIT
   ================================================================ */
function init() {
  let savedTheme = 'dark';
  try {
    const stored = localStorage.getItem('nc-theme');
    if (stored === 'light' || stored === 'dark') savedTheme = stored;
  } catch (e) {}
  setTheme(savedTheme, false);
  setLanguage('ru');

  resize();
  animate();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
