<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>NeuralMap — Brain Atlas & Pathology Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;
  --bg-elevated:#0f141f;
  --bg-panel:rgba(255,255,255,0.02);
  --bg-panel-hover:rgba(255,255,255,0.05);
  --bg-accent:rgba(88,166,255,0.08);
  --border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.14);
  --border-accent:rgba(88,166,255,0.35);
  --text:#e6edf3;
  --text-muted:#7d8590;
  --text-dim:#4d5566;
  --accent:#58a6ff;
  --accent-soft:#79c0ff;
  --success:#3fb950;
  --warning:#d29922;
  --danger:#f85149;
  --frontal:#58a6ff;
  --parietal:#3fb950;
  --temporal:#d29922;
  --occipital:#a371f7;
  --cerebellum:#6e7681;
  --brain-tissue:#c9c1b8;
  --brain-dark:#a89f94;
  --brain-light:#e2dbd1;
  --font-sans:'Inter',-apple-system,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
[data-lang="ru"]{
  --font-sans:'Inter','SF Pro',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  -webkit-user-select:none;
  font-weight:400;
}
button{font-family:inherit;background:none;border:none;cursor:pointer;color:inherit;font-size:inherit}
input{font-family:inherit;color:inherit}
svg{display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ============ APP LAYOUT ============ */
.app{
  display:grid;
  grid-template-rows:56px 1fr 60px;
  height:100dvh;
  background:var(--bg);
  position:relative;
  overflow:hidden;
}
.app::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(88,166,255,0.04),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(163,113,247,0.03),transparent 40%);
  pointer-events:none;
  z-index:0;
}
.app > *{position:relative;z-index:1}

/* ============ TOP BAR ============ */
.topbar{
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  background:rgba(10,14,26,0.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  flex:none;
}
.brand-mark{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  color:var(--accent);
}
.brand-mark svg{width:28px;height:28px}
.brand-text h1{
  font-size:14px;
  font-weight:600;
  letter-spacing:-0.2px;
  line-height:1.1;
}
.brand-text small{
  display:block;
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--text-dim);
  letter-spacing:0.3px;
  margin-top:1px;
}
.topbar-tabs{
  display:flex;
  gap:4px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:6px;
  padding:3px;
  margin:0 auto;
}
.topbar-tab{
  padding:6px 16px;
  border-radius:4px;
  font-size:12px;
  font-weight:500;
  color:var(--text-muted);
  transition:all .2s ease;
  letter-spacing:0.1px;
  white-space:nowrap;
}
.topbar-tab.active{
  background:rgba(255,255,255,0.06);
  color:var(--text);
}
.topbar-tab:hover:not(.active){color:var(--text)}
.topbar-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex:none;
}
.lang-switch{
  display:flex;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:5px;
  padding:2px;
  gap:2px;
}
.lang-btn{
  padding:4px 9px;
  font-family:var(--font-mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:0.5px;
  border-radius:3px;
  color:var(--text-muted);
  transition:all .15s ease;
  text-transform:uppercase;
}
.lang-btn.active{
  background:rgba(88,166,255,0.15);
  color:var(--accent-soft);
}
.version-tag{
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--text-dim);
  letter-spacing:0.5px;
  padding:4px 8px;
  border:1px solid var(--border);
  border-radius:4px;
  white-space:nowrap;
}
@media (max-width:900px){
  .topbar-tabs{display:none}
  .version-tag{display:none}
}

/* ============ BODY ============ */
.body{
  display:grid;
  grid-template-columns:280px 1fr 340px;
  overflow:hidden;
  min-height:0;
}
.panel{
  overflow-y:auto;
  overflow-x:hidden;
  padding:20px 16px;
  scrollbar-width:thin;
  min-height:0;
}
.panel-left{
  border-right:1px solid var(--border);
  background:rgba(10,14,26,0.5);
}
.panel-right{
  border-left:1px solid var(--border);
  background:rgba(10,14,26,0.5);
  padding:20px 18px;
}
@media (max-width:1240px){
  .body{grid-template-columns:1fr 340px}
  .panel-left{
    position:fixed;
    top:56px;bottom:60px;left:0;
    width:300px;
    z-index:50;
    background:var(--bg-elevated);
    transform:translateX(-100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    box-shadow:20px 0 50px rgba(0,0,0,0.5);
  }
  .panel-left.open{transform:none}
}
@media (max-width:880px){
  .body{grid-template-columns:1fr}
  .panel-right{
    position:fixed;
    top:56px;bottom:60px;right:0;
    width:min(360px,92vw);
    z-index:50;
    background:var(--bg-elevated);
    transform:translateX(100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    box-shadow:-20px 0 50px rgba(0,0,0,0.5);
  }
  .panel-right.open{transform:none}
}

/* ============ PANEL HEADERS ============ */
.panel-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:14px;
  margin-bottom:16px;
  border-bottom:1px solid var(--border);
}
.panel-title h2{
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-muted);
}
.panel-close{
  width:28px;height:28px;
  display:grid;place-items:center;
  border-radius:5px;
  color:var(--text-muted);
  transition:all .15s ease;
}
.panel-close:hover{background:var(--bg-panel-hover);color:var(--text)}
.panel-close svg{width:16px;height:16px}
@media (min-width:1241px){ .panel-left .panel-close{display:none} }
@media (min-width:881px){ .panel-right .panel-close{display:none} }

.section-label{
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin:0 0 10px;
}

/* ============ REGION LIST ============ */
.region-list{display:flex;flex-direction:column;gap:4px;margin-bottom:24px}
.region-item{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:11px 12px;
  border-radius:7px;
  border:1px solid transparent;
  text-align:left;
  transition:all .18s ease;
  background:rgba(255,255,255,0.01);
}
.region-item:hover{background:var(--bg-panel-hover)}
.region-item.active{
  background:var(--bg-accent);
  border-color:var(--border-accent);
}
.region-item .dot{
  width:8px;height:8px;
  border-radius:50%;
  flex:none;
  transition:all .2s ease;
}
.region-item.active .dot{box-shadow:0 0 12px currentColor}
.region-item .label{
  flex:1;
  font-size:13px;
  font-weight:500;
  color:var(--text-muted);
  transition:color .18s;
}
.region-item.active .label{color:var(--text)}
.region-item .arrow{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--text-dim);
  transition:transform .2s ease;
}
.region-item.active .arrow{color:var(--accent);transform:translateX(2px)}

/* ============ DISEASE LIST ============ */
.disease-list{display:flex;flex-direction:column;gap:6px}
.disease-item{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:11px 12px;
  border-radius:7px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.015);
  text-align:left;
  transition:all .18s ease;
  position:relative;
  overflow:hidden;
}
.disease-item::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:2px;
  background:var(--d-color,var(--text-dim));
  opacity:0.4;
  transition:opacity .2s ease;
}
.disease-item:hover{background:var(--bg-panel-hover)}
.disease-item.active{
  border-color:color-mix(in srgb,var(--d-color) 40%,var(--border));
  background:color-mix(in srgb,var(--d-color) 6%,var(--bg-panel));
}
.disease-item.active::before{opacity:1}
.disease-item .d-icon{
  width:26px;height:26px;
  border-radius:5px;
  display:grid;place-items:center;
  color:#fff;
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:700;
  flex:none;
  background:var(--d-color,var(--text-dim));
  letter-spacing:-0.5px;
}
.disease-item .d-body{flex:1;min-width:0}
.disease-item .d-name{
  font-size:12.5px;
  font-weight:500;
  color:var(--text-muted);
  margin-bottom:2px;
  display:block;
}
.disease-item.active .d-name{color:var(--text)}
.disease-item .d-desc{
  font-size:10.5px;
  color:var(--text-dim);
  line-height:1.35;
}

/* ============ HEALTHY BUTTON ============ */
.disease-item.healthy::before{background:var(--success)}
.disease-item.healthy .d-icon{background:linear-gradient(135deg,var(--success),#2d8f3c);color:#0a0e1a}

/* ============ SEVERITY SLIDER ============ */
.severity-box{
  margin-top:16px;
  padding:14px;
  background:rgba(255,255,255,0.02);
  border:1px solid var(--border);
  border-radius:8px;
}
.severity-header{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:12px;
}
.severity-header label{
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-muted);
}
.severity-value{
  font-family:var(--font-mono);
  font-size:18px;
  font-weight:600;
  color:var(--accent);
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.5px;
}
.severity-slider{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:32px;
  background:transparent;
  cursor:pointer;
  display:block;
}
.severity-slider::-webkit-slider-runnable-track{
  height:2px;
  border-radius:1px;
  background:linear-gradient(to right,
    var(--accent) var(--p,50%),
    rgba(255,255,255,0.1) var(--p,50%));
}
.severity-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:14px;height:14px;
  border-radius:50%;
  background:var(--accent);
  margin-top:-6px;
  border:2px solid var(--bg);
  box-shadow:0 0 0 1px var(--accent),0 0 16px rgba(88,166,255,0.6);
  transition:transform .15s ease;
}
.severity-slider:active::-webkit-slider-thumb{transform:scale(1.2)}
.severity-slider::-moz-range-track{
  height:2px;
  border-radius:1px;
  background:rgba(255,255,255,0.1);
}
.severity-slider::-moz-range-progress{
  height:2px;border-radius:1px;background:var(--accent);
}
.severity-slider::-moz-range-thumb{
  width:14px;height:14px;
  border-radius:50%;
  background:var(--accent);
  border:2px solid var(--bg);
  box-shadow:0 0 0 1px var(--accent);
}
.severity-stages{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-family:var(--font-mono);
  font-size:9.5px;
  color:var(--text-dim);
  letter-spacing:0.3px;
  text-transform:uppercase;
}
.severity-stages span.active{color:var(--accent)}

/* ============ VIEWPORT ============ */
.viewport{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 50% 45%,rgba(88,166,255,0.03),transparent 60%);
  min-height:0;
}
.brain-stage{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
#brain-svg{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  filter:drop-shadow(0 20px 60px rgba(0,0,0,0.5));
}

/* SVG brain styles */
.brain-outline{fill:var(--brain-tissue);stroke:rgba(0,0,0,0.25);stroke-width:0.5}
.brain-sulcus{fill:none;stroke:rgba(0,0,0,0.15);stroke-width:0.6;stroke-linecap:round}
.lobe{
  cursor:pointer;
  transition:fill .35s cubic-bezier(.4,0,.2,1),opacity .35s ease,filter .35s ease;
  fill:transparent;
}
.lobe.highlight{opacity:1}
.lobe.dimmed{opacity:0.25}
.lobe-glow{
  pointer-events:none;
  transition:opacity .4s ease;
  mix-blend-mode:screen;
}
.zone-marker{
  cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.zone-marker circle{
  transition:all .3s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(0 0 6px currentColor);
}
.zone-marker:hover circle{transform:scale(1.4);transform-origin:center}
.zone-marker.active circle{transform:scale(1.6);transform-origin:center}
.zone-label{
  font-family:var(--font-mono);
  font-size:6px;
  font-weight:500;
  letter-spacing:0.3px;
  fill:var(--text-muted);
  pointer-events:none;
  transition:fill .3s ease;
  text-transform:uppercase;
}
.zone-label.active{fill:var(--text)}
.leader-line{
  stroke:var(--border-strong);
  stroke-width:0.4;
  fill:none;
  pointer-events:none;
  transition:stroke .3s ease;
}
.leader-line.active{stroke:var(--accent);stroke-width:0.6}
.leader-endpoint{
  fill:var(--border-strong);
  transition:fill .3s ease;
}
.leader-endpoint.active{fill:var(--accent)}

/* Disease overlay particles */
.lesion-particle{
  pointer-events:none;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:0.3}
  50%{opacity:0.7}
}

/* ============ VIEWPORT OVERLAYS ============ */
.viewport-top{
  position:absolute;
  top:16px;
  left:16px;
  right:16px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  pointer-events:none;
  z-index:5;
}
.viewport-chip{
  pointer-events:auto;
  display:inline-flex;
  align-items:center;
  gap:6px;
  height:28px;
  padding:0 11px;
  border-radius:5px;
  border:1px solid var(--border);
  background:rgba(10,14,26,0.7);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:var(--text-muted);
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:0.5px;
  text-transform:uppercase;
  transition:all .18s ease;
  white-space:nowrap;
}
.viewport-chip::before{
  content:'';
  width:4px;height:4px;
  border-radius:50%;
  background:currentColor;
  opacity:0.4;
  transition:opacity .18s ease;
}
.viewport-chip.on{
  background:rgba(88,166,255,0.1);
  border-color:var(--border-accent);
  color:var(--accent);
}
.viewport-chip.on::before{
  opacity:1;
  box-shadow:0 0 6px var(--accent);
}
.viewport-hint{
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  font-family:var(--font-mono);
  font-size:9.5px;
  color:var(--text-dim);
  letter-spacing:0.8px;
  text-transform:uppercase;
  background:rgba(10,14,26,0.7);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:6px 14px;
  border-radius:5px;
  border:1px solid var(--border);
  pointer-events:none;
  white-space:nowrap;
}
.viewport-hint .sep{color:var(--text-dim);margin:0 6px;opacity:0.5}

.viewport-label{
  position:absolute;
  top:50%;
  left:24px;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:4px;
  pointer-events:none;
  max-width:140px;
}
.viewport-label .vl-tag{
  font-family:var(--font-mono);
  font-size:9px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-dim);
}
.viewport-label .vl-value{
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:600;
  color:var(--accent);
  letter-spacing:0.3px;
}

/* ============ BOTTOM NAV ============ */
.bottomnav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:0 20px;
  border-top:1px solid var(--border);
  background:rgba(10,14,26,0.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  overflow-x:auto;
}
.bottomnav::-webkit-scrollbar{height:0}
.nav-item{
  padding:8px 16px;
  border-radius:6px;
  font-family:var(--font-mono);
  font-size:10.5px;
  font-weight:500;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--text-dim);
  transition:all .18s ease;
  white-space:nowrap;
  flex:none;
}
.nav-item:hover{color:var(--text-muted);background:rgba(255,255,255,0.03)}
.nav-item.active{
  color:var(--text);
  background:rgba(255,255,255,0.05);
}
@media (max-width:600px){
  .nav-item{padding:8px 10px;font-size:9.5px;letter-spacing:0.5px}
}

/* ============ ANALYTICS CARDS ============ */
.analytics-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
}
.analytics-header h3{
  font-size:18px;
  font-weight:600;
  letter-spacing:-0.3px;
  line-height:1.2;
  color:var(--text);
  margin:0 0 4px;
}
.analytics-header .subtitle{
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--text-muted);
  letter-spacing:0.3px;
}
.analytics-header .close-x{
  width:24px;height:24px;
  display:grid;place-items:center;
  border-radius:4px;
  color:var(--text-dim);
  transition:all .15s ease;
  flex:none;
}
.analytics-header .close-x:hover{background:var(--bg-panel-hover);color:var(--text)}
.analytics-header .close-x svg{width:14px;height:14px}

.metric-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
}
.metric-row:last-child{border-bottom:none}
.metric-row .metric-label{
  color:var(--text-muted);
  font-size:12px;
}
.metric-row .metric-value{
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:500;
  color:var(--text);
  letter-spacing:0.2px;
}
.metric-row .metric-value.good{color:var(--success)}
.metric-row .metric-value.warn{color:var(--warning)}
.metric-row .metric-value.bad{color:var(--danger)}

.card{
  background:rgba(255,255,255,0.02);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
  margin-bottom:12px;
}
.card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.card-title{
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-muted);
}
.card-badge{
  font-family:var(--font-mono);
  font-size:9.5px;
  font-weight:600;
  padding:3px 8px;
  border-radius:4px;
  letter-spacing:0.5px;
  text-transform:uppercase;
}

/* Bar chart */
.mini-chart{
  display:flex;
  align-items:flex-end;
  gap:5px;
  height:64px;
  padding:8px 0;
}
.mini-bar{
  flex:1;
  background:linear-gradient(180deg,var(--accent-soft),var(--accent));
  border-radius:2px 2px 0 0;
  min-height:4px;
  transition:height .4s cubic-bezier(.4,0,.2,1);
  opacity:0.85;
}
.mini-bar.dim{background:rgba(255,255,255,0.1)}
.mini-chart-labels{
  display:flex;
  gap:5px;
  margin-top:2px;
}
.mini-chart-labels span{
  flex:1;
  text-align:center;
  font-family:var(--font-mono);
  font-size:8px;
  color:var(--text-dim);
  letter-spacing:0.2px;
  text-transform:uppercase;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* Description text */
.desc-text{
  font-size:12px;
  line-height:1.65;
  color:var(--text-muted);
  margin:0;
}
.desc-text strong{color:var(--text);font-weight:500}

/* Tag list */
.tag-list{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:10px;
}
.tag{
  font-family:var(--font-mono);
  font-size:10px;
  padding:4px 8px;
  border-radius:4px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  color:var(--text-muted);
  letter-spacing:0.2px;
}
.tag.danger{
  background:rgba(248,81,73,0.06);
  border-color:rgba(248,81,73,0.2);
  color:#ff8888;
}
.tag.warn{
  background:rgba(210,153,34,0.06);
  border-color:rgba(210,153,34,0.2);
  color:#e3b341;
}

/* Empty state */
.empty{
  text-align:center;
  padding:48px 20px;
  color:var(--text-dim);
}
.empty svg{
  width:40px;height:40px;
  margin:0 auto 14px;
  opacity:0.35;
}
.empty p{
  font-family:var(--font-mono);
  font-size:10.5px;
  line-height:1.7;
  letter-spacing:0.3px;
  max-width:220px;
  margin:0 auto;
}

/* Scrim for mobile */
.scrim{
  position:fixed;
  inset:56px 0 60px 0;
  background:rgba(0,0,0,0.6);
  z-index:40;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.scrim.show{opacity:1;pointer-events:auto}

/* Mobile toggle buttons */
.mobile-only{
  display:none;
}
@media (max-width:1240px){ .mobile-only#leftToggle{display:grid} }
@media (max-width:880px){ .mobile-only#rightToggle{display:grid} }
.mobile-toggle{
  width:36px;height:36px;
  border-radius:6px;
  display:grid;place-items:center;
  color:var(--text-muted);
  transition:all .15s ease;
}
.mobile-toggle:hover{background:var(--bg-panel-hover);color:var(--text)}

/* Severity slider colors based on disease */
.severity-slider.danger::-webkit-slider-runnable-track{
  background:linear-gradient(to right,var(--danger) var(--p,50%),rgba(255,255,255,0.1) var(--p,50%));
}
.severity-slider.danger::-webkit-slider-thumb{
  background:var(--danger);
  box-shadow:0 0 0 1px var(--danger),0 0 16px rgba(248,81,73,0.6);
}
.severity-slider.danger .severity-value{color:var(--danger)}

/* Fade in animation */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}
.fade-in{animation:fadeUp .3s ease forwards}

/* Loading */
.loading{
  position:fixed;
  inset:0;
  background:var(--bg);
  z-index:9999;
  display:grid;
  place-items:center;
  transition:opacity .5s ease;
}
.loading.hidden{opacity:0;pointer-events:none}
.loading-inner{text-align:center}
.loading-mark{
  width:48px;height:48px;
  margin:0 auto 20px;
  color:var(--accent);
  animation:spin 2s linear infinite;
}
@keyframes spin{
  from{transform:rotate(0)}
  to{transform:rotate(360deg)}
}
.loading-text{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--text-dim);
}

/* Panel scrim */
.panel-left.open ~ .body-scrim,
.panel-right.open ~ .body-scrim{opacity:1;pointer-events:auto}
</style>

/* ============ INTERACTION HANDLERS ============ */
function onLobeEnter(id) {
  hoveredRegion = id;
  applyHighlight();
}

function onLobeLeave() {
  hoveredRegion = null;
  applyHighlight();
}

function onLobeClick(id) {
  selectedRegion = (selectedRegion === id) ? null : id;
  selectedSubzone = null;
  applyHighlight();
  renderAnalytics();
}

function onZoneEnter(id) {
  hoveredRegion = SUBZONES.find(s => s.id === id)?.region || null;
  applyHighlight();
}

function onZoneLeave() {
  hoveredRegion = null;
  applyHighlight();
}

function onZoneClick(id) {
  const sz = SUBZONES.find(s => s.id === id);
  if (!sz) return;
  selectedSubzone = id;
  selectedRegion = sz.region;
  applyHighlight();
  renderAnalytics();
}

/* ============ HIGHLIGHT LOGIC ============ */
function applyHighlight() {
  const active = selectedRegion || hoveredRegion;

  Object.keys(brainGroups).forEach(rid => {
    const g = brainGroups[rid].group;
    const path = brainGroups[rid].path;
    const region = REGIONS[rid];

    if (!active) {
      path.setAttribute('fill', 'transparent');
      g.style.opacity = '1';
    } else if (rid === active) {
      path.setAttribute('fill', region.color);
      path.setAttribute('fill-opacity', '0.22');
      g.style.opacity = '1';
    } else {
      path.setAttribute('fill', 'transparent');
      g.style.opacity = '0.35';
    }
  });

  // Zone markers
  SUBZONES.forEach(sz => {
    const marker = document.querySelector('[data-zone="' + sz.id + '"]');
    const label = document.querySelector('[data-zone-label="' + sz.id + '"]');
    if (!marker) return;

    const region = REGIONS[sz.region];
    const on = !active || sz.region === active;

    marker.style.opacity = on ? '1' : '0.2';
    marker.style.pointerEvents = on ? 'auto' : 'none';

    if (label) {
      const show = chipState.labels && on;
      label.style.opacity = show ? '1' : '0';
    }

    if (selectedSubzone === sz.id) {
      marker.classList.add('active');
    } else {
      marker.classList.remove('active');
    }
  });

  // Update viewport label
  const vlValue = document.getElementById('vl-value');
  const vlTag = document.getElementById('vl-tag');
  if (vlValue && vlTag) {
    if (selectedSubzone) {
      const sz = SUBZONES.find(s => s.id === selectedSubzone);
      vlValue.textContent = sz[LANG] ? sz[LANG].full : sz.id;
    } else if (active) {
      vlValue.textContent = REGIONS[active][LANG].name;
    } else {
      vlValue.textContent = t('vl_full');
    }
  }
}

/* ============ LANGUAGE ============ */
function applyLanguageToBrain() {
  SUBZONES.forEach(sz => {
    const label = document.querySelector('[data-zone-label="' + sz.id + '"]');
    if (label && sz[LANG]) label.textContent = sz[LANG].name;
  });

function updateDiseaseSelection() {

  });

function selectDisease(id) {
  if (id) {
    currentDisease = DISEASES.find(d => d.id === id);
    const box = document.getElementById('severityBox');
    box.style.display = 'block';
    const slider = document.getElementById('severitySlider');
    slider.classList.add('danger');
    applySeverity(currentSeverity);
    setStatus('ALERT', id === 'stroke' ? 'danger' : 'warn');
  } else {
    currentDisease = null;
    document.getElementById('severityBox').style.display = 'none';
    clearDiseaseEffects();
    setStatus('READY', '');
  }
  updateDiseaseSelection();
  renderAnalytics();
}

/* ============ SEVERITY ============ */
function applySeverity(value) {
  currentSeverity = value;
  const slider = document.getElementById('severitySlider');
  const valEl = document.getElementById('severityValue');
  const stagesEl = document.getElementById('severityStages');

  slider.value = value;
  slider.style.setProperty('--p', value + '%');
  valEl.textContent = value + '%';

  // Stage highlight
  if (stagesEl) {
    const stageIdx = Math.min(3, Math.floor(value / 25));
    Array.from(stagesEl.children).forEach((s, i) => {
      s.classList.toggle('active', i === stageIdx);
    });
  }

  if (currentDisease) {
    applyDiseaseToBrain(currentDisease, value / 100);
  }
  renderAnalytics();
}

/* ============ DISEASE EFFECTS ON SVG ============ */
function clearDiseaseEffects() {
  const overlay = document.getElementById('disease-overlay');
  if (overlay) overlay.innerHTML = '';
  Object.keys(brainGroups).forEach(rid => {
    brainGroups[rid].path.setAttribute('fill', 'transparent');
    brainGroups[rid].group.style.opacity = '1';
  });
  SUBZONES.forEach(sz => {
    const m = document.querySelector('[data-zone="' + sz.id + '"]');
    if (m) { m.style.opacity = '1'; m.style.pointerEvents = 'auto'; }
  });
  applyHighlight();
}

function applyDiseaseToBrain(disease, sev) {
  clearDiseaseEffects();
  if (!disease) return;

  const overlay = document.getElementById('disease-overlay');
  const affected = new Set(disease.affected);
  const primaryRegions = new Set(disease.primaryRegions);

  // Tint affected lobes
  Object.keys(brainGroups).forEach(rid => {
    if (primaryRegions.has(rid)) {
      brainGroups[rid].path.setAttribute('fill', disease.color);
      brainGroups[rid].path.setAttribute('fill-opacity', (0.08 + sev * 0.35).toFixed(2));
      brainGroups[rid].group.style.opacity = '1';
    } else {
      brainGroups[rid].path.setAttribute('fill', 'transparent');
      brainGroups[rid].group.style.opacity = String(1 - sev * 0.5);
    }
  });

  // Lesion orbs at affected zone markers
  disease.affected.forEach(szId => {
    const sz = SUBZONES.find(s => s.id === szId);
    if (!sz) return;
    const radius = 4 + sev * 8;
    const glow = svgEl('circle', {
      cx: sz.x, cy: sz.y, r: radius,
      fill: disease.color,
      opacity: (0.25 + sev * 0.35).toFixed(2),
      filter: 'url(#soft-blur)',
      class: 'lesion-particle'
    });
    overlay.appendChild(glow);
  });

  // Highlight affected zone markers
  SUBZONES.forEach(sz => {
    const m = document.querySelector('[data-zone="' + sz.id + '"]');
    if (!m) return;
    if (affected.has(sz.id)) {
      m.style.opacity = '1';
      m.style.pointerEvents = 'auto';
    } else {
      m.style.opacity = String(1 - sev * 0.7);
      m.style.pointerEvents = 'none';
    }
  });
}

function renderRegionAnalytics(el) {
  const r = REGIONS[selectedRegion];
  const data = r[LANG];
  const fd = FUNCTIONAL_DATA[selectedRegion][LANG];

  let metricsHtml = '';
  const metricMap = [
    ['cognitive', 'metric_cognitive'],
    ['motor', 'metric_motor'],
    ['language', 'metric_language'],
    ['memory', 'metric_memory'],
    ['decision', 'metric_cognitive'],
    ['connectivity', 'metric_connectivity']
  ];
  metricMap.slice(0, 6).forEach(([key, labelKey]) => {
    const v = fd[key];
    const pct = Math.round(v * 100);
    const cls = v > 0.75 ? 'good' : v > 0.5 ? 'warn' : 'bad';
    metricsHtml +=
      '<div class="metric-row">' +
        '<span class="metric-label">' + t(labelKey) + '</span>' +
        '<span class="metric-value ' + cls + '">' + pct + '%</span>' +
      '</div>';
  });

  // Mini chart from metrics
  const bars = metricMap.slice(0, 5).map(([key]) => {
    const v = fd[key];
    const h = Math.round(v * 56) + 4;
    return '<div class="mini-bar" style="height:' + h + 'px"></div>';
  }).join('');
  const labels = metricMap.slice(0, 5).map(([key, labelKey]) =>
    '<span>' + t(labelKey).split(' ')[0] + '</span>'
  ).join('');

  // Functional areas (subzones in this region)
  const subs = SUBZONES.filter(s => s.region === selectedRegion);

  el.innerHTML =
    '<div class="analytics-header">' +
      '<div>' +
        '<h3>' + data.name + '</h3>' +
        '<span class="subtitle">' + data.latin + '</span>' +
      '</div>' +
      '<button class="close-x" onclick="clearSelection()" aria-label="Close">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
      '</button>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header">' +
        '<span class="card-title">' + t('card_anatomy') + '</span>' +
      '</div>' +
      '<p class="desc-text">' + data.desc + '</p>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header">' +
        '<span class="card-title">Functional Metrics</span>' +
      '</div>' +
      '<div class="mini-chart">' + bars + '</div>' +
      '<div class="mini-chart-labels">' + labels + '</div>' +
      '<div style="margin-top:14px">' + metricsHtml + '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header">' +
        '<span class="card-title">' + t('card_functions') + '</span>' +
      '</div>' +
      '<div class="tag-list">' +
        data.functions.map(f => '<span class="tag">' + f + '</span>').join('') +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header">' +
        '<span class="card-title">' + t('card_subzones') + '</span>' +
        '<span class="card-badge" style="background:rgba(88,166,255,0.1);color:var(--accent)">' + subs.length + '</span>' +
      '</div>' +
      subs.map(s =>
        '<button class="sub-item" data-sub="' + s.id + '">' +
          '<span class="pin" style="background:' + s.color + '"></span>' +
          '<span>' + (s[LANG] ? s[LANG].full : s.id) + '</span>' +
          '<span class="go">→</span>' +
        '</button>'
      ).join('') +
    '</div>' +

    '<div class="card" id="subNoteCard" style="display:none">' +
      '<div class="card-header">' +
        '<span class="card-title">' + t('card_about') + '</span>' +
      '</div>' +
      '<p class="desc-text" id="subNoteText"></p>' +
    '</div>';

  // Attach sub-item handlers
  el.querySelectorAll('.sub-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.sub;
      const sz = SUBZONES.find(s => s.id === sid);
      if (!sz) return;
      selectedSubzone = sid;
      applyHighlight();
      const box = document.getElementById('subNoteCard');
      const txt = document.getElementById('subNoteText');
      if (box && txt) {
        box.style.display = 'block';
        txt.innerHTML = '<strong>' + sz[LANG].full + '</strong><br>' + sz[LANG].note;
      }
    });
  });

  // If subzone selected, auto-open its note
  if (selectedSubzone) {
    const sz = SUBZONES.find(s => s.id === selectedSubzone);
    if (sz && sz.region === selectedRegion) {
      const box = document.getElementById('subNoteCard');
      const txt = document.getElementById('subNoteText');
      if (box && txt) {
        box.style.display = 'block';
        txt.innerHTML = '<strong>' + sz[LANG].full + '</strong><br>' + sz[LANG].note;
      }
    }
  }
}

function renderDiseaseAnalytics(el) {
  const d = currentDisease;
  const data = d[LANG];
  const sev = currentSeverity;
  const stageIdx = Math.min(3, Math.floor(sev / 25));
  const stageLabels = ['severity_stage_1', 'severity_stage_2', 'severity_stage_3', 'severity_stage_4'];
  const stageLabel = t(stageLabels[stageIdx]);

  const affectedNames = d.affected
    .map(id => {
      const sz = SUBZONES.find(s => s.id === id);
      return sz ? sz[LANG].name : id;
    });

  const metricsHtml = [
    ['cognitive', 'metric_cognitive'],
    ['motor', 'metric_motor'],
    ['language', 'metric_language'],
    ['sensory', 'metric_sensory'],
    ['memory', 'metric_memory'],
    ['connectivity', 'metric_connectivity']
  ].map(([key, labelKey]) => {
    const base = d.en.metrics[key];
    const impairment = 1 - base;
    const current = Math.max(0, base - impairment * (sev / 100));
    const pct = Math.round(current * 100);
    const cls = current > 0.75 ? 'good' : current > 0.5 ? 'warn' : 'bad';
    return '<div class="metric-row">' +
      '<span class="metric-label">' + t(labelKey) + '</span>' +
      '<span class="metric-value ' + cls + '">' + pct + '%</span>' +
    '</div>';
  }).join('');

  el.innerHTML =
    '<div class="analytics-header">' +
      '<div>' +
        '<h3>' + data.name + '</h3>' +
        '<span class="subtitle">' + data.short + '</span>' +
      '</div>' +
      '<button class="close-x" onclick="clearDisease()" aria-label="Close">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
      '</button>' +
    '</div>' +

    '<div class="card" style="border-left:2px solid ' + d.color + '">' +
      '<span class="card-badge" style="background:' + d.color + '22;color:' + d.color + '">' + stageLabel + ' · ' + sev + '%</span>' +
      '<p class="desc-text" style="margin-top:10px">' + data.desc + '</p>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><span class="card-title">' + t('card_mechanism') + '</span></div>' +
      '<p class="desc-text">' + data.mechanism + '</p>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><span class="card-title">' + t('card_progression') + '</span></div>' +
      data.stages.map((stage, i) => {
        const isCurrent = i === stageIdx;
        const isPast = i < stageIdx;
        const cls = isCurrent ? 'danger' : (isPast ? 'warn' : '');
        return '<div class="metric-row" style="padding:8px 0">' +
          '<span class="metric-label" style="color:' + (isCurrent ? 'var(--text)' : 'var(--text-dim)') + ';font-weight:' + (isCurrent ? '500' : '400') + '">' +
            (i + 1) + '. ' + stage +
          '</span>' +
        '</div>';
      }).join('') +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><span class="card-title">' + t('card_affected') + '</span></div>' +
      '<div class="tag-list">' + affectedNames.map(n => '<span class="tag danger">' + n + '</span>').join('') + '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><span class="card-title">' + t('card_neuro') + '</span></div>' +
      '<div class="tag-list">' + data.neurotransmitters.map(n => '<span class="tag warn">' + n + '</span>').join('') + '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><span class="card-title">' + t('card_symptoms') + '</span></div>' +
      '<div class="tag-list">' + data.symptoms.map(s => '<span class="tag danger">' + s + '</span>').join('') + '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><span class="card-title">Functional Metrics</span></div>' +
      metricsHtml +
    '</div>';
}

function clearSelection() {
  selectedRegion = null;
  selectedSubzone = null;
  applyHighlight();
  updateRegionListSelection();
  renderAnalytics();
}

function clearDisease() {
  selectDisease(null);
}

/* ============ STATUS ============ */
const statusDot = document.getElementById('statusDot');
function setStatus(text, cls) {
  if (statusDot) {
    statusDot.textContent = text;
    statusDot.className = 'status-dot' + (cls ? ' ' + cls : '');
  }
}

/* ============ LANGUAGE SWITCH ============ */
function setLanguage(lang) {
  LANG = lang;
  document.documentElement.setAttribute('data-lang', lang);
  document.documentElement.setAttribute('lang', lang);

  // Update UI texts
  document.getElementById('left-title').textContent = t('left_title');
  document.getElementById('right-title').textContent = t('right_title');
  document.getElementById('lobes-label').textContent = t('lobes_label');
  document.getElementById('diseases-label').textContent = t('diseases_label');
  document.getElementById('severity-label').textContent = t('severity_label');
  document.getElementById('brand-sub').textContent = t('brand_sub');
  document.getElementById('tab-atlas').textContent = t('tab_atlas');
  document.getElementById('tab-functional').textContent = t('tab_functional');
  document.getElementById('chip-labels').textContent = t('chip_labels');
  document.getElementById('chip-heatmap').textContent = t('chip_heatmap');
  document.getElementById('chip-progression').textContent = t('chip_progression');
  document.getElementById('vl-tag').textContent = t('vl_tag');
  document.getElementById('hint-tap').textContent = t('hint_tap');
  document.getElementById('hint-drag').textContent = t('hint_drag');
  document.getElementById('hint-scroll').textContent = t('hint_scroll');
  document.getElementById('nav-home').textContent = t('nav_home');
  document.getElementById('nav-atlas').textContent = t('nav_atlas');
  document.getElementById('nav-pathways').textContent = t('nav_pathways');
  document.getElementById('nav-simulations').textContent = t('nav_simulations');
  document.getElementById('nav-settings').textContent = t('nav_settings');

  // Re-render dynamic content
  renderRegionList();
  renderDiseaseList();
  renderBrain();
  updateRegionListSelection();
  updateDiseaseSelection();
  applyHighlight();
  renderAnalytics();
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setLanguage(btn.dataset.lang);
  });
});

/* ============ CHIPS ============ */
document.querySelectorAll('.viewport-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const key = chip.dataset.toggle;
    chipState[key] = !chipState[key];
    chip.classList.toggle('on', chipState[key]);
    applyHighlight();
  });
});

/* ============ TOPBAR TABS ============ */
document.querySelectorAll('.topbar-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.topbar-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});

/* ============ BOTTOM NAV ============ */
document.querySelectorAll('.nav-item').forEach(nav => {
  nav.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    nav.classList.add('active');
  });
});

/* ============ SEVERITY SLIDER ============ */
const severitySlider = document.getElementById('severitySlider');
if (severitySlider) {
  severitySlider.addEventListener('input', () => {
    applySeverity(+severitySlider.value);
  });
}

/* ============ MOBILE PANELS ============ */
const panelLeft = document.getElementById('panel-left');
const panelRight = document.getElementById('panel-right');
const scrim = document.getElementById('scrim');
const leftToggle = document.getElementById('leftToggle');
const rightToggle = document.getElementById('rightToggle');
const closeLeft = document.getElementById('closeLeft');
const closeRight = document.getElementById('closeRight');

function openLeft() { panelLeft.classList.add('open'); panelRight.classList.remove('open'); scrim.classList.add('show'); }
function closeLeftPanel() { panelLeft.classList.remove('open'); scrim.classList.remove('show'); }
function openRight() { panelRight.classList.add('open'); panelLeft.classList.remove('open'); scrim.classList.add('show'); }
function closeRightPanel() { panelRight.classList.remove('open'); scrim.classList.remove('show'); }

if (leftToggle) leftToggle.addEventListener('click', openLeft);
if (rightToggle) rightToggle.addEventListener('click', openRight);
if (closeLeft) closeLeft.addEventListener('click', closeLeftPanel);
if (closeRight) closeRight.addEventListener('click', closeRightPanel);
if (scrim) scrim.addEventListener('click', () => { closeLeftPanel(); closeRightPanel(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeLeftPanel();
    closeRightPanel();
    clearSelection();
  }
});

/* ============ SVG RESIZE ============ */
function resizeBrain() {
  const stage = document.getElementById('brainStage');
  if (!stage) return;
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  const aspect = 300 / 240;
  const scale = Math.min(w / 300, h / 240);
  const finalW = 300 * scale;
  const finalH = 240 * scale;
  brainSvg.setAttribute('width', finalW);
  brainSvg.setAttribute('height', finalH);
}

window.addEventListener('resize', resizeBrain);

/* ============ INIT ============ */
function init() {
  document.documentElement.setAttribute('data-lang', 'en');

  renderRegionList();
  renderDiseaseList();
  renderBrain();
  renderAnalytics();

  // Default healthy state
  selectDisease(null);

  // Resize brain
  setTimeout(resizeBrain, 100);

  // Hide loader
  setTimeout(() => {
    const loader = document.getElementById('loading');
    if (loader) loader.classList.add('hidden');
    setStatus('READY', '');
  }, 600);
}

// Expose for inline onclick handlers
window.clearSelection = clearSelection;
window.clearDisease = clearDisease;

// Wait for DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

console.log('🧠 NeuralMap v2.1 — initialized');
</script>
</body>
